  "sect_222b": "\nOne person has to remain awake at all times to bail water, and in fact this unending task is not as bad as trying to rest. At least the activity keeps you warm and helps prevent you from getting cramp.<br><span class=\"indent\"></span>The dawn is grey and cheerless, marked by a greyish pearl-like glimmer beyond the eastern clouds. It might as well be dusk for all the solace it gives you. The rain settles into a persistent, chilling drizzle. 'At least we have fresh drinking water,' you say, collecting it in your cupped hands. 'As long as the rain keeps up we won't die of thirst.'<br><span class=\"indent\"></span>'I almost wish we would,' moans Blutz miserably. 'Another night like that and I'll be praying for death.'<br><span class=\"indent\"></span>'Shut your whining mouth,' snaps Oakley. 'It's going to get a lot worse than this.'<br><span data-piece=\"222b_0\" class=\"choice\"><a data-goto=\"sect_259\">Maybe not.</a></span><span data-piece=\"222b_1\" class=\"choice\"><a data-goto=\"sect_7\">He's right.</a></span>\n",
  "sect_222c": "\nSedated by fatigue, you are surprised by a sudden delicious blossoming of warmth from deep inside you. You slide deeper into sleep, luxuriating in the unexpected comfort and unaware that it signals the last desperate fight of your tortured body to cling to life. You will never awaken.<br><div class=\"s3\">THE END</div>\n",
  "sect_223": "\nPutting his spectacles back on, the scholar gratefully shakes you by the hand. 'This is a place for gentlemen of fortune, not gentlemen of letters,' you tell him. 'I recommend you head on to a lawful port as soon as possible.'<br><span class=\"indent\"></span>He shakes his head. 'But I've travelled all the way from Glorianne in search of someone: the wizard William Wild.'<br><span class=\"indent\"></span>You nod. 'I've heard of him. Why should you expect to find him here?'<br><span class=\"indent\"></span>'I'm told he sailed for the colonies with Queen Titania. I left after they did, but my ship must have made better headway because it seems the Queen is still at sea and won't reach the colonies for several weeks.'<br><span class=\"indent\"></span>'It's as you say, but you're mistaken if you think they'll put into port here. Selenice is not under Gloriannic rule.'<br><span class=\"indent\"></span>He flutters his hands impatiently. 'I know that. But it occurs to me that Dr Wild's half-brother, a man called Skarvench, might know where he's bound.'<br><span class=\"indent\"></span>The others have come over to join you. 'So Skarvench is half-brother to the Queen's wizard!' says Oakley with a whistle. 'No doubt such news portends mischief.'<br><span class=\"indent\"></span>'Why do you want to find Wild?' Blutz asks the scholar.<br><span class=\"indent\"></span>'He paid me to do some astronomical calculations for him. He wanted to know when a certain eclipse of the moon would occur, as apparently he had certain plans which would be disrupted if the eclipse happened too early. Well, I gave him the results, but after he sailed I double-checked my calculations and it turns out I made an error. I told Dr Wild the eclipse would be at two o'clock on midsummer night, but in fact it will be slightly earlier, at midnight.'<br><span class=\"indent\"></span>Assuring the scholar that you will deliver his message personally, you escort him to the harbour and put him aboard a ship bound for Glorianne.<br><span data-piece=\"223_0\" class=\"choice\"><a data-goto=\"sect_374\">Continue.</a></span>\n",
  "sect_224": "\nHe said no <em>man</em> can use the key. Pointing to the lock in the lock in the middle of the chain, you try to make the monkey understand what you want it to do - but to no avail. 'Go on, you little fleabag!' you yell in exasperation, but its only reaction to this is to give itself a cursory scratch and go on squatting there on the edge of the coracle, blinking at you.<br><span class=\"indent\"></span>'Begging your pardon, skipper,' says Blutz, 'but you can't order a monkey about like you would an ordinary seaman. You've got to talk more gentle, like.'<br><span class=\"indent\"></span>'Gentle?' you say, amazed.<br><span class=\"indent\"></span>'Aye,' Blutz nods. 'It's a thing skippers know nothing about. Let me try.' He turns to the monkey. 'Now then, Mister Chatter, be a good bloke and unlock the harbour chain so your shipmates can sail through.'<br><span class=\"indent\"></span>And blow you down if this doesn't do the trick. The monkey clambers along the chain and you hear the click of a key as its paws turn an invisible object in the lock. The chain falls aside and the monkey comes scurrying back, shrieking gleefully.<br><span class=\"indent\"></span>'Imagine if captains had to take such a tone with their crew,' you mutter. 'A ship's deck would be as blooming genteel as a church!'<br><span class=\"indent\"></span>'Don't worry, skipper,' says Grimes as the coracle glides into the harbour. 'It might work a treat with monkeys, but sailors will always need a bit of yelling at.'<br><span data-piece=\"224_0\" class=\"choice\"><a data-goto=\"sect_205\">Continue.</a></span>\n",
  "sect_225": "\nThe surviving marines are rounded up and bound. Grimes is all for going aboard the warship and using her as your new vessel. Blutz soon points out the drawback in this idea: 'We'd be hunted down by the entire Gloriannic navy! That's going to make it rather hard to save the Gloriannic Queen, isn't it?'<br><span class=\"indent\"></span>'The Queen be hanged!' cries one of the crew. 'We've got treasure, and now that we've seized a warship it'll be easy to keep our coffers filled. I'm for a life of solid piracy. Forget revenge, abandon honour - let rum and gold be our goals!'<br><span class=\"indent\"></span>You can't consent to that. You still envisage yourself as the Queen's saviour and Skarvench's nemesis. Ignoring the sullen looks of the crew, you order them to cut the warship adrift and turn the <em>Lady of Shalott</em> back towards Selenice.<br><span data-piece=\"225_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_226": "\nDropping to your knees, you draw a circle around you in the sand and usher your shipmates to stand within it. Then, holding forth the focus of your protection, you begin to recite: 'They return at evening, and swords are in their lips, but let them growl and wander up and down for their blood; they shall not be satisfied. Though a host should encamp against me, my heart shall not fear; when they come upon me to eat up my flesh they shall stumble and fall. For I will sing of power. Yea, in my refuge I will sing aloud in the morning..!'<br><span class=\"indent\"></span>All through the night your ordeal continues. Your voice grows hoarse, and whenever you quaver in your chant one of the vampires lunges forward, trying to snatch you out of the circle. But at long last, just when all hope seems lost, a flicker of grey light trembles on the eastern horizon.<br><span class=\"indent\"></span>'The dawn!' shouts Blutz. 'Thank God!'<br><span class=\"indent\"></span>The vampires gnash their fangs and turn like a pack of dogs, skulking back towards their coffins. 'Aye, it's sunrise and we must retreat,' says El Draque in a voice of icy anger. 'But do not rifle my treasure by day, for he that does will suffer my curse. My vengeance will reach out for him beyond the grave.'<br><span class=\"indent\"></span>With that, he drops back into the hole. When you venture over, emboldened by the spreading daylight, you see the corpses all back in their boxes. Now you must decide how much you fear his parting threat.<br><span data-piece=\"226_0\" class=\"choice\"><a data-goto=\"sect_302a\">Take the silver ingots.</a></span><span data-piece=\"226_1\" class=\"choice\"><a data-goto=\"sect_396\">Leave them behind.</a></span>\n",
  "sect_227": "\nYour poor ship has taken all the damage she can stand. Listing hard over, her prow begins to sink beneath the waves. 'Man the lifeboats!' shouts Oakley. 'Abandon ship!'<br><span class=\"indent\"></span>Grimes takes your arm. 'Skipper, all's lost now. There's nothing left for us but to save ourselves.'<br><span class=\"indent\"></span>You hesitate. Honour demands that a captain go down with his ship, but that is not what roots you to the spot. Instead it is your bitter disappointment at failing to scupper your foe. Who knows what wickedness he will now wreak, and you are powerless to stop him.<br><span class=\"indent\"></span>Whether or not you flee the sinking ship, your bid for glory ends here.<br><div class=\"s3\">THE END</div>\n",
  "sect_228": "\nTaking hold of the rope, you pull yourself up. Mist surrounds you, dampening your clothes. There is an eerie chill here, suspended in a miasmic white void. The moon shimmers above as though seen in a stagnant pond. The shouts of your men echo leadenly up through the gloom.<br><span class=\"indent\"></span>The rope stirs. You look up to see a shape descending out of the moonlit vapour towards you. It is Skarvench, hanging like a great black spider on its web. Let him come. You will show him that this is no mere fly he has to face.<br><span data-piece=\"228_0\" class=\"choice\"><a data-goto=\"sect_323\">Continue.</a></span>\n",
  "sect_229": "\nYou know well that the art of concealment rests on distracting the attention. Even as the door starts to swing open, you reach across and unlatch the cabin porthole. Then, scattering a few maps and charts onto the floor from the table where they were lying, you take cover in a heap of oilskins behind the door.<br><span class=\"indent\"></span>Not a moment too soon. The bald stocky figure of the sailmaster stands in the doorway, lantern in his hand. Seeing the open porthole he gives a growl of annoyance and rushes to close it, worried that salt spray could damage his precious navigation charts. Then he gathers up some papers, puts them under his arm, and crosses to Skarvench's cabin.<br><span class=\"indent\"></span>You emerge from your hiding place and peek across the passage. The door of Skarvench's cabin stands ajar, and you can hear him going over the charts with the sailmaster. Now is your chance. Seeing a toolkit beside the door, you take it; your rowing boat may very well need repairs. There is no time to look for other items. You sneak back along the passage and up on deck. <br><span data-piece=\"229_0\" class=\"choice\"><a data-goto=\"sect_172\">Continue.</a></span>\n",
  "sect_230": "\nYou find only a couple of small crabs which between them amount to barely more than a mouthful. Blutz gazes at them hungrily, flabby jowls sagging in dismay. 'Not worth dividing them up,' he groans. 'Who's going to be the lucky one, then?'<br><span class=\"indent\"></span>As usual, the others instinctively look to you for leadership. Your own stomach is growling as much as anyone's. <br><span data-piece=\"230_0\" class=\"choice\"><a data-goto=\"sect_268\">Eat the crabs yourself.</a></span><span data-piece=\"230_1\" class=\"choice\"><a data-goto=\"sect_287\">Give them to one of the others.</a></span>\n",
  "sect_231": "\nYour skin is loose on your bones and your tongue feels like a wad of burnt cotton. The urge to drink seawater is almost unbearable now. Your only respite from consciousness is not sleep, but dream-haunted delirium.<br><span data-piece=\"231_0\" class=\"choice\"><a data-goto=\"sect_231a\">Can you go on?</a></span>\n",
  "sect_231a": "\n\n",
  "sect_232": "\nYou gorge yourselves on ripe fruits and tasty nuts - only to suffer severe stomach cramps just minutes later. Oakley rushes down the beach and gulps sea water until he vomits. The rest of you follow suit, but you are left dizzy and weak.<br><span class=\"indent\"></span>'Something must have been poisonous,' groans Blutz. 'Maybe we ought to go to the tower. There might be someone there who'll give us food.'<br><span data-piece=\"232_0\" class=\"choice\"><a data-goto=\"sect_194\">Go to the tower.</a></span><span data-piece=\"232_1\" class=\"choice\"><a data-goto=\"sect_137\">Leave the island now.</a></span>\n",
  "sect_233": "\nThe four of you crouch down in the weird boat. No sooner have you settled yourselves than the two great fish slap the waters with their tails, drawing you out to sea. Darkness and frothy waves churn past. With spray in your eyes, the moon looks like a whirlpool in the firmament and there is no way to tell how far you've travelled when, at last, the boat drifts to a halt. You see that you are close to the entrance of a massive harbour. A long golden chain is stretched across the harbour mouth to block vessels from entering or leaving.<br><span class=\"indent\"></span>The moon emerges from behind a cloud, flooding the scene in its timeless white glow. You give a gasp, for now you see that what you had taken to be the pillars of the harbour gate are actually colossal legs stretching up far into the night sky. Craning your neck, you see the massive outline of a giant's shoulders against the moon-grazed clouds.<br><span class=\"indent\"></span>The giant stoops, showing a smile as wide as a galleon's beam in his face of smooth dark marble. 'Four wayfarers,' he says in the tone of one who has noticed four curious insects under his nose. 'Mortals. What brings you to Neptune's gate?'<br><span data-piece=\"233_0\" class=\"choice\"><a data-goto=\"sect_34\">'We seek a ship.'</a></span><span data-piece=\"233_1\" class=\"choice\"><a data-goto=\"sect_53\">'We want help in our quest.'</a></span><span data-piece=\"233_2\" class=\"choice\"><a data-goto=\"sect_72\">'We want to go home.'</a></span>\n",
  "sect_234": "\n'Quick,' you say to Oakley over your shoulder, 'push me over and make like you're giving me a kick. And make it look convincing.' He is taken aback at first, but then he catches on to your plan. As you feel him shove you from behind, you fling yourself down to sprawl in the sand. 'Ouch!' you grunt as you feel the toe of his boot. 'Not <em>that</em> convincing.'<br><span class=\"indent\"></span>'We've caught this scurvy wretch,' Oakley tells the natives with the help of sign-language.<br><span class=\"indent\"></span>The chief must have learned a few words off sailors who stopped here. 'Kill,' he says. 'Burn alive over fire.'<br><span class=\"indent\"></span>Oakley hesitates. 'Er...'<br><span class=\"indent\"></span>'Tell him you're taking me to Port Leshand, you clot!' you prompt him hurriedly under your breath.<br><span class=\"indent\"></span>'Oh yes. Er, the prisoner will be taken to Queen Titania, the, er, chief of Glorianne. Get it? She'll decide the proper punishment.'<br><span class=\"indent\"></span>The natives are still keen to seize you, but Oakley keeps them off with warnings of dire reprisals if Queen's Titania's wishes are not carried out.<br><span data-piece=\"234_0\" class=\"choice\"><a data-goto=\"sect_272\">Continue.</a></span>\n",
  "sect_235": "\nThe storm rolls over you, tossing your jollyboat halfway to the clouds with each wave. The sea becomes thick with icy froth. The sky is a flickering lantern - one moment blue-white and bright as daybreak, then blacker than the underworld in the thunderous space between lightning flashes.<br><span class=\"indent\"></span>Wretchedly sick, weak with exhaustion and hunger, the four of you struggle to keep the little craft from submerging. Oakley sings wildly into the sheets of rain as he bails water with cupped hands:<br><span class=\"indent\"></span>'Oh, the <em>Coffin Lid</em> heaves to and fro,<br><span class=\"indent\"></span>tossed by storms and gales,<br><span class=\"indent\"></span>What's that thunder now I hear:<br><span class=\"indent\"></span>four hearts thudding full o' fear?<br><span class=\"indent\"></span>Or Death's bone fingers drawing near,<br><span class=\"indent\"></span>and banging in the nails?'<br>Grimes and Blutz both look to be near the end of their tether. Oakley's gallows song is not helping their nerves. Nor yours, for that matter.<br><span class=\"indent\"></span>If you try to shut Oakley up, you risk provoking a fight. On the other hand, if you do nothing then morale will drain away entirely.<br><span data-piece=\"235_0\" class=\"choice\"><a data-goto=\"sect_216\">Tell him to shut up.</a></span><span data-piece=\"235_1\" class=\"choice\"><a data-goto=\"sect_254\">Let him keep singing.</a></span>\n",
  "sect_236": "\nHolding firm to your mystic amulet, you pronounce the words of a blessing.<br><span class=\"indent\"></span>'Hey, it worked!' exclaims Blutz, clambering cumbrously over the rail. 'Look, we're not trapped by the curse any more.'<br><span class=\"indent\"></span>You nod, allowing yourself a slight smile of self congratulation. 'Don't dawdle, though. The effect of the charm won't last for ever.'<br><span class=\"indent\"></span>Lowering yourselves down to the water, you get back into the jollyboat tethered there and row hastily away through the chopping waves. Behind you, the <em>Larnassos</em> fades until she is no more than a wavering patch of shadow, and then is swallowed entirely by the darkness. 'Good riddance!' spits Grimes. <br><span data-piece=\"236_0\" class=\"choice\"><a data-goto=\"sect_136\">Continue.</a></span>\n",
  "sect_237": "\n'Well, Mister Chatter,' says Oakley, settling the little monkey on his knee and producing a pocket-knife, 'it's been an honour to sail with 'ee, but your shipmates are going to have to ask a favour of you now, and it's that most noble sacrifice a bloke can make.'<br><span class=\"indent\"></span>Rich red sunset glints on the blade, and in a stroke the deed is done. 'Poor little beggar!' sighs Blutz.<br><span class=\"indent\"></span>'Better than poor us, matey,' says Oakley as he carves you each a hunk of meat. 'Four starving sailors cramped into a jollyboat leaves precious room for sentiment.'<br><span data-piece=\"237_0\" class=\"choice\"><a data-goto=\"sect_256\">Eat.</a></span><span data-piece=\"237_1\" class=\"choice\"><a data-goto=\"sect_237a\">Go hungry.</a></span>\n",
  "sect_237a": "\n\n",
  "sect_238": "\nRaising your sword, you leap aboard the raft. You intended only to warn Mortice, but instead of backing off he gives a murderous snarl and runs straight onto the sword, impaling himself through the heart. You look away quickly with a grimace of dismay. Still gripping the blade, you glance back at the others and start to say, 'There wasn't anything I could do. He just -'<br><span class=\"indent\"></span>'Look out!' Blutz screeches in warning, pointing past you. 'He's not dead!'<br><span class=\"indent\"></span>Your eyes jerk back to Mortice, who you now see to your horror is still moving. Twitching galvanically, he grins a blood-rimmed smile and coughs gore, then starts to pull himself along the sword blade towards you.<br><span class=\"indent\"></span>If you want to flee back to the boat it means letting go of your sword.<br><span data-piece=\"238_0\" class=\"choice\"><a data-goto=\"sect_238a\">Do so.</a></span><span data-piece=\"238_1\" class=\"choice\"><a data-goto=\"sect_314\">Fight on.</a></span>\n",
  "sect_238a": "\n\n",
  "sect_239": "\nThe captain listens to your tale with equal measures of horror and disbelief. 'It's a hard tale to swallow,' he says at last, 'but I've heard this fellow Skarvench is full of hubris.'<br><span class=\"indent\"></span>'It's no mere pipedream,' says Grimes. 'Skarvench is cunning and ruthless. If he's set his sights on such a prize, you can be sure he has a good plan.'<br><span class=\"indent\"></span>The captain scratches his head. 'It is true that the Queen's flagship is bound for the colonies,' he admits. 'But I only heard the news myself as I was about to set sail from Glorianne, so Skarvench must have spies in high places. I'd help if I could, but my vessel is only a merchantman and would fare badly against a fully-armed pirate ship.'<br><span class=\"indent\"></span>He finally agrees to set you off in Port Selenice, where you have your best chance of enlisting aid against Skarvench. Then, wishing you well, he resumes his journey towards Leshand.<br><span data-piece=\"239_0\" class=\"choice\"><a data-goto=\"sect_406\">Continue.</a></span><span data-piece=\"239_1\" class=\"choice\"><a data-goto=\"sect_165\">Continue.</a></span>\n",
  "sect_240": "\nYou are dragged aboard the <em>Belle Dame</em>. Jeering, the pirates gather round and tie you and your friends to the rail. The burly mate, Porbuck, steps forward swinging a whip in his hand. His huge flabby face is creased into a ghoulish grin.<br><span class=\"indent\"></span>'While the cat's away, eh, Porbuck?' says Oakley. He is trying to sound flippant, but his face is the curdled-milk colour of fear. 'Skarvench won't like it if you kill us before he gets back.'<br><span class=\"indent\"></span>Porbuck chortles as he raises the whip. 'Don't you go worryin', Oakley. You won't die just yet. Reckon you'll beg for it, though.'<br><span class=\"indent\"></span>Hours of agony pass before your flayed bodies are finally cast into the sea. By that time you gratefully accept the cool oblivion of death.<br><div class=\"s3\">THE END</div>\n",
  "sect_241": "\nYou raise your fists and step quickly forward, ready to give the demon-witch a sound thrashing if she doesn't lift her spell and allow you to leave the island. For her part, she gives you a disdainful smile and places her hands on her hips, tilting her chin back mockingly. 'Come, mortal,' she says. 'Plant your best punch. Then I'll take my turn, and we'll see who's left standing after that.'<br><span data-piece=\"241_0\" class=\"choice\"><a data-goto=\"sect_271\">Take a swing at her.</a></span><span data-piece=\"241_1\" class=\"choice\"><a data-goto=\"sect_290\">Try for an armlock.</a></span><span data-piece=\"241_2\" class=\"choice\"><a data-goto=\"sect_309\">Lift her over your head for a body slam.</a></span><span data-piece=\"241_3\" class=\"choice\"><a data-goto=\"sect_119\">Surrender while you still can.</a></span>\n",
  "sect_242": "\nYou sit up suddenly with a groan. Your chest feels as though you've been kicked by a horse, but by rights you ought to be dead. Shaking your head to clear it, you look down and discover that Skarvench's bullet was deflected by the article hanging at your breast. Instead of hitting your heart, it glanced off the metal and only left a long red gash.<br><span class=\"indent\"></span>Grimes's face comes into focus. 'How long have I been out cold?' you ask him, each breath making you wince in pain.<br><span class=\"indent\"></span>'At least quarter of an hour, skipper.'<br><span class=\"indent\"></span>Quite a crowd has gathered around you. As you stagger groggily to your feet, you find you're still holding the corkscrew. 'A fat lot of good this did me...'<br><span class=\"indent\"></span>Oakley cracks a grin, relieved to see you're all right. 'I dunno, you might've had his remaining eye out with it if you'd been a bit closer.'<br><span class=\"indent\"></span>An elderly pirate steps out of the crowd. You recognize him as a respected man in the disreputable community of Selenice. 'Skarvench broke the Brethren's law,' he says. 'He's an outcast now. No port on the Carab will give him shelter.'<br><span class=\"indent\"></span>Blutz is nursing a lump on his head. His nostrils flare in rage as he cries, 'If Skarvench succeeds in abducting Queen Titania he'll be rich enough to buy his own port!'<br><span class=\"indent\"></span>'He won't,' you say in a voice laced with icy determination. 'We'll stop him.' <br><span data-piece=\"242_0\" class=\"choice\"><a data-goto=\"sect_343\">Continue.</a></span>\n",
  "sect_243": "\nA key that no one can see or touch? The ocean god's riddle leaves you baffled until you remember the hornpipe in your pocket. Putting it to your lips, you play a snatch of an old sea shanty. As you do, the chain unlocks itself, falling aside to admit your boat into the harbour.<br><span class=\"indent\"></span>'Well, son of a gun!' says Blutz. 'It was a musical key that was needed, then.' <br><span data-piece=\"243_0\" class=\"choice\"><a data-goto=\"sect_205\">Continue.</a></span>\n",
  "sect_244": "\nClutching your letter of marque, you emerge into the sunshine with the happy air of scholars who have just been awarded their diploma. Outwardly you retain the weather-beaten faces and grimy clothes of common street ruffians, but the document in your hands proclaims otherwise. Now you are licensed privateers - proud sea warriors in the conflict with the rapacious kingdom of Sidonia!<br><span class=\"indent\"></span>'Now all we need is a ship,' says Blutz. <br><span class=\"indent\"></span>The rest of you whirl and glare at him, the contented smiles wiped off your faces in an instant. Trust the fat oaf to bring you down to earth with a bump.<br><span data-piece=\"244_0\" class=\"choice\"><a data-goto=\"sect_69\">Call on Master Capstick.</a></span><span data-piece=\"244_1\" class=\"choice\"><a data-goto=\"sect_107\">It's time to move on.</a></span>\n",
  "sect_245": "\nEl Draque raises his arms and comes forward to embrace you. It could almost be the gesture of one greeting a long-lost friend - if not for the fangs that gleam like talons beneath his white lips.<br><span class=\"indent\"></span>A seagull wheels high above in the cloudless indigo sky, its wings catching a last flicker of sunlight. You see one chance. Your sword flashes in the grey dusk too fast for the eye to follow. For an instant El Draque stands rooted to the spot, arms outstretched, not yet aware of what you've done. Then a torrent of mingled hate and anguish and disbelief washes across his pale contorted features as he looks down to see your sword hilt protruding from his chest.<br><span class=\"indent\"></span>He falls and crumbles to a pile of ash, and as he does the other vampires slump to the ground also. A ghastly keening rises from their lips as they slowly dissolve, leaving nothing but a miasmal stench and dark patches in the sand.<br><span class=\"indent\"></span>You are about to retrieve your sword, but Blutz advises you to leave it where it is. 'I've heard vampires can reform themselves even from lifeless dust.' he says with a shudder. Hurriedly loading the silver ingots aboard the <em>Lady of Shalott</em>, you set sail for Selenice.<br><span data-piece=\"245_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_246": "\nWithout the lunar wind to fill her sails, the <em>Moon Dog</em> drops quickly. You hear her splash down some distance off your starboard bow.<br><span class=\"indent\"></span>'Now Skarvench is seaborne like us,' says Oakley with a fierce smile. 'If not for this damned fog, we could give him a battle he'd not soon forget.'<br><span data-piece=\"246_0\" class=\"choice\"><a data-goto=\"sect_265\">Try using the thundercloud fan.</a></span><span data-piece=\"246_1\" class=\"choice\"><a data-goto=\"sect_284\">Disperse the fog with sorcery.</a></span><span data-piece=\"246_2\" class=\"choice\"><a data-goto=\"sect_303\">Continue.</a></span>\n",
  "sect_247": "\nDarting quickly over into the hold, you break open a travelling chest bearing the royal seal. You scatter the packed clothes and jewels that are inside until you find what you are looking for: one of the Queen's voluminous gowns. Pulling this on, you hurry back on deck, drawing amazed stares from your comrades.<br><span class=\"indent\"></span>'Good grief, skipper!' says Oakley with a wry smile. 'You makes a bloomin' pretty queen, and no mistake!'<br><span class=\"indent\"></span>'Get out of sight, all of you,' you tell them. Then, lying in wait behind the overturned water-barrel, you watch until the rope begins to stir. Someone is descending. You see him slide down the rope as loathsome as a great black spider - Skarvench himself! Choking back the urge to attack him at once, you wait until he reaches the deck before pretending to stumble out of your hiding-place.<br><span class=\"indent\"></span>'Oho!' he cries. 'The precious baggage herself! It's right handy of you to make my job so easy, yer majesty.' So saying, he reaches out and hefts you over his shoulder. 'Whuf! You're a weighty lass. But a spell on biscuit an' water'll soon take some o' that ample flesh off your bones. That an' the cat, o' course!'<br><span class=\"indent\"></span>You wait until he has carried you halfway up the rope. You may as well let the brigand wear himself out before you kill him. Now you are suspended in a weird misty void between sea and sky, with just the faint haze of moonshine to light your final confrontation. You wrest out of his grasp, seize the rope, and throw off your disguise.<br><span class=\"indent\"></span>'You!' gasps Skarvench. <br><span data-piece=\"247_0\" class=\"choice\"><a data-goto=\"sect_323\">Continue.</a></span>\n",
  "sect_248": "\nThere is a meaty smack as your fist connects with his solar plexus. He makes a soft sucking sound and falls like a fish out of water. Stooping, you deliver a punch to the jaw that lays him out cold. Freezing, you listen tensely but the conversation in Skarvench's cabin continues as before. Nobody heard anything. Still, you had better not tarry here any longer.<br><span data-piece=\"248_0\" class=\"choice\"><a data-goto=\"sect_172\">Continue.</a></span>\n",
  "sect_249": "\nReaching the top of the cliffs, you stand atop a spar of rock which gives you a clear view of the interior of the island. Lush jungle clings to the flanks of a sharply peaked mountain in the centre. The summit of the mountain is hidden by a haze of cloud. Nearer at hand you spy succulent fruits. From beyond the curtain of foliage comes the gurgling of a brook.<br><span data-piece=\"249_0\" class=\"choice\"><a data-goto=\"sect_306\">Gather provisions.</a></span><span data-piece=\"249_1\" class=\"choice\"><a data-goto=\"sect_325\">Explore the interior of the island.</a></span><span data-piece=\"249_2\" class=\"choice\"><a data-goto=\"sect_116\">Get back in the boat and sail on.</a></span>\n",
  "sect_250": "\n'This seems a bountiful enough place - indeed, a very Eden,' says Grimes. 'Why don't we tarry here a while, shipmates, and get our strength back for the long haul to Port Leshand?'<br><span class=\"indent\"></span>Blutz casts another nervous glance towards the centre of the island. Rearing above the treetops is the high cone of the volcano, ashen smoke lying above it like a thunderhead. 'I'm not so sure,' he says.<br><span data-piece=\"250_0\" class=\"choice\"><a data-goto=\"sect_288\">Vote for spending a few days here.</a></span><span data-piece=\"250_1\" class=\"choice\"><a data-goto=\"sect_135\">Blutz is right, you should get under way.</a></span>\n",
  "sect_251": "\nShe emerges from the shadows of the entrance: a stately figure with skin the colour of burnished oak and hair like a shower of green stars. Her clothing and accent are not those of a Carab native, but seem to evoke the mysteries of an ancient civilization. 'I am Ejada, witch-queen of this isle,' she tells you. 'I demand tribute from all who come to my shores, but my demands are not excessive. All I'll take is the soul of one of you, to be sacrificed at dawn to my mother the Earth Goddess.'<br><span class=\"indent\"></span>'Send your own soul to hell!' yells Oakley, snatching up a rock and dashing forward. Ejada calmly sweeps her arm, knocking Oakley to the ground as though he'd run into a tree branch.<br><span class=\"indent\"></span>'Return here in the hour before dawn,' Ejada goes on. 'By then you must have decided which of you will give up his soul.'<br><span class=\"indent\"></span>Helping Oakley to his feet, you return to find the jollyboat sunk deep into the sand of the beach. You try digging it up, but it only sinks deeper. 'That's that, then,' sobs Blutz. 'The witch's magic has trapped us here. We'll have to choose who's to die!'<br><span data-piece=\"251_0\" class=\"choice\"><a data-goto=\"sect_308\">Make a raft.</a></span><span data-piece=\"251_1\" class=\"choice\"><a data-goto=\"sect_346\">Hide from Ejada in the jungle.</a></span><span data-piece=\"251_2\" class=\"choice\"><a data-goto=\"sect_327\">Go to her at dawn as she instructed.</a></span>\n",
  "sect_252": "\nThe warship stands much taller than your own vessel, making your few cannon-shots largely ineffective. Your shells smack into the warship's strong oaken flanks with hardly more effect than grape-shot. If only you could score a hit on the enemy's rigging.<br><span class=\"indent\"></span>The warship does not return fire. Those mighty guns could easily blast you to kindling, but she is steering instead so as to pull alongside for a boarding action.<br><span data-piece=\"252_0\" class=\"choice\"><a data-goto=\"sect_35\">It's time for some magic.</a></span><span data-piece=\"252_1\" class=\"choice\"><a data-goto=\"sect_54\">Show off your acrobatics.</a></span><span data-piece=\"252_2\" class=\"choice\"><a data-goto=\"sect_263\">Use the thundercloud fan.</a></span><span data-piece=\"252_3\" class=\"choice\"><a data-goto=\"sect_282\">Don the bronze helmet.</a></span><span data-piece=\"252_4\" class=\"choice\"><a data-goto=\"sect_73\">Stand by to repel boarders.</a></span>\n",
  "sect_253": "\nThe islanders stare in horror at the red death's-head daubed across your face. Several of them step forward with raised spears, angry defiance slowly replacing their initial shock. It is Grimes who realises the cause: 'Those other natives must be their enemies. And they think you're one of 'em.'<br><span data-piece=\"253_0\" class=\"choice\"><a data-goto=\"sect_196\">Shoot one of them.</a></span><span data-piece=\"253_1\" class=\"choice\"><a data-goto=\"sect_215\">Fight your way back to the water.</a></span><span data-piece=\"253_2\" class=\"choice\"><a data-goto=\"sect_234\">Try trickery.</a></span><span data-piece=\"253_3\" class=\"choice\"><a data-goto=\"sect_291\">Wipe off the red dye and offer gifts.</a></span>\n",
  "sect_254": "\nThroughout a tempestuous night, Oakley screams verse after verse of his morbid dirge, vying with the thunder's roar until his voice is as hoarse as the croak of a dying man. You can tell from the looks on the others' faces that they have been infected by Oakley's mood. Desperation at your sorry plight has now been worn down to hopelessness and raw horror.<br><span class=\"indent\"></span>'Dawn,' says Grimes, nodding towards a drear grey gleam beyond the soot-coloured clouds. 'I doubt we'll live to see another.'<br><span class=\"indent\"></span>The day wears relentlessly on, and you grow weaker.<br><span data-piece=\"254_0\" class=\"choice\"><a data-goto=\"sect_254a\">Can you make it?</a></span>\n",
  "sect_254a": "\n\n",
  "sect_255": "\nHow will you circumvent the curse that lies upon the <em>Larnassos</em>?<br><span data-piece=\"255_0\" class=\"choice\"><a data-goto=\"sect_331\">Use the butcher's cleaver.</a></span><span data-piece=\"255_1\" class=\"choice\"><a data-goto=\"sect_350\">Maybe your crucifix will help.</a></span><span data-piece=\"255_2\" class=\"choice\"><a data-goto=\"sect_369\">Try something clever with the toolkit.</a></span><span data-piece=\"255_3\" class=\"choice\"><a data-goto=\"sect_236\">Recite a charm.</a></span><span data-piece=\"255_4\" class=\"choice\"><a data-goto=\"sect_388\">It's time for extreme measures.</a></span>\n",
  "sect_256": "\nThroughout another night and day you are swept westwards by the strong sea current. Sometime after dusk, as night shrouds the vast expanse of water and closes walls of darkness around the tiny confines of your boat, you hear a voice hailing you: 'Ho there! Who is it? I hear your oars - speak up!'<br><span class=\"indent\"></span>Blutz peers out into the darkness. 'I think I see him,' he whispers to the rest of you. 'A lone figure on a raft. Must've been shipwrecked.'<br><span class=\"indent\"></span>'Shall we row over and pick him up?' says Grimes.<br><span class=\"indent\"></span>Predictably, Oakley is against this. 'We have enough bad luck to go around as it is. Why add another hungry mouth to an already overcrowded boat?'<br><span data-piece=\"256_0\" class=\"choice\"><a data-goto=\"sect_294\">Row over to the man on the raft.</a></span><span data-piece=\"256_1\" class=\"choice\"><a data-goto=\"sect_313\">Ignore him.</a></span>\n",
  "sect_257": "\nThe shot rings out in the night and a puff of gunsmoke drifts like silver fog in the moonlight. As the smoke clears you see to your astonishment that Mortice has not fallen. He is just standing there with a ghastly bloodless grin, eyes blazing like a ship's lanterns. Then you notice something else - the bullet didn't miss him. There is a gaping hole torn right through his chest. For a long moment no-one moves a muscle. Silence gives the scene an air of unreality.<br><span class=\"indent\"></span>'He's not a living man!' gasps Blutz at last. 'He's one of the undead!'<br><span data-piece=\"257_0\" class=\"choice\"><a data-goto=\"sect_219\">Attack Mortice bare-handed.</a></span><span data-piece=\"257_1\" class=\"choice\"><a data-goto=\"sect_238\">Draw your sword.</a></span><span data-piece=\"257_2\" class=\"choice\"><a data-goto=\"sect_276\">Cut his raft adrift from the jollyboat.</a></span>\n",
  "sect_258": "\nYou arrive at Leshand harbour to find the town awash with troops. It is not long before you hear the news that has stirred up such panic. 'The nefarious buccaneer Skarvench has captured the Queen of Glorianne,' a stevedore tells you as he unpacks the ship's cargo. 'He's demanding a million doubloons in ransom, otherwise he'll make a gift of her to her arch-enemy the King of Sidonia.'<br><span class=\"indent\"></span>'Woeful news!' groans Oakley. 'The Sidonians will likely break her on the wheel, or tie her to an anchor and send her to sup with Davy Jones! If only we could have done something to prevent it.'<br><span class=\"indent\"></span>You could have, but you frolicked too long in an island paradise. Now your part in history is at an end.<br><div class=\"s3\">THE END</div>\n",
  "sect_259": "\nYou are able to jury-rig a weather cloth using strips torn from everyone's clothing. When this is fitted around the boat it has the effect of raising the freeboard, helping to keep water from sloshing over the sides. You also inspect the planking and make sure that any cracks where the boat is taking in water are plugged with wadding.<br><span class=\"indent\"></span>'Will we stay afloat through another storm like last night's, though?' asks Grimes when he sees you taking these measures.<br><span class=\"indent\"></span>You shrug. 'Pray for better weather.' <br><span data-piece=\"259_0\" class=\"choice\"><a data-goto=\"sect_26\">Continue.</a></span>\n",
  "sect_260": "\nYou reply with a discreet smile and draw the official aside, adopting the conspiratorial tone of one elegantly mannered knave to another. By promising him a lavish share of any treasure you take from Sidonian galleons, you finally manage to convince him to issue you with a letter of marque. <br><span data-piece=\"260_0\" class=\"choice\"><a data-goto=\"sect_244\">Continue.</a></span>\n",
  "sect_261": "\nYou look at the corkscrew in your hand. 'Of course! This is how we'll get our ship.'<br><span class=\"indent\"></span>The others watch you with rekindled concern. 'Maybe you ought to lie down for a bit, skipper?' suggests Blutz. 'You took a nasty knock back there.'<br><span class=\"indent\"></span>In answer you give only a triumphant laugh, setting out towards the harbour with a determined stride they are hard pressed to match. Now you see clearly that it was divine providence that guided your hand to the corkscrew - the same divine providence that deflected the bullet and saved your life. The force of conviction bears you on like a gale until you stand on the quayside, a smile playing on your lips as you gaze at the lapping waves.<br><span class=\"indent\"></span>The others come up just as you are withdrawing the cork from the bottle. They gasp in astonishment to see a weird green vapour billow out, spreading to lie in a thick fog-bank beside the quay. A wind arises, stirs the fog, then dissipates it like a puff of steam.<br><span class=\"indent\"></span>Someone mutters an oath. Where the green fog hung moments before, a ship now lies moored - a fine gilded galleon with a figurehead in the shape of a lion's head. Cannons fashioned to resemble leonine paws adorn her flanks. Her furled sails blaze like sunlit clouds against the azure of the sky.<br><span class=\"indent\"></span>'A magic ship..!' breathes Blutz. 'What'll we call her?'<br><span class=\"indent\"></span>'She's the <em>Providence</em>,' you reply. 'Gentlemen, shall we go aboard?' <br><span data-piece=\"261_0\" class=\"choice\"><a data-goto=\"sect_261a\">Continue.</a></span>\n",
  "sect_261a": "\n\n",
  "sect_262": "\nThe ring sparkles in the rich moonlight. The gold looks almost green, the jewelled eyes have a submarine glow. 'Who could doubt it is the very image of Leviathan, greatest of sea serpents?' You are struck almost breathless in awe. 'See, it all but shines with power! I feel I have only to call upon the serpent by name, and he'll rise up from the depths and sweep this chain asunder.'<br><span class=\"indent\"></span>Every sailor has heard the ancient myths of Leviathan, the sea monster born out of primordial chaos.<br><span class=\"indent\"></span>'As it says in the Book of Job: \"Iron he counts as straw, and brass as rotten wood\",' puts in Oakley.<br><span class=\"indent\"></span>Grimes turns to you with a dour look. 'It is also said: \"If ever thou think to rouse him, consider the struggle that awaits thee and let be.\" And in Isaiah is he not called \"the fleeing serpent, twisting serpent\"? Do not call him up from the deep, I pray you, or we are all dead men.'<br><span data-piece=\"262_0\" class=\"choice\"><a data-goto=\"sect_281\">Insist on using the magic ring.</a></span><span data-piece=\"262_1\" class=\"choice\"><a data-goto=\"sect_72\">Give up the attempt.</a></span>\n",
  "sect_263": "\nOne sweep of the magic fan is enough to produce a powerful gale. The warship's sails snap taut and she is sent veering away with white-flecked billows surging high up around her heaving prow. It is as though the sea a cannon-shot from your bows is being churned up by a mighty storm, while the water around you has only a gentle swell. Your own canvas catches just a strong clear breeze that drives you safely away, while the warship is borne far astern in the grip of the storm.<br><span class=\"indent\"></span>You find the thundercloud fan has gone, vanishing once its power was expended. <br><span data-piece=\"263_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_264": "\nEl Draque clutches you to him. You are powerless to resist; you feel like a sleepwalker. He presses his lips against your throat, and a moment of cold pain is followed by a spreading glow of warmth. Drowsiness clouds your mind as you spiral down into a whirlpool of dark oblivion. You will awaken into the half living world of the undead, cursed to roam the seas without a soul in search of human blood.<br><span class=\"indent\"></span>You failed to save the Queen. You failed to slay Skarvench. You failed even to earn yourself a clean quick death.<br><div class=\"s3\">THE END</div>\n",
  "sect_265": "\nA single sweep of the fan summons a strong wind. The fog swirls and parts, swiftly dispersing into wispy tendrils. You now clearly sight both the crippled <em>Rose</em> and, closer to you, the <em>Moon Dog</em>. She is standing at two o'clock off your starboard bow, just in cannon range. You have the weather gauge, meaning that the wind is blowing from behind you towards the <em>Moon Dog</em> - the ideal position for a sea battle.<br><span class=\"indent\"></span>'Now we have a choice,' says Oakley. 'We can sail in to board her, or stand off and rake her with our guns. What's it to be, skipper?'<br><span class=\"indent\"></span>As captain it is your decision.<br><span data-piece=\"265_0\" class=\"choice\"><a data-goto=\"sect_322\">Steer in towards the <em>Moon Dog</em>.</a></span><span data-piece=\"265_1\" class=\"choice\"><a data-goto=\"sect_341\">Unlimber the cannon.</a></span>\n",
  "sect_266": "\nA deck plank creaks behind you. You turn to see a thin scholarly-looking figure with a neat goatee beard. You have never met him before, but his arcanely patterned robes and peaked cap mark him out unmistakeably. He is the Queen's court wizard, Dr Wild.<br><span class=\"indent\"></span>'You've been quite troublesome, so my brother tells me,' he says in a mock-mild voice.<br><span class=\"indent\"></span>You look at the wand in his hand, already flickering with sorcerous energy. 'I've hardly got started yet,' you tell him.<br><span class=\"indent\"></span>You were hoping to goad him into talking while you edged closer, but he is too wily for that. Instead of replying, he only smiles and gives an almost regretful shake of his head. Waving the wand, he conjures a phantasmal green harpoon out of thin air and hurls it at your chest.<br><span data-piece=\"266_0\" class=\"choice\"><a data-goto=\"sect_266a\">Deflect it with your own magic.</a></span><span data-piece=\"266_1\" class=\"choice\"><a data-goto=\"sect_266b\">Dodge.</a></span><span data-piece=\"266_2\" class=\"choice\"><a data-goto=\"sect_266b\">Can you survive?</a></span>\n",
  "sect_266a": "\nA hastily-recited charm causes the harpoon to evaporate before it strikes you. Wild is taken aback, but only for an instant. Seeing that you also are skilled in the mystic arts, he narrows his eyes in steely determination.<br><span data-piece=\"266a_0\" class=\"choice\"><a data-goto=\"sect_285\">Show him what you can do.</a></span><span data-piece=\"266a_1\" class=\"choice\"><a data-goto=\"sect_304\">He's readying another spell.</a></span>\n",
  "sect_266b": "\n\n",
  "sect_266c": "\nYou throw yourself to one side - not quite fast enough to completely evade the phantasmal harpoon, but at least it only grazes your shoulder. Nursing your wounded arm, you advance towards Wild. He raises his wand, and you can see from the look of fiery purpose in his eyes that he has the measure of you. You cannot count on him to be so careless a second time.<br><span data-piece=\"266c_0\" class=\"choice\"><a data-goto=\"sect_285\">Hit him with a spell of your own.</a></span><span data-piece=\"266c_1\" class=\"choice\"><a data-goto=\"sect_304\">He's readying another spell.</a></span>\n",
  "sect_266d": "\nThe harpoon pierces your flesh and yet, although it feels solid and real, when you look again there is nothing there.<br><span class=\"indent\"></span>Wild sneers at your surprise. 'How can illusory things cause pain, you're wondering? Much more than that, my impetuous young friend - they can kill.'<br><span data-piece=\"266d_0\" class=\"choice\"><a data-goto=\"sect_285\">Hit him with a spell of your own.</a></span><span data-piece=\"266d_1\" class=\"choice\"><a data-goto=\"sect_304\">He's readying another spell.</a></span>\n",
  "sect_266e": "\nYou are impaled by Wild's magical missile. You fall just as if a real harpoon had been driven through your heart. And yet there is no blood. It was an illusion that struck the death-blow, but your death itself is all too real.<br><div class=\"s3\">THE END</div>\n",
  "sect_267": "\n'Well, if it ain't me prodigal orphans!' chortles Skarvench, drawing his sword and pistol as he sees you break from the undergrowth. 'You ran off without collectin' your back pay, mates, so he's a little something on account, like.' So saying, he levels his pistol and pulls the trigger.<br><span class=\"indent\"></span>Pain lances through your shoulder as the shot tears flesh and splinters bone. But sheer hatred of your foe drives you on. A red haze sparkles across your vision, and Skarvench's grinning face is like a painting in blood on the back of your eyes as you race forward with a savage snarl.<br><span data-piece=\"267_0\" class=\"choice\"><a data-goto=\"sect_267a\">Fight.</a></span>\n",
  "sect_267a": "\n\n",
  "sect_268": "\nYour companions look on with sour sidelong glances as you hungrily devour the crabs. You stare back at them defiantly until they turn away. After all, didn't they leave the decision to you? As leader, you must try to keep your strength up.<br><span data-piece=\"268_0\" class=\"choice\"><a data-goto=\"sect_116\">Go back to the boat and put to sea.</a></span><span data-piece=\"268_1\" class=\"choice\"><a data-goto=\"sect_211\">Explore more of the island first.</a></span>\n",
  "sect_269": "\n'In God's name, the devil's caught up with us!' says Oakley with a gasp of horror as the four of you return to the shore.<br><span class=\"indent\"></span>You were bringing up the rear and are still pushing your way out of the undergrowth. Hearing this oath, you hurry to catch up and see what it is that has stopped Oakley and the others dead in their tracks. When you do, it is as though the chill wind of a midwinter night had blown for an instant through the sweltering heat of this tropical jungle. For, out at sea but coming nearer by the minute, lies Skarvench's ship: the dreaded <em>Belle Dame</em>. Drenched in the blood-red light of sunset, it is a sight that closes icy fingers of fear around your heart.<br><span class=\"indent\"></span>'They're making anchorage outside the cove,' says Grimes, shielding his gaze against the low sun. 'It's too shallow for them to bring her right in, lucky for us. They won't know we're here yet. Maybe we'll have a chance of slipping away under cover of darkness.'<br><span class=\"indent\"></span>You rub your jaw, mulling over other options. Despite your hatred of Skarvench - and, yes, admit it: your fear of him - you are curious to know why he's come here. 'We could haul the jollyboat up into the jungle and hide it,' you suggest. 'Then if Skarvench sends a party ashore, we can spy on them.'<br><span class=\"indent\"></span>'Foolishness,' avers Oakley. 'I agree with hiding the boat, but then we should go deep into the jungle and lie low until Skarvench has left. Let's stay well clear of him and his cronies.'<br><span class=\"indent\"></span>What will you do: <br><span data-piece=\"269_0\" class=\"choice\"><a data-goto=\"sect_307\">Try to get off the island after dark.</a></span><span data-piece=\"269_1\" class=\"choice\"><a data-goto=\"sect_326\">Spy on Skarvench's shore party.</a></span><span data-piece=\"269_2\" class=\"choice\"><a data-goto=\"sect_288\">Stay out of sight until they're long gone.</a></span>\n",
  "sect_270": "\nDrawing your pistol, you shoot one of the natives dead just as he is raising his spear to thrust at you.<br><span class=\"indent\"></span>The loud bang startles the other natives. They rush back a few paces, screeching in astonishment. When they see blood spreading from the corpse of the native you shot, they start to make a weird moaning sound and tremble with fright.<br><span class=\"indent\"></span>'It seems they've never seen firearms before,' grunts Oakley. 'Trouble is, you just used your one shot.'<br><span class=\"indent\"></span>'They don't know that, do they. Come on, let's get down to the beach. Don't rush, but don't dawdle either.'<br><span data-piece=\"270_0\" class=\"choice\"><a data-goto=\"sect_400\">Continue.</a></span>\n",
  "sect_271": "\nYour fist comes up and smashes into Ejada's jaw with agonizing force. Agonizing to you, that is. As you reel back, clutching your knuckles and groaning with pain, she laughs languidly and sweeps her arm out, dashing you to the ground without apparent effort.<br><span data-piece=\"271_0\" class=\"choice\"><a data-goto=\"sect_271a\">Can you get up?</a></span>\n",
  "sect_271a": "\n\n",
  "sect_271b": "\nThe feather shield deflected the brunt of her blow, but you can see now that hand-to-hand combat with her is as futile as punching an oak tree.<br><span data-piece=\"271b_0\" class=\"choice\"><a data-goto=\"sect_317\">Let's see her shrug off a pistol ball.</a></span><span data-piece=\"271b_1\" class=\"choice\"><a data-goto=\"sect_384\">Try a spell.</a></span><span data-piece=\"271b_2\" class=\"choice\"><a data-goto=\"sect_5\">Make a run for it.</a></span>\n",
  "sect_271c": "\nYou rise unsteadily, fingering your tender jaw and playing for time until your ears stop ringing. Hand-to-hand combat with her is as futile as punching an oak tree.<br><span data-piece=\"271c_0\" class=\"choice\"><a data-goto=\"sect_317\">Just shoot her.</a></span><span data-piece=\"271c_1\" class=\"choice\"><a data-goto=\"sect_384\">See if a spell does anything.</a></span><span data-piece=\"271c_2\" class=\"choice\"><a data-goto=\"sect_5\">Make a run for it.</a></span>\n",
  "sect_271d": "\nThat's it. You're finished. You try to rise, but her blow broke something inside you. Coughing blood, you nestle your head on the grass-covered flagstones and relax into the arms of easeful death.<br><div class=\"s3\">THE END</div>\n",
  "sect_272": "\nThe natives bring you baked root-bread, fruit and gourds full of fresh water. You can take enough provisions for two meals.<br><span class=\"indent\"></span>They also take a look at your battered craft and help to patch up any damage, demonstrating amazing skill with no tools other than bamboo and woven leaves.<br><span class=\"indent\"></span>With the help of sign language, the chief explains to you that not many ocean-going vessels visit this island. If you were to stay here you might be marooned for months. On the other hand, he offers to escort you southwards to the main shipping-lane, where you might meet up with a ship bound for civilization. You soon realise that this would not be a free service, however. He expects a gift of some kind.<br><span data-piece=\"272_0\" class=\"choice\"><a data-goto=\"sect_310\">Give him something.</a></span><span data-piece=\"272_1\" class=\"choice\"><a data-goto=\"sect_177\">Head on to Leshand without his help.</a></span><span data-piece=\"272_2\" class=\"choice\"><a data-goto=\"sect_329\">Stay on the island and wait for rescue.</a></span><span data-piece=\"272_3\" class=\"choice\"><a data-goto=\"sect_348\">Stay on the island and wait for rescue.</a></span>\n",
  "sect_273": "\nTowards sunset the storm finally blows over, leaving the clouds in the west lying like blots of blood across the steel rim of the sea.<br><span class=\"indent\"></span>The four of you are by now slumped in the bottom of the boat, as limp as corpses on a trestle. Your lips are black and blistered, your flesh fish-white and swollen with sores. Blutz gnaws his knuckle until it bleeds, just to feel moisture on his tongue. After looking up at the sky Grimes starts to shiver, either from dread of the onrushing night or because he is in the first stages of fever.<br><span class=\"indent\"></span>A shadow shimmers against the last light of day. A ship's sails show purple-black against the red haze. 'We're saved!' gasps Oakley, raising his hands to hail the ship. 'Ahoy there!'<br><span data-piece=\"273_0\" class=\"choice\"><a data-goto=\"sect_292\">You have a sudden premonition.</a></span><span data-piece=\"273_1\" class=\"choice\"><a data-goto=\"sect_311\">Hail the ship.</a></span><span data-piece=\"273_2\" class=\"choice\"><a data-goto=\"sect_330\">Keep quiet until she's passed.</a></span>\n",
  "sect_274": "\nYou select three diamonds, each the size of a walnut.<br><span class=\"indent\"></span>'They're worth a queen's ransom!' gasps Blutz as he sees you gather the jewels together.<br><span class=\"indent\"></span>'Perhaps that's what we should call the ship we're going to buy them with,' you reply, smiling. 'The <em>Queen's Ransom</em>.'<br><span class=\"indent\"></span>Leaving Mandrigard to sleep over his still-lavish treasure hoard, you tiptoe out of the cabin and ascend to the deck.<br><span data-piece=\"274_0\" class=\"choice\"><a data-goto=\"sect_217\">Continue.</a></span>\n",
  "sect_275": "\nHunger saps your strength. You spend the night half in slumber and half in a dead faint. Cold sweat soaks your clothes. Even sunrise fails to warm the chill out of your bones, and as you crouch at the back of the boat shivering you realise you are running a fever.<br><span data-piece=\"275_0\" class=\"choice\"><a data-goto=\"sect_275a\">Is this the end?</a></span>\n",
  "sect_275a": "\n\n",
  "sect_275b": "\nDeprivation and hardship have slowly taken their toll. You no longer have the strength to fight off sickness, nor even to care whether you live or die. You sink into a coma from which there will be no awakening, that long darkness which has no dawn.<br><div class=\"s3\">THE END</div>\n",
  "sect_276": "\nCasting off, you row away from the raft with all haste. It dwindles into the distance until it is visible only as a moonlit speck far to stern. Mortice is still to be seen jumping in rage, appearing like a guttering candle flame in the distant darkness. His last curse comes like a sigh of wind across the water: 'El Draque drink your blood, you swabs...' and then there is silence and unbroken night.<br><span class=\"indent\"></span>At last you deem it safe to sleep. Tomorrow you pray you will sight another vessel. How much longer can you survive otherwise?<br><span data-piece=\"276_0\" class=\"choice\"><a data-goto=\"sect_332\">Continue.</a></span>\n",
  "sect_277": "\n'A pretty sunrise,' says Oakley painfully through swollen lips. 'It'll likely be the last we see in this life.'<br><span class=\"indent\"></span>Grimes nods. 'It's warm enough where we're going, my merry lads.'<br><span class=\"indent\"></span>You give a grunt of disapproval. 'Don't tempt the Devil with your grim jokes, Mister Grimes. He might think you're wishing out loud, and come to collect you personally. We're bound for a better harbour than that, I think. Hellfire isn't for honest scoundrels like us, but for rank fiends of Skarvench's cut.'<br><span data-piece=\"277_0\" class=\"choice\"><a data-goto=\"sect_277a\">Can you go on?</a></span>\n",
  "sect_277a": "\n\n",
  "sect_278": "\nYou have always made sure of nurturing a network of paid informers in large towns such as Leshand, and now your foresight reaps dividends. You soon discover that Skarvench recently collected all outstanding debts and redeemed his treasures for hard cash. The evidence points to some sort of ambitious project for which he will need every bit of finance that he can muster.<br><span class=\"indent\"></span>'I've heard he's engaged a shipwright in Port Selenice,' one of your informants tells you. 'A special commission it was, for a ship to be called the <em>Moon Dog</em>. Got a lot of odd features.'<br><span class=\"indent\"></span>'Such as?'<br><span class=\"indent\"></span>He leans closer, dropping his voice to a whisper. 'Gun ports along the keel! And other things, even weirder than that. Perhaps ol' Skarvench has gone mad - but heaven help us all if so, for a mad dog is no nicer than a sane one.'<br><span class=\"indent\"></span>As you turn away, the informant snatches at your sleeve. 'Here, what about my pay?'<br><span class=\"indent\"></span>You tug away from his grip. 'For that tittle-tattle you've just told me? It's common knowledge that I could've had from any gossip in the town. That's not what I pay you for, and you know it.'<br><span class=\"indent\"></span>Ignoring his grumbles, you walk away.<br><span data-piece=\"278_0\" class=\"choice\"><a data-goto=\"sect_202\">Listen out for rumours about the Queen.</a></span><span data-piece=\"278_1\" class=\"choice\"><a data-goto=\"sect_164\">Find out what's known about El Draque.</a></span><span data-piece=\"278_2\" class=\"choice\"><a data-goto=\"sect_69\">Pay a visit to Master Capstick.</a></span><span data-piece=\"278_3\" class=\"choice\"><a data-goto=\"sect_12\">Go shopping for supplies.</a></span><span data-piece=\"278_4\" class=\"choice\"><a data-goto=\"sect_31\">Get some of your items identified.</a></span><span data-piece=\"278_5\" class=\"choice\"><a data-goto=\"sect_50\">Apply for a letter of marque.</a></span><span data-piece=\"278_6\" class=\"choice\"><a data-goto=\"sect_409\">Apply for a letter of marque.</a></span><span data-piece=\"278_7\" class=\"choice\"><a data-goto=\"sect_107\">You've done all you can in Port Leshand.</a></span>\n",
  "sect_279": "\n'I got it fair and square, by the law of the sea,' snorts Mandrigard. 'Took it from a marble hall atop an island cliff, and no hand was raised against me and my merry lads. But as we went - not a man Jack of us able to straighten his back under the weight of loot, mind you - an old fool of a priest called after us with a curse. He told us we'd know no rest, sailing the ocean's breadth for ever more, and never able to find port nor set foot ashore so long as our hands were tainted with the theft of sacred treasures.'<br><span class=\"indent\"></span>He pauses, draining his wine-cup yet again. It occurs to you that you have not seen him refill it from the jug, but it never seems empty.<br><span class=\"indent\"></span>Rain rattles on the shutters across the cabin window. The ship's timbers groan and sigh as she sails on before the wind.<br><span data-piece=\"279_0\" class=\"choice\"><a data-goto=\"sect_46\">Ask Mandrigard something else.</a></span><span data-piece=\"279_1\" class=\"choice\"><a data-goto=\"sect_65\">Explore the rest of his ship.</a></span>\n",
  "sect_280": "\nLeading your comrades out of town, you walk to a secluded cove along the beach. 'What have we come here for?' asks Blutz. 'Is it a smugglers' cove?'<br><span class=\"indent\"></span>Grimes nods approvingly. 'A good idea, if so. Any smugglers who try to avoid the port levy in Selenice can hardly go whining to the Brethren if we seize their contraband.'<br><span class=\"indent\"></span>'No, there aren't any smugglers,' you say. 'But if I'm right, it's here we'll get our ship.' You wait at the fringe of the beach with sea foam at your feet. Sunset first sets the sky afire, then drains it of colour. Finally, raising the conch-shell horn to your lips, you blow a long low note. It resounds out into the velvet dusk, rolling eerily across the water.<br><span class=\"indent\"></span>You lower the horn, but it continues to sound. The note gets deeper and louder. It is throbbing in your hands now, pulsing with magical energy. 'It's going to explode!' shrieks Blutz in sudden alarm. 'Get rid of it, skipper!' Before you can stop him, he has snatched the horn and lobbed it far out into the waves.<br><span class=\"indent\"></span>The sound continues to build under the water, like the deepest rumbling note of a submerged organ. You avert your eyes, hands pressed to your ears, as a titanic blast sends a waterspout gushing into the air. Droplets of brine shower down around you. You look back out to sea. Something has bobbed up from the sea bed and is coming towards you: a coracle formed of a giant half-shell drawn by a shark and a dolphin. These strange steeds are tethered to the coracle with seaweed fronds, like horses pulling a carriage. 'Climb aboard,' says the shark in a sharp voice. 'We'll take you to Neptune's harbour.'<br><span class=\"indent\"></span>The dolphin has a softer tone: 'But beware, as you must find your own vessel for the journey back.'<br><span class=\"indent\"></span>Choose:<br><span data-piece=\"280_0\" class=\"choice\"><a data-goto=\"sect_233\">Board the coracle.</a></span><span data-piece=\"280_1\" class=\"choice\"><a data-goto=\"sect_203\">Refuse.</a></span>\n",
  "sect_281": "\nDespite Grimes's earnest entreaties, you decide to call upon the power of Leviathan. The decision alone is enough. As you raise the hand bearing the ring - even before you can speak the serpent's name - you sense something dark and monstrous rising from the illimitable depths. Waves rear like mountains to blot out the sky. The wind shrieks in fear and flees in all directions.<br><span class=\"indent\"></span>Leviathan rises out of the water. His body is a tower of bronze scales, each the size of a shield, green with brine stain. Phosphorescent venom drips from his gaping jaws in a torrent of liquid white fire. Dank poisonous vapour curls up from the black caves of his nostrils.<br><span class=\"indent\"></span>You realise your mistake at once - you could never hope to command an entity so fearsome. As you cower in the boat, you see one more thing that strikes you full of mortal terror; on the face of the colossus there is now a look of fear. Even he will be hard-pressed to stand against Leviathan, and in their titanic battle four tiny mortals will be trodden underfoot, sent plunging into the ocean depths. You have brought your own doom upon you.<br><div class=\"s3\">THE END</div>\n",
  "sect_282": "\nThe instant you place the helmet on your brow, your mind becomes a maelstrom of bloody battle-images. All manner of martial tricks, tactics and harsh killing-lore are now second nature to you. For the duration of just this one battle, you are as fierce and careless of fear as any Spartan warrior. <br><span class=\"indent\"></span>Grappling hooks hug your vessel to the warship's flank, and marines come swarming over the rail with loud battle-cries. The fighting rages from stem to stern - the clash of cutlasses, the bangs and acrid smoke of pistol shots, the screams of wounded men. Blood and gunpowder are the smells mingling on the briny breeze this afternoon.<br><span data-piece=\"282_0\" class=\"choice\"><a data-goto=\"sect_282a\">Fight.</a></span>\n",
  "sect_282a": "\n\n",
  "sect_282b": "\nThe marines have numbers on their side, but they are pitched against some of the toughest buccaneers on the Carab Sea. Your men know they are fighting for their very lives, since almost every one of them has a price on his head. And among them strides their captain, imbued with the spirit of the ancient Spartans, who never asked, 'How many are the enemy?' but only 'Where are they?'<br><span data-piece=\"282b_0\" class=\"choice\"><a data-goto=\"sect_225\">Desperation wins the day.</a></span>\n",
  "sect_283": "\nThe words have hardly left your lips when he gives an exultant shriek of laughter and launches himself up the side, scaling towards the rail with the speed of a spider running up a wall. Behind him, the two oarsmen throw off their cowls and also begin to climb. You see faces pale as candlewax gleaming in the lantern-light, and long sharp teeth bared in naked bloodlust.<br><span class=\"indent\"></span>Then an even more horrific sight at last draws a cry of fear from your lips, as a dozen other figures erupt out of the black water and start to make their way up the side of the ship. These are more grotesque than the first three, with ravaged faces of bare bone and grave-mould. Barnacles crust their tarnished breastplates and their once-fine coats hang about them like tattered shrouds.<br><span class=\"indent\"></span>'All hands on deck!' you manage to call out, at last freeing yourself from the paralysis of terror as the first of the monsters reaches the rail. 'We're being boarded by vampires!' <br><span data-piece=\"283_0\" class=\"choice\"><a data-goto=\"sect_321\">Continue.</a></span>\n",
  "sect_284": "\nA steady wind arises quickly in answer to your magical summons. It is not strong - you dare not tamper with the elements too much - but it is enough for your purposes. The fog swirls and breaks apart, swiftly dispersing into wispy tendrils. You now have a clear view of both the crippled <em>Rose</em> and, nearer to you, Skarvench's ship the <em>Moon Dog</em>. She is standing at two o'clock off your starboard bow, just within cannon range. You have the weather gauge, meaning that the wind is blowing from behind you towards the <em>Moon Dog</em> - the ideal position for a sea battle.<br><span class=\"indent\"></span>'Now we have a choice,' says Oakley. 'We can sail in for boarding, or stand off and rake her with our guns. What's it to be, skipper?'<br><span class=\"indent\"></span>A snap decision is needed.<br><span data-piece=\"284_0\" class=\"choice\"><a data-goto=\"sect_322\">Steer in towards the <em>Moon Dog</em>.</a></span><span data-piece=\"284_1\" class=\"choice\"><a data-goto=\"sect_341\">Unlimber those cannon.</a></span>\n",
  "sect_285": "\n'You would match your magic against mine?' sneers Wild. 'You fool - didn't the hurricane I summoned give you any inkling of my power?'<br><span class=\"indent\"></span>'It was impressive,' you admit. 'More than I could achieve, at least with any hope of controlling it. But I think you're bluffing, Doctor; I think that hurricane took most of your power. That and the fog. Now we're evenly matched.'<br><span class=\"indent\"></span>A web of fiery tendrils shoots from your wand, igniting Wild's robes. As the flames lick up to engulf him, he gives a single scream like nothing you've ever heard from a human throat, then stumbles back against the rail and falls into the sea.<br><span class=\"indent\"></span>'Don't congratulate yourself too soon.' You whirl to see an elderly aristocratic-looking man standing in the companion-way with sword and pistol. It can only be Admiral Calidor, commander of the Queen's navy. 'Well, don't just stand there,' he continues. 'I heard enough to guess you're on our side, whoever you are; now's your chance to prove it. Stand by to repel boarders!'<br><span class=\"indent\"></span>He gestures, and you look up to see Skarvench and his pirates sliding down out of the mist like spiders on their webs. Marines rush up on deck to give battle. Calidor himself closes with the lumbering figure of Porbuck.<br><span class=\"indent\"></span>The fight rages all around you, but you stride oblivious across the deck. There is only one foe you must face - and now you see him, looming out of the eerie mist, and all your hatred wells up in a mighty roar: 'Skarvench!'<br><span class=\"indent\"></span>'Ah, mate,' he says with a strange smile. 'Ready to die, are ye?'<br><span data-piece=\"285_0\" class=\"choice\"><a data-goto=\"sect_171\">Continue.</a></span>\n",
  "sect_286": "\nYour sword flashes out, taking his life before he knows it. With hands pressed to his pierced heart, mouth opening and closing like a fish out of water, he sinks to the floor and expires in silence. You waste no pity on him. He has done the evil Skarvench's every bidding without a qualm for all these years, happy to collude in wickedness even if not bold enough to do wicked deeds of his own. You turn away from the body and hurry up on deck. <br><span data-piece=\"286_0\" class=\"choice\"><a data-goto=\"sect_172\">Continue.</a></span>\n",
  "sect_287": "\nYou decide to let Blutz eat the crabs. He is the least sturdy of the four of you, and even a meagre meal will help keep his spirits up. As Blutz tucks in, deftly cracking the shells on a rock and shredding the tough flesh with his teeth, Grimes catches your eye and nods sagely. He agrees with your judgement.<br><span data-piece=\"287_0\" class=\"choice\"><a data-goto=\"sect_211\">Explore the island.</a></span><span data-piece=\"287_1\" class=\"choice\"><a data-goto=\"sect_116\">Sail on to the next island in the chain.</a></span>\n",
  "sect_288": "\n\n",
  "sect_288a": "\nYou spend nearly a week on the island, sustained by nature's bounty and an ample supply of fresh rainwater draining down off the slopes of the volcano. Your skills allow you to supplement your diet with game, which makes a welcome change from fish.<br><span class=\"indent\"></span>At last, by common consent, you decide it is time to move on. The volcano is producing occasional ominous growls from deep in the earth, and you have no desire to still be here when it finally erupts. Climbing aboard your boat, the four of you resume your arduous voyage towards Port Leshand. <br><span data-piece=\"288a_0\" class=\"choice\"><a data-goto=\"sect_135\">Continue.</a></span>\n",
  "sect_288b": "\nYou spend nearly a week on the island, sustained by nature's bounty and an ample supply of fresh rainwater draining down off the slopes of the volcano. You subsist comfortably enough by gathering nuts and berries.<br><span class=\"indent\"></span>At last, by common consent, you decide it is time to move on. The volcano is producing occasional ominous growls from deep in the earth, and you have no desire to still be here when it finally erupts. Climbing aboard your boat, the four of you resume your arduous voyage towards Port Leshand. <br><span data-piece=\"288b_0\" class=\"choice\"><a data-goto=\"sect_135\">Continue.</a></span>\n",
  "sect_289": "\nIn the glimmering predawn, as your little boat drifts gently on across the still ocean, you have your first chance to take stock of the situation. You must judge every factor with great care from now on: even the smallest mistake could spell disaster, and you will need every scrap of luck and cleverness if you are to make it to civilized lands alive.<br><span class=\"indent\"></span>First, your companions on the voyage. Grimes, lanky and lantern-jawed, is a lugubrious fellow but despite his habit of expecting the worst he is a good man to have aboard, being neither timid nor quarrelsome. Oakley is tough and smart but abrasive - a possible challenge to your leadership, if you fail to assert yourself. All the same, you have been in enough tough scrapes together in the past to know that you can count on him too. Blutz is the weak link of the group: a timid, clumsy little scuttlebutt of a man. But you know that he can be clever and resourceful when he has to be.<br><span class=\"indent\"></span>The three of them look at you and Oakley says, 'Well, where shall we point our prow?'<br><span class=\"indent\"></span>Look at the jollyboat map. Port Leshand is your obvious destination.<br><span data-piece=\"289_0\" class=\"choice\"><a data-goto=\"sect_2\">Steer straight for it, heading due west.</a></span><span data-piece=\"289_1\" class=\"choice\"><a data-goto=\"sect_21\">Set a course through the Smoking Islands.</a></span><span data-piece=\"289_2\" class=\"choice\"><a data-goto=\"sect_40\">Steer well to the south of the islands.</a></span>\n",
  "sect_290": "\nClosing with your foe, you seize her at wrist and elbow and try to bend her arm around behind her back. You have used the selfsame hold on some of the nastiest bullies to sail the seven seas, and you remember one fellow in particular - a scar-faced gorilla called Gutshredder Turnbull - weeping like a baby as he begged you to let go.<br><span class=\"indent\"></span>Against Ejada, the armlock is useless. You might as well be trying to break the branch of an oak tree. After a brief tussle, she flings you to the ground with a painful jolt. <br><span data-piece=\"290_0\" class=\"choice\"><a data-goto=\"sect_290a\">Can you fight on?</a></span>\n",
  "sect_290a": "\n\n",
  "sect_290b": "\nDespite her scornful laugh you leap up ready to renew the attack. But how can you overcome a foe with seemingly limitless strength?<br><span data-piece=\"290b_0\" class=\"choice\"><a data-goto=\"sect_271\">Deliver your haymaker punch.</a></span><span data-piece=\"290b_1\" class=\"choice\"><a data-goto=\"sect_309\">Go for a body slam.</a></span><span data-piece=\"290b_2\" class=\"choice\"><a data-goto=\"sect_317\">Use your pistol.</a></span><span data-piece=\"290b_3\" class=\"choice\"><a data-goto=\"sect_384\">Pit your magic against hers.</a></span><span data-piece=\"290b_4\" class=\"choice\"><a data-goto=\"sect_5\">Beat a hasty retreat.</a></span>\n",
  "sect_290c": "\nThat's it. You're finished. You try to rise, but your legs won't move. Your back is broken. Coughing blood, you nestle your head on the grass-covered flagstones and relax into the arms of easeful death.<br><div class=\"s3\">THE END</div>\n",
  "sect_291": "\n\n",
  "sect_291a": "\nYou must offer the natives one of the following; they won't accept anything else: <br><span data-piece=\"291a_0\" class=\"choice\"><a data-goto=\"sect_291c\">A sword.</a></span><span data-piece=\"291a_1\" class=\"choice\"><a data-goto=\"sect_291d\">A pistol.</a></span><span data-piece=\"291a_2\" class=\"choice\"><a data-goto=\"sect_291e\">An amulet.</a></span><span data-piece=\"291a_3\" class=\"choice\"><a data-goto=\"sect_291f\">A wand.</a></span><span data-piece=\"291a_4\" class=\"choice\"><a data-goto=\"sect_291g\">A ship in a bottle.</a></span><span data-piece=\"291a_5\" class=\"choice\"><a data-goto=\"sect_291h\">A conch-shell horn.</a></span><span data-piece=\"291a_6\" class=\"choice\"><a data-goto=\"sect_291i\">A bat-shaped talisman.</a></span><span data-piece=\"291a_7\" class=\"choice\"><a data-goto=\"sect_291j\">A black kite.</a></span><span data-piece=\"291a_8\" class=\"choice\"><a data-goto=\"sect_291k\">Don't give them anything.</a></span>\n",
  "sect_291b": "\nYou display all your belongings, but you don't have anything that interests the islanders. Their mood starts to turn distinctly nasty. <br><span class=\"indent\"></span>'Time we were going,' says Grimes. But the islanders see what you have in mind. They close ranks around you.<br><span data-piece=\"291b_0\" class=\"choice\"><a data-goto=\"sect_215\">Fight your way back to the boat.</a></span>\n",
  "sect_291c": "\n\n",
  "sect_291d": "\n\n",
  "sect_291e": "\n\n",
  "sect_291f": "\n\n",
  "sect_291g": "\n\n",
  "sect_291h": "\n\n",
  "sect_291i": "\n\n",
  "sect_291j": "\n\n",
  "sect_291k": "\nBad move,' Oakley says. 'Don't show a dog and bone and then tell him he can't have a gnaw of it.'<br><span class=\"indent\"></span>He's right. The islanders' disappointment swiftly turns to anger. They are pressing closer and you don't like that murderous look in their eyes.<br><span data-piece=\"291k_0\" class=\"choice\"><a data-goto=\"sect_215\">Fight your way back to the beach.</a></span>\n",
  "sect_292": "\nA dim flicker of memory makes you shudder. Watching the tall black sails against the sunset, you are reminded of an ancient mariners' legend that tells of the doomed Captain Mandrigard, master of a vessel called the <em>Larnassos</em>. After stealing the sacred treasures of the Temple of Dionysus, he was cursed never to set foot on shore again 'while his hand was still sullied with theft'. According to myth, his crew found some way to escape the curse but Mandrigard himself never did, and he still sails the seven seas to this day. Anyone who sets foot aboard the <em>Larnassos</em> now is cursed to stay on her for ever.<br><span data-piece=\"292_0\" class=\"choice\"><a data-goto=\"sect_311\">Hail the ship.</a></span><span data-piece=\"292_1\" class=\"choice\"><a data-goto=\"sect_330\">Let her go by in the dusk.</a></span>\n",
  "sect_293": "\nYou have soon gathered a small pile of the items that catch your eye. These include a conch-shell horn, an ancient bronze helmet, a ring in the form of a dragon, and a fan with the shape and colouring of a thundercloud.<br><span class=\"indent\"></span>'Yes, any of this lot could well be magical,' agrees Oakley, scrutinizing your selection. Like you, he has the practiced adventurer's instinct for such things. 'How many shall we take?'<br><span class=\"indent\"></span>After a brief conference, you decide to take only two items. By the pirates' code you should not steal from the captain of a vessel that has shown you hospitality. But weighed against that is the fact that Mandrigard knowingly lured you into the same curse that has trapped him here.<br><span class=\"indent\"></span>'Sometimes I hanker for the old-fashioned days of piracy,' complains Blutz, 'when we'd count plain wealth as treasure and didn't look for a patina of magic to tart it up.' He is looking longingly at a diamond the size of a walnut which lies on the captain's table.<br><span data-piece=\"293_0\" class=\"choice\"><a data-goto=\"sect_139\">Draw on your knowledge of folklore.</a></span><span data-piece=\"293_1\" class=\"choice\"><a data-goto=\"sect_293a\">Pick which items you'll take.</a></span>\n",
