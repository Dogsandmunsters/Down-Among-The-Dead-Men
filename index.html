  "sect_293a": "\nMake your decision quickly before Mandrigard wakes up.<br><span data-piece=\"293a_0\" class=\"choice\"><a data-goto=\"sect_293b\">A diamond.</a></span><span data-piece=\"293a_1\" class=\"choice\"><a data-goto=\"sect_293c\">The thundercloud fan.</a></span><span data-piece=\"293a_2\" class=\"choice\"><a data-goto=\"sect_293d\">The conch-shell horn.</a></span><span data-piece=\"293a_3\" class=\"choice\"><a data-goto=\"sect_293e\">The bronze helmet.</a></span><span data-piece=\"293a_4\" class=\"choice\"><a data-goto=\"sect_293f\">The dragon ring.</a></span>\n",
  "sect_293b": "\n\n",
  "sect_293c": "\n\n",
  "sect_293d": "\n\n",
  "sect_293e": "\n\n",
  "sect_293f": "\n\n",
  "sect_293g": "\n'So that's one of 'em,' mutters Grimes. 'What else could be useful?'<br><span data-piece=\"293g_0\" class=\"choice\"><a data-goto=\"sect_293b\">A diamond.</a></span><span data-piece=\"293g_1\" class=\"choice\"><a data-goto=\"sect_293c\">The thundercloud fan.</a></span><span data-piece=\"293g_2\" class=\"choice\"><a data-goto=\"sect_293d\">The conch-shell horn.</a></span><span data-piece=\"293g_3\" class=\"choice\"><a data-goto=\"sect_293e\">The bronze helmet.</a></span><span data-piece=\"293g_4\" class=\"choice\"><a data-goto=\"sect_293f\">The dragon ring.</a></span>\n",
  "sect_293h": "\nHaving indulged their lust for treasure, your companions would like to help themselves to the other items, but you draw them aside. 'Two items was what we agreed.'<br><span class=\"indent\"></span>Outside, salt spray billows across the deck, driven by high winds that stretch the sails hard against the rigging. 'It's a wonder she ain't broke up long since,' says Blutz.<br><span class=\"indent\"></span>'She's a cursed ship,' declares Oakley matter-of-factly. 'Such vessels have an unnatural resilience.'<br><span class=\"indent\"></span>Grimes suppresses a shudder at the mention of the curse. 'It's time we quit this vessel, mates.'<br><span data-piece=\"293h_0\" class=\"choice\"><a data-goto=\"sect_236\">Recite a charm.</a></span><span data-piece=\"293h_1\" class=\"choice\"><a data-goto=\"sect_255\">Use an item.</a></span><span data-piece=\"293h_2\" class=\"choice\"><a data-goto=\"sect_388\">Good idea. But how?</a></span>\n",
  "sect_294": "\nYou row nearer, watching as the raft and its occupant slowly take shape out of the gloom. He is an old man, thin and wizened as a bent stick, whose eyes shine with a pale moon-coloured light. Dark crusted stains in his beard make you wonder if he has resorted to drinking salt water, until you notice the full bucket and long box of provisions beside him on the raft.<br><span class=\"indent\"></span>His mouth cracks open in a long-toothed cackle. 'The fates be praised! Here am I adrift, poor old Timmy Mortice, an' here come four stalwarts to rescue me. 'Tis a miracle! Come and share my water, mates, an' let's swap our stories.'<br><span data-piece=\"294_0\" class=\"choice\"><a data-goto=\"sect_29\">Tell him about yourselves.</a></span><span data-piece=\"294_1\" class=\"choice\"><a data-goto=\"sect_48\">Begin by asking him about himself.</a></span>\n",
  "sect_295": "\nThe box is filled with yellow bones and tatters of wet rag. Choking back your disgust, you reach in to rummage amongst these until you discover a few items of treasure. There is a bat-shaped talisman, a rusty sword, and a diamond almost as big as a walnut.<br><span class=\"indent\"></span>Blutz is still staring around nervously. 'I don't get it,' he says. 'What happened to the old codger?'<br><span class=\"indent\"></span>Oakley lifts the skull out of the box and gazes at it for a moment, then throws it far off into the darkness. You see it gleam in the moonlight, then there is a splash. 'Gone for good, I reckon,' says Oakley. 'Let's help ourselves to some of that food he had.'<br><span class=\"indent\"></span>Grimes shakes his head. 'It's gone off. The water too.'<br><span class=\"indent\"></span>You push past him, but he is right. Mortice's provisions are now rancid and mould-covered, showing every sign of being months old. The water in the barrel is no more than stagnant green murk.<br><span class=\"indent\"></span>Returning to your boat, you jettison the raft and row a good distance before finally settling down for the night. 'We're going to have to pray a ship comes along tomorrow,' says Oakley as you drift off to sleep. 'I don't think we can hold out much longer.' <br><span data-piece=\"295_0\" class=\"choice\"><a data-goto=\"sect_332\">Continue.</a></span>\n",
  "sect_296": "\nThe fighting rages fiercely and, although sickened at the need for bloodshed, you soon realise that it must continue until you have defeated or driven off all of them. If you tried to retreat down the ladder while there were still natives on the cliff tops, they could easily pick you off with thrown rocks. Inspired by your example, your friends lay about them with gusto as the natives charge to the attack with spears and clubs.<br><span data-piece=\"296_0\" class=\"choice\"><a data-goto=\"sect_296a\">Keep fighting.</a></span>\n",
  "sect_296a": "\n\n",
  "sect_296b": "\nAfter a short and brutal exchange of blows, most of the natives lie senseless and the remainder are fleeing in terror. You hurry back down to the jollyboat and put to sea without delay. <br><span data-piece=\"296b_0\" class=\"choice\"><a data-goto=\"sect_116\">Continue.</a></span>\n",
  "sect_297": "\nYou settle on a cheap dive close to the shanty town as the best place to find news of Skarvench. There, under a luridly painted sign depicting a man hung upside-down, the evil pirate captain has whiled away many an hour ashore in gambling and rum-soaked revelry.<br><span class=\"indent\"></span>Raucous laughter issues through the open door, but the whole tavern goes silent for a moment as you step inside. Dozens of ugly faces turn to stare as you saunter across the sawdust-strewn planks of the floor.<br><span class=\"indent\"></span>'Like an angel passing,' you remark to your friends, recalling the old superstition.<br><span class=\"indent\"></span>'Aye,' mutters Grimes under his breath, 'the Angel of Death. Let's scarper, mates. This is no place to loiter in. It's a den of vicious sea-rats.'<br><span class=\"indent\"></span>Slowly the babble of drunken chatter returns, but many sullen eyes remain fixed on you.<br><span data-piece=\"297_0\" class=\"choice\"><a data-goto=\"sect_146\">Stay here despite the danger.</a></span><span data-piece=\"297_1\" class=\"choice\"><a data-goto=\"sect_297a\">Find somewhere else to drink.</a></span>\n",
  "sect_297a": "\n'The beer there is like ditchwater anyway,' says Oakley as you slope off down the street.<br><span data-piece=\"297a_0\" class=\"choice\"><a data-goto=\"sect_183\">Seek out information about El Draque.</a></span><span data-piece=\"297a_1\" class=\"choice\"><a data-goto=\"sect_221\">Find out news of Queen Titania.</a></span><span data-piece=\"297a_2\" class=\"choice\"><a data-goto=\"sect_392\">Finished with listening to rumours.</a></span>\n",
  "sect_298": "\nThere is nothing you can do to evade capture. Dragged back in hemp bonds to the <em>Belle Dame</em>, you are hauled up on deck and tossed like sacrificial offerings in front of Skarvench. In the stark moonlight, his black beard and white face make him look the very picture of Satan himself. 'Bilge-rotten blasted fiend!' you yell at him. 'You can't force honest men to live a villain's life!'<br><span class=\"indent\"></span>He scowls and spits. 'Aye, you're right, mate. Honest toil's what you four thrive on, ain't it? You aren't buccaneer material - I see that now. Well, I'll give you honest toil. How'd ye like scrape the barnacles off the hull, for starters?<br><span class=\"indent\"></span>Lashed to ropes, the four of you are swung overboard and dragged back and forth along the keel of the ship. Soon the flesh is ragged on your bruised bones, and brine floods into your anguished lungs. Darkness closes over you for the last time. It is the end.<br><div class=\"s3\">THE END</div>\n",
  "sect_299": "\nHow many diamonds are you spending to buy a ship?<br><span data-piece=\"299_0\" class=\"choice\"><a data-goto=\"sect_299a\">Three.</a></span><span data-piece=\"299_1\" class=\"choice\"><a data-goto=\"sect_299b\">Two.</a></span><span data-piece=\"299_2\" class=\"choice\"><a data-goto=\"sect_299c\">Just the one.</a></span>\n",
  "sect_299a": "\n\n",
  "sect_299b": "\n\n",
  "sect_299c": "\n\n",
  "sect_300": "\nSomehow you have to get a bigger ship, as your current one is no match for Skarvench's heavily-armed galleon. Sitting in your cabin aboard the <em>Lady of Shalott</em>, you mull over the options open to you.<br><span data-piece=\"300_0\" class=\"choice\"><a data-goto=\"sect_319\">Go looking for El Draque's treasure.</a></span><span data-piece=\"300_1\" class=\"choice\"><a data-goto=\"sect_338\">Sail in search of the ship frozen in ice.</a></span><span data-piece=\"300_2\" class=\"choice\"><a data-goto=\"sect_357\">Resort to plain dishonest piracy.</a></span>\n",
  "sect_301": "\nOn returning to Port Selenice you go straight to Master Kemp's shipyard, where your treasure secures you a fair-sized galleon in place of your small sloop. You check her out from stem to stern, and despite finding a few faults you have a good instinct about her. Patting one of the cannon, you say, 'This is the ship for us. What's she called, Master Kemp?'<br><span class=\"indent\"></span>'My friend,' he replies, 'she is the <em>Shivered Timber</em>.'<br><span data-piece=\"301_0\" class=\"choice\"><a data-goto=\"sect_301a\">Continue.</a></span>\n",
  "sect_301a": "\n\n",
  "sect_302": "\nHe looks you long and hard in the eyes, then turns away with a snarl and a muttered oath. 'Davy Jones's teeth! This one's will is too strong...' He glances back up at you, but the earlier mask of pleasantry is now entirely peeled away to reveal a look of pure murderous hatred. 'Very well. We cannot come up uninvited. But be warned, you frail thing of daylight and warm blood: do not touch my treasure. For if you do, I promise you a curse that will harry you into the grave and haunt you even beyond it. This I swear, or my name's not El Draque!'<br><span class=\"indent\"></span>They melt away into the mist - the tall figure, the boat, and the two oarsmen, all faded to nothing. By dawn you're not even sure it ever happened. But when you start to order the treasure brought aboard, you remember El Draque's parting words. Maybe it was a dream - but can't a ghost in a dream lay curses just as easily?<br><span data-piece=\"302_0\" class=\"choice\"><a data-goto=\"sect_396\">Sail without taking the treasure.</a></span><span data-piece=\"302_1\" class=\"choice\"><a data-goto=\"sect_302a\">Load it aboard, and hang the curse.</a></span>\n",
  "sect_302a": "\n\n",
  "sect_303": "\n'The <em>Rose</em> is at the centre of Skarvench's web,' you realise. 'That's where we'll find him.'<br><span class=\"indent\"></span>You cannot safely take your ship on into the fog. Instead, you take a small party in one of the cutters and begin to row as quickly as possible towards the centre of the fogbank. 'It seems to be issuing from the <em>Rose</em> herself,' says Oakley. 'And I've never seen fog so thick. I can barely see Blutz sitting in the stern back there, and he's not easy to miss!'<br><span class=\"indent\"></span>'Stow that personal talk, if you please, Mister Oakley!' protests Blutz from the back of the boat. Despite the grim danger you are facing, every man in the cutter allows himself a chuckle.<br><span class=\"indent\"></span>'Mister Blutz's girth is entirely a natural phenomenon,' says the ever sober-minded Grimes. 'I can't say the same for this fog. And the moonlight is returning; the <em>Moon Dog</em> will be airborne again by now. Let's hope we're in time.'<br><span class=\"indent\"></span>The <em>Rose</em> looms ahead. You catch hold of her access ladder and secure your cutter, then lead the way up. <br><span data-piece=\"303_0\" class=\"choice\"><a data-goto=\"sect_190\">Put on the bronze helmet.</a></span><span data-piece=\"303_1\" class=\"choice\"><a data-goto=\"sect_209\">Save that till later.</a></span><span data-piece=\"303_2\" class=\"choice\"><a data-goto=\"sect_209\">Continue.</a></span>\n",
  "sect_304": "\nA shot cracks out through the mist-shrouded deck, splintering the wand in Wild's hand. You and he both turn, equally amazed, as a tall figure steps out of the companion-way hatch. He holds a smoking pistol, and from his aristocratic manner you guess he must be Admiral Lord Calidor, commander of the Queen's navy. 'Wild,' he says curtly, 'your twig's split.' He must know he's just made the luckiest shot in history, but with typical Gloriannic aplomb he shows no sign of it.<br><span class=\"indent\"></span>'Admiral,' begins Wild in a wheedling voice, 'this pirate villain -'<br><span class=\"indent\"></span>'Forget it, Wild,' says Calidor, reloading his pistol. 'I'm wise to your game.' A squad of marines pour past him onto the deck. 'Sergeant, Dr Wild is to be placed under arrest on a charge of high treason.'<br><span class=\"indent\"></span>Suddenly Wild's facade of genteel urbanity crumbles. Howling in rage, he whips out a dagger and throws it. It catches you in the arm and you stagger back with a grunt of surprise rather than pain. <br><span data-piece=\"304_0\" class=\"choice\"><a data-goto=\"sect_304a\">It's but a scratch.</a></span><span data-piece=\"304_1\" class=\"choice\"><a data-goto=\"sect_304a\">He's done for you.</a></span>\n",
  "sect_304a": "\n\n",
  "sect_304b": "\nWild turns and leaps overboard into the sea. Whether it is suicide or whether he has a plan of escape, you may never know. You have more pressing concerns. Swarming down the rope from the <em>Moon Dog</em>, baying like phantoms taking human form out of the mist, come Skarvench and his men. Calidor and his marines stand ready for a battle-royal, but you press ahead of them, lunging towards Skarvench as he lands on the deck. Now you will settle your feud once and for all. <br><span data-piece=\"304b_0\" class=\"choice\"><a data-goto=\"sect_171\">Continue.</a></span>\n",
  "sect_305": "\nYou step forward smartly and take him by the elbow. 'Ah, Mister Fitzhugh,' you say. 'Come along, the cap'n wants us on deck. We're to steer a course for Glorianne.'<br><span class=\"indent\"></span>He starts to follow you up the companion-way steps, but casts a dubious look back towards Skarvench's cabin. 'Eh? Glorianne? But that's a journey of months! He said nothing to me of this.'<br><span class=\"indent\"></span>You shrug. 'We've got to get the Queen, haven't we?'<br><span class=\"indent\"></span>Fitzhugh hesitates. He's not sure what to think. As he starts back towards Skarvench's cabin to check your story, you settle the matter by coshing him over the back of the neck. He slumps to the floor, and you hurry away to join your comrades.<br><span data-piece=\"305_0\" class=\"choice\"><a data-goto=\"sect_172\">Continue.</a></span>\n",
  "sect_306": "\nYou need to venture only a little way into the jungle to collect armfuls of fruit and nuts. You also drink from a freshwater stream until your bellies are stretched like topgallants in a high wind. <br><span class=\"indent\"></span>'Phew!' says Oakley, rolling back on the grass. 'That was the sweetest drop I ever tasted, mates. But now I reckon we ought to be getting on our way.'<br><span class=\"indent\"></span>You parcel up the food, which by your reckoning amounts to three meals' worth of provisions.<br><span data-piece=\"306_0\" class=\"choice\"><a data-goto=\"sect_344\">Back to the boat.</a></span>\n",
  "sect_307": "\nClouds cover the sharp silver horns of the moon as, with muffled oars, you pull out of the cove and row beneath the black bows of Skarvench's anchored vessel.<br><span class=\"indent\"></span>'Like tiptoeing past the face of a sleeping dragon,' whispers Oakley with characteristic grim humour.<br><span class=\"indent\"></span>'Oh no,' says Blutz suddenly, 'I'm going to - ACHOOOO!'<br><span class=\"indent\"></span>Silently cursing this stroke of bad luck, the four of you crouch low in the boat and pray that the lookout on deck didn't hear the sneeze. But those prayers go unheeded. You can see the man's face appear at the rail, peering out into the darkness. A glance up at the sky assures you that fate really has no mercy: the moon is about to emerge from behind a cloud. When it does, the lookout cannot miss spotting you.<br><span data-piece=\"307_0\" class=\"choice\"><a data-goto=\"sect_364\">Try a long shot with your sword.</a></span><span data-piece=\"307_1\" class=\"choice\"><a data-goto=\"sect_383\">Continue.</a></span>\n",
  "sect_308": "\n\n",
  "sect_308a": "\nWith the help of the others you put together a makeshift raft, even rigging a rough sail from interwoven palm leaves. You have to work fast, knowing that you have only the space of a single night.<br><span class=\"indent\"></span>'It'll never stay afloat,' says Oakley, surveying the ramshackle craft. 'We'd have done better to spend the night digging four graves.'<br><span class=\"indent\"></span>You raise your amulet and recite a charm. 'Don't be so cynical, mister. She's as seaworthy as a porpoise now I've put a lick of magic on her.'<br><span data-piece=\"308a_0\" class=\"choice\"><a data-goto=\"sect_137\">Put to sea on the raft.</a></span><span data-piece=\"308a_1\" class=\"choice\"><a data-goto=\"sect_327\">Go to the witch's palace at dawn.</a></span><span data-piece=\"308a_2\" class=\"choice\"><a data-goto=\"sect_346\">Hide from her in the jungle.</a></span>\n",
  "sect_308b": "\nWith the help of the others you put together a makeshift raft, even rigging a rough sail from interwoven palm leaves. You have to work fast, knowing that you have only the space of a single night, and you are not sure the raft will hold together long enough for you to reach the next island.<br><span data-piece=\"308b_0\" class=\"choice\"><a data-goto=\"sect_137\">Put to sea on the raft.</a></span><span data-piece=\"308b_1\" class=\"choice\"><a data-goto=\"sect_327\">Go to the witch's palace at dawn.</a></span><span data-piece=\"308b_2\" class=\"choice\"><a data-goto=\"sect_346\">Hide from her in the jungle.</a></span>\n",
  "sect_309": "\nEjada twists in your grasp, fighting back with a strength that seems incredible for a person with her slimly supple frame. It is like holding on to a python. But at last you succeed in getting her in a firm grip and dragging her off her feet. As you lift her up above your head, you are surprised to notice green roots trailing from the soles of her bare feet. Now that these roots have been tugged out of the ground they are withering fast - and at the same time you can feel Ejada getting weaker. Her mightily pounding blows fade to soft slaps, her roars of anger become faint moans as she cries for quarter.<br><span data-piece=\"309_0\" class=\"choice\"><a data-goto=\"sect_157\">Continue.</a></span>\n",
  "sect_310": "\n\n",
  "sect_310a": "\nYou must give the chief one of the following items: <br><span data-piece=\"310a_0\" class=\"choice\"><a data-goto=\"sect_310c\">A sword.</a></span><span data-piece=\"310a_1\" class=\"choice\"><a data-goto=\"sect_310d\">A pistol.</a></span><span data-piece=\"310a_2\" class=\"choice\"><a data-goto=\"sect_310e\">An amulet.</a></span><span data-piece=\"310a_3\" class=\"choice\"><a data-goto=\"sect_310f\">A wand.</a></span><span data-piece=\"310a_4\" class=\"choice\"><a data-goto=\"sect_310g\">A ship in a bottle.</a></span><span data-piece=\"310a_5\" class=\"choice\"><a data-goto=\"sect_310h\">A conch-shell horn.</a></span><span data-piece=\"310a_6\" class=\"choice\"><a data-goto=\"sect_310i\">A bat-shaped talisman.</a></span><span data-piece=\"310a_7\" class=\"choice\"><a data-goto=\"sect_310j\">A black kite.</a></span><span data-piece=\"310a_8\" class=\"choice\"><a data-goto=\"sect_310k\">Don't give him anything after all.</a></span>\n",
  "sect_310b": "\nYou have nothing that interests the chief, so you will have to manage without his help.<br><span data-piece=\"310b_0\" class=\"choice\"><a data-goto=\"sect_177\">Set sail for Port Leshand.</a></span><span data-piece=\"310b_1\" class=\"choice\"><a data-goto=\"sect_329\">Stay on the island and wait for rescue.</a></span><span data-piece=\"310b_2\" class=\"choice\"><a data-goto=\"sect_348\">Stay on the island and wait for rescue.</a></span>\n",
  "sect_310c": "\n\n",
  "sect_310d": "\n\n",
  "sect_310e": "\n\n",
  "sect_310f": "\n\n",
  "sect_310g": "\n\n",
  "sect_310h": "\n\n",
  "sect_310i": "\n\n",
  "sect_310j": "\n\n",
  "sect_310k": "\nYou decide the chief is demanding too steep a price for the little assistance he can offer you. You review your other options:<br><span data-piece=\"310k_0\" class=\"choice\"><a data-goto=\"sect_177\">Set sail for Port Leshand.</a></span><span data-piece=\"310k_1\" class=\"choice\"><a data-goto=\"sect_329\">Stay on the island and wait for rescue.</a></span><span data-piece=\"310k_2\" class=\"choice\"><a data-goto=\"sect_348\">Stay on the island and wait for rescue.</a></span>\n",
  "sect_310l": "\nWith two well-stocked canoes accompanying you, you strike south from Pandanus Island. After only a few days, you are delighted to see a ship appear on the eastern horizon. Gradually taking shape out of the morning haze, she draws closer until you can make out her comely gilded figurehead and the name painted across her bows: the <em>Jewel of Heaven</em>. Grimes is more interested in the colours she's flying. 'A Gloriannic ship, by God's grace! We're saved!'<br><span class=\"indent\"></span>Bidding farewell to the islanders who have brought you this far, you are grateful to be taken aboard the <em>Jewel of Heaven</em>. Even so, Blutz speaks for you all as he watches your little craft, now abandoned, go drifting off across the swell. 'She brought us through it against all the odds, mates. You can never say more for any vessel.' <br><span class=\"indent\"></span>And, to the bewilderment of the sailors, you raise your arms to salute the ramshackle craft bobbing off into the distance.<br><span data-piece=\"310l_0\" class=\"choice\"><a data-goto=\"sect_370\">Continue.</a></span>\n",
  "sect_311": "\nThe ship's prow looms overhead, her tall sails standing like the shadows of midnight against the greying sky. After a long moment during which you begin to fear she is but a drifting ghost-ship, a figure appears at the rail and calls down to you. 'Come aboard, strangers.'<br><span class=\"indent\"></span>A rope ladder is flung down. You look at your companions. They seem to share your unease, but what choice is there? If you stay in the foundering jollyboat your chance of survival is scant. Grabbing the swaying ladder, you ascend until you are level with the rail. The vessel's captain is standing there. He holds out his hand to help you aboard, but something in his eager haunted gaze makes you flinch.<br><span class=\"indent\"></span>'Come on deck!' he insists. 'Here's my hand.'<br><span data-piece=\"311_0\" class=\"choice\"><a data-goto=\"sect_353\">Continue.</a></span><span data-piece=\"311_1\" class=\"choice\"><a data-goto=\"sect_422\">Step aboard.</a></span><span data-piece=\"311_2\" class=\"choice\"><a data-goto=\"sect_330\">Return to the jollyboat and shove off.</a></span>\n",
  "sect_312": "\nA look of grim resignation comes into your eyes. You lift your wand to the sky as though about to conduct a symphony of the elements. The others see this and take a step back, suddenly alarmed at the aura of power surrounding their friend. 'What are you going to do?' asks Oakley.<br><span class=\"indent\"></span>'We're under a curse,' you tell him simply. 'I mean to call the one who laid the curse.'<br><span class=\"indent\"></span>So saying, you begin to chant the words of a summoning spell. Cold green light glows at the tip of your wand. As your incantation grows in strength, the heavens flash and growl in stern reply, discharging mighty thunderbolts through the turbid clouds. The masts are limned in a sharp unearthly glare. The deck pitches wildly as the ship is swirled and swung by a gale that dredges up waves thirty feet high. Roaring winds blast the rain down onto you in freezing sheets as the full fury of the storm writhes within the fetters of your spell. A pillar of lightning drops into the sea less than a cannon-shot away, sizzling white fire blazing through the wet darkness, prompting looks of panic on the faces of your friends.<br><span class=\"indent\"></span>'For God's sake, stop!' screams Oakley above the noise of the storm. 'You're bringing the wrath of Heaven down on us.'<br><span class=\"indent\"></span>Suddenly the wind drops. The thunderclouds, piled up like black fortresses in the sky, quieten their rumbling. The rain falls as before in a light gossamer spray. No, not as before; this is not rain. It has a sweet heady taste and stains the deck with mauve rivulets. Blutz tilts up his face to the sky and gives a cry of wonder: 'Lads, 'tis raining wine!'<br><span class=\"indent\"></span>A throaty feral roar makes you all whirl. Across the deck you behold an imposing robed figure, standing in an ivy-twined chariot drawn by four giant panthers. He has skin like gold and eyes of jewelled brilliance, and ringlets of blue hair frame his broad face. It was the panthers' roar you heard, but now the figure speaks, and his voice is no less wild or daunting: 'You summoned me.'<br><span class=\"indent\"></span>You drop to your knees, glancing back over your shoulder to hiss at the others. 'Bow down as if he was the father of all ship's captains - and sharpish, shipmates. This is the god Dionysus.' <br><span data-piece=\"312_0\" class=\"choice\"><a data-goto=\"sect_59\">Continue.</a></span>\n",
  "sect_313": "\nMuffling your oars, you row off under the cover of darkness. Even so, the man on the raft hears you. 'Avast there!' he cries hoarsely. 'Don't leave me! Come back!'<br><span class=\"indent\"></span>At long last these pleas are swallowed up by distance. You look around the boat. Each of your companions has a glum shamefaced look. 'What could we have done for him, anyhow?' says Oakley.<br><span class=\"indent\"></span>Blutz nods readily at this. 'That's right. He's probably no worse off than we are. The current is making most of our headway, not rowing - a raft's almost as good as a boat in these waters.'<br><span class=\"indent\"></span>'And in any case we had nothing to share with him but misfortune,' mutters Grimes.<br><span class=\"indent\"></span>You too feel a twinge of regret, but not because you have any pity for the man on the raft. It is only that you just realised he might have had food and drink that he could share with the four of you.<br><span data-piece=\"313_0\" class=\"choice\"><a data-goto=\"sect_332\">Sail on.</a></span>\n",
  "sect_314": "\nMortice's nails are sharp, ragged, and caked with grave-clod. He rakes them across your throat, drawing a spurt of blood.<br><span data-piece=\"314_0\" class=\"choice\"><a data-goto=\"sect_314a\">Still alive?</a></span>\n",
  "sect_314a": "\n\n",
  "sect_314b": "\nHe seizes you and hefts you off your feet. You are helpless in his grasp; he has the strength of six men. Giving vent to a spine-chilling roar, he swings you over his head and throws you into the sea.<br><span class=\"indent\"></span>Oakley has lost no time in cutting the rope that moored the raft to the jollyboat. Blutz meanwhile has grabbed one of the oars and now thrusts it towards you. Floundering to the surface, you spit out a mouthful of seawater and stretch your hand towards the oar.<br><span data-piece=\"314b_0\" class=\"choice\"><a data-goto=\"sect_314d\">Get back aboard.</a></span><span data-piece=\"314b_1\" class=\"choice\"><a data-goto=\"sect_314e\">Get back on board.</a></span>\n",
  "sect_314c": "\nHe seizes you and hefts you off your feet. You are helpless in his grasp; he has the strength of six men. Giving vent to a spine-chilling roar, he snaps your back like a twig, then swings you over his head and throws you into the sea. You sink helplessly down into the murmuring bathukolpian darkness of Davy Jones's locker.<br><div class=\"s3\">THE END</div>\n",
  "sect_314d": "\n'Blimey, you didn't even let go of your sword,' marvels Blutz as he drags you into the boat.<br><span class=\"indent\"></span>'I'd as soon go down to the bottom as lose it. Like my own right arm, this blade is.'<br><span class=\"indent\"></span>Casting off, you row away from the raft with all haste. It dwindles into the distance until it is visible only as a moonlit speck far to stern. Mortice is still to be seen jumping in rage, appearing like a guttering candle flame in the distant darkness. His last curse comes like a sigh of wind across the water: 'El Draque drink your blood, you swabs...' and then there is silence and unbroken night.<br><span class=\"indent\"></span>At last you deem it safe to sleep. Tomorrow you pray you will sight another vessel. How much longer can you survive otherwise?<br><span data-piece=\"314d_0\" class=\"choice\"><a data-goto=\"sect_332\">Continue.</a></span>\n",
  "sect_314e": "\nIt's only as Blutz pulls you into the boat that you realize you no longer have your sword. Not being a strong swimmer, you were forced to let go of it to save your life.<br><span class=\"indent\"></span>Casting off, you row away from the raft with all haste. It dwindles into the distance until it is visible only as a moonlit speck far to stern. Mortice is still to be seen jumping in rage, appearing like a guttering candle flame in the distant darkness. His last curse comes like a sigh of wind across the water: 'El Draque drink your blood, you swabs...' and then there is silence and unbroken night.<br><span class=\"indent\"></span>At last you deem it safe to sleep. Tomorrow you pray you will sight another vessel. How much longer can you survive otherwise?<br><span data-piece=\"314e_0\" class=\"choice\"><a data-goto=\"sect_332\">Continue.</a></span>\n",
  "sect_315": "\nYou draw the fan from your sleeve and wave it. Skarvench stares, a cruel laugh shivering his tall frame. 'Showin' yourself for the limp-wrist you are, eh, ye slippery swab? Or is it that you're finding things gettin' too hot for you? By Garn, I'll give you hot. I'll roast your gizzard before the sun rises on another day!'<br><span class=\"indent\"></span>You lower the fan. There is a change in the air: a sudden taste of something on the wind. Skarvench senses it too. His seafaring instincts are second to none, and recognition freezes his ugly smirk. He turns, looking out to sea, sniffing the breeze. 'Hurricane!' he whispers, aghast.<br><span class=\"indent\"></span>The sky turns from blue to a dingy sulphurous yellow, bruised by livid blotches of cloud. Out to sea, the waves froth and churn as a storm wind comes sweeping in like a giant's fist. You see it strike the <em>Belle Dame</em> where she lies at anchor, snapping her sails taut and bucking her to and fro like a toy.<br><span class=\"indent\"></span>'To the boat!' screams Skarvench. 'This wind will reef us if we don't put out to sea.' As he and his men scurry to their rowboat, he pauses just long enough to turn and shake his fist. 'You'll be sorry! Aye, you'll beg for death afore I'm through with ye!'<br><span class=\"indent\"></span>His words are drowned out by the wind. As the storm sweeps on, bearing the <em>Belle Dame</em> before it, you notice that the thundercloud fan has vanished. Deciding that you had better be long gone by the time Skarvench returns here, you put to sea in your ramshackle vessel.<br><span data-piece=\"315_0\" class=\"choice\"><a data-goto=\"sect_177\">Continue.</a></span>\n",
  "sect_316": "\nDoctor Scriptor chuckles softly to himself as he inspects the horn. You cannot help thinking that he really is a rather weird old cove, but certainly no one can beat him when it comes to identifying magic treasures.<br><span class=\"indent\"></span>'Oh ho, this is a fine prize,' he declares. 'The Horn of Poseidon. Go down to the shore and blow it, so the tale goes, and a phantom boat will arise out of the waves and take you to the god's gate. But it's also said that no mortal can see or touch the key that will open that gate. Now, as to my fee...'<br><span class=\"indent\"></span>He demands a doubloon for what he's told you so far. Or you can sell him the horn; he will give you twenty doubloons for it.<br><span data-piece=\"316_0\" class=\"choice\"><a data-goto=\"sect_316a\">Pay his fee.</a></span><span data-piece=\"316_1\" class=\"choice\"><a data-goto=\"sect_316c\">Refuse to pay.</a></span><span data-piece=\"316_2\" class=\"choice\"><a data-goto=\"sect_316b\">Sell him the horn.</a></span>\n",
  "sect_316a": "\n\n",
  "sect_316b": "\n\n",
  "sect_316c": "\n'A doubloon? For less than a minute of your time?'<br><span class=\"indent\"></span>'Not for the minute it took me to look at this item,' he demurs, 'but for the knowledge of a lifetime.'<br><span class=\"indent\"></span>As you are not going to pay his fee, he shows you the door.<br><span data-piece=\"316c_0\" class=\"choice\"><a data-goto=\"sect_392\">Leave.</a></span>\n",
  "sect_316d": "\nAre there other items that you want him to identify?<br><span data-piece=\"316d_0\" class=\"choice\"><a data-goto=\"sect_335\">A bat-shaped talisman.</a></span><span data-piece=\"316d_1\" class=\"choice\"><a data-goto=\"sect_354\">A bronze helmet.</a></span><span data-piece=\"316d_2\" class=\"choice\"><a data-goto=\"sect_373\">A dragon ring.</a></span><span data-piece=\"316d_3\" class=\"choice\"><a data-goto=\"sect_392\">Bid him good day.</a></span>\n",
  "sect_317": "\nThe bullet hits Ejada square between the eyes but has no more effect than if you'd fired it into the bole of an oak tree. She winces and says with a confident smile, 'Your best shot? Try mine.'<br><span data-piece=\"317_0\" class=\"choice\"><a data-goto=\"sect_317a\">You can take it.</a></span><span data-piece=\"317_1\" class=\"choice\"><a data-goto=\"sect_317a\">Can you take it?</a></span>\n",
  "sect_317a": "\n<br>",
  "sect_317b": "\nShe lunges forward, her fingers driving up towards the pit of your stomach, but her attack is deflected by the magical shield of feathers you've been carrying.<br><span data-piece=\"317b_0\" class=\"choice\"><a data-goto=\"sect_241\">Take her on bare-handed.</a></span><span data-piece=\"317b_1\" class=\"choice\"><a data-goto=\"sect_384\">Resort to magic.</a></span><span data-piece=\"317b_2\" class=\"choice\"><a data-goto=\"sect_5\">Turn and flee.</a></span>\n",
  "sect_317c": "\nShe lunges forward, her fingers driving up into the pit of your stomach with sickening force. You can't take many more blows like that.<br><span data-piece=\"317c_0\" class=\"choice\"><a data-goto=\"sect_241\">Use your pugilistic skills.</a></span><span data-piece=\"317c_1\" class=\"choice\"><a data-goto=\"sect_384\">Resort to magic.</a></span><span data-piece=\"317c_2\" class=\"choice\"><a data-goto=\"sect_5\">Turn and flee.</a></span>\n",
  "sect_317d": "\nShe lunges forward, her fingers driving up into the pit of your stomach with sickening force. You fold around the blow and sink to your knees, retching up blood. Death comes swiftly.<br><div class=\"s3\">THE END</div>\n",
  "sect_318": "\nYou present the deed of ownership to the harbour master and he leads you along the quay in the direction of a sterling galleon whose proud figurine juts imposingly against the sun. 'Why, she's magnificent!' says Blutz, starting up the gangplank. 'We'll soon blast Skarvench out of the water in this beauty, shipmates.'<br><span class=\"indent\"></span>'Avast there, ye fat swab!' snarls a man from the deck, shaking his fist. 'Get off me gangplank afore ye breaks it!'<br><span class=\"indent\"></span>The harbour master had gone striding on ahead. Hearing the commotion, he comes back and tugs your sleeve, pointing to a much smaller vessel at the end of the dockside. 'No,' he says, 'that is your ship.'<br><span class=\"indent\"></span>You look her up and down without enthusiasm. She sits slightly lopsided in the water, and her few guns show patches of rust. You cannot imagine a small sloop like that tackling Skarvench's mighty galleon.<br><span class=\"indent\"></span>Oakley pats you on the shoulder. 'Buck up, skipper. We'll just have to make the best of her.'<br><span class=\"indent\"></span>You nod in agreement and go aboard to inspect your first command: the <em>Lady of Shalott</em>.<br><span data-piece=\"318_0\" class=\"choice\"><a data-goto=\"sect_300\">Continue.</a></span>\n",
  "sect_319": "\nWith your companions' help, you examine the sea charts and plot your course. Where will you steer?<br><span data-piece=\"319_0\" class=\"choice\"><a data-goto=\"sect_186\">To Tortoise Island.</a></span><span data-piece=\"319_1\" class=\"choice\"><a data-goto=\"sect_339\">To Port Leshand.</a></span><span data-piece=\"319_2\" class=\"choice\"><a data-goto=\"sect_358\">To Crossbones Island.</a></span>\n",
  "sect_320": "\nSelenice is a veritable haven for pirates, and a large and experienced crew flocks to your cause. Some have heard of your exploits and are eager to join the quest for gold and glory. Others, having learned of your hatred of Skarvench, take grim pleasure in joining the battle against him; they, like you, have old scores to settle.<br><span class=\"indent\"></span>While you are signing on the last few crewmen, Blutz comes bustling along the dock full of urgent news. 'I met a bloke in a tavern,' he manages to pant out, leaning on a stanchion to recover his breath. 'He was employed as pilot to steer Queen Titania's convoy past the Smoking Islands. He told me the convoy's heading for Port Tudor where they'll sit out the hurricane season.'<br><span class=\"indent\"></span>'The hurricane season!' scoffs Oakley. 'The hurricane's not due for a month.'<br><span class=\"indent\"></span>Blutz shakes his head. 'This bloke I was talking to said they think it's going to hit early this year. Apparently the Queen's wizard cast a horoscope and he's sure of it.'<br><span class=\"indent\"></span>Grimes grabs you by the shoulder. 'Skipper, you know what this means. If Skarvench intends to go through with his attack on the Queen's convoy, he'll have to do it before they reach Port Tudor.'<br><span class=\"indent\"></span>'By thunder, you're right! All hands to their posts. We sail for Port Tudor, and there isn't a moment to lose!'<br><span data-piece=\"320_0\" class=\"choice\"><a data-goto=\"sect_138\">Continue.</a></span>\n",
  "sect_321": "\nThe vampires come at you in a crazed rush, knowing no fear in their longing to taste your warm rich blood. They feel no pain either, taking the blows of your valiant sailors as though they were the stings of gnats. For a moment you feel a stab of hopelessness, shrinking back as the tide of defeat threatens to engulf you, but then you see the grim desperate faces of your brave lads as they battle the monsters. Your passion wells up in a great roar that thunders across the deck. 'This is <em>my</em> ship, by hell and high water, and I'll suffer a thousand deaths before I'll allow a bunch of bloodsucking lubbers to wrest her from me!'<br><span class=\"indent\"></span>Your example inspires the crew to fresh efforts and they lay about them with their sabres, chopping bloodless limbs from undead bodies. And still the vampires come, all undaunted by this macabre butchery...<br><span data-piece=\"321_0\" class=\"choice\"><a data-goto=\"sect_321a\">Fight on.</a></span>\n",
  "sect_321a": "\n\n",
  "sect_321b": "\nPain, injury, even dismemberment, mean nothing to these implacable undead foes. You are seized, borne to the ground, and made the plaything of the vampires. Your last sight is of their exultant faces drenched in your blood. Your mortal life is over.<br><div class=\"s3\">THE END</div>\n",
  "sect_322": "\nCannonballs whistle out of the night, splintering timber and crushing bones. You see one of you crewmen give a short cry and go sailing out of the rigging to his doom. A shell goes thundering past only paces from where you're standing, but you remain ice cool as you close in on your foe.<br><span data-piece=\"322_0\" class=\"choice\"><a data-goto=\"sect_322a\">Continue.</a></span>\n",
  "sect_322a": "\n\n",
  "sect_322b": "\nThe ship is taking a pounding. Your crew, blown ragged by cannon fire, are daunted. But you stand firm and your example rallies them. The distance between your vessel and the <em>Moon Dog</em> is closing. You calmly call your orders.<br><span data-piece=\"322b_0\" class=\"choice\"><a data-goto=\"sect_379\">'Stay to windward.'</a></span><span data-piece=\"322b_1\" class=\"choice\"><a data-goto=\"sect_360\">'Sail on to her lee side.'</a></span>\n",
  "sect_323": "\n'I don't know how you escaped my bullet,' growls Skarvench, 'but this time I'm going to make sure of the matter. I'll chop off your head and stick it on a marline-spike to look at as I go to sleep each night!'<br><span class=\"indent\"></span>You give him no answer. Clutching hold of the rope with one hand, you save your strength for the most desperate struggle of your life. <br><span data-piece=\"323_0\" class=\"choice\"><a data-goto=\"sect_323a\">Make every blow count.</a></span><span data-piece=\"323_1\" class=\"choice\"><a data-goto=\"sect_323c\">Make every blow count.</a></span>\n",
  "sect_323a": "\n\n",
  "sect_323b": "\nHis sword-slash lays open your forearm to the bone. Losing your grip on the rope, you plunge to your death on the deck far below and the last sound you hear is the crowing laughter of your dearly hated foe.<br><div class=\"s3\">THE END</div>\n",
  "sect_323c": "\n\n",
  "sect_323d": "\nSkarvench sees the light of battle in your eyes and he knows the fear of all who faced the invincible might of Sparta. You effortlessly swipe his sword aside, ignoring the pain as his blade bites into your arm, and prise his fingers off the rope.<br><span class=\"indent\"></span>He utters a single cry, astonished and querulous like the croak of a carrion bird, then goes plunging down to his death on the deck below. You climb back down not a moment too soon, for the rope is suddenly jerked out of your hands and goes coiling up into the mist.<br><span class=\"indent\"></span>'They've had enough, now their captain's dead,' says Grimes as you watch the outlines of the <em>Moon Dog</em> recede up into the sky.<br><span class=\"indent\"></span>'I'd have liked to get that Curshaw - and Porbuck as well,' mutters Oakley. 'I've still got scores to settle with those two.'<br><span class=\"indent\"></span>You clasp their arms and nod towards the broken body of Skarvench lying on the deck. 'Don't be downcast, lads. Tomorrow's another day, and no doubt we'll catch up with those villains sooner or later, but we've done sterling work tonight!'<br><span class=\"indent\"></span>'Indeed you have,' says an aristocratic voice. You turn to see a tall distinguished-looking Gloriannic gentleman who can only be Admiral Calidor, commander of the Queen's navy. Behind him are a squad of royal marines. 'If you hadn't shown up,' he continues, 'who knows if we would have been able to cope with those pirates. We've only just managed to subdue their accomplice, the sorcerer William Wild.'<br><span class=\"indent\"></span>'My lord,' you say, bowing, 'they were after the Queen herself.'<br><span class=\"indent\"></span>Calidor smiles. 'I know. And, speaking of the Queen...'<br><span data-piece=\"323d_0\" class=\"choice\"><a data-goto=\"sect_427\">Continue.</a></span>\n",
  "sect_324": "\nSkarvench stands over you. You see his face as though it were reflected in a pool of blood. His voice roars and surges in your ears: '...among the dead men...'<br><span class=\"indent\"></span>The image clouds and clots, then the red haze turns to blackness as your grip on life gives way. You have met your doom at the hands of your arch-enemy, and now there is no one to stop him.<br><div class=\"s3\">THE END</div>\n",
  "sect_325": "\nMaking your way towards the sound of running water, you push the thick undergrowth aside to discover a sparkling stream. After slaking your thirst you follow the stream inland until you come to a clearing where an ancient stone monolith stands surrounded by creepers and green-filtered sunlight. Tiny gnats flit about like motes of golden dust as you inquisitively scrape away the moss covering the monolith so as to examine its carvings. Although weathered, some of the carvings can still be made out, although none of you has any idea what they represent.<br><span class=\"indent\"></span>To the far left is a carving of the crescent moon, to the right a sun-symbol. Between them are four icons that may depict the islands of the chain. On the first island, reading from the left, stand a group of small figures. On the next, a woman whose feet are roots buried in the ground fends off two warriors whose clubs seem helpless to harm her. On the third, a volcano belches fire. On the fourth island, a solitary figure points off to sea as if warning travellers to stay away.<br><span class=\"indent\"></span>The forest is full of eerie sounds. Blutz looks about nervously. 'Shouldn't we be getting back to the boat?' <br><span data-piece=\"325_0\" class=\"choice\"><a data-goto=\"sect_344\">Continue.</a></span>\n",
  "sect_326": "\nYou hide the jollyboat and lie in wait until the next morning, when Skarvench comes ashore in a rowboat with five other men: his quartermaster - the whippet-thin villain named Curshaw, his lumbering first mate Porbuck, Borograve the master gunner, and two seamen carrying spades.<br><span class=\"indent\"></span>You crouch in the cover of the bushes and watch this sinister band making their way purposefully through the trees, with Skarvench striding ahead, pacing out distances and from time to time referring to a map he is carrying. Blutz gives a muffled gasp. 'They've come to dig up some treasure!' he realises.<br><span class=\"indent\"></span>Oakley narrows his eyes. It is all he can do not to leap up from your hiding place and charge at Skarvench, so filled with hatred are his memories. But much as you yearn for revenge on the evil pirate captain, you know that to attack him now in your weakened state would mean almost certain death. It would be wiser to bide your time.<br><span data-piece=\"326_0\" class=\"choice\"><a data-goto=\"sect_99\">That pesky monkey…</a></span><span data-piece=\"326_1\" class=\"choice\"><a data-goto=\"sect_4\">Stay in hiding and spy on Skarvench.</a></span><span data-piece=\"326_2\" class=\"choice\"><a data-goto=\"sect_267\">Give the go-ahead to attack him.</a></span>\n",
  "sect_327": "\nEjada stands in front of her palace and surveys you with a haughty eye. In her gilded finery and bejewelled head-dress, with her limbs like a statue's and her star sapphire gaze, she looks every inch a goddess.<br><span class=\"indent\"></span>She raises a flint knife. 'My mother the Earth is thirsty for a mortal soul. Which of you shall I send to her?'<br><span class=\"indent\"></span>This is the moment of truth.<br><span data-piece=\"327_0\" class=\"choice\"><a data-goto=\"sect_5\">Make a run for it.</a></span><span data-piece=\"327_1\" class=\"choice\"><a data-goto=\"sect_365\">Fight her.</a></span><span data-piece=\"327_2\" class=\"choice\"><a data-goto=\"sect_119\">Offer her a portion of each of your souls.</a></span><span data-piece=\"327_3\" class=\"choice\"><a data-goto=\"sect_384\">Use a spell against her.</a></span>\n",
  "sect_328": "\nAfter a hard-fought battle you finally get in a killing blow. To your amazement, Ejada does not fall like any mortal opponent. Instead she gives a deep groan and sags forward like a puppet with its strings cut. Green sap spurts from the wound you've made above her heart, and her long virid tresses wither like plucked blooms.<br><span class=\"indent\"></span>'Blow me down if she wasn't some sort o' plant!' says Grimes, touching her cheek. 'Feels like wood rather than flesh.'<br><span class=\"indent\"></span>You shrug and sheathe your sword. 'She did say she was the Earth Goddess's daughter.'<br><span class=\"indent\"></span>A hasty exploration of Ejada's palace soon uncovers several treasures: a magic wand, a healing potion, a ship in a bottle, and a black kite. The potion can be drunk once at any time to restore your Life Points score to normal. The other items may or may not come in handy later.<br><span class=\"indent\"></span>Returning to the boat, you put to sea without further delay.<br><span data-piece=\"328_0\" class=\"choice\"><a data-goto=\"sect_137\">Continue.</a></span>\n",
  "sect_329": "\n\n",
  "sect_330": "\nWith sails towering against the darkling sky, the ship sails past on her endless voyage. Seemingly she casts a deep bone-racking chill in her wake, and all of you shiver as you watch her fade into the night.<br><span class=\"indent\"></span>'A backwards blessing on this cold,' mutters Grimes through chattering teeth. 'Let's head south, mates. Better a slow journey in warmer waters than to be flung up to scrape the icy hull of heaven!'<br><span data-piece=\"330_0\" class=\"choice\"><a data-goto=\"sect_135\">Agree with the plan to turn south.</a></span><span data-piece=\"330_1\" class=\"choice\"><a data-goto=\"sect_386\">Insist on pressing on to the west.</a></span><span data-piece=\"330_2\" class=\"choice\"><a data-goto=\"sect_349\">Insist on pressing on westward.</a></span>\n",
  "sect_331": "\nYou raise the cleaver, a grim look setting your features like stone. 'Who's to be first?' you ask.<br><span class=\"indent\"></span>Blutz's lip trembles. He looks like a large timid hamster when he says, 'Eh? What do you mean?'<br><span class=\"indent\"></span>'It's obvious, mate,' puts in Grimes, nodding towards the water tank full of decomposed hands. 'The only way off this ship is to sacrifice a hand.'<br><span class=\"indent\"></span>Oakley nods. 'That's what the sailors must've done. I don't know if it was the pain and loss that cancelled out their guilt. Maybe it was just a way of getting around the letter of the curse - y'know, chopping off the hand that did the fateful deed. Who's to say? But I see a tank full o' hands and no bodies to go with them, so they must've got away, mustn't they?'<br><span class=\"indent\"></span>Each of you in turn submits to the cleaver, depositing your severed hand in the water tank with the others. It is a gruesome sacrifice, but your only way of circumventing the curse. <br><span data-piece=\"331_0\" class=\"choice\"><a data-goto=\"sect_331a\">It's your turn.</a></span>\n",
  "sect_331a": "\n\n",
  "sect_331b": "\nYou can bear the pain, but what's harder to stomach is that you've lost your agility along with your hand.<br><span class=\"indent\"></span>'Don't look so sick about the gills,' says Oakley. 'All the best pirates are wearing hooks these days.'<br><span class=\"indent\"></span>Throwing him a sour look, you clamber back down to the jollyboat tethered alongside and start to row away.<br><span data-piece=\"331b_0\" class=\"choice\"><a data-goto=\"sect_136\">Continue.</a></span>\n",
  "sect_331c": "\n'Don't look so sick, mate,' says Oakley to Blutz. 'All the best pirates are wearing hooks these days.'<br><span class=\"indent\"></span>Chuckling bleakly at this, you clamber back down to the jollyboat tethered alongside and start to row away.<br><span data-piece=\"331c_0\" class=\"choice\"><a data-goto=\"sect_136\">Continue.</a></span>\n",
  "sect_331d": "\nYou fall as your blood goes spurting across the deck. Grimes steps in with a bit of torn shirt-cloth to tie a tourniquet, but it's too late. You have suffered so much already, and the final shock of cutting off your hand has finished you.<br><div class=\"s3\">THE END</div>\n",
  "sect_332": "\nAfter so long at sea you would have expected to sight a ship by now. A nasty suspicion begins to obsess your thoughts: that you have drifted far south of the main trade route, and that you now have no hope of being picked up. Talking it over with the others, you find that Grimes and Oakley are for turning north, possibly in the hope of reaching the Smoking Islands. There you could forage for food and water. Blutz thinks you should stick to your present course. 'Ships are scarce because the hurricane season starts in a month or so,' he reasons, 'but I still say that if we keep heading west we'll be picked up soon.'<br><span class=\"indent\"></span>Oakley snorts impatiently. 'The hurricane isn't due for at least eight weeks! No, the reason we've not seen a ship is because we're too far south.'<br><span data-piece=\"332_0\" class=\"choice\"><a data-goto=\"sect_135\">Steer northwards.</a></span><span data-piece=\"332_1\" class=\"choice\"><a data-goto=\"sect_351\">Stay on a westbound course.</a></span>\n",
  "sect_333": "\nThe smooth steely outlines and the cloudy blue colour of the iceberg tell you that it is old ice, which will have lost its salt content over the years and should be safe to drink.<br><span data-piece=\"333_0\" class=\"choice\"><a data-goto=\"sect_352\">Continue.</a></span>\n",
  "sect_334": "\nIs it sixth sense or wishful thinking that guides your fingers to the talisman? You can only guess at its power, but you mutter a silent plea, invoking the talisman's magic to come to your aid now.<br><span class=\"indent\"></span>A shadow falls across the beach, as though a cloud covered the sun. The shadow deepens. The sailors - all of them hardened veterans of the sea - look up at the sky with faces like frightened children. The sound that escapes their lips is the voice of fear, born of the most primitive terror of all. The dark.<br><span class=\"indent\"></span>A black wing of shadow draws across the face of the sun. The day is plunged into night. In the confusion, you race off along the beach and put out to sea in your small vessel. Skarvench's bellows of rage roll across the water behind you, but his men are too terrified to follow his orders. Knowing that the pirates will search for you between here and Leshand, you set a southerly course. As the eclipse passes and the daylight comes trickling back, the island is already far behind. You notice that the bat-shaped talisman has vanished.<br><span data-piece=\"334_0\" class=\"choice\"><a data-goto=\"sect_367\">Continue.</a></span>\n",
  "sect_335": "\nDoctor Scriptor examines the talisman for several minutes before giving his opinion. 'This is the likeness of the Bat of Night, a mythic creature. Under my spy-glass it displays a greenish tinge, indicating that some magic still remains. Possibly its power would work once . Twice at most.'<br><span class=\"indent\"></span>'To do what?' asks Blutz. <br><span class=\"indent\"></span>'Your guess is as good as mine,' replies Scriptor blandly. He hands you back the talisman. 'Perhaps it helps you to see in the dark? Now, my fee for the assessment is one doubloon, as you very well know.'<br><span data-piece=\"335_0\" class=\"choice\"><a data-goto=\"sect_335a\">Pay his fee.</a></span><span data-piece=\"335_1\" class=\"choice\"><a data-goto=\"sect_335b\">Refuse to pay.</a></span>\n",
  "sect_335a": "\n\n",
  "sect_335b": "\n'So you can't tell us any more than that it might work once, maybe twice. And you'd like a doubloon for that?'<br><span class=\"indent\"></span>'You know more than you did when you came in,' Scriptor points out, 'and yet so far I am none the richer.'<br><span data-piece=\"335b_0\" class=\"choice\"><a data-goto=\"sect_335a\">Pay him after all.</a></span><span data-piece=\"335b_1\" class=\"choice\"><a data-goto=\"sect_392\">Leave.</a></span>\n",
  "sect_335c": "\nHave you anything else you want him to look at?<br><span data-piece=\"335c_0\" class=\"choice\"><a data-goto=\"sect_316\">A conch-shell horn.</a></span><span data-piece=\"335c_1\" class=\"choice\"><a data-goto=\"sect_354\">A bronze helmet.</a></span><span data-piece=\"335c_2\" class=\"choice\"><a data-goto=\"sect_373\">A dragon ring.</a></span><span data-piece=\"335c_3\" class=\"choice\"><a data-goto=\"sect_392\">Bid him good day.</a></span>\n",
  "sect_336": "\nThe pedlar is a thin fellow with a pigtail and a silver ring in his ear. On his shoulder crouches a weasel which is attached his wrist by a length of twine. As you approach, the pedlar whisks the tarpaulin off his cart and begins describing the jumble of items he has, tossing each aside and grabbing another almost as quickly as he can reel off the prices.<br><span class=\"indent\"></span>'Steady on, matey,' grumbles Oakley. 'I can hardly keep up. What were you askin' for this here cutlass, now?'<br><span data-piece=\"336_0\" class=\"choice\"><a data-goto=\"sect_393\">You know that face.</a></span><span data-piece=\"336_1\" class=\"choice\"><a data-goto=\"sect_410\">See what he has to sell.</a></span>\n",
  "sect_337": "\nMaster Kemp the shipbuilder is delighted to provide you with a magnificent warship fitted with eighty cannon. 'She is the <em>Meteor</em>,' he says. 'I built her for a customer some months ago, but sadly he was apprehended in Port Worshen before he could take delivery. Now he's to be seen on Execution Dock - food for rooks, God help his soul - and his fine ship is yours.'<br><span class=\"indent\"></span>'Perhaps we should change the name?' suggests Oakley. '<em>Meteor</em> was the original owner's choice, not ours.'<br><span data-piece=\"337_0\" class=\"choice\"><a data-goto=\"sect_394\">You know a thing or two about names.</a></span><span data-piece=\"337_1\" class=\"choice\"><a data-goto=\"sect_411\">Change the vessel's name.</a></span><span data-piece=\"337_2\" class=\"choice\"><a data-goto=\"sect_337a\">Leave it as it is.</a></span>\n",
  "sect_337a": "\n\n",
  "sect_338": "\nYou have little enough to go on - just a hazarded guess at the iceberg's last position, and your best estimate of how far the prevailing current might have carried it by now. It is going to be like looking for a needle in a haystack, as your comrades are swift to point out.<br><span class=\"indent\"></span>'But when that proverbial needle is made of gold, so to speak, and has a diamond set into it,' you reply to their objections, 'surely then the task's worth attempting?'<br><span data-piece=\"338_0\" class=\"choice\"><a data-goto=\"sect_359\">If anyone can find it, you can.</a></span><span data-piece=\"338_1\" class=\"choice\"><a data-goto=\"sect_378\">Order a course due south.</a></span><span data-piece=\"338_2\" class=\"choice\"><a data-goto=\"sect_56\">Steer south-west.</a></span><span data-piece=\"338_3\" class=\"choice\"><a data-goto=\"sect_207\">Steer south-east.</a></span><span data-piece=\"338_4\" class=\"choice\"><a data-goto=\"sect_357\">Give up on the iceberg and try piracy.</a></span>\n",
  "sect_339": "\nYou sign on a small crew. A good following wind carries you to Leshand in six days. Disappointment awaits you there, however, as no-one has any idea where El Draque's treasure lies buried. 'Sure, an' if I knew,' says one old tar you speak to, 'would I not be after fetchin' it meself?'<br><span class=\"indent\"></span>At these words, his drinking companions all cross themselves, and mouths that are more accustomed to hard swearing mumble a swift prayer. 'Don't pay any heed to old Bunratty's talk!' cries another man. 'Anyone who went seeking El Draque's treasure might as well pawn their souls to the Devil on the day they set sail.'<br><span class=\"indent\"></span>Blutz is quite discomfited by all this, and you are surprised to see as you leave the inn that even Grimes and Oakley are wide-eyed and pale. 'Come on, skipper,' urges Oakley. 'It's pretty clear there's something eerie about this El Draque. Why, he's supposed to be dead and gone but a lot of folk still seem mortally afraid of him for all that!'<br><span class=\"indent\"></span>'Let's put to sea and try a little piracy,' suggests Grimes. 'We'd soon have enough put by to get ourselves a decent warship.'<br><span data-piece=\"339_0\" class=\"choice\"><a data-goto=\"sect_377\">Keep searching for El Draque's treasure.</a></span><span data-piece=\"339_1\" class=\"choice\"><a data-goto=\"sect_357\">Agree to Grimes's suggestion.</a></span>\n",
  "sect_340": "\nSevered limbs lie like dead fishes across the deck - not just those of the vampires, but also some torn from their sockets of your poor sailors, who now lie screaming as their lifeblood gushes across the planks.<br><span class=\"indent\"></span>Three of the vampires still stand, but your spirited defence of your vessel has cowed them. They crouch back against the rail. Then, keeping their eyes fixed on you, they drop to their knees with a hideous mewling sound to lick up some of the spilled blood. 'Merciful God...' croaks Grimes. Although not a squeamish man, he turns away and retches with disgust.<br><span class=\"indent\"></span>The remaining vampires rise and face you across the carnage. Of all the crew only yourself, Grimes, Oakley and Blutz are still standing - and the fight has gone out of you at the sight of such horrors. For their part, the vampires make no move but only stare at you and lick their gore-spattered lips. At last their leader speaks. He is a pallid but unblemished creature with eyes like old ice. 'I am El Draque. Never have I been bested, but tonight I will concede you've fought me to a stand off. We'll go and leave you in peace, but I'll add this warning. Do not touch the treasure in our coffins, or you'll carry my curse for the rest of your days.'<br><span class=\"indent\"></span>He drops back over the side with the other two. There is no splash, nor any sign of them when you go to the rail to look. There is just the swirling fog. The fallen vampires dissolve from the deck into a miasmic murk which only disperses with the sunrise. You take stock of the dead and injured among your crew, then hold a council with your officers to decide whether to take the treasure or not.<br><span data-piece=\"340_0\" class=\"choice\"><a data-goto=\"sect_302a\">Take it.</a></span><span data-piece=\"340_1\" class=\"choice\"><a data-goto=\"sect_396\">Leave it.</a></span>\n",
  "sect_341": "\nThe <em>Moon Dog</em> manoeuvres slowly nearer, pushing against the wind. She is taking damage all the time from your cannons, but the wind causes your own ship to heel over slightly, so that most of your shots strike the enemy's hull rather than the sails. You have not yet crippled the <em>Moon Dog</em>, and now she is turning for a broadside.<br><span data-piece=\"341_0\" class=\"choice\"><a data-goto=\"sect_19\">Stand and take it.</a></span><span data-piece=\"341_1\" class=\"choice\"><a data-goto=\"sect_38\">Pull astern of the enemy for boarding.</a></span><span data-piece=\"341_2\" class=\"choice\"><a data-goto=\"sect_57\">Move out of range of their cannon.</a></span>\n",
  "sect_342": "\nSkarvench utters a single cry like the croak of a carrion bird, then goes plunging down to his death on the deck below. You climb back down not a moment too soon, for the rope is suddenly jerked out of your hands and goes coiling up into the mist.<br><span class=\"indent\"></span>'They've had enough, now their captain's dead,' says Grimes as you watch the outlines of the <em>Moon Dog</em> recede up into the sky.<br><span class=\"indent\"></span>'I'd have liked to get that Curshaw - and Porbuck as well,' mutters Oakley. 'I've still got scores to settle with those two.'<br><span class=\"indent\"></span>You clasp their arms and nod towards the broken body of Skarvench lying on the deck. 'Don't be downcast, lads. Tomorrow's another day, and no doubt we'll catch up with those villains sooner or later, but we've done sterling work tonight!'<br><span class=\"indent\"></span>'Indeed you have,' says an aristocratic voice. You turn to see a tall distinguished-looking Gloriannic gentleman who can only be Admiral Calidor, commander of the Queen's navy. Behind him are a squad of royal marines. 'If you hadn't shown up,' he continues, 'who knows if we would have been able to cope with those pirates. We've only just managed to subdue their accomplice, the sorcerer William Wild.'<br><span class=\"indent\"></span>'My lord,' you say, bowing, 'they were after the Queen herself.'<br><span class=\"indent\"></span>Calidor smiles. 'I know. And, speaking of the Queen...'<br><span data-piece=\"342_0\" class=\"choice\"><a data-goto=\"sect_427\">Continue.</a></span>\n",
  "sect_343": "\nYou make your way outside, where there are more onlookers attracted by news of the shooting. 'Are you the one Skarvench shot?' asks an old man, seeing the blood on your chest.<br><span class=\"indent\"></span>'Aye,' you say, and you tell him the tale of your lucky escape.<br><span class=\"indent\"></span>He looks at the article that saved your life. 'A valuable investment. I must buy one myself.'<br><span class=\"indent\"></span>Blutz chips in: 'Listen, old man, did you see where Skarvench went?'<br><span class=\"indent\"></span>'Less of the \"old\" if you please, fatty,' says the old man bristling. 'And to answer your query, he and his men went chortling their way down this very street in the direction of the waterfront.'<br><span class=\"indent\"></span>Oakley cries out an oath. 'They'll have set sail! We need a ship of our own.'<br><span data-piece=\"343_0\" class=\"choice\"><a data-goto=\"sect_261\">You have a ship in a bottle.</a></span><span data-piece=\"343_1\" class=\"choice\"><a data-goto=\"sect_280\">Use the conch-shell horn.</a></span><span data-piece=\"343_2\" class=\"choice\"><a data-goto=\"sect_318\">You have a deed of ownership.</a></span><span data-piece=\"343_3\" class=\"choice\"><a data-goto=\"sect_299\">Buy a ship.</a></span><span data-piece=\"343_4\" class=\"choice\"><a data-goto=\"sect_343a\">'Easy to say, Mister Oakley.'</a></span>\n",
  "sect_343a": "\nWithout the means to get hold of a ship, you have no hope of catching Skarvench. Your adventure is dead in the water.<br><div class=\"s3\">THE END</div>\n",
  "sect_344": "\nYou return to the cliffs to find a dozen islanders standing at the top of the vine ladder. They wear grass skirts and each has a red skull-like mask painted across his face. 'That's how the island got its name,' mutters Oakley out of the corner of his mouth.<br><span class=\"indent\"></span>'Maybe so,' whispers Grimes. 'Or maybe they're headhunters.'<br><span class=\"indent\"></span>You approach cautiously, uncertain of the islanders' intentions. They watch you in silence and then one of them bares his lips in a ferocious grin. Blutz gives a small moan and goes weak at the knees, and you have to catch his arm to give him support. To your horror, the islander's front teeth are filed to sharp points!<br><span data-piece=\"344_0\" class=\"choice\"><a data-goto=\"sect_363\">Fight.</a></span><span data-piece=\"344_1\" class=\"choice\"><a data-goto=\"sect_382\">Offer them gifts.</a></span><span data-piece=\"344_2\" class=\"choice\"><a data-goto=\"sect_400\">Start to descend the ladder.</a></span>\n",
  "sect_345": "\nThe cutters are hard on your stern, and your sorry little band are all too weakened by privation to outrun them. Realising this, you tell your friends to steer in close to the shoreline - where earlier, beneath the crystal-clear water, you noticed the jagged outline of submerged rocks.<br><span class=\"indent\"></span>It is a gamble. You might run onto the rocks yourselves. But to fall into Skarvench's hands would be even more certain disaster. Luckily your jollyboat passes safely over the reef, but when the pursuing cutters reach it there is a harsh scraping sound followed by a telltale splintering. The pirates' jeering shouts turn to cries of alarm.<br><span class=\"indent\"></span>You look back. As you guessed, the cutters were overladen. Lying lower in the water than your jollyboat, they have run aground. The pirates shake their fists, but they have no hope of catching you now. The <em>Belle Dame</em> must remain at anchor till the tide turns, while you row on throughout the night.<br><span data-piece=\"345_0\" class=\"choice\"><a data-goto=\"sect_135\">Continue.</a></span>\n",
  "sect_346": "\nYou hide deep in the woods. As the silvery gleam of the predawn sky fills the shadows between the leaves, you suddenly hear an imperious command shouted from far off. It is the voice of the witch. At her order, the palm trees bend to seize the four of you and you are passed from branch to branch through the forest to be flung roughly on the ground in front of the palace.<br><span data-piece=\"346_0\" class=\"choice\"><a data-goto=\"sect_327\">Continue.</a></span>\n",
  "sect_347": "\nNo sooner has night fallen than an uncanny chill closes around you. An unspoken fear impels all of you to stagger back from the hole you have dug. You watch aghast as a shimmering mist forms in the air above the boxes. Then looming shadows are thrown against the mist - as suddenly as if blinds had been thrown up on an open window - and a host of pale ragged figures come shambling forward. Some have skin of tallow, others are ravaged by grave-mould. Spots of rust mark their armour, and their coats hang about them like decaying shrouds.<br><span class=\"indent\"></span>The foremost of this frightful throng steps forth. His face is the colour of clay, making his acid blue eyes all the more startling. Baring his sharp teeth in a macabre grin, he issues his greeting in a rasping voice. 'So there are still a few who'd dare to steal from El Draque. I admire your brass, my lads. And now, let's spill a little blood and drink a gory toast to the last day of your lives, and then mayhap I'll let you join my jolly band.'<br><span data-piece=\"347_0\" class=\"choice\"><a data-goto=\"sect_226\">Take out your crucifix.</a></span><span data-piece=\"347_1\" class=\"choice\"><a data-goto=\"sect_226\">Recite a defensive charm.</a></span><span data-piece=\"347_2\" class=\"choice\"><a data-goto=\"sect_245\">Impale him on your sword.</a></span><span data-piece=\"347_3\" class=\"choice\"><a data-goto=\"sect_264\">Continue.</a></span>\n",
  "sect_348": "\nEach day the natives bring you food and water, treating you like honoured guests. By night you sing under the stars; by day you doze in warm sea breezes. Life is full of ease and contentment. Only one thought mars your pleasure at this regal luxury: that somewhere out there across the broad seas, Skarvench still lives to work his evil ways.<br><span class=\"indent\"></span>Almost a month goes by. At last a ship appears on the horizon. By now rest and good food have restored your strength and you leap to your feet, waving palm leaves and yelling at the top of your lungs. The ship diverts her course and a rowboat is sent to fetch you from the shore.<br><span class=\"indent\"></span>The captain, a Gloriannic merchant named Quintal, greets you heartily as you come aboard. Handing you mugs of ale, he tells you his ship is bound for Leshand. Although Leshand was your original objective, you know that time is now of the essence if you're to have any chance of foiling Skarvench's scheme to abduct Queen Titania.<br><span data-piece=\"348_0\" class=\"choice\"><a data-goto=\"sect_239\">Confide in Captain Quintal.</a></span><span data-piece=\"348_1\" class=\"choice\"><a data-goto=\"sect_258\">Keep Skarvench's plans to yourself.</a></span>\n",
  "sect_349": "\n\n",
  "sect_349a": "\nA shrieking gale rises out of the east to blow you onward, but at least there is an end to the numbing rain that has pestered you for so much of the voyage. Making good headway through high frothing waves, your worst hardship becomes nausea at being hurled up and down in your flimsy craft. Even so, hunger gnaws at your insides and your longing for food and water becomes overwhelming.<br><span data-piece=\"349a_0\" class=\"choice\"><a data-goto=\"sect_349c\">Share out some rations.</a></span><span data-piece=\"349a_1\" class=\"choice\"><a data-goto=\"sect_368\">Eat the monkey.</a></span><span data-piece=\"349a_2\" class=\"choice\"><a data-goto=\"sect_387\">Go without food.</a></span><span data-piece=\"349a_3\" class=\"choice\"><a data-goto=\"sect_387\">There's nothing to eat.</a></span>\n",
  "sect_349b": "\nA shrieking gale rises in the east. You soon become nauseous at being hurled up and down in your flimsy craft. Even as you lean over the side racked by dry heaves, hunger gnaws away at your insides. At last, weakened beyond endurance, you slip over the side and are swept down into the ocean depths.<br><div class=\"s3\">THE END</div>\n",
  "sect_349c": "\n\n",
  "sect_350": "\nYour fervent prayers go unanswered. As the four of you kneel there on the deck, heads reverently bowed, Blutz gives a sudden sob. 'God's abandoned us, shipmates!' he weeps. 'We're cursed.'<br><span class=\"indent\"></span>'Aye,' cracks a voice through the gusting wind. 'Cursed to sail adrift under a heedless heaven for all eternity!'<br><span class=\"indent\"></span>You turn, shocked to see Mandrigard standing on the poopdeck, his turban lost, hair flying wildly and robes snapping about him. Rain streaks his colourless face. He stumps forward, his whalebone leg creaking the deck timbers under his weight. A grog bottle is in his hand, and he sloshes its contents as he laughs at you: 'Prayer, is it you're at? Ah, you poor fools, haven't you yet guessed the truth? This is purgatory, mates! There's no praying your way out of this mess. Here there's no living or dying, no rest, no atonement, nor answer to your orisons! This is how it'll be, now and forever, aboard the damned ship <em>Larnassos!</em>'<br><span class=\"indent\"></span>His screaming laughter rises to the cloud-filled sky, and with a feeling of mounting horror you realise he is right. You have brought the curse upon your heads. Now you will sail the seas throughout eternity.<br><div class=\"s3\">THE END</div>\n",
  "sect_351": "\nThe sun stares balefully down from a sky of burnished steel, leeching your strength. To prevent your brains being cooked in your skulls, you soak strips of torn cloth in the sea and wrap them round your brows. The brine dries to hard salt which chafes your many sores, but by now you are past caring. <br><span data-piece=\"351_0\" class=\"choice\"><a data-goto=\"sect_351c\">Don't give up hope.</a></span>\n",
  "sect_351a": "\n\n",
  "sect_351b": "\nDeprivation and hardship have slowly taken their toll until even your iron constitution has been worn to a nubbin. Weak with hunger, you no longer have the will to go on. Even vengeance against Skarvench does not seem to matter now. Your adventure is over.<br><div class=\"s3\">THE END</div>\n",
  "sect_351c": "\n\n",
  "sect_351d": "\nAfter what seems an endless time, Oakley gives a surprised shout and lunges desperately for something floating in the water beside the boat. Fumbling in a frenzy of excitement, he finally gets a firm hold on the object and hefts it up for you all to see.<br><span class=\"indent\"></span>'A coconut!' says Blutz. 'But is it safe to eat? Floating out here in mid-ocean, I mean. How did it get here?'<br><span class=\"indent\"></span>'Jetsam,' says Oakley with conviction.<br><span class=\"indent\"></span>Blutz scratches his fat jowls. 'Er... but I heard this legend of Domdaniel, which is the place under the sea where the drowned sailors live. This coconut might have floated up from one of their groves. That would make it dead men's food, you see, and not for us.'<br><span class=\"indent\"></span>'Pah! You fat fool!' gasps Oakley.<br><span class=\"indent\"></span>Grimes and Oakley intend to eat the coconut whether it is safe or not. Blutz protests that even if it was dropped off a ship, it might have gone rotten.<br><span data-piece=\"351d_0\" class=\"choice\"><a data-goto=\"sect_158\">It's fine.</a></span><span data-piece=\"351d_1\" class=\"choice\"><a data-goto=\"sect_389\">Eat some of the coconut.</a></span><span data-piece=\"351d_2\" class=\"choice\"><a data-goto=\"sect_351a\">Don't eat any.</a></span>\n",
  "sect_352": "\nThe outlines of the ship become clearer as you approach the iceberg. She is a fine gilded galleon, her sails hanging like cerements, wreaths of frost along her flanks and spikes of ice amid the rigging. Though apparently quite old and of exotic origin, it seems that the ice has kept the touch of time from harming her. You can even make out the name painted on the prow, the letters distorted and shimmering as though seen through a lens. Blutz (who is an educated man among pirates, having once drowned a school-teacher) reads it: 'The <em>Octavius</em>. Wonder how long she's been ice-bound, eh, mates?'<br><span class=\"indent\"></span>Coming alongside the ice-floe, Oakley leaps ashore and hammers a spike for the mooring rope. 'Years perhaps. But let's not linger here, it's chilly enough to make a brass monkey drop its balls. We'll just collect water and be off.'<br><span class=\"indent\"></span>'But will it be safe?' says Blutz again. 'Surely an iceberg is just frozen sea-water. You can't drink it.'<br><span data-piece=\"352_0\" class=\"choice\"><a data-goto=\"sect_425\">Collect some ice.</a></span><span data-piece=\"352_1\" class=\"choice\"><a data-goto=\"sect_371\">Agree with Blutz that it's not safe.</a></span>\n",
  "sect_353": "\nPerhaps it is the warning of a sixth sense, perhaps just a groundless fear, but you suddenly know that not all the riches of the Sidonian Main could tempt you to set foot on that eerily silent deck. Ignoring the captain's outstretched hand, you leap up onto the rail and from there jump to the rigging, making your way with catlike grace until you are astride the yardarm.<br><span class=\"indent\"></span>Captain Mandrigard takes out his sabre and shakes it at you. 'Blast ye, come down from there, ye damned monkey!' he roars. But you see that he won't be coming up in pursuit of you. Not with his wooden leg.<br><span class=\"indent\"></span>Seizing the pulleys that support the ship's cutter, or sailing boat, you swing it out over the side and then sever the ropes. The cutter falls with a splash and, as your friends scramble aboard it, you give the captain a dashing salute. 'Thank you, sir, for the fine new boat; please keep our old jollyboat in exchange. But now I must bid you adieu.'<br><span class=\"indent\"></span>Mandrigard spits curses that would bring a blush to the Devil himself, but there is nothing he can do. Scrambling down the side of the ship, you join the others in the cutter. 'This is more like it,' says Blutz appreciatively, slapping the firm timbers. 'She won't sink under us in a hurry!'<br><span data-piece=\"353_0\" class=\"choice\"><a data-goto=\"sect_330\">Continue.</a></span>\n",
  "sect_354": "\n'This was the helmet of a Spartan king,' decides Scriptor after turning the object over in his hands. 'Despite the millennia that have passed since Sparta's heyday, their name is still a byword for stern martial prowess. I would conclude, therefore, that donning the helm would confer some skill at arms.'<br><span class=\"indent\"></span>He demands a doubloon for what he's told you so far. Or you can sell the helmet to Scriptor for his collection; he'll pay you fifteen doubloons for it.<br><span data-piece=\"354_0\" class=\"choice\"><a data-goto=\"sect_354a\">Pay his fee.</a></span><span data-piece=\"354_1\" class=\"choice\"><a data-goto=\"sect_354c\">Refuse to pay.</a></span><span data-piece=\"354_2\" class=\"choice\"><a data-goto=\"sect_354b\">Sell it to him.</a></span>\n",
  "sect_354a": "\n\n",
  "sect_354b": "\n\n",
