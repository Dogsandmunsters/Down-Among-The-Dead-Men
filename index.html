  "sect_354c": "\n'One doubloon seems a hefty price to put on such a small service.'<br><span class=\"indent\"></span>He peers at you over his glasses. 'There is a tavern at the end of the street, if you would rather spend your money on something more to your tastes.'<br><span data-piece=\"354c_0\" class=\"choice\"><a data-goto=\"sect_392\">Leave.</a></span>\n",
  "sect_354d": "\n'Do you have any other items you want me to take a look at?' asks Scriptor.<br><span data-piece=\"354d_0\" class=\"choice\"><a data-goto=\"sect_316\">A conch-shell horn.</a></span><span data-piece=\"354d_1\" class=\"choice\"><a data-goto=\"sect_335\">A bat-shaped talisman.</a></span><span data-piece=\"354d_2\" class=\"choice\"><a data-goto=\"sect_373\">A dragon ring.</a></span><span data-piece=\"354d_3\" class=\"choice\"><a data-goto=\"sect_392\">Bid him good day.</a></span>\n",
  "sect_355": "\nDucking under the low rafters, you cross the sawdust-strewn taproom and seat yourselves in an alcove. At a table nearby sits a blind old man sipping brandy from a wide saucer-shaped cup. Raucous laughter pulls your gaze to the bar, where three ruffians are amusing themselves at the expense of a gentleman in shabby scholastic robes. One of the ruffians has taken the man's spectacles and is jokingly trying them on, ignoring his short-sighted attempts to grab them back.<br><span data-piece=\"355_0\" class=\"choice\"><a data-goto=\"sect_71\">You recognize some faces.</a></span><span data-piece=\"355_1\" class=\"choice\"><a data-goto=\"sect_33\">Talk to the blind man.</a></span><span data-piece=\"355_2\" class=\"choice\"><a data-goto=\"sect_52\">Step in to help the scholar.</a></span><span data-piece=\"355_3\" class=\"choice\"><a data-goto=\"sect_374\">Leave to visit the shipyard.</a></span>\n",
  "sect_356": "\nNo sooner has he set eyes on your diamonds than the shipbuilder rushes out from his office to take care of your needs personally. Showing you around the shipyard, he points to a fine new vessel that is just in the last stages of caulking. 'She will be ready to float within a week,' he declares. 'You have only to specify the name and figurehead of your choice.'<br><span class=\"indent\"></span>You stand with hands on hips, beaming at the ship. It feels like love at first sight. 'Name her the <em>Queen's Ransom</em>,' you say exultantly.<br><span class=\"indent\"></span>Oakley nods. 'Aye, and make the figurehead a comely mermaid, if you will, Master Shipbuilder.' <br><span data-piece=\"356_0\" class=\"choice\"><a data-goto=\"sect_356a\">Continue.</a></span>\n",
  "sect_356a": "\n\n",
  "sect_357": "\nAfter signing up a small crew, you spend the next few weeks plying the main shipping-lanes in search of spoils. You succeed in waylaying a couple of Sidonian merchantmen, but they prove to have little of worth in their holds. After tallying the profits and deducting each crewman's share, Blutz comes to you. 'At this rate it'll take us months to earn enough for a decent warship, Cap'n,' he says.<br><span class=\"indent\"></span>You gnaw your lip - the only outward sign that you are concerned. Other than that, your face remains an impassive granite mask. Gazing dead ahead, you say, 'You've a suggestion, Mister Blutz?'<br><span class=\"indent\"></span>'Aye, Cap'n. I know you won't like it, seein' as how you hail from Glorianne yourself, but if we didn't just confine ourselves to Sidonian ships - that is, if we was to plunder Gloriannic vessels too - we'd earn what we need in half the time.'<br><span class=\"indent\"></span>It is your judgement call. What order will you give?<br><span data-piece=\"357_0\" class=\"choice\"><a data-goto=\"sect_376\">'Continue to prey only on Sidonian ships.'</a></span><span data-piece=\"357_1\" class=\"choice\"><a data-goto=\"sect_395\">'Attack both Sidonian and Gloriannic ships from now on.'</a></span><span data-piece=\"357_2\" class=\"choice\"><a data-goto=\"sect_412\">'Reduce the crew's share of plunder.'</a></span>\n",
  "sect_358": "\nSigning on a small crew, you set sail. A strong following wind allows you to make good headway, and you reach the island in under three weeks. There your luck runs out, however, for there is no hint of treasure. Cursing blue fire, you have your men scour the beach and the hinterland for signs - carvings in the bark of a tree, piled stones, skeletons laid in a line, and all the other marks pirates use. But it is all in vain. At last Oakley and the others come to you in your cabin. 'The tide's against us, so to speak, skipper. If we don't put about and return to Selenice right away, Skarvench will have done the deed and we'll have lost our chance.'<br><span class=\"indent\"></span>You swear under your breath, but you know Oakley is right. Reluctantly you sail the <em>Lady of Shalott</em> back to Selenice.<br><span data-piece=\"358_0\" class=\"choice\"><a data-goto=\"sect_396\">Continue.</a></span>\n",
  "sect_359": "\nA combination of relentless determination and unsurpassed navigation skills drives you inexorably towards your goal. At any hour of the day or night you are to be seen upon the poopdeck, taking estimates of the wind and sea currents or using a cross-staff to measure the stars. The crew know of your near legendary status as a master mariner and dare not question your judgement, even though you are steering the ship far off the familiar sailing routes.<br><span class=\"indent\"></span>Finally your perseverance is rewarded with a cry of 'Ice ho!' from the crow's nest. You race up from your cabin and give a great roar of triumph as you catch sight of the low blue hump of an iceberg dead ahead.<br><span data-piece=\"359_0\" class=\"choice\"><a data-goto=\"sect_414\">Continue.</a></span>\n",
  "sect_360": "\n\n",
  "sect_360a": "\nYour two vessels are now almost within pistol range.<br><span data-piece=\"360a_0\" class=\"choice\"><a data-goto=\"sect_398\">Steer directly towards the <em>Moon Dog</em>.</a></span><span data-piece=\"360a_1\" class=\"choice\"><a data-goto=\"sect_415\">Heave to and let the wind bring her alongside.</a></span>\n",
  "sect_360b": "\nYou are clipped by cannon-fire. Your poor ship has taken all the damage she can stand. Listing hard over, her prow begins to sink beneath the waves. 'Man the lifeboats!' shouts Oakley. 'Abandon ship!'<br><span class=\"indent\"></span>Grimes takes your arm. 'Skipper, all's lost now. There's nothing left for us but to save ourselves.'<br><span class=\"indent\"></span>You hesitate. Honour demands that a captain go down with his ship, but that is not what roots you to the spot. Instead it is your bitter disappointment at failing to scupper your foe. Who knows what wickedness he will now wreak, and you are powerless to stop him.<br><span class=\"indent\"></span>Whether or not you flee the sinking ship, your bid for glory ends here.<br><div class=\"s3\">THE END</div>\n",
  "sect_361": "\nSkarvench opens his mouth, but the only sound that issues forth is a stifled croak. Teetering from a mortal wound, he falls to the deck and lies still.<br><span class=\"indent\"></span>Seeing the death of their leader, the pirates lose heart for the battle and are soon rounded up. As their muskets are confiscated, Oakley comes over and takes you by the arm. 'You all right, skipper?' he asks with a look of concern. 'You look in a bad way.'<br><span class=\"indent\"></span>'If you think I look bad, Mister Oakley,' you reply with a smile of weary triumph, 'you ought to take a look at the other bloke.' <br><span data-piece=\"361_0\" class=\"choice\"><a data-goto=\"sect_427\">Continue.</a></span>\n",
  "sect_362": "\n\n",
  "sect_362a": "\n\n",
  "sect_363": "\nThe islanders close in with violence in mind.<br><span data-piece=\"363_0\" class=\"choice\"><a data-goto=\"sect_296\">Draw your sword.</a></span><span data-piece=\"363_1\" class=\"choice\"><a data-goto=\"sect_296\">Knock some heads together.</a></span><span data-piece=\"363_2\" class=\"choice\"><a data-goto=\"sect_270\">Draw your pistol.</a></span><span data-piece=\"363_3\" class=\"choice\"><a data-goto=\"sect_3\">You don't know how to fight.</a></span>\n",
  "sect_364": "\nDrastic situations call for drastic remedies. Using a last-ditch trick taught to you years ago by your father, you hurl your sword at the lookout. It strikes true, penetrating his heart and killing him instantly. He tumbles from the deck without a sound, hitting the water with a limp splash.<br><span class=\"indent\"></span>'Well aimed,' says Grimes in a hushed tone of admiration. 'You got him before he could raise the alarm.'<br><span class=\"indent\"></span>You nod, regretting the loss of your sword. Rowing on, you do not relax until the ship has dropped out of sight over the horizon to your stern.<br><span data-piece=\"364_0\" class=\"choice\"><a data-goto=\"sect_135\">Continue.</a></span>\n",
  "sect_365": "\nShe gleans your intention at once and lunges forward to attack. How will you fight her?<br><span data-piece=\"365_0\" class=\"choice\"><a data-goto=\"sect_402\">Use the shark's-tooth sword.</a></span><span data-piece=\"365_1\" class=\"choice\"><a data-goto=\"sect_419\">Use your sword.</a></span><span data-piece=\"365_2\" class=\"choice\"><a data-goto=\"sect_419\">Use an ordinary sword.</a></span><span data-piece=\"365_3\" class=\"choice\"><a data-goto=\"sect_317\">Use your pistol.</a></span><span data-piece=\"365_4\" class=\"choice\"><a data-goto=\"sect_241\">Resort to pugilism.</a></span><span data-piece=\"365_5\" class=\"choice\"><a data-goto=\"sect_365a\">You have no martial skills.</a></span>\n",
  "sect_365a": "\n<br>",
  "sect_365b": "\nYou cannot defend yourself from her strong blows. Reeling back, you must decide what to do now.<br><span data-piece=\"365b_0\" class=\"choice\"><a data-goto=\"sect_384\">Cast a spell.</a></span><span data-piece=\"365b_1\" class=\"choice\"><a data-goto=\"sect_5\">Turn and flee.</a></span>\n",
  "sect_365c": "\nWhile you hesitate, deciding what to do, she moves like a blur. Her hand comes up, sharp nails angled towards your chest. She holds your heart up to show you, but by that time you are already dead.<br><div class=\"s3\">THE END</div>\n",
  "sect_366": "\nThe fog thickens about the ship, smudging the outlines of the bay and covering the stars in a filmy veil. From the marshy ground of the shore comes a green unhealthy glow, just visible between the drifting palls of mist. Blutz gazes at this eerie phosphorescence and says through chattering teeth, 'Will o' wisps. Spirits of men who drowned at sea and were washed up here.'<br><span class=\"indent\"></span>You are due to take the first watch, with Blutz relieving you at eight bells. It strikes you that his nerves may not stand a midnight vigil, and maybe it would be better if he exchanged watches with you.<br><span data-piece=\"366_0\" class=\"choice\"><a data-goto=\"sect_112\">Give Blutz the midnight watch.</a></span><span data-piece=\"366_1\" class=\"choice\"><a data-goto=\"sect_131\">Take it yourself.</a></span>\n",
  "sect_367": "\nAs you go south you begin to strike the warm east current marking the main shipping lane. 'Here we have a chance of rescue,' declares Oakley. His tone is confident enough - an attempt to inspire good cheer - but the rigors of the voyage are again taking their toll. <br><span data-piece=\"367_0\" class=\"choice\"><a data-goto=\"sect_367a\">Can you make it?</a></span>\n",
  "sect_367a": "\n\n",
  "sect_367b": "\n'Might as well see if there are any scraps to gnaw on,' says Blutz, reaching for the canvas that covers your meagre belongings.<br><span class=\"indent\"></span>You put out your hand. 'Belay those sort of liberties, Mister Blutz. Rations'll be handed out on my say-so.'<br><span data-piece=\"367b_0\" class=\"choice\"><a data-goto=\"sect_367c\">Share out the provisions.</a></span><span data-piece=\"367b_1\" class=\"choice\"><a data-goto=\"sect_125\">Conserve what little food you have.</a></span><span data-piece=\"367b_2\" class=\"choice\"><a data-goto=\"sect_125\">There's no food anyway.</a></span>\n",
  "sect_367c": "\n\n",
  "sect_368": "\n'Poor little fellow, it seems unfair after he's been with us so long,' bleats Blutz.<br><span class=\"indent\"></span>You agree in principle, but seamen soon learn that practical necessities must outweigh sentiment. 'We could eat you instead if you'd rather spare the monkey, Mister Blutz.'<br><span class=\"indent\"></span>'Aye,' says Grimes, jabbing him good-naturedly in the ribs. 'And you'd make a better meal, too. Wouldn't he, mates?'<br><span class=\"indent\"></span>In the event, despite the shedding of a maudlin tear or two, it is the monkey who ends up on your plates. The meal is cold and gristly, but better than nothing. <br><span data-piece=\"368_0\" class=\"choice\"><a data-goto=\"sect_405\">Continue.</a></span>\n",
  "sect_369": "\n\n",
  "sect_369a": "\nYou reach into the toolkit and rummage around for a hacksaw. Your reasoning is that the curse prevents you from leaving the deck of the <em>Larnassos</em>. Very well, then, you'll take the deck with you when you go - or part of it, at any rate. Sawing around the outline of your footprints, you give your astonished companions a knowing wink and then climb over the rail. The foot-shaped pieces of plank which you've cut out remain clinging to the soles of your shoes, stuck fast by the magic of the curse.<br><span class=\"indent\"></span>'Well, blow me!' mutters Grimes. Taking the hacksaw, he too saws out his own patch of the deck, and the others follow suit. Soon the four of you are climbing back down to the jollyboat tethered alongside.<br><span class=\"indent\"></span>You may have cleverly circumvented the exact letter of the curse, but do not be too quick to pat yourself on the back. The wooden soles will stay on your feet for ever as an uncanny reminder of your narrow escape. They make a noisy clattering when you walk which will hinder any attempt you might make at stealth, so you lose your Roguery skill.<br><span class=\"indent\"></span>You row away from the <em>Larnassos</em> until she is swallowed up by distance and darkness.<br><span data-piece=\"369a_0\" class=\"choice\"><a data-goto=\"sect_136\">Continue.</a></span>\n",
  "sect_369b": "\nYou reach into the toolkit and rummage around for a hacksaw. Your reasoning is that the curse prevents you from leaving the deck of the <em>Larnassos</em>. Very well, then, you'll take the deck with you when you go - or part of it, at any rate. Sawing around the outline of your footprints, you give your astonished companions a knowing wink and then climb over the rail. The foot-shaped pieces of plank which you've cut out remain clinging to the soles of your shoes, stuck fast by the magic of the curse.<br><span class=\"indent\"></span>'Well, blow me!' mutters Grimes. Taking the hacksaw, he too saws out his own patch of the deck, and the others follow suit. Soon the four of you are climbing back down to the jollyboat tethered alongside. You row away from the <em>Larnassos</em> until she is swallowed up by distance and darkness.<br><span data-piece=\"369b_0\" class=\"choice\"><a data-goto=\"sect_136\">Continue.</a></span>\n",
  "sect_370": "\nThe captain of the <em>Jewel of Heaven</em> is a bluff good-natured man who roars at his crew with gusto. For their part they seem devoted to him - and perhaps a little overawed by his forceful nature and matchless knowledge of the sea. You spend several pleasant evenings sitting in his cabin, where the rum flows free after a good supper. 'Hark to that!' he is wont to say, listening to the water lapping against the hull. 'Did you ever hear a mother with babe in arms sing such a sweet lullaby? Ah, the sweet sighing of the sea - it's a sound to seal the hushed casket of a man's soul, my merry lads!'<br><span class=\"indent\"></span>'Here aboard your fine ship, I'm happy to agree,' laughs Oakley. 'When we were drifting in our boat, though, the sea sang us a more mournful tune!'<br><span class=\"indent\"></span>The captain is glad to have educated company, and you can strike up conversations on various topics. <br><span data-piece=\"370_0\" class=\"choice\"><a data-goto=\"sect_390\">Ask his opinion of piracy.</a></span><span data-piece=\"370_1\" class=\"choice\"><a data-goto=\"sect_380\">Ask him about the war with Sidonia.</a></span><span data-piece=\"370_2\" class=\"choice\"><a data-goto=\"sect_403\">Discuss the Queen's tour of her colonies.</a></span><span data-piece=\"370_3\" class=\"choice\"><a data-goto=\"sect_420\">Ask him about Port Leshand.</a></span>\n",
  "sect_371": "\nWhat secrets, you muse to yourself, lie locked aboard the ice-bound vessel? It is a mystery that may never be answered. Even a full ship's company armed with ice picks would take weeks to hack her out of the ice.<br><span class=\"indent\"></span>You veer away from the iceberg, soon losing it far astern. The hideous incessant sun continues to sap your strength by day. By night you lie groaning in the gravid cold. <br><span data-piece=\"371_0\" class=\"choice\"><a data-goto=\"sect_371a\">Can you face another day?</a></span>\n",
  "sect_371a": "\n\n",
  "sect_372": "\nYou are stripped of all your possessions and bundled into the ship's hold to await Skarvench's return. The hatch closes, leaving you in darkness. You can hear rats scurrying about. 'Help untie these bonds,' you tell the others. 'Then we wait.'<br><span class=\"indent\"></span>After several hours you hear Skarvench come aboard. Feet clump down, creaking the timbers around the hatch over your heads. You hear a voice say, 'Does 'e want 'em up on deck now?'<br><span class=\"indent\"></span>'Not yet,' replies another man. 'We're to get under way first. Cap'n's keen to reach Selenice an' see if the moonsails 'ave arrived.'<br><span class=\"indent\"></span>The ship moves slowly as the anchor cable is winched in. Then you hear the pirates break into song as they hoist the sails and begin to steer out of the bay.<br><span class=\"indent\"></span>Suddenly there is a jolt and the ship lurches to one side. This is your chance. Hastily forcing the hatch, you emerge on deck to find that the ship has run aground on a reef. 'I knew those alterations I made to the charts would pay off,' you tell the others with a crafty smile.<br><span class=\"indent\"></span>Slipping over the side, you swim away unnoticed in the confusion. Once back at the shore, you lose no time getting your little vessel and putting to sea under cover of the dusk.<br><span data-piece=\"372_0\" class=\"choice\"><a data-goto=\"sect_177\">Continue.</a></span>\n",
  "sect_373": "\nScriptor looks closely at the ring through his jeweller's lens, then hands it back to you with a frown. 'This is a very dangerous item indeed,' he explains. 'It is cursed, and will bring disaster on anyone who tries to use it.'<br><span class=\"indent\"></span>'How <em>do</em> you use it?' wonders Blutz, reaching for the ring.<br><span class=\"indent\"></span>You snatch it back. 'We don't.'<br><span class=\"indent\"></span>Oakley gives the doctor a shrewd look. 'This wouldn't just be your way of getting us to sell the ring cheap, would it, Doc?' he mutters.<br><span class=\"indent\"></span>Scriptor splutters with outrage. 'Certainly not! I want nothing to do with it. In fact, I shall not even ask my usual fee of one doubloon for the consultation, since it is unlucky to seek profit from a cursed item.'<br><span data-piece=\"373_0\" class=\"choice\"><a data-goto=\"sect_316\">Ask about the conch-shell horn.</a></span><span data-piece=\"373_1\" class=\"choice\"><a data-goto=\"sect_335\">Show him the bat-shaped talisman.</a></span><span data-piece=\"373_2\" class=\"choice\"><a data-goto=\"sect_354\">Ask about the bronze helmet.</a></span><span data-piece=\"373_3\" class=\"choice\"><a data-goto=\"sect_392\">Bid him good day.</a></span>\n",
  "sect_374": "\nYou make your way to the eastern edge of town and along the boardwalk into the shipyard. Labourers scurry to and fro ignoring you, for it is their busiest season with the hurricane just a month away. A dozen ships lie here careened - raised up on dry land and tilted on one side so that repairs or routine maintenance can be carried out. The new vessels stand in stocks further back from the water's edge, in varying degrees of construction. You see stacks of oak planks which are used for the hulls, and long straight pine poles that will become the masts.<br><span class=\"indent\"></span>The Master Shipbuilder, Kemp, emerges from his workshop and comes hurrying over. He is a spare-framed fellow with grey mutton-chop whiskers around a face coloured red by harsh coast winds and nips of brandy wine. 'Greetings,' he says. He is on the point of shaking hands when he remembers that his fingers are tarry from caulking the new ships. 'Ah well. How can I help you?'<br><span data-piece=\"374_0\" class=\"choice\"><a data-goto=\"sect_43\">'We want to buy a ship.'</a></span><span data-piece=\"374_1\" class=\"choice\"><a data-goto=\"sect_63\">'Done any work for Skarvench recently?'</a></span><span data-piece=\"374_2\" class=\"choice\"><a data-goto=\"sect_82\">'What do you know about the <em>Cold Grue</em>?'</a></span>\n",
  "sect_375": "\nThe shipbuilder shows you a small sloop with ten cannon. 'Is that all you can sell us?' protests Grimes. 'She's hardly a suitable vessel for hard piracy.'<br><span class=\"indent\"></span>The shipbuilder shrugs. 'This is the best I can offer for the price. Her previous owner ran her up and down the Sidonian Main trading in various goods - the cannons were only installed as a defensive measure against piracy, ironically enough.' Seeing your disgruntled expression, he adds: 'She does still have a small consignment of salt aboard. It was still in the hold when she came into my hands. I'll throw that in for free.'<br><span class=\"indent\"></span>'Salt? Most generous of you. Still, she'll have to do.' And, so saying, you take possession of the <em>Lady of Shalott</em>. <br><span data-piece=\"375_0\" class=\"choice\"><a data-goto=\"sect_300\">Continue.</a></span>\n",
  "sect_376": "\nThe next few days see an upswing in your fortunes as treasure ships, anxious to be well clear of the region before the onset of the hurricane season, come sailing to your clutches like fish into a net. You board three well-laden galleons and carry off a fine haul in gold coins, jewelled trinkets and rich sea-coloured silks.<br><span class=\"indent\"></span>You pace to and fro as Blutz's quill scrapes on the pages of the account book, tracing the growth of your riches. At last he looks up with a sigh, sets aside his quill and cracks his knuckles. You, Grimes and Oakley leap forward like three expectant fathers waiting for a midwife's news. 'Well?'<br><span class=\"indent\"></span>'We've enough loot to buy us one of the finest warships on the Carab Sea,' declares Blutz with a broad grin.<br><span class=\"indent\"></span>'Excellent news.' You race up on deck. 'Hoist the mainsail! Helmsman, five points to starboard! We're bound for home.'<br><span class=\"indent\"></span>A cry from the crow's nest warns of a dark cloud on your horizon of hope. 'A Gloriannic warship in sight off the port bow!' calls the lookout. 'She's raising signals. The order is for us to heave to and prepare to be boarded.'<br><span class=\"indent\"></span>'Brandy and bilge-water!' swears Grimes, joining you on the poopdeck. 'What's it to be, cap'n - do we let those lubbers come aboard, or give 'em a run for their money?'<br><span data-piece=\"376_0\" class=\"choice\"><a data-goto=\"sect_24\">Allow the warship to come alongside.</a></span><span data-piece=\"376_1\" class=\"choice\"><a data-goto=\"sect_214\">Try outrunning her.</a></span><span data-piece=\"376_2\" class=\"choice\"><a data-goto=\"sect_252\">Turn and make a fight of it.</a></span>\n",
  "sect_377": "\nThe search for clues becomes an obsession, driving you to sleepless nights and foolhardy risks. You begin to frequent the roughest taverns of Leshand - places where a careless word can get your throat cut. Hardened villains scowl at your urgent questioning, but you soon discover that the name of El Draque seals all lips. 'But he's dead,' you protest, 'hanged at sea more than a month ago.'<br><span class=\"indent\"></span>They watch you in silence until one old sailor summons the courage to speak. 'Then how come I seen him on the deck of his vessel not one week since, drenched in moonlight and shrieking fit to burst?'<br><span class=\"indent\"></span>Another seizes you by the collar. 'The grave's not more than a temporary berth for El Draque. But no one will be saying that of you, if you keep on poking your nose about!'<br><span class=\"indent\"></span>You are finally forced to set sail back to Selenice empty handed.<br><span data-piece=\"377_0\" class=\"choice\"><a data-goto=\"sect_396\">Continue.</a></span>\n",
  "sect_378": "\nYour obsessive search for the iceberg drives you to steer a course far off the known shipping lanes. At first, in awe of your reputation as a mariner, the crew toil on without complaint. But then the days draw by with no sight of land or other ships, and the grumbling begins. Initially it takes the form of simple discontent: a spluttered curse when a man bites into an apple from the deck-barrel and finds it rotten, or a surly rejoinder when orders are given.<br><span class=\"indent\"></span>Oakley, Grimes and Blutz do their best to keep discipline, but the sun beats down day after day until the pitch bubbles in the seams and the sails blaze too bright to look at. Water begins to run low, and it is then that the grumbling begins to veer towards outright mutiny.<br><span class=\"indent\"></span>'It's getting bad below decks, skipper,' Oakley tells you. 'I know you're set on finding that vessel, but I don't think we can keep the crew in line much longer.'<br><span data-piece=\"378_0\" class=\"choice\"><a data-goto=\"sect_396\">Give up and return to Selenice.</a></span><span data-piece=\"378_1\" class=\"choice\"><a data-goto=\"sect_56\">Press on westwards.</a></span><span data-piece=\"378_2\" class=\"choice\"><a data-goto=\"sect_93\">Set a course to the east.</a></span>\n",
  "sect_379": "\nMore flashes show from the <em>Moon Dog</em>'s guns, but these shells go booming harmlessly beyond your bows, hissing to the deep below. You are now almost within grappling distance of the enemy ship.<br><span data-piece=\"379_0\" class=\"choice\"><a data-goto=\"sect_25\">Ram her at full sail.</a></span><span data-piece=\"379_1\" class=\"choice\"><a data-goto=\"sect_415\">Go close alongside for boarding.</a></span>\n",
  "sect_380": "\n'It is expected to get worse,' is the captain's view. 'The Sidonians rapaciously claim ownership of the whole of the New World; Glorianne and some other smaller nations dispute this. There is great wealth in the New World - why should we not share it? But the Sidonians continue to act like selfish schoolyard bullies, and in the meantime we have a hard time keeping our few colonies safe. Why, I have even heard that the King of Sidonia has put a price on Queen Titania's head: a million doubloons if she's delivered to him alive. The arrogance of the man!'<br><span class=\"indent\"></span>It makes sense. If the King of Sidonia could force Titania into marriage, he would thereby add Glorianne to his empire without firing a shot. But first he would have to capture her, of course, and now you begin to see the scope of Skarvench's plan. If he succeeds in kidnapping the Queen, he can ransom her to the highest bidder - either back to Glorianne, or for Sidonia's million doubloon reward.<br><span data-piece=\"380_0\" class=\"choice\"><a data-goto=\"sect_11\">Divulge what you know of Skarvench's plan.</a></span><span data-piece=\"380_1\" class=\"choice\"><a data-goto=\"sect_390\">Talk about pirates.</a></span><span data-piece=\"380_2\" class=\"choice\"><a data-goto=\"sect_420\">Ask the captain about Port Leshand.</a></span><span data-piece=\"380_3\" class=\"choice\"><a data-goto=\"sect_403\">Discuss Queen Titania's tour of the colonies.</a></span><span data-piece=\"380_4\" class=\"choice\"><a data-goto=\"sect_108\">Get some rest.</a></span>\n",
  "sect_381": "\nYour next goal is to reach civilization, and now you weigh up the advantages of each route. The direct westerly course to Port Leshand lies through stormy seas that might easily capsize a small boat like yours. Alternatively, diverting far south would take you into a region where the prevailing ocean currents flow westward, so you could be carried to Leshand faster than if you steered a direct course. The drawback is that your supplies might not last out. One solution to that problem would be to steer the middle course, island-hopping as you head generally west towards Leshand. Then your only worry would be the risk of attack from hostile natives.<br><span data-piece=\"381_0\" class=\"choice\"><a data-goto=\"sect_399\">Continue.</a></span><span data-piece=\"381_1\" class=\"choice\"><a data-goto=\"sect_416\">Continue.</a></span><span data-piece=\"381_2\" class=\"choice\"><a data-goto=\"sect_289\">Continue.</a></span>\n",
  "sect_382": "\n\n",
  "sect_382a": "\nThey cluster round eagerly to see what items you have. What will you offer them? <br><span data-piece=\"382a_0\" class=\"choice\"><a data-goto=\"sect_382c\">A sword.</a></span><span data-piece=\"382a_1\" class=\"choice\"><a data-goto=\"sect_382d\">A pistol.</a></span><span data-piece=\"382a_2\" class=\"choice\"><a data-goto=\"sect_382e\">An amulet.</a></span><span data-piece=\"382a_3\" class=\"choice\"><a data-goto=\"sect_382f\">A wand.</a></span><span data-piece=\"382a_4\" class=\"choice\"><a data-goto=\"sect_382g\">A crucifix.</a></span><span data-piece=\"382a_5\" class=\"choice\"><a data-goto=\"sect_382h\">A toolkit.</a></span><span data-piece=\"382a_6\" class=\"choice\"><a data-goto=\"sect_382i\">All your money.</a></span><span data-piece=\"382a_7\" class=\"choice\"><a data-goto=\"sect_382j\">Don't give them anything.</a></span>\n",
  "sect_382b": "\nYou display all your belongings, but you don't have anything that interests the islanders. They begin to get angry. You have a fight on your hands.<br><span data-piece=\"382b_0\" class=\"choice\"><a data-goto=\"sect_296\">Draw your sword.</a></span><span data-piece=\"382b_1\" class=\"choice\"><a data-goto=\"sect_296\">Lay into them bare-handed.</a></span><span data-piece=\"382b_2\" class=\"choice\"><a data-goto=\"sect_270\">Draw your pistol.</a></span><span data-piece=\"382b_3\" class=\"choice\"><a data-goto=\"sect_3\">You're no fighter.</a></span>\n",
  "sect_382c": "\n\n",
  "sect_382d": "\n\n",
  "sect_382e": "\n\n",
  "sect_382f": "\n\n",
  "sect_382g": "\n\n",
  "sect_382h": "\n\n",
  "sect_382i": "\n\n",
  "sect_382j": "\nThe natives bare their teeth in angry grins when they see you packing your belongings away. 'I don't think that's gone down well,' says Blutz nervously.<br><span data-piece=\"382j_0\" class=\"choice\"><a data-goto=\"sect_363\">Fight.</a></span>\n",
  "sect_383": "\nThe moonlight shines down on you like the beam of a lantern. The lookout gapes in an amazement for only a second, then starts yelling at the top of his lungs. You start to row desperately away, but you are still very weak from your ordeal. Looking back, you see that the pirates have lost no time in lowering two cutters into the water and are now rowing hard to intercept you.<br><span data-piece=\"383_0\" class=\"choice\"><a data-goto=\"sect_345\">Make a run for it.</a></span><span data-piece=\"383_1\" class=\"choice\"><a data-goto=\"sect_401\">There's no escape.</a></span>\n",
  "sect_384": "\nEjada throws back her glossy green hair and laughs. 'A wizardly duel? So be it - centuries have passed since any mortal mage dared to pit his sorcery against mine!' So saying, she raises her hands and begins the incantation of a spell.<br><span data-piece=\"384_0\" class=\"choice\"><a data-goto=\"sect_62\">Summon a gust of wind to lift her off her feet.</a></span><span data-piece=\"384_1\" class=\"choice\"><a data-goto=\"sect_81\">Unleash a blast of flame to burn her up.</a></span>\n",
  "sect_385": "\nThe basilisk: a gigantic bird with dracontine wings, scales instead of feathers, and a long serpentine tail. Its stare alone is enough to kill virtually any living thing. Of all animals, only the weasel is immune to the basilisk's deadly gaze and is capable of killing it.<br><span data-piece=\"385_0\" class=\"choice\"><a data-goto=\"sect_109\">There's another kind of basilisk.</a></span><span data-piece=\"385_1\" class=\"choice\"><a data-goto=\"sect_52\">Rescue the scholar from the three bullies.</a></span><span data-piece=\"385_2\" class=\"choice\"><a data-goto=\"sect_374\">Head straight to the shipyard.</a></span>\n",
  "sect_386": "\nYour craft is rocked by churning waves and rattled by incessant storm winds. Finally it can take no more. The timbers break apart with a shudder, plunging your sorry little band into the wine-dark waters of the sea. Your last sight is of Blutz, gasping as he claws for a handhold in thin air, calling to you for help. But you cannot help him. You cannot even save yourself.<br><div class=\"s3\">THE END</div>\n",
  "sect_387": "\nBy now your throat feels as though you have been choked with soot. 'Ah, if only the rain would start falling again - just a light drizzle,' moans Grimes. 'I'd give my right hand to taste a drop of water.'<br><span class=\"indent\"></span>Blutz stares at the heaving sea. His lolling swollen tongue makes him look like a parched dog. 'Perhaps a handful of brine would do no harm?' he ventures.<br><span class=\"indent\"></span>'Don't try it,' Oakley grunts. 'You'd wither your tongue to the root.'<br><span data-piece=\"387_0\" class=\"choice\"><a data-goto=\"sect_387a\">Water, water, everywhere.</a></span>\n",
  "sect_387a": "\n\n",
  "sect_387b": "\nYou can't go on. Lying in the bottom of the boat, you look around the faces of your companions and you realize their expressions of hopeless despair are reflected in your own.<br><span class=\"indent\"></span>'It's over,' you say. You're not sure if any of them heard you. Those are your last words in this life.<br><div class=\"s3\">THE END</div>\n",
  "sect_388": "\nEach attempt you make at leaving the ship is thwarted by a powerful force which drags you back to the deck. It is as though invisible spirits were hovering around you and conspiring to prevent your escape. Your efforts become increasingly desperate, until at last you even try jumping overboard into the churning sea. But even this is to no avail - you are just jerked back to the deck like an iron filing in the pull of a magnet.<br><span class=\"indent\"></span>'Well, that's that,' groans Blutz, flopping back against the rail in a pose of exhaustion and defeat. 'We're doomed never to get off this ship.'<br><span data-piece=\"388_0\" class=\"choice\"><a data-goto=\"sect_312\">It's time for a long shot.</a></span><span data-piece=\"388_1\" class=\"choice\"><a data-goto=\"sect_350\">All you can do now is pray.</a></span>\n",
  "sect_389": "\nBy wrapping the coconut in his shirt and banging it against the side of the boat, Oakley succeeds in breaking it open without losing any of the precious contents. He laughs delightedly as coconut milk dribbles down his chin. 'As sweet as any nectar of the gods!' he declares.<br><span class=\"indent\"></span>It proves to be a meagre banquet in any case, and everyone is soon complaining that their thirst has returned worse than before.<br><span class=\"indent\"></span>Blazing heat holds you like a vice as the afternoon wears on. At last the sun sinks into the furthest reaches of the sea. As the cool of approaching night revives your sorry band, Grimes sits up and grabs your arm. 'Look, shipmate,' he says with sudden urgency, 'here's the way I see it. We're not long for this world if something ain't done. I say we should steer further south still. At this time of year you can often find icebergs that have cracked off the pack ice in the thaw.'<br><span class=\"indent\"></span>'So what?' groans Oakley, rousing himself irritably.<br><span class=\"indent\"></span>Grimes turns to him. 'Where there's an iceberg there'll be fresh water. Penguins too, if luck's with us.'<br><span class=\"indent\"></span>Oakley gives a bleak laugh to hear this. 'Luck? Luck lost sight of our boat long ago, matey!'<br><span data-piece=\"389_0\" class=\"choice\"><a data-goto=\"sect_407\">Agree to Grimes's plan to veer south.</a></span><span data-piece=\"389_1\" class=\"choice\"><a data-goto=\"sect_424\">Stick on your current course.</a></span>\n",
  "sect_390": "\nAfter hearing some of your experiences aboard the <em>Belle Dame</em>, he nods sagely. 'Aye, that Skarvench is a scurvy pitch-hearted fiend sure enough,' he agrees. 'One of the worst pirates on the seas, since he cares not which ships he plunders - those of the accursed Sidonians, or those loyal to Her Gloriannic Majesty. Yet there are other pirates just as greedy, bloodthirsty and full of wickedness. One such is the Sidonian corsair El Draque, who captains the galleon <em>Cold Grue</em>. Bloodthirsty is indeed the word for him, I'm told. It's said he hangs his victims like slaughtered pigs from the yardarm, collecting their lifeblood in a silver goblet to drink by moonlight!'<br><span class=\"indent\"></span>The captain pauses, regards his own cup thoughtfully for a moment, then refills it. 'Piracy's not a bad business,' he continues, 'so long as you have a clear sense of where your loyalties lie. My advice is to first obtain a letter of marque. Letters of marque are issued by the governors of Gloriannic colonies. Possession of one authorizes you to attack Sidonian ships, in effect enabling you to act as private soldiers of Her Majesty. A fine arrangement which benefits everyone.'<br><span class=\"indent\"></span>'Except the Sidonians, of course,' you say with a smile.<br><span class=\"indent\"></span>The captain roars with laughter. 'Aye, the God-cursed bilge suckers!'<br><span data-piece=\"390_0\" class=\"choice\"><a data-goto=\"sect_420\">Talk about Port Leshand.</a></span><span data-piece=\"390_1\" class=\"choice\"><a data-goto=\"sect_380\">Ask him about the war with Sidonia.</a></span><span data-piece=\"390_2\" class=\"choice\"><a data-goto=\"sect_403\">Discuss the Queen's tour of her colonies.</a></span><span data-piece=\"390_3\" class=\"choice\"><a data-goto=\"sect_108\">It's time to get some rest.</a></span>\n",
  "sect_391": "\nThe pirates have forgotten to allow for your special talents. As they row towards the <em>Belle Dame</em>, you slip your bonds but hold the ropes up behind you as though still tied. As the rowboat is tying up alongside the ship, you contrive to stumble against Curshaw. 'Satan boil your gums!' he snaps. 'Watch where you're going.'<br><span class=\"indent\"></span>You drop the loose ropes and show him the barrel of the pistol you've just taken out of his belt. 'Watch where <em>you're</em> going, Curshaw,' you say with deliberate menace. 'If you aren't careful it might be five fathoms straight down.'<br><span class=\"indent\"></span>He puts up his hands. So does Porbuck, the slow-witted mate. Waving the pistol, you usher them out of the boat. Clinging to the rope ladder, they glower as you row off.<br><span class=\"indent\"></span>'It won't be long before Skarvench gets back aboard and gives chase,' says Grimes. 'Our best bet to shake him off is to head south.'<br><span class=\"indent\"></span>You agree. <br><span data-piece=\"391_0\" class=\"choice\"><a data-goto=\"sect_367\">Continue.</a></span>\n",
  "sect_392": "\n'We should not spend too long here in Leshand,' is Oakley's opinion as the four of you walk along the waterfront. 'While we dally, Skarvench advances insidiously towards his final goal.'<br><span class=\"indent\"></span>Grimes is of like mind. 'Let's obtain a letter of marque first, though,' he maintains. 'That way we can earn some money on the high seas. We will need finance to tackle Skarvench, as warships cost money!'<br><span data-piece=\"392_0\" class=\"choice\"><a data-goto=\"sect_50\">Apply for a letter of marque.</a></span><span data-piece=\"392_1\" class=\"choice\"><a data-goto=\"sect_409\">Apply for a letter of marque.</a></span><span data-piece=\"392_2\" class=\"choice\"><a data-goto=\"sect_69\">Pay a call on Master Capstick.</a></span><span data-piece=\"392_3\" class=\"choice\"><a data-goto=\"sect_107\">Ready to ship out of Leshand.</a></span>\n",
  "sect_393": "\n\n",
  "sect_393a": "\nYou recognise the man as Twitchy Pinque, a notorious petty thief who wouldn't hesitate to sell his own grandmother - not that he would get much for her if he did, since she is a known witch with a soul of pure poison.<br><span class=\"indent\"></span>Seizing him by the scruff of his grubby neck, you whisper into his ear, 'It's not stolen, this lot, is it, Twitchy? Not selling stolen goods that you've pilfered here in Selenice? That'd be nothing short of pig stupid, I'd say. I'd only have to give a whistle and some of the nastiest pirates in the Carab are going to fall on you like half a ton of ballast. I wonder what they'd do to you, eh, Twitchy?'<br><span class=\"indent\"></span>This unorthodox bargaining technique quickly convinces Pinque to drop to rock-bottom prices:<br><span data-piece=\"393a_0\" class=\"choice\" data-shop=\"6\"><span class=\"indent\"></span>Pocket watch  7 doubloons.</span><span data-piece=\"393a_1\"><span class=\"indent\"></span>Pocket watch - you can't afford it</span><span data-piece=\"393a_2\"><span class=\"indent\"></span>Pocket watch - out of stock</span><span data-piece=\"393a_3\" class=\"choice\" data-shop=\"7\"><span class=\"indent\"></span>Pistol   8 doubloons.</span><span data-piece=\"393a_4\"><span class=\"indent\"></span>Pistol - you can't afford it</span><span data-piece=\"393a_5\"><span class=\"indent\"></span>Pistol - out of stock</span><span data-piece=\"393a_6\" class=\"choice\" data-shop=\"8\"><span class=\"indent\"></span>Sword   7 doubloons.</span><span data-piece=\"393a_7\"><span class=\"indent\"></span>Sword - you can't afford it</span><span data-piece=\"393a_8\"><span class=\"indent\"></span>Sword - out of stock</span><span data-piece=\"393a_9\" class=\"choice\" data-shop=\"9\"><span class=\"indent\"></span>Hornpipe  3 doubloons.</span><span data-piece=\"393a_10\"><span class=\"indent\"></span>Hornpipe - you can't afford it</span><span data-piece=\"393a_11\"><span class=\"indent\"></span>Hornpipe - out of stock</span><span data-piece=\"393a_12\" class=\"choice\" data-shop=\"10\"><span class=\"indent\"></span>Weasel   2 doubloons.</span><span data-piece=\"393a_13\"><span class=\"indent\"></span>Weasel - you can't afford it</span><span data-piece=\"393a_14\"><span class=\"indent\"></span>Weasel - out of stock</span><span data-piece=\"393a_15\" class=\"choice\" data-shop=\"11\"><span class=\"indent\"></span>Amulet  12 doubloons.</span><span data-piece=\"393a_16\"><span class=\"indent\"></span>Amulet - you can't afford it</span><span data-piece=\"393a_17\"><span class=\"indent\"></span>Amulet - out of stock</span><span class=\"indent\"></span>You are dubious about the amulet, but Pinque swears blind it's genuine. 'Belonged to my dear old granny, guv. Still does technically, I suppose, since I never asked her if I could take it.'<br><span class=\"indent\"></span>Buy anything you can afford, then:<br><span data-piece=\"393a_18\" class=\"choice\"><a data-goto=\"sect_355\">Go into the tavern.</a></span><span data-piece=\"393a_19\" class=\"choice\"><a data-goto=\"sect_374\">Go to see the shipbuilder.</a></span>\n",
  "sect_393b": "\nYou recognise the man as Twitchy Pinque, a notorious petty thief who wouldn't hesitate to sell his own grandmother - not that he would get much for her if he did, since she is a known witch with a soul of pure poison. <br><span class=\"indent\"></span>Seizing him by the scruff of his grubby neck, you whisper into his ear, 'It's not stolen, this lot, is it, Twitchy? Not selling stolen goods that you've pilfered here in Selenice? That'd be nothing short of pig stupid, I'd say. I'd only have to give a whistle and some of the nastiest pirates in the Carab are going to fall on you like half a ton of ballast. I wonder what they'd do to you, eh, Twitchy?'<br><span class=\"indent\"></span>This unorthodox bargaining technique quickly convinces Pinque to drop to rock-bottom prices:<br><span data-piece=\"393b_0\" class=\"choice\" data-shop=\"6\"><span class=\"indent\"></span>Pocket watch  7 doubloons.</span><span data-piece=\"393b_1\"><span class=\"indent\"></span>Pocket watch - you can't afford it</span><span data-piece=\"393b_2\"><span class=\"indent\"></span>Pocket watch - out of stock</span><span data-piece=\"393b_3\" class=\"choice\" data-shop=\"7\"><span class=\"indent\"></span>Pistol   8 doubloons.</span><span data-piece=\"393b_4\"><span class=\"indent\"></span>Pistol - you can't afford it</span><span data-piece=\"393b_5\"><span class=\"indent\"></span>Pistol - out of stock</span><span data-piece=\"393b_6\" class=\"choice\" data-shop=\"8\"><span class=\"indent\"></span>Sword   7 doubloons.</span><span data-piece=\"393b_7\"><span class=\"indent\"></span>Sword - you can't afford it</span><span data-piece=\"393b_8\"><span class=\"indent\"></span>Sword - out of stock</span><span data-piece=\"393b_9\" class=\"choice\" data-shop=\"9\"><span class=\"indent\"></span>Hornpipe  3 doubloons.</span><span data-piece=\"393b_10\"><span class=\"indent\"></span>Hornpipe - you can't afford it</span><span data-piece=\"393b_11\"><span class=\"indent\"></span>Hornpipe - out of stock</span><span data-piece=\"393b_12\" class=\"choice\" data-shop=\"10\"><span class=\"indent\"></span>Weasel   2 doubloons.</span><span data-piece=\"393b_13\"><span class=\"indent\"></span>Weasel - you can't afford it</span><span data-piece=\"393b_14\"><span class=\"indent\"></span>Weasel - out of stock</span><span class=\"indent\"></span>Buy anything you can afford, then:<br><span data-piece=\"393b_15\" class=\"choice\"><a data-goto=\"sect_355\">Go into the tavern.</a></span><span data-piece=\"393b_16\" class=\"choice\"><a data-goto=\"sect_374\">Go to see the shipbuilder.</a></span>\n",
  "sect_394": "\nYou are reminded of the <em>Pelican</em>, a high-castled galleon which was renamed the <em>Saint Christopher</em>. Not long after, she heeled over making a sharp turn in strong crosswinds, took in water through her gun ports, and sank with the loss of two hundred crewmen. Since Christopher is usually an auspicious patron saint to name a ship after, the disaster in this case can only have been caused by changing the ship's name. When you tell the story to your friends they agree with you. 'She stays the <em>Meteor</em>,' says Oakley, nodding. <br><span data-piece=\"394_0\" class=\"choice\"><a data-goto=\"sect_394a\">Continue.</a></span>\n",
  "sect_394a": "\n\n",
  "sect_395": "\nYou have embarked on a fateful course - pray that it leads you to fortune, not a rope's end.<br><span class=\"indent\"></span>The next few days see an upswing in your fortunes as treasure ships, anxious to be well clear of the region before the onset of the hurricane season, come sailing to your clutches like fish into a net. You board three well-laden galleons and carry off a fine haul in gold coins, jewelled trinkets and rich sea-coloured silks.<br><span class=\"indent\"></span>You pace to and fro as Blutz's quill scrapes on the pages of the account book, tracing the growth of your riches. At last he looks up with a sigh, sets aside his quill and cracks his knuckles. You, Grimes and Oakley leap forward like three expectant fathers waiting for a midwife's news. 'Well?'<br><span class=\"indent\"></span>'We've enough loot to buy us one of the finest warships on the Carab Sea!' declares Blutz with a broad grin.<br><span class=\"indent\"></span>'Excellent news!' You race up on deck. 'Hoist the mainsail! Helmsman, five points to starboard! We're bound for home!'<br><span class=\"indent\"></span>A cry from the crow's nest warns of a dark cloud on your horizon of hope. 'A Gloriannic warship in sight off the port bow!' calls the lookout. 'She's raising signals. The order is for us to heave to and prepare to be boarded.'<br><span class=\"indent\"></span>'Brandy and bilge-water!' swears Grimes, joining you on the poopdeck. 'What's it to be, cap'n - do we let those lubbers come aboard, or give 'em a run for their money?'<br><span data-piece=\"395_0\" class=\"choice\"><a data-goto=\"sect_24\">Allow the warship to come alongside.</a></span><span data-piece=\"395_1\" class=\"choice\"><a data-goto=\"sect_214\">Try outrunning her.</a></span><span data-piece=\"395_2\" class=\"choice\"><a data-goto=\"sect_252\">Turn and make a fight of it.</a></span>\n",
  "sect_396": "\nYou sail the <em>Lady of Shalott</em> back into Selenice harbour no richer than when you left - a run of bad luck which hardly bodes well for your chances against Skarvench.<br><span class=\"indent\"></span>'We're a laughing stock,' bemoans Oakley. 'Everyone's talking about the pirates who couldn't find a doubloon to save their lives. The only sailors who'll sign on with us now are old men, cripples and drunks.'<br><span class=\"indent\"></span>You receive this news with a grim heart, but do your best to appear confident for the sake of your loyal lieutenants. 'Courage, my lads!' you cry, brandishing your fist to the heavens. 'Skarvench cannot hide from us, and now we have the advantage of surprise, for what trouble can he possibly expect from a little sloop like this?'<br><span data-piece=\"396_0\" class=\"choice\"><a data-goto=\"sect_396a\">Continue.</a></span>\n",
  "sect_396a": "\n\n",
  "sect_397": "\nHeavy sheets of rain sweep across the deck, accompanied by a howling wind, as the sky turns blacker than midnight. The unearthly pallor of St Elmo's Fire tickles along the topgallants, mirroring flickers of sheet lightning behind the coal-coloured clouds. The sails snap and strain as if a hundred invisible demons were trying to uproot the masts, and colossal waves break around the ship's bows.<br><span class=\"indent\"></span>The sailors are clinging to the rail for dear life as the ship goes pitching and yawing in the gale's grip. Even on the faces of your brave lieutenants you see the frozen grin of stark terror. You leap down onto the deck yourself, hauling yourself along the lines to trim the topsails, then seizing the whipstaff and steering the prow deftly against the oncoming wind.<br><span class=\"indent\"></span>Inspired by your example, the crew resume their duties. The familiar routine helps to banish their worst fears. They no longer feel helpless in the face of the unknown, and they put their trust in you, their peerless captain, to bring them safely through the storm.<br><span data-piece=\"397_0\" class=\"choice\"><a data-goto=\"sect_94\">Continue.</a></span>\n",
  "sect_398": "\n\n",
  "sect_398a": "\nThe crack of cannon-fire signals another broadside from the <em>Moon Dog</em>. The fo'c'sle takes a direct hit, smashing apart like a matchwood toy. You hear the screams of men who are struck by shells, but you must steel yourself to ignore their suffering. This is the crucial moment, as you close into mortal combat with your foe.<br><span data-piece=\"398a_0\" class=\"choice\"><a data-goto=\"sect_415\">Continue.</a></span>\n",
  "sect_398b": "\nThe crack of cannon-fire signals another broadside from the <em>Moon Dog</em>. The fo'c'sle takes a direct hit, smashing apart like a matchwood toy. The screaming of grown men is not a pleasant sound.<br><span data-piece=\"398b_0\" class=\"choice\"><a data-goto=\"sect_227\">Continue.</a></span>\n",
  "sect_399": "\nYour small boat is in a sorry condition, weatherbeaten from lying unused and untended on the ship's deck for so long. Worms have made tiny holes in the wood, and the timbers are sun-dried and warped.<br><span class=\"indent\"></span>Grimes sees you looking at the planking and gives a wry chuckle. 'Aye, not much is she? A sorry little vessel for us to pin our hopes on.'<br><span class=\"indent\"></span>'Our hopes?' says Oakley with a snort. 'Our <em>lives</em>, man!'<br><span class=\"indent\"></span>You touch your amulet and mutter the words of an incantation. 'That will help keep us safe from disaster on the high seas,' you explain to the others. 'It's an old charm to keep the boat seaworthy. Never fails.'<br><span class=\"indent\"></span>'And have you a charm to keep us from dying of thirst?' grumbles Blutz. But no, there is no such charm.<br><span data-piece=\"399_0\" class=\"choice\"><a data-goto=\"sect_416\">But perhaps a spell…</a></span><span data-piece=\"399_1\" class=\"choice\"><a data-goto=\"sect_289\">Continue.</a></span>\n",
  "sect_400": "\nThe natives watch in unfathomable silence while you smartly descend the ladder of knotted vines. Apparently they are not ready to launch any assault as yet, since no boulders or spears come hurtling down at you from above. Then you see another group of natives striding along the beach towards you. These are also daubed in blood-red war paint and carry spears and clubs studded with splinters of volcanic rock. There are far too many of them for you to have any hope of fighting your way past to the boat. As they draw nearer, they begin to utter a low chant which is full of ominous intent.<br><span class=\"indent\"></span>'Cannibals, or my bones are bleached wood,' mutters Grimes. 'They mean to stuff us in their cookpot.'<br><span data-piece=\"400_0\" class=\"choice\"><a data-goto=\"sect_22\">Maybe, but you don't think so.</a></span><span data-piece=\"400_1\" class=\"choice\"><a data-goto=\"sect_117\">Offer them a gift.</a></span><span data-piece=\"400_2\" class=\"choice\"><a data-goto=\"sect_79\">Outwit them with cunning.</a></span><span data-piece=\"400_3\" class=\"choice\"><a data-goto=\"sect_60\">Overawe them with magic.</a></span><span data-piece=\"400_4\" class=\"choice\"><a data-goto=\"sect_41\">Make a dash for the boat.</a></span>\n",
  "sect_401": "\nJeers and snarling shouts fill your ears. They sound like a pack of mad dogs. You glance back to see the cutters bearing down on you, crowded with grinning pirates whose cutlasses gleam menacingly in the colourless moonlight. Weakened as you are, you cannot possibly outrun them.<br><span data-piece=\"401_0\" class=\"choice\"><a data-goto=\"sect_418\">You have just one chance.</a></span><span data-piece=\"401_1\" class=\"choice\"><a data-goto=\"sect_298\">It looks hopeless.</a></span>\n",
  "sect_402": "\nAs soon as she lays eyes on your strange sword, Ejada's scornful confidence dissolves into uncertainty. 'The prophecy!' she gasps to herself. ' \"A sword not mined from any rock nor forged on any anvil!\" '<br><span class=\"indent\"></span>You lunge in, scoring a bloody gash across her cheek. 'Defend yourself, witch, or die.'<br><span class=\"indent\"></span>Raising her knife, she strides forward and matches you blow for blow. <br><span data-piece=\"402_0\" class=\"choice\"><a data-goto=\"sect_402a\">Fight.</a></span>\n",
  "sect_402a": "\n\n",
  "sect_402b": "\nEjada seems hard-pressed to get any blows past the feather shield, which proves far more effective than its flimsy appearance would have led you to expect. Your own attacks, however, bite deep.<br><span data-piece=\"402b_0\" class=\"choice\"><a data-goto=\"sect_328\">She's beaten.</a></span>\n",
  "sect_402c": "\nEjada smiles. She hasn't seen that she's wide open for a killing blow. You go to raise your sword, but your arm is like lead. Where is her knife - ? You look down, and now you know the reason for the smile. The hilt is planted in your breast.<br><span class=\"indent\"></span>'Your remains will nourish the earth,' she says. 'It is the circle of life.'<br><span class=\"indent\"></span>But what awaits you now is not life, but death.<br><div class=\"s3\">THE END</div>\n",
  "sect_403": "\nHe pauses in the act of raising his cup to his lips and glares at you from under beetling brows. 'Eh?' he demands. 'What do you know of that? It is supposed to be a secret, and you'd do well not to blab such delicate matters. A wagging tongue is a tongue worth cutting!' He fingers his sword-hilt, glowering at you sidelong.<br><span data-piece=\"403_0\" class=\"choice\"><a data-goto=\"sect_11\">'Skarvench plans to kidnap the Queen.'</a></span><span data-piece=\"403_1\" class=\"choice\"><a data-goto=\"sect_108\">Keep quiet about that.</a></span>\n",
  "sect_404": "\nA storm overtakes you, closing its teeth on your vessel with a screech of cracking timbers. Under a sky the colour of brimstone, you cling to the sides and crouch low, teeth bared in terror as you watch the foaming billows race past. The gale lasts half the night, sporadically spitting rails of icy rain down on your heads until your joints feel as stiff as a day-old corpse. When the sun finally rises, you greet it without cheer, knowing that within hours it will have baked you half out of your wits.<br><span data-piece=\"404_0\" class=\"choice\"><a data-goto=\"sect_404a\">Can you go on?</a></span>\n",
  "sect_404a": "\n\n",
  "sect_404b": "\n'Anything to eat?' asks Blutz hopefully.<br><span data-piece=\"404b_0\" class=\"choice\"><a data-goto=\"sect_404c\">Share out the provisions.</a></span><span data-piece=\"404b_1\" class=\"choice\"><a data-goto=\"sect_404d\">There's only scraps.</a></span><span data-piece=\"404b_2\" class=\"choice\"><a data-goto=\"sect_277\">There's nothing.</a></span>\n",
  "sect_404c": "\n\n",
  "sect_404d": "\n\n",
  "sect_405": "\nTo the delighted surprise of you all, dawn outlines the shape of high cliffs dead ahead. As gulls wheel idly in the sky above, Blutz cannot contain himself. Weeping with joy, he shouts, 'Land ho! We're home, mates. Thank God and all His blessed saints, we've come through it and we're home!' He falls to his knees and clasps his hands together. 'Oh, I'll never do wickedness again, not me! I'll say my prayers and do only good deeds for the rest of my days.'<br><span class=\"indent\"></span>Oakley leans to you with a grin and speaks behind his hand: 'I'll lay you twenty doubloons to a twist of rope that he forgets that resolution as soon as he claps eyes on a tavern.'<br><span class=\"indent\"></span>Following the coast south a short way, you soon come to the familiar and welcome sight of the harbour mouth. You have reached Port Leshand at last! <br><span data-piece=\"405_0\" class=\"choice\"><a data-goto=\"sect_9\">Continue.</a></span>\n",
  "sect_406": "\nYou are back in civilization. Now you have time to take stock of your harrowing ordeal. The memory of how you behaved at times gives you little cause for pride, and the dour looks of your companions reflect your inner sense of shame. Nor do you have what it takes to be a leader of men; you know that now. Grimes cannot meet your gaze as he shakes hands with you. 'Best we go our separate ways for a while,' he mutters. 'Maybe we'll meet again.'<br><span class=\"indent\"></span>Blutz is more forthright. 'None of us has come through this business with flying colours, mate. But if we aren't even masters of our own worse nature, how could we ever hope to overcome Skarvench?'<br><span class=\"indent\"></span>You are reluctantly forced to agree. Skarvench's soul may be as black as the devil's pitch, but your own is hardly spotlessly pure. Perhaps his baleful influence has made you what you are today: no valiant hero, just a fallible adventurer with a sadly chequered past.<br><div class=\"s3\">THE END</div>\n",
  "sect_407": "\nStriking southwards in search of icebergs, you enter cooler waters. The climate is still subtropical here, but ocean currents carry meltwater from the polar regions and there is always the possibility of finding icebergs. In a larger vessel they would be a hazard. Now they could be your one chance of survival.<br><span class=\"indent\"></span>After hours of continually scanning the horizon you are half blind with the sea glare, but at last you catch sight of a great blue crag drifting majestically in the distance. Sunbeams make a thousand spangling stars on its surface. 'There's yer iceberg,' says Blutz. 'But the thing is, will it be safe to drink?'<br><span class=\"indent\"></span>Drawing nearer, you begin to make out a darker outline within the blue-grey ice. Oakley is the first to recognize it. 'It's a ship! A blooming ship - frozen inside the iceberg!'<br><span data-piece=\"407_0\" class=\"choice\"><a data-goto=\"sect_333\">Continue.</a></span><span data-piece=\"407_1\" class=\"choice\"><a data-goto=\"sect_352\">Row over to the iceberg.</a></span><span data-piece=\"407_2\" class=\"choice\"><a data-goto=\"sect_371\">Carry on west towards Port Leshand.</a></span>\n",
  "sect_408": "\nCurshaw scowls as he sees you looking at him. 'I'll enjoy giving you a taste of the cat,' he says, referring to the whip used to punish mutineers.<br><span class=\"indent\"></span>'You would, you mouse,' you say, taunting him. 'You only squeak bravely when your victim is tied up.'<br><span class=\"indent\"></span>Curshaw leaps to his feet, hands bunched into fists. 'I'll cut out your tongue and swallow it whole! I'll fry your gizzard for breakfast!'<br><span class=\"indent\"></span>You glance away nonchalantly. 'Big talk, small fry.'<br><span class=\"indent\"></span>This is too much for him. Snatching up a paddle, he swings it at your head. It is your cue to explode into action. Still crouching, you duck under the swing and then, while Curshaw totters off-balance, you shoot to your feet and deliver a bone-cracking head butt that lays him flat.<br><span class=\"indent\"></span>Porbuck lets go of the oars and lumbers towards you - only to go reeling back as you lash out with two flying kicks in rapid succession. He shakes his head, growls, and comes doggedly on to pummel you with his huge fists.<br><span data-piece=\"408_0\" class=\"choice\"><a data-goto=\"sect_408a\">Fight.</a></span>\n",
  "sect_408a": "\n\n",
  "sect_408b": "\nPorbuck is a brutal and powerful fighter who would be difficult to beat even if you didn't have your hands tied. It is a true test of your brawling skill but at last, bloodied and bruised, you flatten him with a knee to the solar plexus. The others help you tip him and Curshaw overboard. Then the four of you quickly untie one another's bonds and start rowing away.<br><span data-piece=\"408b_0\" class=\"choice\"><a data-goto=\"sect_177\">Continue.</a></span>\n",
  "sect_408c": "\nPorbuck is a brutal and powerful fighter who would be difficult to beat even if you didn't have your hands tied. Unable to block, you have to endure a series of thudding body blows that pulverize your innards. With a gasp, you sink to your knees and Porbuck steps in to break your neck.<br><div class=\"s3\">THE END</div>\n",
  "sect_409": "\nA letter of marque would allow you to indulge in a spot of honest piracy - or rather privateering, as it is called. Such a letter licenses you to act as a private soldier of Her Majesty's navy, with full entitlement to plunder Sidonian treasure-ships.<br><span class=\"indent\"></span>'But we'll never be able to get one,' sighs Blutz after you have all spent some time discussing the idea.<br><span class=\"indent\"></span>'That's right,' growls Oakley. 'I hear it costs almost as much in bribes to get hold of a letter of marque as you're likely to bring in as profit!'<br><span class=\"indent\"></span>'We may as well try, at least,' you tell them, irritated to hear such pessimism.<br><span class=\"indent\"></span>You make your way up the narrow streets to the fort, where you lose no time in applying to the Office of Prejudicial Trade for a letter of marque. A bland-faced fellow in a blue velvet doublet listens to your request, then favours you with a prim smile. 'Of course, Her Majesty's government is very keen to see private enterprise flourish,' he murmurs silkily. 'But drawing up a letter of marque is not just a simple matter of putting quill to paper. There are forms to be filled in, credentials to be established, the proper channels to go through, red tape...' He pretends to stifle a yawn. 'It all takes time. And money.'<br><span class=\"indent\"></span>Grimes nudges you and mutters behind his hand. 'He's angling for a bribe, skipper.'<br><span data-piece=\"409_0\" class=\"choice\"><a data-goto=\"sect_409a\">Give him a diamond.</a></span><span data-piece=\"409_1\" class=\"choice\"><a data-goto=\"sect_260\">Promise him a cut.</a></span><span data-piece=\"409_2\" class=\"choice\"><a data-goto=\"sect_409b\">Leave.</a></span>\n",
  "sect_409a": "\n\n",
  "sect_409b": "\n'I have a coin in my pocket,' says Blutz as you walk away from the fort, 'but it's pining for company.'<br><span class=\"indent\"></span>'The world's going to the dogs,' says Oakley. 'It's getting so a man can't hardly make a dishonest living.'<br><span data-piece=\"409b_0\" class=\"choice\"><a data-goto=\"sect_69\">Call on Master Capstick.</a></span><span data-piece=\"409b_1\" class=\"choice\"><a data-goto=\"sect_107\">Weigh up your remaining options.</a></span>\n",
  "sect_410": "\n\n",
  "sect_410a": "\nAfter a brief bout of haggling you settle on the following prices:<br><span data-piece=\"410a_0\" class=\"choice\" data-shop=\"12\"><span class=\"indent\"></span>Pocket watch  8 doubloons.</span><span data-piece=\"410a_1\"><span class=\"indent\"></span>Pocket watch - you can't afford it</span><span data-piece=\"410a_2\"><span class=\"indent\"></span>Pocket watch - out of stock</span><span data-piece=\"410a_3\" class=\"choice\" data-shop=\"13\"><span class=\"indent\"></span>Pistol   12 doubloons.</span><span data-piece=\"410a_4\"><span class=\"indent\"></span>Pistol - you can't afford it</span><span data-piece=\"410a_5\"><span class=\"indent\"></span>Pistol - out of stock</span><span data-piece=\"410a_6\" class=\"choice\" data-shop=\"14\"><span class=\"indent\"></span>Sword   11 doubloons.</span><span data-piece=\"410a_7\"><span class=\"indent\"></span>Sword - you can't afford it</span><span data-piece=\"410a_8\"><span class=\"indent\"></span>Sword - out of stock</span><span data-piece=\"410a_9\" class=\"choice\" data-shop=\"15\"><span class=\"indent\"></span>Hornpipe  4 doubloons.</span><span data-piece=\"410a_10\"><span class=\"indent\"></span>Hornpipe - you can't afford it</span><span data-piece=\"410a_11\"><span class=\"indent\"></span>Hornpipe - out of stock</span><span data-piece=\"410a_12\" class=\"choice\" data-shop=\"16\"><span class=\"indent\"></span>Weasel   2 doubloons.</span><span data-piece=\"410a_13\"><span class=\"indent\"></span>Weasel - you can't afford it</span><span data-piece=\"410a_14\"><span class=\"indent\"></span>Weasel - out of stock</span><span data-piece=\"410a_15\" class=\"choice\" data-shop=\"17\"><span class=\"indent\"></span>Amulet   15 doubloons.</span><span data-piece=\"410a_16\"><span class=\"indent\"></span>Amulet - you can't afford it</span><span data-piece=\"410a_17\"><span class=\"indent\"></span>Amulet - out of stock</span><span class=\"indent\"></span>You are dubious about the amulet, but the pedlar swears blind it is the genuine article. 'Belonged to my dear old granny, guv. Still does technically, I suppose, since I never asked her if I could take it.'<br><span class=\"indent\"></span>After you have bought anything you need:<br><span data-piece=\"410a_18\" class=\"choice\"><a data-goto=\"sect_355\">Enter the tavern.</a></span><span data-piece=\"410a_19\" class=\"choice\"><a data-goto=\"sect_374\">Go to talk to the shipbuilder.</a></span>\n",
  "sect_410b": "\nAfter a brief bout of haggling you settle on the following prices:<br><span data-piece=\"410b_0\" class=\"choice\" data-shop=\"12\"><span class=\"indent\"></span>Pocket watch  8 doubloons.</span><span data-piece=\"410b_1\"><span class=\"indent\"></span>Pocket watch - you can't afford it</span><span data-piece=\"410b_2\"><span class=\"indent\"></span>Pocket watch - out of stock</span><span data-piece=\"410b_3\" class=\"choice\" data-shop=\"13\"><span class=\"indent\"></span>Pistol   12 doubloons.</span><span data-piece=\"410b_4\"><span class=\"indent\"></span>Pistol - you can't afford it</span><span data-piece=\"410b_5\"><span class=\"indent\"></span>Pistol - out of stock</span><span data-piece=\"410b_6\" class=\"choice\" data-shop=\"14\"><span class=\"indent\"></span>Sword   11 doubloons.</span><span data-piece=\"410b_7\"><span class=\"indent\"></span>Sword - you can't afford it</span><span data-piece=\"410b_8\"><span class=\"indent\"></span>Sword - out of stock</span><span data-piece=\"410b_9\" class=\"choice\" data-shop=\"15\"><span class=\"indent\"></span>Hornpipe  4 doubloons.</span><span data-piece=\"410b_10\"><span class=\"indent\"></span>Hornpipe - you can't afford it</span><span data-piece=\"410b_11\"><span class=\"indent\"></span>Hornpipe - out of stock</span><span data-piece=\"410b_12\" class=\"choice\" data-shop=\"16\"><span class=\"indent\"></span>Weasel   2 doubloons.</span><span data-piece=\"410b_13\"><span class=\"indent\"></span>Weasel - you can't afford it</span><span data-piece=\"410b_14\"><span class=\"indent\"></span>Weasel - out of stock</span><span class=\"indent\"></span>After you have bought anything you need:<br><span data-piece=\"410b_15\" class=\"choice\"><a data-goto=\"sect_355\">Enter the tavern.</a></span><span data-piece=\"410b_16\" class=\"choice\"><a data-goto=\"sect_374\">Go to talk to the shipbuilder.</a></span>\n",
  "sect_411": "\nYou are struck by sudden inspiration. 'Remember what I said when we found that treasure-haul, lads? A queen's ransom, it was, and so that's what we'll call her.'<br><span class=\"indent\"></span>Oakley directs the shipbuilder's attention to the bows. 'We'll take her, Master Kemp - only paint in a new name, will you. She's to be called the <em>Queen's Ransom</em>.' <br><span data-piece=\"411_0\" class=\"choice\"><a data-goto=\"sect_411a\">Continue.</a></span>\n",
  "sect_411a": "\n\n",
  "sect_412": "\nBlutz reluctantly goes to inform the crew of their captain's decree: that their own share of spoils will be reduced from now on. It is hardly surprising that they greet this news with a chorus of jeers and snarls. However, your desire for revenge on Skarvench blinds you to more immediate dangers until it is too late. In the dead of night, you are suddenly woken by a hand across your mouth and a knife at your throat. A voice says harshly, 'Up on deck with ye!' and you are dragged from your cabin.<br><span class=\"indent\"></span>The moonlight reveals a throng of grim faces, pale as ghosts at the thought of the dread deed they are about to do. But you see they are determined. Grimes and your other stalwart friends are shoved forward, bound head to foot.<br><span class=\"indent\"></span>'You broke the Brethren's code,' hisses the ringleader of the mutineers. 'We're entitled to our just share of treasure, see.'<br><span class=\"indent\"></span>'You damned fools,' you growl back at them. 'Release me now: that's an order.'<br><span class=\"indent\"></span>'Give yer orders to the sharks!' they say, pushing you out along a plank. Prodded with cutlasses, you have nowhere to go but to the end of the plank - and then far down, into the fathomless depths.<br><div class=\"s3\">THE END</div>\n",
  "sect_413": "\nYou take the shore-boat back to the <em>Lady of Shalott</em> but, with hardly any breeze, she has to be sculled towards the opening of the bay. By now the sun has set and the stars are glittering in a clear sky. Grimes sniffs the air and grimaces, remarking on the foulness of the region. 'That'll be the swamps fringing the bay,' he mutters. 'A rank and fever-ridden place, this is.'<br><span class=\"indent\"></span>Blutz comes hurrying back to the poop deck to report to you. 'A bank of fog is rolling in. It'll be hard getting to open sea, and even when we do there's no wind for the sails.'<br><span class=\"indent\"></span>What is to be done?<br><span data-piece=\"413_0\" class=\"choice\"><a data-goto=\"sect_36\">Whip up a magical wind.</a></span><span data-piece=\"413_1\" class=\"choice\"><a data-goto=\"sect_413a\">Drop anchor and wait until daybreak.</a></span><span data-piece=\"413_2\" class=\"choice\"><a data-goto=\"sect_55\">Try to manoeuvre out of the bay.</a></span><span data-piece=\"413_3\" class=\"choice\"><a data-goto=\"sect_74\">Try to manoeuvre out of the bay.</a></span>\n",
  "sect_413a": "\n\n",
  "sect_414": "\nNow that the current has carried the iceberg into warmer latitudes, it is rather smaller than when you last clapped eyes on it. The ship frozen inside is clearly visible now, her gilt and paintwork shimmering mirage-like beyond the pane of ice that entraps her. You can make out the guns ranged along her flanks silent, eternally watchful sentinels. How many years since they last thundered forth their fury, you wonder? How long since wind filled those lank hoarfrosted sails? Since that fine prow last proudly split the waves?<br><span class=\"indent\"></span>'The <em>Octavius</em>,' you murmur, half to yourself, as you draw alongside the iceberg. 'But how will we ever get her out of that ice?'<br><span class=\"indent\"></span>'It would take the whole crew digging with picks from now till the moon goes blue,' says Grimes.<br><span class=\"indent\"></span>You nod. The comment is unhelpful, but quite true. You had been counting on the iceberg being more reduced by sun and warm waters by this time. Now that you see it, excavating the <em>Octavius</em> seems an impossible task.<br><span class=\"indent\"></span>Blutz steps forward. 'Begging your pardon, skipper, but I've got an idea.' You turn and give him a long dubious look. 'Er... well, it might take a while, but I think there's a way we can get that ship out of the ice.'<br><span class=\"indent\"></span>Oakley interrupts with an exasperated gasp. 'We're wasting time! The <em>Octavius</em> might as well be thirty fathoms deep for all the chance we've got of sailing her. Let's set to filling our coffers with a spot of good old-fashioned piracy. Then we can sail back and trade in this old tub for a decent warship.'<br><span data-piece=\"414_0\" class=\"choice\"><a data-goto=\"sect_376\">Agree with Oakley.</a></span><span data-piece=\"414_1\" class=\"choice\"><a data-goto=\"sect_44\">Let Blutz try his plan.</a></span>\n",
  "sect_415": "\nAll the pent-up emotion of your crew explodes in an excited roar as they go leaping onto the deck of the enemy ship with you at their head. <br><span class=\"indent\"></span>The pirates stand ready to meet your boarding party, armed with muskets and drawn swords, and the fighting is hard and fierce. You are all but deafened by the gunshots going off all around you, half blinded by the thick clouds of smoke and sprays of blood, but you struggle onwards. Until a musket shot catches you at point-blank range. <br><span data-piece=\"415_0\" class=\"choice\"><a data-goto=\"sect_415a\">A flesh wound! Shrug it off.</a></span><span data-piece=\"415_1\" class=\"choice\"><a data-goto=\"sect_415a\">And with victory so close.</a></span>\n",
  "sect_415a": "\n\n",
  "sect_415b": "\nIgnoring the pain, you look around. The battle rages back and forth across the deck. Pirates come running at you but you smash them aside. Your only thought now is to find your foe and slay him yourself; you do not want him to die mercifully from a stray bullet.<br><span class=\"indent\"></span>The moment you catch sight of him, you realize your anxiety was misplaced. The bullets go whistling past his ears, but he stands untouched by fear, arms spread out and laughing like a fiend from the pit. You begin to wonder if he can be killed, or are his hate and madness stronger than death itself?<br><span class=\"indent\"></span>His single eye fixes on you through the haze of gunsmoke. 'Ah, matey,' he says. 'Come to see your old cap'n one last time, eh?' <br><span data-piece=\"415b_0\" class=\"choice\"><a data-goto=\"sect_89\">Continue.</a></span>\n",
  "sect_416": "\nGrimes gazes back into the east, where a pale gold glimmer heralds the approach of dawn. 'God curse that Skarvench!' he declares suddenly. 'I wish I'd had the chance to slice open his foul heart as he slept.'<br><span class=\"indent\"></span>Oakley nods. 'Even that might not have been enough to stop the fiend from coming after us.'<br><span class=\"indent\"></span>'Coming after us?' says Blutz nervously. 'Do you think he will?'<br><span class=\"indent\"></span>You have to agree with Oakley. Skarvench is not the kind of man to let others cross him. The fact that you four have got free of his clutches will enrage him as much as the theft of the jollyboat. He might well give chase - and if he catches up with you, your fate will not bear thinking about.<br><span class=\"indent\"></span>'What about your magic?' Blutz asks you. 'Can't you keep him off our stern? Conjure up a tempest to blow the <em>Belle Dame</em> far out to sea!'<br><span class=\"indent\"></span>You mull it over. You could cast such a spell, but it is mighty magic indeed. It could all too easily get out of control, and even if it works it might leave you too weakened for further sorcery later.<br><span data-piece=\"416_0\" class=\"choice\"><a data-goto=\"sect_15\">Attempt it anyway.</a></span><span data-piece=\"416_1\" class=\"choice\"><a data-goto=\"sect_289\">Give up the idea for now.</a></span>\n",
  "sect_417": "\nThe vicious grins on their faces as they accept your gift leave you uncertain of how you stand. While the gift is passed around for inspection, Oakley says, 'Quick now, lads, let's get back to the jollyboat before they turn nasty.'<br><span class=\"indent\"></span>You make a hasty descent of the cliffs, but before you are even halfway down a rock comes sailing past your head. 'Move it!' you shout to the others. 'Or we're all done for.'<br><span data-piece=\"417_0\" class=\"choice\"><a data-goto=\"sect_417a\">Continue.</a></span>\n",
  "sect_417a": "\n\n",
  "sect_417b": "\nMore rocks come dashing down, and you can now hear a horrid chortling from the natives as they watch their missiles bruise and buffet you. Thanks to your amulet and a hastily-spoken charm to a tutelary spirit, most of the missiles go wide of the mark, and you are no worse than badly scratched. <br><span class=\"indent\"></span>Reaching he bottom of the ladder, you race back to the boat and cast off, rowing away from the shore as fast as your weary limbs will allow.<br><span class=\"indent\"></span>'Let's hope we have more luck on the next island,' says Grimes.<br><span data-piece=\"417b_0\" class=\"choice\"><a data-goto=\"sect_116\">Continue.</a></span>\n",
  "sect_417c": "\nMore rocks come dashing down, and you can now hear a horrid chortling from the natives as they watch their missiles bruise and buffet you. Somehow you manage to keep your hold on the ladder despite this fearful barrage, but by the time you reach the bottom you have blood streaming from a dozen cuts.<br><span class=\"indent\"></span>You race back to the boat and cast off, rowing away from the shore as fast as your weary limbs will allow.<br><span class=\"indent\"></span>'Let's hope we have more luck on the next island,' says Grimes.<br><span data-piece=\"417c_0\" class=\"choice\"><a data-goto=\"sect_116\">Continue.</a></span>\n",
  "sect_417d": "\nMore rocks come dashing down. One strikes you on the head. Your grip goes slack and you fall. Out cold, you don't even feel the impact that breaks your neck.<br><div class=\"s3\">THE END</div>\n",
