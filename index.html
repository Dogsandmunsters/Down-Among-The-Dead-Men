  "sect_418": "\nWaiting until the two cutters are almost alongside, you suddenly jump to your feet and leap across to the nearest one, landing on the side with all your weight. As the cutter lists sickeningly, taking on water, the pirates aboard start to panic. Fearing the cutter is about to capsize, they lurch back over towards the other side. Several fall overboard, abandoning their weapons as they flounder about in the sea. One lunges at you angrily, but you jump over his clutches and he too pitches over the side. The crew of the other cutter meanwhile are forced to veer away sharply to avoid a collision.<br><span class=\"indent\"></span>The scene degenerates quickly into utter confusion. Some of the pirates in the water try to get aboard the second cutter, their own shipmates clubbing them back from the sides for fear they will sink the already overloaded boat. The first cutter is now drifting in a circle, half the oars floating off in the waves and with a good deal of water sloshing in the bottom of the hull. You are satisfied that the pirates will be too busy for a while to give chase, so you jump nimbly back into the jollyboat and tell your friends to row for all they are worth.<br><span class=\"indent\"></span>A confused bedlam of yells and curses echoes out over the water after you, but soon you have left the island far behind. The <em>Belle Dame</em> cannot safely manoeuvre clear of the island until daybreak. By that time you intend to have put many leagues between you and your former captain.<br><span data-piece=\"418_0\" class=\"choice\"><a data-goto=\"sect_135\">Continue.</a></span>\n",
  "sect_419": "\nYou drive your sword-point against Ejada's breast in a lunge which is swift, merciless and deadly. But when you step aside waiting for her to fall, you see to your horror that the blade has barely scratched her skin.<br><span class=\"indent\"></span>'All bark and no bite, eh?' she says with a soft cold laugh. 'My turn now.' <br><span data-piece=\"419_0\" class=\"choice\"><a data-goto=\"sect_419a\">Continue.</a></span>\n",
  "sect_419a": "\n\n",
  "sect_419b": "\nShe raises her arm, swiping at you with languid grace. The blow seems effortless but carries the force of a cudgel-stroke. You are flung back dazed. <br><span data-piece=\"419b_0\" class=\"choice\"><a data-goto=\"sect_241\">Resort to your bare hands.</a></span><span data-piece=\"419b_1\" class=\"choice\"><a data-goto=\"sect_317\">Shoot her.</a></span><span data-piece=\"419b_2\" class=\"choice\"><a data-goto=\"sect_384\">Use magic against her.</a></span><span data-piece=\"419b_3\" class=\"choice\"><a data-goto=\"sect_5\">Turn and flee.</a></span>\n",
  "sect_419c": "\nShe raises her arm, swiping at you with languid grace. The blow seems effortless but hits you with the force of a cannonball. You are flung to the ground with a fractured skull. Your adventure is over.<br><div class=\"s3\">THE END</div>\n",
  "sect_420": "\nThe captain chuckles. 'Nominally it is a Gloriannic colony, though I daresay there's a half-dozen rogues and ruffians for every honest merchant. The governor of Leshand encourages buccaneers to drop their anchors there, for as a rule they have a lot of gold to spend and this makes the port grow richer. But never show your face in Leshand if you've preyed on Gloriannic ships - then you'd be seized and hung in chains on the waterfront, see.'<br><span class=\"indent\"></span>'For how long?' asks Blutz naively.<br><span class=\"indent\"></span>'Till you turn soft and drop, like venison,' laughs the captain.<br><span class=\"indent\"></span>'Not for plundering Sidonian ships?' prompts Oakley.<br><span class=\"indent\"></span>'Of course not! They'd like as give you a medal for that. Glorianne rejoices at each act of piracy the Sidonians suffer, and the governor of Leshand is happy to hand out letters of marque sanctioning such.'<br><span class=\"indent\"></span>If you wish, you can now turn the conversation to other topics.<br><span data-piece=\"420_0\" class=\"choice\"><a data-goto=\"sect_390\">Talk about piracy.</a></span><span data-piece=\"420_1\" class=\"choice\"><a data-goto=\"sect_380\">Ask him about the war.</a></span><span data-piece=\"420_2\" class=\"choice\"><a data-goto=\"sect_403\">Discuss the Queen's tour of her colonies.</a></span><span data-piece=\"420_3\" class=\"choice\"><a data-goto=\"sect_108\">Get some rest.</a></span>\n",
  "sect_421": "\nWith no way to keep dry, you see that there is at least a means of staving off the terrible chill. 'Strip off your clothes and soak them in the sea,' you advise your companions.<br><span data-piece=\"421_0\" class=\"choice\"><a data-goto=\"sect_421a\">But will it work?</a></span>\n",
  "sect_421a": "\n\n",
  "sect_421b": "\nSince the sea water is warmer than the rain, your idea helps to avoid the worst discomforts of exposure. Even so, the hardship takes its toll.<br><span data-piece=\"421b_0\" class=\"choice\"><a data-goto=\"sect_259\">Inspect the boat.</a></span><span data-piece=\"421b_1\" class=\"choice\"><a data-goto=\"sect_7\">Continue.</a></span>\n",
  "sect_421c": "\nSince the sea water is warmer than the rain, your idea helps to avoid the worst perils of exposure. Even so, the hardship takes its toll. Already on the point of death from your earlier ordeals, you soon lapse into a fever from which you will never awaken.<br><div class=\"s3\">THE END</div>\n",
  "sect_422": "\nYou have never known such an uncanny hush aboard a ship. The deck, shrouded in a mist of fine drizzle, is silent apart from the creak of the ship's timbers and the rustling of wet sails in the gusting wind.<br><span class=\"indent\"></span>Blutz is the last to climb aboard, puffing as he hauls his rotund body over the rail. He looks around, blinking, uncertain, and then voices the question that is in all your minds: 'Where are your crew?'<br><span class=\"indent\"></span>Captain Mandrigard gives a twisted smile when he hears this. He is a long lanky stick of a man, with one leg of flesh and one of carved whalebone. Dressed in silk robes out of another era, he has an emerald-pinned turban wound around his head and a naked sabre hanging at his belt. His skin is the colour of wrought iron, his brow high and wrinkled. When he speaks, you are reminded of the rumbling of a church organ: 'Gone - deserted, the dogs! I am alone aboard my ship now.'<br><span class=\"indent\"></span>He takes you below to his cabin, where you are confronted by a breathtaking wealth of treasure. Gold, silver and sparkling jewels are strewn carelessly across the table. Mandrigard sweeps them contemptuously to the floor and pours goblets of wine for you all, drinking deep without proposing any toast. His own goblet is especially fine: pale yellow onyx with a border of gold around the rim. When he sees you admiring it, he slurps more wine and says, 'Cast your eyes on my treasure if you like. It's a fine haul for any corsair, is it not? Oh, but what a price I paid for it!'<br><span data-piece=\"422_0\" class=\"choice\"><a data-goto=\"sect_279\">Ask about the treasure.</a></span><span data-piece=\"422_1\" class=\"choice\"><a data-goto=\"sect_8\">Discuss passage to Port Leshand.</a></span><span data-piece=\"422_2\" class=\"choice\"><a data-goto=\"sect_27\">Ask about the crew.</a></span>\n",
  "sect_423": "\nLeshand is a busy port of narrow half-timbered houses with small leaded windows and peaked roofs of olive-green tiles. The town is overlooked by the massive stone garrison fort on the hill above the harbour. It is well known that the governor prefers to rule the colony with a light touch, exercising his authority in as leisurely a manner as possible, openly encouraging buccaneers to put into dock here and spend their loot. But things are different at the moment, and you are struck by subtle but noticeable changes since your last visit. The buccaneers are here as usual, but in fewer numbers and on markedly better behaviour. The soldiers of the city militia are adorned in clean new tabards, which they wear with expressions of pride. There are even a handful of street-cleaners whom you pass scrubbing at the accumulated grime on the cobblestones.<br><span class=\"indent\"></span>A good meal and a bath go a long way to refreshing you after your weeks at sea.<br><span data-piece=\"423_0\" class=\"choice\"><a data-goto=\"sect_127\">Find out the latest news.</a></span><span data-piece=\"423_1\" class=\"choice\"><a data-goto=\"sect_69\">Call at Master Capstick's house.</a></span><span data-piece=\"423_2\" class=\"choice\"><a data-goto=\"sect_12\">Visit a chandler's to buy supplies.</a></span><span data-piece=\"423_3\" class=\"choice\"><a data-goto=\"sect_31\">Find someone to identify strange items.</a></span><span data-piece=\"423_4\" class=\"choice\"><a data-goto=\"sect_88\">Listen for rumours.</a></span><span data-piece=\"423_5\" class=\"choice\"><a data-goto=\"sect_50\">Apply for a letter of marque.</a></span><span data-piece=\"423_6\" class=\"choice\"><a data-goto=\"sect_409\">Apply for a letter of marque.</a></span>\n",
  "sect_424": "\nYou awaken cramped and sore, your limbs locked stiff after an uncomfortable and chilly night. Each of your friends gives a weak groan as he wakes, almost as though stricken with grief at having to face another terrible day of scorching heat. No sooner has the sun risen than waves of heat come rolling over the flat mirror of the sea, making you gasp for water. 'I'd give my soul for one drop...' moans Grimes. 'Half a drop!'<br><span class=\"indent\"></span>'Your soul?' Oakley manages a short bark of laughter. 'Who'd want your black soul, you old sea dog?'<br><span class=\"indent\"></span>They cling together, shaking with gallows humour at this, wheezing between their teeth because belly laughter would crack their desiccated throats.<br><span class=\"indent\"></span>'They're hysterical - half mad!' snaps Blutz. He stares at you hopelessly. 'Do something, or we'll all die. I don't want to end my days in an open boat, unshriven and unmourned, never to lie in the fresh soil of home!'<br><span data-piece=\"424_0\" class=\"choice\"><a data-goto=\"sect_101\">Use your magic.</a></span><span data-piece=\"424_1\" class=\"choice\"><a data-goto=\"sect_120\">Bide your time.</a></span><span data-piece=\"424_2\" class=\"choice\"><a data-goto=\"sect_120\">You can do nothing.</a></span>\n",
  "sect_425": "\nAs it turns out, the sun has melted small pools on the iceberg's surface, saving you the effort of chipping blocks of ice to get water. The taste is slightly brackish, but it seems otherwise drinkable. You fill your bellies before heading back to the jollyboat and casting off.<br><span class=\"indent\"></span>You head west, watching the sun slide down the sky. Then Blutz gives an excited shout and points astern. You all turn, rubbing your eyes when you see a fleck of gold against the indigo eastern sky. To your disbelief and delight, the fleck grows until you can clearly see that it is the topsails of a brigantine bearing directly for you.<br><span class=\"indent\"></span>Leaping to your feet, you wave and stamp and shout until you see the faces of sailors appear at the rail. They drop sail, steering towards you. 'Ahoy there,' you hear a voice call as the brigantine draws level with your boat, 'we'll throw down a rope.' 'Why, this is a glad day!' says Oakley as you climb up to the deck. 'First a good drink of water, and now a ride home into the bargain!' <br><span data-piece=\"425_0\" class=\"choice\"><a data-goto=\"sect_370\">Continue.</a></span>\n",
  "sect_426": "\nThe second of the four islands comes in sight: a verdant jungle-clad shoreline dominated by the immense hump of a smouldering volcano. High up on the volcano's slopes you can see the dull red gleam of lava. Grey sulphurous smoke sits in a wreath around the cone.<br><span class=\"indent\"></span>'We'd be foolhardly to put ashore here,' maintains Blutz. 'That volcano could erupt and bury us all!'<br><span data-piece=\"426_0\" class=\"choice\"><a data-goto=\"sect_193\">Reassure him.</a></span><span data-piece=\"426_1\" class=\"choice\"><a data-goto=\"sect_174\">Put in at the island.</a></span><span data-piece=\"426_2\" class=\"choice\"><a data-goto=\"sect_135\">Continue sailing west.</a></span>\n",
  "sect_427": "\n\n",
  "sect_427a": "\nYou are taken to Queen Titania's cabin in the aft gallery of the <em>Rose</em>. You are amazed at the sight of such luxury aboard a ship: there is a thick carpet, velvet drapes and even a gilded throne.<br><span class=\"indent\"></span>The Queen is younger than you expected, slim as a colt and palely pretty, with hair of autumn flame. But there is the ring of purebred royalty in her voice as she greets you. 'You have saved us from a fate that does not bear contemplation,' she says. 'You have our thanks - and not only thanks, but also material reward. Such a valiant mariner should not live a pirate's cruel life. Will you accept a title and a grant of land in Glorianne?'<br><span class=\"indent\"></span>'And there's a commission in the navy waiting for you, too, if you want it,' puts in Admiral Calidor. He turns and bows to the Queen with his hand to his chest. 'Your pardon, Majesty.'<br><span class=\"indent\"></span>'Not at all, Calidor.' The Queen smiles - a vivacious radiant smile, quite at odds with the stuffy panoply of courtly etiquette that surrounds her. Turning back to you, she adds: 'Our esteemed admiral is quite right. You would make a welcome addition to our navy. Well?'<br><span class=\"indent\"></span>You are momentarily lost in a private reverie. The offer is tempting, but you have got used to a life of exhilarating adventure. There was your run-in with El Draque. You may not have seen the last of him. Did you make other enemies along the way? And are there mysteries still for you to explore on the Carab Sea?<br><span class=\"indent\"></span>You look up at Queen Titania. She is waiting for your answer. Pirate, privateer or captain in the navy? It's up to you.<br><div class=\"s3\"><a href=\"facebooklink\">- THE END -</a></div>\n",

    function life(n) {
        if (n < 0) playSound('damage');
        vars[life_points] += n;
        if (vars[life_points] < 0) vars[life_points] = 0;
        if (vars[life_points] > vars[life_points_max]) vars[life_points] = vars[life_points_max];
    }
    
    function hidepiece(piece) {
        // Remove 'p_' prefix if present for matching
        const cleanPiece = piece.startsWith('p_') ? piece.substring(2) : piece;
        const el = document.querySelector(`[data-piece="${cleanPiece}"]`) ||
                   document.querySelector(`[data-piece="${piece}"]`) ||
                   document.querySelector(`[data-piece="p_${cleanPiece}"]`);
        if (el) el.classList.add('hidden');
    }

        vars[life_points] = 10;
        vars[life_points_max] = 10;
    }
    
    function changeSection(newSect) {
        auto = '';
        displaySection(newSect);
        runSectionLogic(newSect, 1);
        
        // Handle auto-redirects
        for (let i = 0; i < 3 && auto !== ''; i++) {
            const nextSect = 'sect_' + auto;
            auto = '';
            displaySection(nextSect);
            runSectionLogic(nextSect, 1);
        }
        
        updateDisplay();
        saveGame();
        
        // Check for death
        if (vars[life_points] <= 0 && vars[char_chosen] === 1) {
            showGameOver();
        }
    }

            jollyboatUnlocked = true;
            document.getElementById('jollyboat-btn').classList.remove('hidden');
        }
        
        const content = SECTIONS[sectId];
        if (content) {
            // Build HTML with optional illustrations
            let html = '';
            
            // Check for section illustration (displayed BEFORE text)
            if (SECTION_ILLUSTRATIONS[sectId]) {
                const imgSrc = 'images/' + SECTION_ILLUSTRATIONS[sectId];
                html += `<img src="${imgSrc}" class="section-illustration" onclick="openLightbox('${imgSrc}')" alt="Illustration">`;
            }
            
            html += content;
            
            // Check for end illustration (displayed AFTER text, for endings)
            if (SECTION_END_ILLUSTRATIONS[sectId]) {
                const imgSrc = 'images/' + SECTION_END_ILLUSTRATIONS[sectId];
                html += `<img src="${imgSrc}" class="section-illustration end-illustration" onclick="openLightbox('${imgSrc}')" alt="Illustration">`;
            }
            
            document.getElementById('section-display').innerHTML = html;
            setupClickHandlers();
            document.querySelectorAll('[data-piece]').forEach(el => el.classList.remove('hidden'));

            document.getElementById('section-display').innerHTML = `<p>Section ${sectId} not found.</p>`;

    }

        document.querySelectorAll('[data-shop]').forEach(el => {

                doShop(parseInt(el.getAttribute('data-shop')));

            life(-2);

    // ========================================
    // SHOP SYSTEM
    // ========================================
    
    function doShop(n) {
        const item = SHOP_ITEMS[n];
        if (!item) return;
        
        const [varName, price, name] = item;
        
        if (n === 99) {
            vars[money] += 200;
            updateDisplay();
            saveGame();
            alert('Added 200 doubloons!');
            return;
        }
        
        // Find the variable index
        const varIndex = {
            'crucifix': crucifix, 'pistol': pistol, 'sword': sword, 'compass': compass,
            'parrot': parrot, 'pocket_watch': pocket_watch, 'hornpipe': hornpipe,
            'weasel': weasel, 'amulet': amulet
        }[varName];
        
        if (varIndex !== undefined && vars[money] >= price) {
            playSound('coins');
            vars[money] -= price;
            vars[varIndex]++;
            updateDisplay();
            saveGame();
            displaySection(currentSection);
            runSectionLogic(currentSection, 0);
        } else if (varIndex === undefined) {
            alert('This item is not available.');
        } else {
            alert('You cannot afford that. You need ' + price + ' doubloons.');
        }
    }

    function updateDisplay() {
        document.getElementById('money-display').textContent = vars[money];
        
        const lifeEl = document.getElementById('life-display');
        lifeEl.textContent = vars[life_points];
        lifeEl.classList.toggle('danger', vars[life_points] <= 3);
        
        const shipStat = document.querySelector('.ship-stat');
        if (vars[ship_name] > 0) {
            shipStat.style.display = 'flex';
            document.getElementById('hull-display').textContent = vars[hull_strength];
        } else {
            shipStat.style.display = 'none';
        }
        
        if (jollyboatUnlocked) {
            document.getElementById('jollyboat-btn').classList.remove('hidden');
        }
    }
    
    function showCharSheet() {
        const content = document.getElementById('char-sheet-content');
        
        if (vars[char_chosen] === 0) {
            content.innerHTML = '<p>Once you have chosen a character, their details will be listed here.</p>';
        } else {
            let html = '';
            
            // Skills
            html += '<div class="char-section"><div class="char-section-title">SKILLS</div><div class="char-section-content">';
            const skills = [];
            for (let v = 53; v <= 64; v++) {
                if (vars[v] > 0) skills.push(VAR_NAMES[v]);
            }
            html += skills.join(', ') || 'None';
            html += '</div></div>';
            
            // Life Points
            html += '<div class="char-section"><div class="char-section-title">LIFE POINTS</div>';
            html += '<div class="char-section-content">' + vars[life_points] + '</div></div>';
            
            // Money
            html += '<div class="char-section"><div class="char-section-title">MONEY</div>';
            html += '<div class="char-section-content">' + vars[money] + ' doubloons</div></div>';
            
            // Possessions
            html += '<div class="char-section"><div class="char-section-title">POSSESSIONS</div><div class="char-section-content">';
            const items = [];
            for (let v = 1; v <= 29; v++) {
                if (vars[v] > 0) {
                    let itemStr = VAR_NAMES[v];
                    if (vars[v] > 1) itemStr += ' x ' + vars[v];
                    if (v === healing_potion) {
                        itemStr += '<button class="use-item-btn" onclick="useHealingPotion()">Drink</button>';
                    }
                    items.push(itemStr);
                }
            }
            html += items.length > 0 ? items.join('<br>') : 'None';
            html += '</div></div>';
            
            // Ship
            const hasShip = vars[ship_name] > 0;
            html += '<div class="char-section ship-section' + (hasShip ? ' active' : '') + '">';
            html += '<div class="char-section-title">SHIP</div><div class="char-section-content">';
            if (hasShip) {
                html += '<em>' + SHIP_NAMES[vars[ship_name]] + '</em><br>Hull Strength: ' + vars[hull_strength];
            } else {
                html += 'No ship yet';
            }
            html += '</div></div>';
            
            content.innerHTML = html;
        }
        
        document.getElementById('char-modal').classList.add('active');
    }
    
    function useHealingPotion() {
        if (vars[healing_potion] <= 0) {
            alert("You don't have a healing potion!");
        } else if (vars[life_points] === 0) {
            alert("You can't drink when you're dead!");
        } else if (vars[life_points] >= vars[life_points_max]) {
            alert("You are at full strength. Save the potion for later.");
        } else {
            vars[healing_potion]--;
            life(999);
            alert("You drink the healing potion and your health is restored.");
            updateDisplay();
            saveGame();
            showCharSheet();
        }
    }

    function confirmReset() {
        if (confirm('Are you sure you want to restart? All progress will be lost.')) resetGame();
    }
    
    function resetGame() {
        localStorage.removeItem('deadmen_save');
        document.getElementById('game-over').classList.remove('active');
        jollyboatUnlocked = false;
        document.getElementById('jollyboat-btn').classList.add('hidden');
        initVars();
        changeSection('sect_1');
    }
    
    // ========================================
    // SAVE/LOAD
    // ========================================
    
    function saveGame() {
        localStorage.setItem('deadmen_save', JSON.stringify({
            section: currentSection,
            vars: vars,
            jollyboatUnlocked: jollyboatUnlocked
        }));
    }
    
    function loadGame() {
        const save = localStorage.getItem('deadmen_save');
        if (save) {
            try {
                const data = JSON.parse(save);
                vars = data.vars;
                jollyboatUnlocked = data.jollyboatUnlocked || false;
                if (jollyboatUnlocked) {
                    document.getElementById('jollyboat-btn').classList.remove('hidden');
                }
                changeSection(data.section);
                return true;
            } catch (e) { console.error('Load failed:', e); }
        }
        return false;
    }
    
    function hasSavedGame() {
        return localStorage.getItem('deadmen_save') !== null;
    }
    
    function showStartupScreen() {
        document.getElementById('startup-screen').classList.remove('hidden');
        // Disable resume button if no saved game
        const resumeBtn = document.getElementById('resume-btn');
        if (!hasSavedGame()) {
            resumeBtn.classList.add('disabled');
            resumeBtn.disabled = true;
        } else {
            resumeBtn.classList.remove('disabled');
            resumeBtn.disabled = false;
        }
    }
    
    function hideStartupScreen() {
        document.getElementById('startup-screen').classList.add('hidden');
    }
    
    function startNewGame() {
        hideStartupScreen();
        initVars();
        changeSection('sect_1');
    }
    
    function resumeGame() {
        if (hasSavedGame()) {
            hideStartupScreen();
            loadGame();
        }
    }
    
    // ========================================
    // INIT
    // ========================================
    
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
        
        // Load sound preference
        loadSoundPreference();
        
        // Show startup screen
        showStartupScreen();
    });
    
    // Register service worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(e => console.log('SW registration failed:', e));
    }
