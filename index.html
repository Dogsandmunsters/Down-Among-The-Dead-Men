  "sect_31": "\nIn a small courtyard off the fish market lives Doctor Scriptor, a collector of magical curios. You have brought him items in the past, both for identification and to see if he would buy them from you.<br><span data-piece=\"31_0\" class=\"choice\"><a data-goto=\"sect_31a\">Show him what you have.</a></span><span data-piece=\"31_1\" class=\"choice\"><a data-goto=\"sect_31b\">Show him what you've got.</a></span>\n",
  "sect_31a": "\nHe looks up from his dusty manuscripts and takes what you have brought to show him, holding up a jeweller's glass and passing each item in turn under the sharp scrutiny of his beady old eyes.<br><span class=\"indent\"></span>'Well?' you ask.<br><span class=\"indent\"></span>'One moment.' Scriptor gives a dry cough, perching his glasses on his thin nose and consulting a dusty leather-bound book. 'Hmm. Ah yes, ah yes. Eureka!'<br><span class=\"indent\"></span>What items are you asking him about:<br><span data-piece=\"31a_0\" class=\"choice\"><a data-goto=\"sect_316\">A conch-shell horn.</a></span><span data-piece=\"31a_1\" class=\"choice\"><a data-goto=\"sect_335\">A bat-shaped talisman.</a></span><span data-piece=\"31a_2\" class=\"choice\"><a data-goto=\"sect_354\">A bronze helmet.</a></span><span data-piece=\"31a_3\" class=\"choice\"><a data-goto=\"sect_373\">A dragon ring.</a></span><span data-piece=\"31a_4\" class=\"choice\"><a data-goto=\"sect_392\">Bid him good day.</a></span>\n",
  "sect_31b": "\nHe takes what you have brought to show him, holding up a jeweller's glass and passing each item in turn under the sharp scrutiny of his beady old eyes.<br><span class=\"indent\"></span>'Well?' you ask.<br><span class=\"indent\"></span>Scriptor shakes his head. 'It's just junk. Nothing magical here.'<br><span class=\"indent\"></span>It seems he cannot help you.<br><span data-piece=\"31b_0\" class=\"choice\"><a data-goto=\"sect_392\">Leave.</a></span>\n",
  "sect_32": "\nYou explode into a sudden flurry of dazzling action. Pushing your friends back out of danger, you dive nimbly to one side as the chief ruffian's knife whistles through the air just a hand's breadth above your scalp. Then, springing up onto the bar, you launch yourself forward, tumbling in midair so as to go careening against the ruffians' legs with the force of a rolling barrel. They are bowled over like so many skittles.<br><span class=\"indent\"></span>Jumping to your feet, you pause just long enough to check that Blutz and the others have safely made their getaway. It is your one mistake. A clumsily-thrown knife catches you in the thigh, laying open a nasty gash. <br><span data-piece=\"32_0\" class=\"choice\"><a data-goto=\"sect_32a\">You can take it.</a></span><span data-piece=\"32_1\" class=\"choice\"><a data-goto=\"sect_32a\">Calamity.</a></span>\n",
  "sect_32a": "\n\n",
  "sect_32b": "\nYou limp hastily outside where your friends help you to get to safety. Only when you are sure there is no sound of pursuit do you slow to a walk.<br><span class=\"indent\"></span>'Well, that wasn't very successful,' says Blutz, gasping for breath.<br><span class=\"indent\"></span>'What are you griping about, Mister Blutz?' you say with a relieved grin. 'You've still got your health, and that's what counts.' <br><span data-piece=\"32b_0\" class=\"choice\"><a data-goto=\"sect_392\">Continue.</a></span>\n",
  "sect_32c": "\nYour once-great strength, worn down by the many hardships you have had to face, fails you at last. You sink to the ground, using your dying breath to curse the name of Skarvench. In another life, perhaps, you will finally have your revenge.<br><div class=\"s3\">THE END</div>\n",
  "sect_33": "\nThe sunlight, filtering weakly through tobacco-stained windows, makes his eyes shine like pearls as he turns to you. 'Pull up a pew, mates,' he says, stifling a sodden belch. 'Ol' Greymalkin is always ready to swap stories with a fellow buccaneer.'<br><span class=\"indent\"></span>'Here is a fearless warrior of the waves, indeed,' says Grimes behind his hand. 'He's in full sail on a sea of wine, and that smell isn't salt spray billowing on the wind!'<br><span class=\"indent\"></span>'I heard that!' snaps Greymalkin drunkenly. 'Poke fun at ol' Greymalkin if you like, ye scurvy nobbler - I'll wager I saw more action afore my lights were put out than ye'll see in your whole poxy life. Aye, an' I heard a few tales in my time, too.'<br><span class=\"indent\"></span>'Heard anything recently?' you ask.<br><span class=\"indent\"></span>'Heard a fair bit. Talkin' about it dries the tongue out, though.'<br><span data-piece=\"33_0\" class=\"choice\"><a data-goto=\"sect_33a\">Buy him a drink.</a></span><span data-piece=\"33_1\" class=\"choice\"><a data-goto=\"sect_52\">Rescue the scholar from the bullies.</a></span><span data-piece=\"33_2\" class=\"choice\"><a data-goto=\"sect_374\">Go to the shipyard.</a></span>\n",
  "sect_33a": "\n\n",
  "sect_34": "\nHis eyes roll in their sockets, each an orb as big as a boulder. 'A ship, is it? Well, there are many moored in this harbour. More ships than you could dream of: all the ships of myth and legend! But do you not see this harbour chain?' His hand dips into the dark water, jangling the massive links as a man might play with a watch-chain.<br><span class=\"indent\"></span>'Won't you lift it,' you boldly ask him; 'allow us to enter and choose a vessel?'<br><span class=\"indent\"></span>He booms his mirth to the sky. 'Hah! You're audacious enough to be a hero, at least. No, I won't help you - but see this lock? You could open the chain yourself easily enough, except for the fact that no man can see or touch the key that fits it.'<br><span data-piece=\"34_0\" class=\"choice\"><a data-goto=\"sect_91\">Riddles, is it?</a></span><span data-piece=\"34_1\" class=\"choice\"><a data-goto=\"sect_110\">Unlock the chain by magic.</a></span><span data-piece=\"34_2\" class=\"choice\"><a data-goto=\"sect_129\">You have something that might do the trick.</a></span><span data-piece=\"34_3\" class=\"choice\"><a data-goto=\"sect_72\">Admit defeat.</a></span>\n",
  "sect_35": "\n'Sidonian men-o'-war hard astern! Three of 'em!' cries your lookout. The Gloriannic warship sees them too and alters course to engage the enemy. Forgotten for the time being, your own ship is able to slip away.<br><span class=\"indent\"></span>Oakley joins you on the poopdeck. 'They're almost over the horizon,' he says, glancing back. 'A nice bit of luck, those Sidonian ships turning up just when they did. But I'm a bit surprised at you making a run for it, skipper. I'd have thought you'd order us to muck in and help the Gloriannic captain.'<br><span class=\"indent\"></span>You smile and pat the wand tucked into your belt. 'Help him, Mister Oakley? Against what - those magical mirages I conjured? They'll be fading like a morning haze as soon as we're out of sight.'<br><span class=\"indent\"></span>He laughs heartily to hear this.<br><span data-piece=\"35_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_36": "\nSailors are a superstitious lot, easily spooked by any overt display of sorcery. Because of this you are reluctant to unleash the full force of your magic in front of the crew. Luckily Blutz realises your dilemma and provides you with an excuse to slip away. 'When I was a lad, we always used to say you could get a wind by whistling for it,' he declares loudly. 'It's worth a try now, ain't it, shipmates?' Turning to you, he adds: 'Begging your pardon, skipper, but it's an ill wind you get if you whistle while the captain's on deck.'<br><span class=\"indent\"></span>'Eh? Oh yes, of course; I've heard that legend. Well, anything's worth trying. Carry on, Mister Blutz.'<br><span class=\"indent\"></span>While the crew start whistling, you go below to your cabin and conjure a wind. Returning on deck a little while later, you see the sails billowing and the sailors dancing for joy. 'Quick thinking, Mister Blutz,' you mutter as the <em>Lady of Shalott</em> clears the mouth of the bay.<br><span class=\"indent\"></span>'Just whistle anytime you need me, Cap'n,' he replies with a wink.<br><span data-piece=\"36_0\" class=\"choice\"><a data-goto=\"sect_396\">Continue.</a></span>\n",
  "sect_37": "\nThe storm turns the sky to boiling pitch, and in your fancy it seems that you would be swamped by celestial fires if it were not that the sea now boils up to the edge of heaven, hissing those fires into smoky darkness. Your crew cling to whatever comes to hand as mighty waves come heaving over the side. You see one man lose his balance and go hurtling across the deck - only saved at the last moment by catching hold of the mainsail shrouds.<br><span class=\"indent\"></span>'Cap'n!' cries the helmsman, peering into the thundering curtains of rain. 'I cannot see to steer her!'<br><span class=\"indent\"></span>You hold your amulet before his eyes. Its burnished gold surface sparkles in the flicker of lightning. 'Focus your gaze on this,' you tell him. 'Have faith.'<br><span class=\"indent\"></span>He stands fast as though entranced, turning the whipstaff to follow each swing of the amulet. The sails strain, drawing shrieks of protest from the masts, and high waves crash around your bows, but you plunge on directly for the heart of the storm.<br><span data-piece=\"37_0\" class=\"choice\"><a data-goto=\"sect_94\">Continue.</a></span>\n",
  "sect_38": "\n\n",
  "sect_38a": "\nWith your nautical experience it's easy to pull your ship deftly aft of the enemy ship without taking damage. All the pent-up emotion of your crew explodes in an excited roar as they go leaping onto the deck of the enemy ship with you at their head. <br><span class=\"indent\"></span>The pirates stand ready to meet your boarding party, armed with muskets and drawn swords, and the fighting is hard and fierce. You are all but deafened by the gunshots going off all around you, half blinded by the thick clouds of smoke and sprays of blood, but you struggle onwards. Until a musket shot catches you at point-blank range. <br><span data-piece=\"38a_0\" class=\"choice\"><a data-goto=\"sect_415a\">A flesh wound! Shrug it off.</a></span><span data-piece=\"38a_1\" class=\"choice\"><a data-goto=\"sect_415a\">And with victory so close.</a></span>\n",
  "sect_38b": "\nEagerness makes you careless, and your vessel is clipped by cannon-fire as you go in. Fortunately the damage is minor. You draw alongside with a scraping of hulls. All the pent-up emotion of your crew explodes in an excited roar as they go leaping onto the deck of the enemy ship with you at their head. <br><span class=\"indent\"></span>The pirates stand ready to meet your boarding party, armed with muskets and drawn swords, and the fighting is hard and fierce. You are all but deafened by the gunshots going off all around you, half blinded by the thick clouds of smoke and sprays of blood, but you struggle onwards - until a musket shot catches you at point-blank range. <br><span data-piece=\"38b_0\" class=\"choice\"><a data-goto=\"sect_415a\">A flesh wound! Shrug it off.</a></span><span data-piece=\"38b_1\" class=\"choice\"><a data-goto=\"sect_415a\">And with victory so close.</a></span>\n",
  "sect_38c": "\nEagerness makes you careless, and your vessel is raked by cannon-fire as you go in. Listing hard over, her prow begins to sink beneath the waves. 'Man the lifeboats!' shouts Oakley. 'Abandon ship!'<br><span class=\"indent\"></span>Grimes grabs your arm. 'Skipper, all's lost now. There's nothing left for us but to save ourselves.'<br><span class=\"indent\"></span>You hesitate. Honour demands that a captain go down with his ship, but that is not what roots you to the spot. Instead it is your bitter disappointment at failing to scupper your foe. Who knows what wickedness he will now wreak, and you are powerless to stop him.<br><span class=\"indent\"></span>Whether or not you flee the sinking ship, your bid for glory ends here.<br><div class=\"s3\">THE END</div>\n",
  "sect_39": "\nThe sailmaster is the officer in charge of day-to-day navigation of the ship. His tiny cabin is strewn about with papers, compasses, books and other maritime paraphernalia.<br><span class=\"indent\"></span>A sound from the bunk directly by your shoulder makes you give a start of alarm. You thought the blasted cabin was empty! But just as you are lunging forward, the blanket is tossed aside and you have a clear view of the bunk's occupant - not a sailor, but only the little monkey that serves as the ship's mascot. Mister Chatter is what the crew call him. He squats on the bunk and watches as you search around the rest of the cabin.<br><span class=\"indent\"></span>You have time to grab two items: <br><span data-piece=\"39_0\" class=\"choice\"><a data-goto=\"sect_39a\">A toolkit and a book of charts.</a></span><span data-piece=\"39_1\" class=\"choice\"><a data-goto=\"sect_39b\">A toolkit and a crucifix.</a></span><span data-piece=\"39_2\" class=\"choice\"><a data-goto=\"sect_39c\">A toolkit and the monkey.</a></span><span data-piece=\"39_3\" class=\"choice\"><a data-goto=\"sect_39d\">A book of charts and a crucifix.</a></span><span data-piece=\"39_4\" class=\"choice\"><a data-goto=\"sect_39e\">A book of charts and the monkey.</a></span><span data-piece=\"39_5\" class=\"choice\"><a data-goto=\"sect_39f\">A crucifix and the monkey.</a></span>\n",
  "sect_39a": "\n\n",
  "sect_39b": "\n\n",
  "sect_39c": "\n\n",
  "sect_39d": "\n\n",
  "sect_39e": "\n\n",
  "sect_39f": "\n\n",
  "sect_40": "\nBy steering a southerly route you take advantage of the prevailing east current which should bear you to Port Leshand with the need for hard effort at the oars. Additionally, there is always the chance that you will be picked up by one of the many ships that ply these waters.<br><span class=\"indent\"></span>After a whole day at sea you do not have such high hopes. In all that time you have seen nothing but the boundless expanse of ocean all around you. The sky is cloudless, giving no respite from the sun that beats mercilessly down from dawn to dusk. By night a cool wind leaves you huddled, shivering, inside your ragged clothes.<br><span data-piece=\"40_0\" class=\"choice\"><a data-goto=\"sect_40a\">How long can you last?</a></span>\n",
  "sect_40a": "\n\n",
  "sect_40b": "\nFrom your long nautical experience, you know that soaking your clothes in the sea helps keep you warm at night and cool during the day. Measures like this protect you and your companions from the worst rigours of the journey.<br><span data-piece=\"40b_0\" class=\"choice\"><a data-goto=\"sect_40c\">Continue.</a></span>\n",
  "sect_40c": "\nShortly after sunrise on the second day, you catch sight of a small uncharted island off to port. In form it is a rough hump of rock no more than a hundred paces from side to side, girt with weed and sandbanks and covered with clumps of greenish algae.<br><span class=\"indent\"></span>'A coral reef,' decides Grimes, noting the vague orange-pink shadow of rocks beneath the waves. 'There could at least be fresh rainwater there - and insects, if not birds.'<br><span class=\"indent\"></span>'What do we want with insects?' asks Blutz in disgust.<br><span class=\"indent\"></span>'Food,' you tell him. 'Necessity must overrule nicety if we're to survive.'<br><span data-piece=\"40c_0\" class=\"choice\"><a data-goto=\"sect_28\">Put in at the island.</a></span><span data-piece=\"40c_1\" class=\"choice\"><a data-goto=\"sect_47\">Continue on your present course.</a></span><span data-piece=\"40c_2\" class=\"choice\"><a data-goto=\"sect_66\">Detour north towards the Smoking Islands.</a></span>\n",
  "sect_41": "\nHeavy stones fly about you like shots from a cannon as you beat your retreat. Several of them thud harmlessly into the soft sand, but then you feel a hot slash of pain as one strikes the side of your head, leaving a ragged gash. You stumble, but Blutz catches your arm to help you into the boat.<br><span data-piece=\"41_0\" class=\"choice\"><a data-goto=\"sect_41a\">Can you make it?</a></span>\n",
  "sect_41a": "\n\n",
  "sect_41b": "\nThanks to your lucky amulet, the wound is no more than a scratch. Throwing Blutz a grateful look, you lean over the oars and the boat is soon out amid the waves.<br><span class=\"indent\"></span>The battering hail of rocks continues as the natives watch you row away. You finally get out to open sea beyond reach of their bombardment.<br><span class=\"indent\"></span>'I think they wanted us to stay for dinner,' jokes Oakley with grim humour. 'I hope the natives on the next island are more friendly.'<br><span data-piece=\"41b_0\" class=\"choice\"><a data-goto=\"sect_116\">'So do I.'</a></span>\n",
  "sect_41c": "\nYou lose consciousness for a moment. The next thing you know, the boat is already out amid the waves with Oakley and Grimes plying the oars for all they're worth.<br><span class=\"indent\"></span>The battering hail of rocks continues as the natives watch you row away. You slump down into the bottom of the boat with an exhausted sigh of relief as you finally get out to open sea beyond reach of the islanders' bombardment.<br><span class=\"indent\"></span>'I think they wanted us to stay for dinner,' jokes Oakley with grim humour. 'I hope the natives on the next island are more friendly.'<br><span data-piece=\"41c_0\" class=\"choice\"><a data-goto=\"sect_116\">'So do I.'</a></span>\n",
  "sect_41d": "\nYou have no strength left to get into the boat. The others have to abandon you and save themselves as the islanders rush over and vent their rage upon your lifeless body.<br><div class=\"s3\">THE END</div>\n",
  "sect_42": "\nYou sneak closer to get within earshot.<br><span data-piece=\"42_0\" class=\"choice\"><a data-goto=\"sect_80\">Continue.</a></span><span data-piece=\"42_1\" class=\"choice\"><a data-goto=\"sect_42a\">Continue.</a></span>\n",
  "sect_42a": "\nStealth is not your strong suit. You tread on a twig and Skarvench and his cronies leap up with angry roars to do battle. Discovered, you have no recourse but to rush in on them.<br><span class=\"indent\"></span>'Well, if it ain't me prodigal orphans!' chortles Skarvench, drawing his sword and pistol as he sees you break from the undergrowth. 'You ran off without collectin' your back pay, mates, so he's a little something on account, like.' So saying, he levels his pistol and pulls the trigger.<br><span class=\"indent\"></span>Pain lances through your shoulder as the shot tears flesh and splinters bone. But sheer hatred of your foe drives you on. A red haze sparkles across your vision, and Skarvench's grinning face is like a painting in blood on the back of your eyes as you race forward with a savage snarl.<br><span data-piece=\"42a_0\" class=\"choice\"><a data-goto=\"sect_267a\">Fight.</a></span>\n",
  "sect_43": "\n'These are glad tidings!' he declares with enthusiasm. 'I am always happy to launch gentlemen of fortune on their careers.'<br><span class=\"indent\"></span>For the next hour you are shown around the shipyard while discussing the exact specifications of your new ship. You explain to Kemp everything you want, from the timber to be used and the kind of armaments right down to details such as the cargo capacity, the figurehead, and even the cabin fittings.<br><span class=\"indent\"></span>'You know your vessels,' he says approvingly. 'Naturally, in view of the fact that on every point you have stipulated that you want materials and labour of only the soundest and best quality, you must appreciate that the price will not be cheap.'<br><span class=\"indent\"></span>You add up the costs and discover that you will need at least one diamond to purchase even a small second-hand ship. Failing that, you will have to obtain one some other way. Promising to return as soon as you have come to a firm decision, you take your leave of Master Kemp and walk back into town.<br><span class=\"indent\"></span>'Where to now?' says Oakley.<br><span class=\"indent\"></span>You think for a moment. 'We'll take rooms at the Sweat o' the Brow inn. If Skarvench shows his face anywhere in Selenice, it'll be there.'<br><span class=\"indent\"></span>Never a truer word was spoken. You arrive at the inn and stand frozen in shock in the doorway. There the devil stands, large as life in front of you. A rum bottle is clutched in his hand and his crew throng the tap-room around him, cowering as he subjects them to one of his thunderous drunken rants.<br><span class=\"indent\"></span>Then his eye alights on you. His snarling voice is cut off in mid-sentence. A thin line of spittle runs down into his beard as his teeth show shark-like in a vicious grin. It is the moment you have waited for. Face to face with your arch foe.<br><span data-piece=\"43_0\" class=\"choice\"><a data-goto=\"sect_14\">Continue.</a></span>\n",
  "sect_44": "\nBlutz directs the crew to fetch up the cargo from the hold. At first you have no idea what he's talking about, then you remember the barrels of rock salt that the last owner of the <em>Lady of Shalott</em> left aboard when he sold her. The light begins to dawn when Blutz orders the cannons loaded with this salt. The first broadside scours the surface of the iceberg, and it is not long before water is trickling down in the hot noon sun.<br><span class=\"indent\"></span>'I remembered that salt can be used to melt ice and snow,' explains Blutz, beaming with elation at the success of his plan. After two more broadsides the salt has etched its way deep into the ice and there comes a continuous crackling sound as the iceberg slowly breaks apart under the onslaught.<br><span class=\"indent\"></span>An attack with pickaxes completes the task. Soon the ice has been chipped away to leave a deep gouge, and the <em>Octavius</em> comes drifting forth gleaming into the full daylight. You board her, abandoning the sloop, and set a northward course. The days pass and your new ship is a delight, handling better than any vessel you've ever sailed. You feel a glow of pride as you at last steer her through the harbour gate and up to the Selenice docks.<br><span data-piece=\"44_0\" class=\"choice\"><a data-goto=\"sect_44a\">Continue.</a></span>\n",
  "sect_44a": "\n\n",
  "sect_45": "\nMermaids are like all faerie creatures in being motivated by caprice. They can be cruel or kind, as the whim takes them. It is well known that they sometimes seek the company of mortal men, whom they entice with their beauty and the promise of secret wealth, because they constantly yearn to draw a little of the surface world's warmth and vitality into their own submerged realm of twilit silence. Few who have succumbed to a mermaid's lures survive to tell the tale. There are cases of men who have tarried a while under the sea, then returned with the gift of second sight - for the mermaids are able to grant knowledge of future events. Such cases are rare. A more likely fate is to be washed up on the beach, leeched of breath by the mermaid's kiss, dead face forever frozen in fearful rapture for having heard the mermaid's secrets and witnessed her unearthly beauty.<br><span class=\"indent\"></span>You know one more thing. Any question put to a mermaid must be answered truthfully if the questioner has a firm grip on her. In that respect, too, she is like any other faerie creature.<br><span data-piece=\"45_0\" class=\"choice\"><a data-goto=\"sect_64\">Continue.</a></span>\n",
  "sect_46": "\nSlurring his words, Mandrigard peers soddenly at you across the table. 'It's more talk you want, is it? Well, I'm talked out. Not all the blabber in a thousand harems will wipe out the curse I carry with me - and you poor dolts are part of that curse now. You'll never leave this ship! You're my crewmen now - now, and forevermore!'<br><span class=\"indent\"></span>Wine-soaked spittle sprays out from his lips as he screams all this. The look in his eyes is like the fires of hell. Then suddenly his eyelids droop, and he slumps forward across the treasure, mumbling, 'See this scar on my left hand? There's the proof, y'see? 'Tis where I broke the lock of that heathen shrine. See the stain of my curse, do you?' <br><span data-piece=\"46_0\" class=\"choice\"><a data-goto=\"sect_65\">Continue.</a></span>\n",
  "sect_47": "\nA little rainfall helps to slake your thirst, but hunger still chews at your bellies and the constant blaze of the sun makes you dizzy.<br><span data-piece=\"47_0\" class=\"choice\"><a data-goto=\"sect_47a\">How much longer can you last?</a></span>\n",
  "sect_47a": "\n\n",
  "sect_47b": "\nSquinting into the sunset, Oakley gives a sudden cry of anguish. 'Another night of this, God rot me, and I'll be as mad as a gannet! If we only had something to eat.' He gnaws the leather of his belt just to have a taste of something solid in his mouth.<br><span data-piece=\"47b_0\" class=\"choice\"><a data-goto=\"sect_218\">Improvise.</a></span><span data-piece=\"47b_1\" class=\"choice\"><a data-goto=\"sect_237\">There's always the monkey.</a></span><span data-piece=\"47b_2\" class=\"choice\"><a data-goto=\"sect_275\">Continue.</a></span>\n",
  "sect_48": "\nYou eat and drink while listening to Mortice tell his tale. It is a gruesome story, beginning with a storm at sea. Mortice was washed ashore on a deserted island along with a dozen corpses of his former shipmates. After many months he was picked up by a ship called the <em>Cold Grue</em>, but there his hope soon turned to despair. 'By day I was locked up in the fo'c'sle, and only let out at night to toil on deck. I never knew a harsher taskmaster than El Draque, captain of that fell ship! There were other poor sailors aboard with me, and if ever you set a foot wrong - or even if you didn't, sometimes - you'd be taken down to the hold an' never seen again. Once I watched El Draque and his corsairs bury treasure by moonlight on a stretch o' shore off Tortoise Island, under a rock marked with crossed bones. Aye, I marked that well; I'd be for goin' back there, if I had myself a ship that could outrun the <em>Cold Grue</em>!'<br><span class=\"indent\"></span>'And how did you escape?' asks Blutz, chomping on a chicken leg.<br><span class=\"indent\"></span>'Why, I made myself this raft and starved until I was so thin I could squeeze out the fo'c'sle hatch like any bag of old scraps. There wasn't a soul stirring on deck during the hours o' daylight, you see. So I loaded up food and water and pushed off. Been adrift for weeks, I have, till I caught sight o' you jolly lads!' He refills your cups from the full barrel beside him.<br><span data-piece=\"48_0\" class=\"choice\"><a data-goto=\"sect_67\">There' something odd about his raft.</a></span><span data-piece=\"48_1\" class=\"choice\"><a data-goto=\"sect_105\">Continue.</a></span>\n",
  "sect_49": "\nYou race off into the jungle not a moment too soon. Turning to peer back from the crest of a wooded hill, you see the <em>Belle Dame</em> already riding at anchor offshore. A rowboat is bringing Skarvench and his cut-throats to the beach even now.<br><span class=\"indent\"></span>'He'll never leave until he's found us,' mutters Oakley as you trudge on through the dense green thickets.<br><span class=\"indent\"></span>'It's a big island,' you call back over your shoulder. 'If we stay hidden long enough, he'll have to give up the search and leave. For all he knows we might be dead already.'<br><span data-piece=\"49_0\" class=\"choice\"><a data-goto=\"sect_144\">Continue.</a></span><span data-piece=\"49_1\" class=\"choice\"><a data-goto=\"sect_163\">Continue.</a></span><span data-piece=\"49_2\" class=\"choice\"><a data-goto=\"sect_49a\">Continue.</a></span>\n",
  "sect_49a": "\nYou hide out deep in the hinterland of the island, surviving off your remaining rations. Eventually you deem it safe to make your way back to the native village. Peering out from the sheltering foliage, you find that the <em>Belle Dame</em> has sailed off. The coast is clear.<br><span class=\"indent\"></span>'That fiend!' rages Oakley. 'No doubt he's off to wreak more wickedness in the world. Are we really going to sit here sucking coconuts while he goes unpunished?'<br><span class=\"indent\"></span>You all agree it is high time you pressed on with your voyage. The natives are now too scared to repeat the offer of an escort. You're on your own.<br><span data-piece=\"49a_0\" class=\"choice\"><a data-goto=\"sect_177\">Continue.</a></span>\n",
  "sect_50": "\nA letter of marque would allow you to indulge in a spot of honest piracy - or rather privateering, as it is called. Such a letter licenses you to act as a private soldier of Her Majesty's navy, with full entitlement to plunder Sidonian treasure-ships.<br><span class=\"indent\"></span>'But we'll never be able to get one,' says Blutz despondently after you have all spent some time discussing the idea.<br><span class=\"indent\"></span>'That's right,' growls Oakley. 'It costs almost as much in bribes to get hold of a letter of marque as you're likely to bring in as profit.'<br><span class=\"indent\"></span>'Oh,' you say, pulling a furled-up document from your sleeve and tossing it onto the table. 'What's this?'<br><span class=\"indent\"></span>Grimes inspects it with mounting astonishment. 'Why, it's a letter of marque, establishing our right to act as privateers on the Carab Sea! How did you get-' He pauses and grins. 'The ink's still wet.'<br><span class=\"indent\"></span>You retrieve the letter of marque, beaming with pride. It is as good a forgery as any you've ever done - when the ink dries it will be indistinguishable from the real thing.<br><span data-piece=\"50_0\" class=\"choice\"><a data-goto=\"sect_69\">Call on Master Capstick.</a></span><span data-piece=\"50_1\" class=\"choice\"><a data-goto=\"sect_107\">You don't need his help.</a></span><span data-piece=\"50_2\" class=\"choice\"><a data-goto=\"sect_107\">Continue.</a></span>\n",
  "sect_51": "\n'Fine,' you say smartly. 'Go ahead and carve us up. Then see what Skarvench does to you when he hears about it.'<br><span class=\"indent\"></span>The leader of the cut-throats replies with a scowl, but you see him hesitate. He's not sure. 'You're bluffing,' he says. 'Skarvench said to deal with anyone who came around snooping after him.'<br><span class=\"indent\"></span>'We're supposed to be with him,' you say, adopting the tone you would use to a stupid child. You're pushing your luck, but that's how you like it.<br><span class=\"indent\"></span>'How do I know you're telling the truth..?' he says, tiny eyes clouding with uncertainty. The knife point wavers.<br><span class=\"indent\"></span>You give a derisive snort. 'Would we be daft enough to just waltz in here asking questions if not?'<br><span class=\"indent\"></span>'Get 'em to prove it, Cuss,' prompts one of the other thugs.<br><span class=\"indent\"></span>You glare at them. 'Don't think we're going to start blabbing the details of the plan in a dump like this. Anyone might overhear. But, Cuss - suffice it to say, there'll be a right <em>royal</em> fuss if we don't link up with the cap'n.'<br><span class=\"indent\"></span>'He's in Selenice by now, I should think,' says Cuss, sheepishly putting away his knife.<br><span class=\"indent\"></span>'Uh huh,' you say nodding. 'We'll find him aboard-'<br><span class=\"indent\"></span>'Aboard the <em>Moon Dog</em>,' he supplies helpfully.<br><span class=\"indent\"></span>'That's the one. Be seeing you.' You leave, waiting until you're around the corner to give a sigh of relief.<br><span class=\"indent\"></span>'What's this about the <em>Moon Dog</em>?' Blutz wonders. 'Skarvench's ship was always the <em>Belle Dame</em>. Why change now?'<br><span class=\"indent\"></span>'Perhaps we'll find out,' you say, 'in Selenice.'<br><span data-piece=\"51_0\" class=\"choice\"><a data-goto=\"sect_392\">Continue.</a></span>\n",
  "sect_52": "\nThe elderly scholar makes another short-sighted lunge for his spectacles, only to trip over the outstretched leg of one of the ruffians and go sprawling. Their laughter is harsh and braying. The scholar gets to his feet and brushes the dust off his velvet robe. 'Please...' he says, almost in tears. 'Give those back; I can't see without them.'<br><span data-piece=\"52_0\" class=\"choice\"><a data-goto=\"sect_128\">Use your cunning.</a></span><span data-piece=\"52_1\" class=\"choice\"><a data-goto=\"sect_147\">Fall back on your streetwise skill.</a></span><span data-piece=\"52_2\" class=\"choice\"><a data-goto=\"sect_166\">Draw your sword.</a></span><span data-piece=\"52_3\" class=\"choice\"><a data-goto=\"sect_185\">Draw your pistol.</a></span><span data-piece=\"52_4\" class=\"choice\"><a data-goto=\"sect_204\">Take them on with your bare hands.</a></span>\n",
  "sect_53": "\nHe places his hand to his jaw and squints his eyes in thought, smiling as he considers your request.<br><span class=\"indent\"></span>'Will you ponder the matter until the stars go out and the moon cracks in two?' you cry boldly. 'Our foe is mortal like ourselves, and does not unfold his plans with the millennial leisure you seem to favour.'<br><span class=\"indent\"></span>'Have a care!' pleads Blutz. 'You'll anger him. He might be the very god Neptune himself.'<br><span class=\"indent\"></span>You round on him with a blaze of anger. 'God or not, <em>I'm</em> your skipper, Mister Blutz! Now keep your counsel while I parley with yon giant.'<br><span class=\"indent\"></span>The giant rumbles with laughter, amused by this exchange. There is a sparkle in his green marble eyes as he says, 'Well spoken, mortal. At sea a man should respect neither god nor titan, but only his captain. I'll help you right enough, since I now see you deserve it, but what help is it you want? Will it be wealth to buy a ship - or the wisdom to sail her well?' <br><span data-piece=\"53_0\" class=\"choice\"><a data-goto=\"sect_148\">Choose wealth.</a></span><span data-piece=\"53_1\" class=\"choice\"><a data-goto=\"sect_167\">Choose wisdom.</a></span>\n",
  "sect_54": "\nThe warship pulls alongside to windward, stealing the breath from your sails. Clambering into the rigging, you run along the mainyard to where the sails of the two ships are already touching. One of the enemy sailors sees you and comes swinging down from the crow's nest, knife in hand. You duck nimbly under his knife-thrust and a cheer goes up from the deck of the <em>Lady of Shalott</em> as your men see you stun your opponent with a sharp jab to the chin. He sags back, caught in the ratlines, and you grab the knife from his limp fingers. Climbing higher into the rigging of the enemy ship, with musket-shots whistling around your ears, you glance down to see the marines casting grappling hooks. Your own crew stand ready to repel boarders as the two ships are pulled together.<br><span class=\"indent\"></span>Digging your knife into the mainsail, you slide right down the billowing canvas, using deft twists of the blade to steer your descent. You land on the deck in front of the helmsman, the split canvas drooping above you. You raise the knife, but the helmsman has no stomach for a fight and runs off, allowing you to throw the whipstaff hard over. The two vessels begin to pull apart as the warship veers in response. Realising your plan too late, the marines make a dash back from the rail, but you have already jammed the whipstaff in position with the knife and swung up onto the poopdeck rail out of reach. Running for the side, you launch yourself into space and catch hold of one of the grapple-lines, swiftly pulling yourself hand over hand back to the <em>Lady of Shalott</em> amid the delighted shouts of your crew.<br><span class=\"indent\"></span>Oakley and the rest lose no time in cutting the remaining lines, and the ships drift rapidly apart. On the deck of the warship you can see the marines struggling to free the jammed whipstaff. By the time they can do that and repair the mainsail you tore in half, you'll have made your getaway.<br><span data-piece=\"54_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_55": "\nThe next half-hour gives you as gruelling a test of your ship-handling skills as you've ever faced. Taking constant depth reckoning with a lead line, you steer the <em>Lady of Shalott</em> slowly between reefs and sandbars until at last you are out of the bay in open waters.<br><span class=\"indent\"></span>Here a light breeze ruffles the sails, but it is not enough to give you the headway you want. You order the rowboats lowered and commence kedging - carrying the anchor as far ahead of the bows as possible and then dropping it so that you can winch the ship onwards. It is slow going, but at last you are well clear of Tortoise Island and the eldritch fog that surrounds it. Soon you pick up a decent wind and from then on it is plain sailing back to Selenice. But you make the voyage with bitter heart because you are returning empty-handed.<br><span data-piece=\"55_0\" class=\"choice\"><a data-goto=\"sect_396\">Continue.</a></span>\n",
  "sect_56": "\nDriven on by remorseless determination, you hardly notice the stirrings of mutiny. At all hours of the day and night you are to be seen pacing the deck, marking the wind and sea currents in your log-book or using a cross-staff to plot the position of the stars. The crew dare not question your judgement now - they fear they would never get home without you.<br><span class=\"indent\"></span>At last your steadfastness is rewarded with a cry of 'Ice ho!' from the deck. You race up the companion-way and give a great shout of triumph as you catch sight of the low blue hump of an iceberg dead ahead. <br><span data-piece=\"56_0\" class=\"choice\"><a data-goto=\"sect_414\">Continue.</a></span>\n",
  "sect_57": "\nDespite having her sails in tatters from the storm earlier, the <em>Rose</em> is not quite out of the fight. Her crew realise the threat and man their cannons, bringing several telling shots to bear on the <em>Moon Dog</em>. Once you are standing abaft your enemy, you add your own fire to that of the <em>Rose</em>. Raked by two foes, the <em>Moon Dog</em> shudders as her mainmast topples.<br><span class=\"indent\"></span>'She's dead in the water!' you cry. 'Close for boarding!'<br><span data-piece=\"57_0\" class=\"choice\"><a data-goto=\"sect_6\">Continue.</a></span>\n",
  "sect_58": "\nAccording to the stories you have heard, Grimoire Island is inhabited not by a demon, but by a powerful witch called Ejada the Green. She is thought to be more than a thousand years old, and one legend is that she sealed a pact with an ancient earth god which guarantees her invulnerability so long as her feet remain on solid ground.<br><span class=\"indent\"></span>But, whether true or false, these folk-tales are not your first concern. Now you must sail on towards the first of the islands - the one Oakley believes to be inhabited by savages.<br><span data-piece=\"58_0\" class=\"choice\"><a data-goto=\"sect_97\">Continue.</a></span>\n",
  "sect_59": "\n'What is it you want of me?' growls the god, fixing you in the sharp glare of his eyes.<br><span class=\"indent\"></span>'My Olympian lord,' you begin, 'we are trapped on this ship...'<br><span class=\"indent\"></span>'Its captain dared to pillage my shrine!' Dionysus thunders. 'He has his just deserts.'<br><span class=\"indent\"></span>'But we don't deserve this fate, lord,' you protest.<br><span class=\"indent\"></span>Dionysus ponders your case. 'Perhaps not. If you were more my creature, I might be moved to mercy.'<br><span class=\"indent\"></span>'Your creature, lord?'<br><span class=\"indent\"></span>'The type of mortal I favour,' continues Dionysus impatiently, 'is a roistering rowdy varlet, full of craziness and lusty with the more uproarious joys that life has to offer. Not for me these sober scholars with their books and scrolls.'<br><span class=\"indent\"></span>'Not I, lord!' you say hastily.<br><span class=\"indent\"></span>He nods thoughtfully. 'I wonder. Well, I'll whisk you off to your destination, but mind you're on your worst behaviour from now on. I can't abide a dainty do-gooder!'<br><span class=\"indent\"></span>At Dionysus's gesture, the wine soaking the decks rises in a cloud of giddying vapour. Reeling from the fumes, you grope out until you feel the hands of your friends. They cling to you as their only protection - though, truth to tell, if the god had unleashed his full wrath then there would have been little enough that you could do.<br><span class=\"indent\"></span>The wine-mist clears. There is no sign of Dionysus or his panthers - nor of the cursed ship. Now the four of you are huddled together in the corner of a dingy tavern. A burly barman stomps over and swabs at a puddle of spilled wine on the table in front of you. 'Ain't you got no homes to go to?' he grumbles.<br><span class=\"indent\"></span>'Where are we?' Oakley innocently asks him.<br><span class=\"indent\"></span>The barman gives him a contemptuous look. 'You drunken lubbers! This is the Slaughtered Goat tavern, in Port Leshand.'<br><span data-piece=\"59_0\" class=\"choice\"><a data-goto=\"sect_59a\">Continue.</a></span>\n",
  "sect_59a": "\n\n",
  "sect_59b": "\nYou have been spirited magically to where you wanted to go, but the god's service has its price. He has left your mind permanently tinged with the exuberant madness that is his hallmark. You are now too headstrong to bother with the niceties of fencing. That sword can decorate your mantelpiece. Instead, you have an urge to find a good red-blooded fracas and wade in with both fists flying.<br><span data-piece=\"59b_0\" class=\"choice\"><a data-goto=\"sect_9\">Continue.</a></span>\n",
  "sect_60": "\nRaising your wand you commence a chant of your own, calling upon the occult forces which empower your magic. Seeing this, the natives fall back with a frightened moan. Then one withered old man in a feather cloak steps forward: their shaman. Wielding an obscene wand carved from a human thigh bone, he screeches a hasty incantation and advances to match his sorcery against yours.<br><span class=\"indent\"></span>Spells flash and sparkle in the air, but the uncanny duel is short-lived. Seeing that you are far more powerful a wizard than he, the shaman hurls his wand down into the sand in a gesture of surrender. <br><span data-piece=\"60_0\" class=\"choice\"><a data-goto=\"sect_22\">Continue.</a></span>\n",
  "sect_61": "\nMagic bends the very elements of nature to your will. The breeze obediently brings you the words of Skarvench and his cronies as they sit chatting over their bottle of grog. They are still more than fifty paces away, but you can now hear them as clearly as if they were right by your side!<br><span class=\"indent\"></span>'So what's this treasure for, Cap'n?' hiccups the quartermaster.<br><span class=\"indent\"></span>'To pay a certain shipwright in Port Selenice, for one thing,' says Skarvench. 'He's to be paid in gold for the new ship he's building us.'<br><span class=\"indent\"></span>'New ship?' says Porbuck the mate, roused from his dull witted torpor. 'I liked the old one...'<br><span class=\"indent\"></span>'This one's better, though. The <em>Moon Dog</em>, she's to be named, and her special sails were ensorcelled by the Queen's own wizard. Does things the <em>Belle Dame</em> never could.'<br><span class=\"indent\"></span>'The Queen's wizard?' repeats Curshaw.<br><span class=\"indent\"></span>'Aye, Will Wild himself. My dear half-brother! But he wants silver coins for his pains, see, so there's another reason for needing this here loot. Ahoy there, ye lazy lubbers, ain't you struck the box yet?'<br><span class=\"indent\"></span>The two sailors look up from their work. 'Aye, Cap'n. Here it is.'<br><span class=\"indent\"></span>You've heard enough. <br><span data-piece=\"61_0\" class=\"choice\"><a data-goto=\"sect_288\">Stay hidden until they have sailed off.</a></span><span data-piece=\"61_1\" class=\"choice\"><a data-goto=\"sect_267\">Risk attacking them now.</a></span>\n",
  "sect_62": "\nA funnel of wind whiplashes down out of the sky. As she feels it engulf her, Ejada gives vent to a cry of alarm and tries to catch a handhold on the palace wall. Her hair and robes billow in the wind and she is sucked inexorably into the air. To your amazement, you can now see something like green shoots or rootlets dangling from the soles of her feet. As soon as these are tugged out of the ground, she begins visibly to weaken and soon she is begging for mercy.<br><span data-piece=\"62_0\" class=\"choice\"><a data-goto=\"sect_157\">Continue.</a></span>\n",
  "sect_63": "\nKemp nods. 'Just recently finished. Skarvench took delivery of her two days ago, a fine galleon of forty guns which he means to name <em>Moon Dog</em>. Got some queer features to her, though.'<br><span class=\"indent\"></span>You press him on the point. 'Such as?'<br><span class=\"indent\"></span>'Well, first off he had me install gunports along the keel. 'The ship'll sink,\" says I, but Skarvench would have none of it - just chortled like an old crow and showed me the designs he'd brought. \"Along the keel,\" he insists, \"and mind you fit the masts thus and so; they've a fair load to lift\".'<br><span class=\"indent\"></span>'Eh?' You're puzzled. 'What did he mean by that?'<br><span class=\"indent\"></span>Kemp sighs. 'My own guess is worthless, so doubtless your own is better. It's not how I've built any ship before, and I've built hundreds. The timber was too light also - pine is easily split by cannon - but Skarvench only laughed fit to burst and said, \"It depends where the cannons be pointing!\" So in the end, since his gold was good, I did it the way he wanted. Now I have other customers to attend to, so I'll be bidding you good day.'<br><span class=\"indent\"></span>'Where to now?' says Oakley as you walk back to town.<br><span class=\"indent\"></span>You think for a moment. 'We'll take rooms at the Sweat o' the Brow inn. If Skarvench shows his face anywhere in Selenice, it'll be there.'<br><span class=\"indent\"></span>You have never spoken a truer word, for no sooner have you stepped through the doorway of the inn than you are rooted to the spot in shock. There the fiend stands, large as life in front of you. A rum bottle is clutched in his hand and his crew throng the tap-room around him, cowering as he subjects them to one of his thunderous drunken rants.<br><span class=\"indent\"></span>Then his eye alights on you. His snarling voice is cut off in mid-sentence. A thin line of spittle runs down into his beard as his teeth show shark-like in a vicious grin. It is the moment you have waited for: face to face with your dearest foe...<br><span data-piece=\"63_0\" class=\"choice\"><a data-goto=\"sect_14\">Continue.</a></span>\n",
  "sect_64": "\nA long moment passes while you all sit thunderstruck, gawping in amazement at the mermaid like four fishes in a net. She waits, serene as a statue. Then a slow smile appears on her lips and, raising her pale arms, she turns to swim away...<br><span class=\"indent\"></span>It is Blutz who reacts first, shocking himself with his own impetuosity. His arm shoots out and he seizes a hunk of the mermaid's long mauve-pink hair. For her part, she gives a cry of shock - abrupt and musical, like the plucked string of a harp - and twists in his grasp with an eel's furious energy.<br><span class=\"indent\"></span>'I got her!' cries Blutz. His eyes shine as he looks around at the rest of you, partly seeking applause and partly reassurance.<br><span class=\"indent\"></span>Then the mermaid herself speaks. Clutching at Blutz's hand, she slowly relaxes her struggles and says, 'Release me, man of the dry land, and I will aid you.' Managing to twist around until she faces you, her eyes flash with wild light as she adds: 'But if you should harm me, I'll lay a curse on you to harrow the hearts of all who hear of it!'<br><span data-piece=\"64_0\" class=\"choice\"><a data-goto=\"sect_83\">Counter her curse with charms.</a></span><span data-piece=\"64_1\" class=\"choice\"><a data-goto=\"sect_102\">Enthrall her with magic.</a></span><span data-piece=\"64_2\" class=\"choice\"><a data-goto=\"sect_121\">Tell Blutz to turn her loose.</a></span><span data-piece=\"64_3\" class=\"choice\"><a data-goto=\"sect_159\">Ask her the best course to Port Leshand.</a></span><span data-piece=\"64_4\" class=\"choice\"><a data-goto=\"sect_140\">Ask what lies ahead on your journey.</a></span>\n",
  "sect_65": "\nTaking your leave of the drunken captain, you investigate the ship. It is built in a style rarely seen these days, with high structures to fore and aft and small brass cannons designed to fire grape-shot at any enemy attempting to board. 'An old vessel,' decides Grimes, 'and somewhat in the Moorish style.' He points to abstract fretwork carvings in the woodwork. 'Such geometrical decoration is typical of the Moors.'<br><span class=\"indent\"></span>'What's this?' asks Blutz. He has found a wooden casket on the main deck, beside the gangplank rail.<br><span class=\"indent\"></span>Grimes rubs his jaw thoughtfully. 'Perhaps a water tank?'<br><span class=\"indent\"></span>'Er... I don't think so,' replies Blutz, eyes widening as he takes a peek inside the casket. 'You'd better take a look at this, mates.'<br><span class=\"indent\"></span>You peer over his shoulder, almost yelping with shock at what you see inside the casket. For although it is half full of rainwater as Grimes surmised, it also contains several dozen skeletal hands. <br><span data-piece=\"65_0\" class=\"choice\"><a data-goto=\"sect_84\">Continue.</a></span>\n",
  "sect_66": "\nRigging a small sail made from your torn shirts, you take the boat northwards. There you hope to find an island with food and fresh water to sustain you on the long journey back to civilization.<br><span class=\"indent\"></span>Hunger makes a knot of your belly, and thirst drives you to distraction. <br><span data-piece=\"66_0\" class=\"choice\"><a data-goto=\"sect_66a\">Can you go on?</a></span>\n",
  "sect_66a": "\n\n",
  "sect_66b": "\nYou arrive at last at an island. Above the bright emerald line marking its jungle-fringed shore rises the steep cone of a volcano. Clouds of smoke wreath its summit, and you can see a dull red glimmer that can only be lava. 'Let's not put in here,' says Blutz despite his thirst. 'It might erupt and kill us all.'<br><span data-piece=\"66b_0\" class=\"choice\"><a data-goto=\"sect_193\">'It won't.'</a></span><span data-piece=\"66b_1\" class=\"choice\"><a data-goto=\"sect_174\">Land here.</a></span><span data-piece=\"66b_2\" class=\"choice\"><a data-goto=\"sect_135\">Head west to the next island.</a></span>\n",
  "sect_67": "\nFew details of any sea-going craft escape your trained eye. You note that although Mortice's raft is made of oak planks, which is a heavy wood, it floats surprisingly light in the water. This is especially odd given that the raft also carries the burden of a man, a full rain barrel, and a large chest of provisions. You can only conclude there must be something buoyant lashed to the underside of the raft.<br><span data-piece=\"67_0\" class=\"choice\"><a data-goto=\"sect_124\">Ask Mortice what he's got there.</a></span><span data-piece=\"67_1\" class=\"choice\"><a data-goto=\"sect_105\">Don't say anything about it.</a></span>\n",
  "sect_68": "\nScared witless by the gargoyle-prow and black sails of Skarvench's ship, the natives will not be easy to convince. Their chief believes the pirates will kill them if they suspect them of lying. In all honesty, you have to admit he is right.<br><span class=\"indent\"></span>You must part with two items to bribe the natives. Choose:<br><span data-piece=\"68_0\" class=\"choice\"><a data-goto=\"sect_68a\">a sword.</a></span><span data-piece=\"68_1\" class=\"choice\"><a data-goto=\"sect_68b\">a pistol.</a></span><span data-piece=\"68_2\" class=\"choice\"><a data-goto=\"sect_68c\">a wand.</a></span><span data-piece=\"68_3\" class=\"choice\"><a data-goto=\"sect_68d\">an amulet.</a></span><span data-piece=\"68_4\" class=\"choice\"><a data-goto=\"sect_68e\">a ship in a bottle.</a></span><span data-piece=\"68_5\" class=\"choice\"><a data-goto=\"sect_68f\">a conch-shell horn.</a></span><span data-piece=\"68_6\" class=\"choice\"><a data-goto=\"sect_68g\">a bat-shaped talisman.</a></span><span data-piece=\"68_7\" class=\"choice\"><a data-goto=\"sect_68h\">a black kite.</a></span><span data-piece=\"68_8\" class=\"choice\"><a data-goto=\"sect_68i\">a diamond.</a></span><span data-piece=\"68_9\" class=\"choice\"><a data-goto=\"sect_68j\">a toolkit.</a></span><span data-piece=\"68_10\" class=\"choice\"><a data-goto=\"sect_68k\">a healing potion.</a></span><span data-piece=\"68_11\" class=\"choice\"><a data-goto=\"sect_68l\">a bronze helmet.</a></span><span data-piece=\"68_12\" class=\"choice\"><a data-goto=\"sect_68m\">a crucifix.</a></span><span data-piece=\"68_13\" class=\"choice\"><a data-goto=\"sect_68n\">a dragon ring.</a></span><span data-piece=\"68_14\" class=\"choice\"><a data-goto=\"sect_68o\">Change your mind about bribing them.</a></span><span data-piece=\"68_15\" class=\"choice\"><a data-goto=\"sect_68o\">You have nothing they want.</a></span>\n",
  "sect_68a": "\n\n",
  "sect_68b": "\n\n",
  "sect_68c": "\n\n",
  "sect_68d": "\n\n",
  "sect_68e": "\n\n",
  "sect_68f": "\n\n",
  "sect_68g": "\n\n",
  "sect_68h": "\n\n",
  "sect_68i": "\n\n",
  "sect_68j": "\n\n",
  "sect_68k": "\n\n",
  "sect_68l": "\n\n",
  "sect_68m": "\n\n",
  "sect_68n": "\n\n",
  "sect_68o": "\nAs you are unwilling or unable to give the natives what they demand for their silence, your choices are limited.<br><span data-piece=\"68o_0\" class=\"choice\"><a data-goto=\"sect_87\">Stay to confront Skarvench.</a></span><span data-piece=\"68o_1\" class=\"choice\"><a data-goto=\"sect_49\">Run off into the jungle.</a></span>\n",
  "sect_68p": "\nOne gift is not enough. The islanders demand another. Choose quickly, for the sails of Skarvench's ship are getting nearer.<br><span data-piece=\"68p_0\" class=\"choice\"><a data-goto=\"sect_68a\">a sword.</a></span><span data-piece=\"68p_1\" class=\"choice\"><a data-goto=\"sect_68b\">a pistol.</a></span><span data-piece=\"68p_2\" class=\"choice\"><a data-goto=\"sect_68c\">a wand.</a></span><span data-piece=\"68p_3\" class=\"choice\"><a data-goto=\"sect_68d\">an amulet.</a></span><span data-piece=\"68p_4\" class=\"choice\"><a data-goto=\"sect_68e\">a ship in a bottle.</a></span><span data-piece=\"68p_5\" class=\"choice\"><a data-goto=\"sect_68f\">a conch-shell horn.</a></span><span data-piece=\"68p_6\" class=\"choice\"><a data-goto=\"sect_68g\">a bat-shaped talisman.</a></span><span data-piece=\"68p_7\" class=\"choice\"><a data-goto=\"sect_68h\">a black kite.</a></span><span data-piece=\"68p_8\" class=\"choice\"><a data-goto=\"sect_68i\">a diamond.</a></span><span data-piece=\"68p_9\" class=\"choice\"><a data-goto=\"sect_68j\">a toolkit.</a></span><span data-piece=\"68p_10\" class=\"choice\"><a data-goto=\"sect_68k\">a healing potion.</a></span><span data-piece=\"68p_11\" class=\"choice\"><a data-goto=\"sect_68l\">a bronze helmet.</a></span><span data-piece=\"68p_12\" class=\"choice\"><a data-goto=\"sect_68m\">a crucifix.</a></span><span data-piece=\"68p_13\" class=\"choice\"><a data-goto=\"sect_68n\">a dragon ring.</a></span><span data-piece=\"68p_14\" class=\"choice\"><a data-goto=\"sect_68o\">Change your mind about bribing them.</a></span><span data-piece=\"68p_15\" class=\"choice\"><a data-goto=\"sect_68o\">You have nothing else they want.</a></span>\n",
  "sect_69": "\nCapstick has a fine house on Halyard Street, in one of the richest parts of town. Smartening yourselves up to look as respectable as possible, you ignore the sidelong glances and haughty sniffs of the wealthy passers-by, marching straight up to present yourselves at the front door. The servant who answers the door at first mistakes you for beggars, but once you've corrected that small misunderstanding he shows you through to his master's study.<br><span class=\"indent\"></span>Capstick is sitting by the fire with a book. Seeing you, he gives his great belly-shaking laugh and leaps up to greet you, commanding the servant to bring a bottle of sherry.<br><span class=\"indent\"></span>'Freshly taken off a Sidonian merchantman,' he says shortly, lifting his glass to savour the smoky gold liquid before drinking. 'And...' he smacks his lips, refills your glasses '...all the better for being plundered off one of those rascals, eh?'<br><span class=\"indent\"></span>Soon the conversation turns to the matters you discussed aboard the <em>Jewel of Heaven</em>. At this, Capstick's face falls. 'I have sour news,' he tells you. 'I must sail for Glorianne in two days' time, and so I'll be unable to partner you in your attack on that devil Skarvench. Moreover, I've told the tale to several high officials - but no one believes it's true.'<br><span class=\"indent\"></span>You give a glum nod. 'Who can blame them, given the source of your information? We are vagabond ex-pirates, which is not the best pedigree for reliable testimony.'<br><span class=\"indent\"></span>'But I believe you, by God!' He produces an envelope and hands it to you. 'This is a deed of ownership for a sloop that I own in Port Selenice. She's just a small craft, but better than no ship at all. Go to Selenice, get together a crew, and see if you can't beat this Skarvench at his own game.'<br><span class=\"indent\"></span>Thanking Capstick for his help, you take your leave. 'I'm only sorry not to be sailing with you,' are his parting words.<br><span class=\"indent\"></span>You set off with the deed of ownership in your pocket.<br><span data-piece=\"69_0\" class=\"choice\"><a data-goto=\"sect_107\">Continue.</a></span>\n",
  "sect_70": "\nMost of the tavern's customers have scurried off into the night. Nursing your injuries, you stagger through the wreckage and take a stiff swig of rum from an overturned bottle on the bar.<br><span class=\"indent\"></span>A weak bloody-mouthed spluttering comes from under a broken trestle. Stepping over, you haul the chief cut-throat to his feet. With his teeth broken and his little close-set eyes swollen half closed, he doesn't look nearly so tough now - like a lot of bullies you've known after the fight's been knocked out of them.<br><span class=\"indent\"></span>'Skarvench's new ship,' you say, shaking him. 'What's it called?'<br><span class=\"indent\"></span>His eyes flicker open. 'Can't tell you,' he groans. 'He'd rip my lungs out.'<br><span class=\"indent\"></span>You break the rum bottle against the wall and shove it towards his chest. 'He won't be able to <em>find</em> your lungs.'<br><span class=\"indent\"></span>The threat breaks what's left of his nerve. In a panic stricken torrent, he blabbers about a ship called the <em>Moon Dog</em> which Skarvench is having built in Port Selenice.<br><span class=\"indent\"></span>You cast the lout back into the debris. As you go to leave you find the innkeeper, Drood, standing by the doorway, hopping from one foot to the other in agitation. 'Who's going to pay for this damage?' he wails.<br><span class=\"indent\"></span>Blutz pushes him aside. 'Don't think of it as damage. Think of it as a free redecoration.'<br><span class=\"indent\"></span>With a laugh, the four of you set off along the street.<br><span data-piece=\"70_0\" class=\"choice\"><a data-goto=\"sect_392\">Continue.</a></span>\n",
  "sect_71": "\nThe blind man is Greymalkin Smith. Once a pirate himself, he was blinded in a powder keg explosion and now ekes out a living running errands around town and swapping gossip for drinks.<br><span class=\"indent\"></span>You have also seen the three ruffians before. In fact, just a few weeks ago you learned that the governor of Leshand has put a price on their heads.<br><span data-piece=\"71_0\" class=\"choice\"><a data-goto=\"sect_33\">Talk to Greymalkin.</a></span><span data-piece=\"71_1\" class=\"choice\"><a data-goto=\"sect_52\">Stop the ruffians bullying the scholar.</a></span><span data-piece=\"71_2\" class=\"choice\"><a data-goto=\"sect_374\">Go to the shipyard.</a></span>\n",
  "sect_72": "\nHis laughter is the peal of summer thunder. 'Scurry off then, little mice. I mistook you for sea rats at least!'<br><span class=\"indent\"></span>The dolphin and the shark convey you back to the beach where you blew the horn. In awed silence, still stunned by the uncanny adventure, you disembark uncertainly and stagger on weak knees up the shore.<br><span data-piece=\"72_0\" class=\"choice\"><a data-goto=\"sect_203\">Continue.</a></span>\n",
  "sect_73": "\nGrappling hooks hug your vessel to the warship's flank, and marines come swarming over the rail with loud battle-cries. The fighting rages from stem to stern - the clash of cutlasses, the bangs and acrid smoke of pistol shots, the screams of wounded men. Blood and gunpowder are the smells mingling on the briny breeze this afternoon.<br><span data-piece=\"73_0\" class=\"choice\"><a data-goto=\"sect_73a\">Fight.</a></span>\n",
  "sect_73a": "\n\n",
  "sect_73b": "\nThe marines have numbers on their side, but they are pitched against some of the toughest buccaneers on the Carab Sea. Your men know they are fighting for their very lives, since almost every one of them has a price on his head.<br><span data-piece=\"73b_0\" class=\"choice\"><a data-goto=\"sect_225\">Desperation wins the day.</a></span>\n",
  "sect_73c": "\nYour crewmen are some of the toughest buccaneers on the Carab Sea, but they are outnumbered and outclassed. All you can do is sell your life dear.<br><div class=\"s3\">THE END</div>\n",
  "sect_74": "\nIt is only a matter of minutes before you hear the sound you were dreading: an ominous scraping as the ship lurches to a halt. 'That tears it!' says Grimes. 'We've run aground.'<br><span class=\"indent\"></span>A hasty inspection reveals that you have run the keel onto a sandbank. There is no damage to the hull, but you will have to wait until high tide to get off again. By now the fog is closing tightly around the bay, blotting out any sight of the island.<br><span class=\"indent\"></span>'We may as well sit it out until dawn,' you decide.<br><span data-piece=\"74_0\" class=\"choice\"><a data-goto=\"sect_366\">Continue.</a></span>\n",
  "sect_75": "\nThe storm fills the sky and your ship is just a speck in its grip. The rain lashes down out of a darkness blacker than night, drumming the deck. Waves as high as cliffs sweep past, flooding over the side and forcing each man to cling on for dear life. Your orders are drowned out by the palpable roar of the wind, which strains the sails to bursting point. You take the whipstaff yourself and push the prow into the onrushing tumult, seeking the hurricane's heart.<br><span class=\"indent\"></span>Grimes rushes back, his face contorted with fear. 'Skipper!' he cries. 'The hurricane must have scattered the Queen's fleet! There's a Gloriannic warship dead across our bows, and the wind's sweeping her straight towards us!'<br><span class=\"indent\"></span>You can see the ship between billowing sheets of rain. Her mast is broken and she is careening out of control towards you. You have only seconds in which to avoid a collision.<br><span data-piece=\"75_0\" class=\"choice\"><a data-goto=\"sect_113\">Tilt the whipstaff to port.</a></span><span data-piece=\"75_1\" class=\"choice\"><a data-goto=\"sect_132\">Tilt it starboard.</a></span>\n",
  "sect_76": "\nTo your own amazement as much as your foe's, the weasel suddenly jumps out of your haversack and leaps across the deck to give him a painful bite on the hand. Skarvench drops the taper with a startled oath: 'Agh! Devil take the animal!'<br><span class=\"indent\"></span>He seizes the weasel by its neck and casts it off over the side, but its attack has bought you the time you needed to close in. Now you are face to face with Skarvench in a battle to the finish.<br><span data-piece=\"76_0\" class=\"choice\"><a data-goto=\"sect_171\">Continue.</a></span>\n",
  "sect_77": "\nSkarvench gives a sharp cough as he swigs a shot of rum. 'Guarded?' he snarls. 'Aye, she'll be guarded. But what if a storm scattered her escort fleet? What then, eh, my lads?'<br><span class=\"indent\"></span>'There'd still be her flagship to contend with, Cap'n,' objects the quartermaster. 'The <em>Rose</em>, I'm told it's called - a ship of eighty cannon!'<br><span class=\"indent\"></span>'It's possible to pluck a rose, me hearties!' rejoins Skarvench with a peal of harsh laughter. ''Specially when she lies becalmed, shrouded in mist with no target for her guns.'<br><span class=\"indent\"></span>'But what's this talk of mist and dead calm?' queries Borograve the master gunner. 'I thought the plan rested on a storm?'<br><span class=\"indent\"></span>'It all relies too much on chance, if you ask me,' says the first mate.<br><span class=\"indent\"></span>You tend to agree - although you never knew Skarvench to trust anything to luck before, not even when playing dice. You are itching to hear how he is going to justify his scheme, but every second you linger here increases the risk of discovery.<br><span data-piece=\"77_0\" class=\"choice\"><a data-goto=\"sect_115\">Continue to eavesdrop.</a></span><span data-piece=\"77_1\" class=\"choice\"><a data-goto=\"sect_96\">Get supplies from the empty cabin.</a></span><span data-piece=\"77_2\" class=\"choice\"><a data-goto=\"sect_172\">Go back on deck empty-handed.</a></span>\n",
  "sect_78": "\nTwo more boxes are swiftly opened, their lids splintering under hard shovel-blows. These also contain dead bodies lying on bars of silver. The third gives you particular cause to shudder - a thin rill of blood has caked on its lips, just as a careless or gluttonous man might leave a dribble of gravy.<br><span class=\"indent\"></span>'Vampires!' gasps Blutz. All together you turn to look at the sun, now almost drowned in the western sea. In mere moments the last of the daylight will have drained away.<br><span class=\"indent\"></span>Blutz pulls a stick from his belt and thrusts it into your hand. It is the broken stool-leg he got clouted with back in the tavern in Selenice. The end has splintered to leave a sharp point. Sharp enough to pierce a heart, if driven down with courage and strength.<br><span class=\"indent\"></span>There is just time to impale one of the three corpses you've unearthed. You glance from one to another. Which will it be?<br><span data-piece=\"78_0\" class=\"choice\"><a data-goto=\"sect_169\">The body with blood on its lips.</a></span><span data-piece=\"78_1\" class=\"choice\"><a data-goto=\"sect_188\">The one with a skull tattoo.</a></span><span data-piece=\"78_2\" class=\"choice\"><a data-goto=\"sect_150\">The one with ice-blue eyes.</a></span>\n",
  "sect_79": "\nAs the cannibals close in, things look bleak indeed. Can you possibly outrun them and get the jollyboat out to sea before you are overwhelmed? Then you remember seeing fragments of coloured chalk further up the beach. 'Come on,' you say urgently, pulling your companions after you, 'I've got an idea.'<br><span class=\"indent\"></span>The cannibals follow in sullen silence as you retreat along the beach. Pretending to stumble, you gather pieces of pink chalk as you go and use these to daub spots on your skin. At first the others think you've lost your wits, but then Blutz sees what you have in mind. 'They'll think we're plague ridden!' he cries. 'They certainly won't want to eat us then!'<br><span class=\"indent\"></span>The four of you crouch shivering beside your boat as the cannibals come striding up. At first the look on their faces is one of ravenous glee, but this soon changes to horror when they get close enough to see the ugly blotches on your skin. The shivering helps to make it look as though you have a fever, but in fact there is no need for pretence - you really are quaking in fear by now.<br><span class=\"indent\"></span>You give a ghastly moan and start to foam convincingly at the mouth. This is more than enough for the cannibals. Flinging down their weapons, they run off. Once they are out of sight along the beach, you get up and examine what they have left behind. Along with a profusion of spears and clubs, you find a feather shield and a shark's tooth sword. The latter is a blade of hardwood edged with shark's teeth - unconventional, but it handles as well as a normal sword.<br><span class=\"indent\"></span>The others have lost no time getting the boat into the water. Hurrying in case the cannibals should realise they've been tricked and return, you put to sea.<br><span data-piece=\"79_0\" class=\"choice\"><a data-goto=\"sect_116\">Continue.</a></span>\n",
  "sect_80": "\nMoving with no more noise than a snake, you edge through the undergrowth until you are close enough to hear what Skarvench and the others are saying. While the two seamen sweat over their spades, heaving up great clods of earth, Skarvench passes the grog bottle around and recounts his scurvy plans.<br><span class=\"indent\"></span>'So what's this treasure for, Cap'n?' hiccups the quartermaster.<br><span class=\"indent\"></span>'To reward a certain shipwright in Port Selenice, for one thing,' says Skarvench. 'He's to be paid in gold for the new ship he's building us.'<br><span class=\"indent\"></span>'New ship?' says Porbuck the mate, roused from his dull-witted torpor. 'I liked the old one.'<br><span class=\"indent\"></span>Skarvench ignores him. 'And the silver's for the Queen's wizard, William Wild. He'll be supplying special sails for our new vessel - aye, and a bit o' trickery into the bargain to ensure we take the <em>Rose</em> unhindered, me hearties!' And he gives a low chuckle of perfect wickedness at the thought.<br><span class=\"indent\"></span>The scheming dog! His monstrous arrogance makes your blood boil. They obviously mean to take the treasure aboard their ship. Should you let them get away?<br><span data-piece=\"80_0\" class=\"choice\"><a data-goto=\"sect_288\">Stay hidden until they've sailed.</a></span><span data-piece=\"80_1\" class=\"choice\"><a data-goto=\"sect_267\">Attack them right now.</a></span>\n",
  "sect_81": "\nA torrent of red fire crackles around Ejada but she stands steadfast, weathering the onslaught. Your spell fades leaving her charred and withered like a burnt wooden effigy. But then, in front of your astonished gaze, she rapidly regenerates and in seconds is completely unscathed!<br><span class=\"indent\"></span>'My mother's gift to her daughter: unending vitality,' she explains with a triumphant smile.<br><span data-piece=\"81_0\" class=\"choice\"><a data-goto=\"sect_81a\">Now it's her turn.</a></span>\n",
  "sect_81a": "\n\n",
  "sect_81b": "\nWith a gesture she causes fists of rock to rip up out of the ground and pummel you. It is only thanks to the feather shield, which is evidently magical, that you avoid serious injury.<br><span data-piece=\"81b_0\" class=\"choice\"><a data-goto=\"sect_5\">Run away.</a></span><span data-piece=\"81b_1\" class=\"choice\"><a data-goto=\"sect_62\">Continue the duel with a whirlwind spell.</a></span><span data-piece=\"81b_2\" class=\"choice\"><a data-goto=\"sect_100\">Cast a darkness spell.</a></span>\n",
  "sect_81c": "\nWith a gesture she causes fists of rock to rip up out of the ground and pummel you. You feel a rib pop as a pounding blow to your gut leaves you limp, followed up by a bone-crunching smash to the jaw that loosens a few teeth.<br><span data-piece=\"81c_0\" class=\"choice\"><a data-goto=\"sect_5\">Run away.</a></span><span data-piece=\"81c_1\" class=\"choice\"><a data-goto=\"sect_62\">Continue the duel with a whirlwind spell.</a></span><span data-piece=\"81c_2\" class=\"choice\"><a data-goto=\"sect_100\">Cast a darkness spell.</a></span>\n",
  "sect_81d": "\nWith a gesture she causes fists of rock to rip up out of the ground. You are merciless pummelled, unable to collect your wits for a spell or even to evade the terrible blows. You fall under the bone-shattering onslaught and your life ends here.<br><div class=\"s3\">THE END</div>\n",
  "sect_82": "\n'She was El Draque's ship,' says Kemp. 'A fine stout vessel. I did some work on her once. Curious to choose a bat as your figurehead, but that was El Draque for you. Those scarlet sails can't have been cheap, either. I hear he was captured by the Gloriannic Navy and hanged at sea for his crimes - though what became of the <em>Grue</em>, I can't say.'<br><span class=\"indent\"></span>Kemp has other customers to attend to, so you bid him good day and walk back to town.<br><span class=\"indent\"></span>'Where to now?' says Oakley.<br><span class=\"indent\"></span>You think for a moment. 'We'll take rooms at the Sweat o' the Brow inn. If Skarvench shows his face anywhere in Selenice, it'll be there.'<br><span class=\"indent\"></span>You have never spoken a truer word, for no sooner have you stepped through the doorway of the inn than you are rooted to the spot in shock. There the fiend stands, large as life in front of you. A rum bottle is clutched in his hand and his crew throng the tap-room around him, cowering as he subjects them to one of his thunderous drunken rants.<br><span class=\"indent\"></span>Then his eye alights on you. His snarling voice is cut off in mid-sentence. A thin line of spittle runs down into his beard as his teeth show shark-like in a vicious grin. It is the moment you have waited for. Face to face with your dearest foe.<br><span data-piece=\"82_0\" class=\"choice\"><a data-goto=\"sect_14\">Continue.</a></span>\n",
  "sect_83": "\nTouching your magical amulet, you utter the words of a brief incantation that will deflect any curse the mermaid might attempt.<br><span class=\"indent\"></span>At this she pouts. 'Such crude magic.'<br><span class=\"indent\"></span>'Crude, perhaps, my lady,' you return with a gallant flourish, 'but I have always found it no less effective for that.'<br><span data-piece=\"83_0\" class=\"choice\"><a data-goto=\"sect_102\">Bring her under hypnotic control.</a></span><span data-piece=\"83_1\" class=\"choice\"><a data-goto=\"sect_121\">Recommend Blutz lets her go at once.</a></span><span data-piece=\"83_2\" class=\"choice\"><a data-goto=\"sect_140\">Ask her what lies ahead.</a></span><span data-piece=\"83_3\" class=\"choice\"><a data-goto=\"sect_159\">Ask the best course to Port Leshand.</a></span>\n",
  "sect_84": "\nMost of the hands are just bare bone, but a couple still show traces of skin and sinew. One even wears a gold ring, though none of you cares to fish it out of the tank. 'I'm glad we haven't drunk from this,' says Oakley quietly, closing the lid. 'No wonder the captain prefers wine. It could fair kill a bloke's thirst for fresh water, it could.'<br><span class=\"indent\"></span>'Here's what did the job,' announces Grimes, picking something up off the deck. He hands it to you: a long-bladed butcher's cleaver.<br><span class=\"indent\"></span>'I'm for leaving right now,' declares Blutz, quaking with fear. But as he tries to climb back down to the jollyboat moored alongside, he makes an ominous discovery. 'I can't get over the rail. It's as if some supernatural force is tugging me back!'<br><span class=\"indent\"></span>The same applies to the rest of you. 'The ship is cursed,' says Grimes. 'And now, shipmates, we're cursed too.'<br><span data-piece=\"84_0\" class=\"choice\"><a data-goto=\"sect_103\">Make repairs to your boat.</a></span><span data-piece=\"84_1\" class=\"choice\"><a data-goto=\"sect_122\">Continue.</a></span><span data-piece=\"84_2\" class=\"choice\"><a data-goto=\"sect_141\">Continue.</a></span>\n",
  "sect_85": "\nBefore long the others call to you, saying they have collected a goodly share of barnacles and other succulent shellfish from the shore of the island. You have meanwhile been strolling around in search of fresh water, but every single pool that has formed in depressions in the rock has turned out to be full of brine.<br><span class=\"indent\"></span>Suddenly there is a shuddering underfoot. The whole island begins to shake. Your companions utter cries of alarm and you see them run towards the boat, abandoning their pile of shellfish. 'It's sinking into the sea!' screeches Blutz. 'Hurry or we'll be drowned!'<br><span class=\"indent\"></span>Out of the corner of your eye you see something break the surface of the sea. You turn, watching aghast as it rises high up into the air. It is sharp and huge, its serrated edge casting an orange-red shadow across the sky. As it flexes open and closed, you stare at it dumbfounded. And then you realise what it is: a giant pincer.<br><span class=\"indent\"></span>The shock almost makes you pass out. This is no island. You're on the back of a gigantic crab.<br><span data-piece=\"85_0\" class=\"choice\"><a data-goto=\"sect_123\">Move!</a></span><span data-piece=\"85_1\" class=\"choice\"><a data-goto=\"sect_142\">Get moving.</a></span>\n",
  "sect_86": "\nMaybe it is ungracious to harbour suspicions about Mortice when he has been kind enough to feed you. All the same, you cannot help but notice certain disquieting facts. For one thing, the supply of food and water he has left is amazing given that he shows every sign of having been adrift for weeks. Also, he declined to eat or drink anything himself while you were eating, not even joining your toast at the end of the meal. His bald statement on the subject was, 'I never drink grog.' That is a very odd thing for any seaman to say. Finally, his insistence at getting a formal invitation to board your boat, along with the fact that he apparently finds the moonlight rather bright for his eyes, is little short of sinister.<br><span class=\"indent\"></span>On the other hand, maybe you've just been at this game too long. It's your choice:<br><span data-piece=\"86_0\" class=\"choice\"><a data-goto=\"sect_143\">Invite him aboard.</a></span><span data-piece=\"86_1\" class=\"choice\"><a data-goto=\"sect_162\">Let him spend the night where he is.</a></span>\n",
  "sect_87": "\nSkarvench's face twists into a broad smile as he sees you striding along the foreshore towards him. But it is a smile to make your blood run with ice: the smile on a wolf's face before it seizes its prey.<br><span class=\"indent\"></span>'Ah, so you blokes have fared well!' he thunders. 'Still hale and hearty, I see. And glad I am to see it, for I wanted to savour your deaths meself. Just knowing you'd been drowned would have left me inconsolable, like.'<br><span data-piece=\"87_0\" class=\"choice\"><a data-goto=\"sect_182\">Fight him here and now.</a></span><span data-piece=\"87_1\" class=\"choice\"><a data-goto=\"sect_315\">Use the thundercloud fan.</a></span><span data-piece=\"87_2\" class=\"choice\"><a data-goto=\"sect_334\">Use the bat-shaped talisman.</a></span><span data-piece=\"87_3\" class=\"choice\"><a data-goto=\"sect_201\">Bide your time.</a></span>\n",
