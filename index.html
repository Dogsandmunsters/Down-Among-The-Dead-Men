  "sect_88": "\nRumours abound in a port like Leshand. Some are mere gossip, some are tall tales, some are outright lies - and a very few are the gospel truth. The trick lies in telling the difference.<br><span class=\"indent\"></span>You keep your ear to the ground for a day or two, trawling the taverns on the lookout for information. What are you interested in finding out about?<br><span data-piece=\"88_0\" class=\"choice\"><a data-goto=\"sect_164\">The pirate El Draque.</a></span><span data-piece=\"88_1\" class=\"choice\"><a data-goto=\"sect_183\">The pirate El Draque.</a></span><span data-piece=\"88_2\" class=\"choice\"><a data-goto=\"sect_202\">Queen Titania's state visit.</a></span><span data-piece=\"88_3\" class=\"choice\"><a data-goto=\"sect_221\">Queen Titania's state visit.</a></span><span data-piece=\"88_4\" class=\"choice\"><a data-goto=\"sect_278\">Listen out for news of Skarvench.</a></span><span data-piece=\"88_5\" class=\"choice\"><a data-goto=\"sect_297\">Listen out for news of Skarvench.</a></span>\n",
  "sect_89": "\n'You've given me a cannon-load o' trouble,' says Skarvench. 'Here's where I pay you back - with my trusty basilisk here.'<br><span class=\"indent\"></span>You glance down to see that he is standing beside a cannon which is pointing straight at you. Skarvench shows you the lighted taper in his hand.<br><span class=\"indent\"></span>'You despicable cur!' you snarl. 'You've no stomach for facing me at close quarters, I see.'<br><span class=\"indent\"></span>'Stow your bluster, mate,' he sneers. 'Here's where you retire to a safe distance. Thirty fathoms down!'<br><span data-piece=\"89_0\" class=\"choice\"><a data-goto=\"sect_76\">Have you still got that weasel?</a></span><span data-piece=\"89_1\" class=\"choice\"><a data-goto=\"sect_95\">Use your pistol.</a></span><span data-piece=\"89_2\" class=\"choice\"><a data-goto=\"sect_114\">Work a charm.</a></span><span data-piece=\"89_3\" class=\"choice\"><a data-goto=\"sect_133\">Dodge.</a></span><span data-piece=\"89_4\" class=\"choice\"><a data-goto=\"sect_152\">Move it!</a></span>\n",
  "sect_90": "\nYou fetch a foaming stoop of ale. After fastidiously transferring the contents to his odd saucer-shaped goblet, he turns his blind gaze on you. 'You were with that Skarvench, weren't ye?'<br><span class=\"indent\"></span>'How did you-?' begins Blutz.<br><span class=\"indent\"></span>He holds up his hand. 'I hears a thing or two. Like about Skarvench doin' in old Marshy. I sailed with Marshy, lads, once upon a time, and Skarvench weren't fit to spit upon his shoes. Talkin' of Skarvench, you know the new ship he's had built, the <em>Moon Dog</em>? Fitted with silver sails that came in a crate all the way from Glorianne. An' why did Skarvench keep askin' around about full moons an' cloud cover an' such - ain't tide tables good enough for him no more? Makes you wonder, mates. Is it lunacy, or is there method in his madness?'<br><span class=\"indent\"></span>'He's a fine one to talk about lunacy,' whispers Grimes as you get up to leave.<br><span class=\"indent\"></span>'I heard that too!' screeches Greymalkin after you. 'Ye'd do well to pay heed to what I told you, if ye want to live. Watch out for that basilisk he had shipped aboard an' all.'<br><span data-piece=\"90_0\" class=\"choice\"><a data-goto=\"sect_385\">You know the legends.</a></span><span data-piece=\"90_1\" class=\"choice\"><a data-goto=\"sect_109\">Basilisk? That rings a bell.</a></span><span data-piece=\"90_2\" class=\"choice\"><a data-goto=\"sect_52\">Step in to rescue that scholar.</a></span><span data-piece=\"90_3\" class=\"choice\"><a data-goto=\"sect_374\">Head to the shipyard.</a></span>\n",
  "sect_91": "\nA key that no-one can see or touch? A riddle set by an ocean god is a mere trifle for an artful trickster like yourself. Pursing your lips, you whistle a few bars of a jaunty tune. To the amazement of the others, this causes the chain to unlock itself and fall aside, giving you admittance to the harbour.<br><span class=\"indent\"></span>You spread your hands and take a bow. 'It was the key of C,' you explain with a smile.<br><span data-piece=\"91_0\" class=\"choice\"><a data-goto=\"sect_205\">Continue.</a></span>\n",
  "sect_92": "\n\n",
  "sect_93": "\nWith your every thought focussed on the goal of finding the iceberg, you are blinded to the stirrings of mutiny. Oakley, Grimes and Blutz come to your cabin. Although you are all old comrades, they seem nervous in the face of your driving obsession. 'Skipper,' begins Oakley, 'the crew are discontent. They fear you'll sail us off the edge of the world.'<br><span class=\"indent\"></span>'The edge of the world? Pah!' you fling your charts down and take a swig of rum. 'It's a thousand leagues from here, at least.'<br><span class=\"indent\"></span>'I don't care for the look on their faces, Cap'n,' presses Grimes. 'They look like mourners at a funeral - our funeral, if you won't turn back.'<br><span class=\"indent\"></span>You give a sour scowl. 'And you, Mister Blutz? Are you party to this insubordination too?'<br><span class=\"indent\"></span>'I'd sail with you to hell, skipper, if you asked me,' replies Blutz. 'It's just... well, I never till now thought you'd ask!'<br><span class=\"indent\"></span>Suddenly the door crashes in. The crew stand there with drawn swords, the bo'sun at their head. 'Out on deck,' he growls. ''Tis time we settled this.'<br><span class=\"indent\"></span>You and your comrades are hauled up and tied. A plank is fixed out over the side of the ship. Even now, it is livid rage rather than fear that consumes you. You curse them for their perfidy, but to no avail. With a sword at your back, you are forced to climb over the rail and walk until you run out of plank.<br><div class=\"s3\">THE END</div>\n",
  "sect_94": "\nIt seems like hours. At last the storm blows over. The full moon appears - a blazing white beacon. The clouds go draining away like pools of quicksilver in the vast dark blue dish of the sky.<br><span class=\"indent\"></span>'Ship ahoy!' cries the lookout. 'She's the <em>Rose</em>!'<br><span class=\"indent\"></span>It is indeed the Queen's proud flagship, her spars snapped and rigging torn from the storm she's just weathered. Even so, she is a daunting oaken fortress on the slow swell of the ocean. There is no sign of the escort fleet - presumably scattered or sent to the deeps by the recent hurricane. You order a cautious approach, wary in case the <em>Rose</em>'s gunners open fire on you out of panic.<br><span class=\"indent\"></span>But this uncanny night still has surprises in store, it seems. As you draw closer to the drifting <em>Rose</em>, thick white fog boils out from nowhere and spreads rapidly across the sea. Within a minute it has entirely obscured your view of the ship. You gaze out at the blanket of fog, luminous in the moonlight, sitting on the waters like a malevolent entity. Tendrils drift across your own deck, and the crew look up at you with expressions of confusion and fear.<br><span class=\"indent\"></span>You sniff the air. 'There's a smell of sorcery here, my lads,' you say to the others.<br><span class=\"indent\"></span>'Look up there!' cries one of the sailors, and suddenly there is a moan of awestruck amazement from everyone on deck. You lift your eyes towards the sky and feel a sudden chill of supernatural dread. Sailing down out of the scattered clouds, her silver sails filled with lunar light, comes Skarvench's enchanted galleon: the <em>Moon Dog</em>.<br><span data-piece=\"94_0\" class=\"choice\"><a data-goto=\"sect_189\">Take a look at the time.</a></span><span data-piece=\"94_1\" class=\"choice\"><a data-goto=\"sect_151\">Use the bat-shaped talisman.</a></span><span data-piece=\"94_2\" class=\"choice\"><a data-goto=\"sect_170\">Fly the black kite.</a></span><span data-piece=\"94_3\" class=\"choice\"><a data-goto=\"sect_208\">You can only wait and watch.</a></span>\n",
  "sect_95": "\nCalmly levelling your pistol, you shoot the end off the taper. 'By all that's unholy!' swears Skarvench. 'I never seen such a shot!'<br><span class=\"indent\"></span>Neither have you, but you do not let surprise cost you your momentary advantage. There is no time to reload the pistol. You race in before Skarvench can relight the fuse, and in seconds the two of you are locked in a fight to the death.<br><span class=\"indent\"></span>'I don't know how you escaped death before,' snarls Skarvench, 'but this time I'm going to make sure of the matter. I'll cut off your head and stick it on the bowsprit of my ship!'<br><span class=\"indent\"></span>His sword comes slicing down in a lethal arc, barely missing your shoulder as you dodge desperately aside. It splinters a great chunk of wood out of the mast behind you. Skarvench only gives a bellow of insensate fury and draws it back for another swing. He is in a killing rage, and this fight will be every bit as dangerous as you had anticipated.<br><span data-piece=\"95_0\" class=\"choice\"><a data-goto=\"sect_95a\">Fight.</a></span>\n",
  "sect_95a": "\n\n",
  "sect_96": "\nYou hurry into the cabin, startling the pet monkey which is perched on the bunk. Immediately it starts jumping up and down, chittering wildly, and the only thing you can do is grab it and stuff it into your haversack. Praying that no-one heard the noise, you head up on deck. <br><span data-piece=\"96_0\" class=\"choice\"><a data-goto=\"sect_172\">Continue.</a></span>\n",
  "sect_97": "\nTaking turns at the oars, you row westwards under the glare of a fierce sun. Soon your lips are parched, your necks blistered red in the heat. Everyone's spirits were at first buoyed up by the relief you felt at escaping from Skarvench's grasp, but soon you begin to wilt with the awful gnawing of discouragement and doubt. Will you survive long enough to reach land, or will the little jollyboat become your floating coffin?<br><span data-piece=\"97_0\" class=\"choice\"><a data-goto=\"sect_97a\">Keep going.</a></span>\n",
  "sect_97a": "\n\n",
  "sect_97b": "\nThanks to your seafaring experience, you know to protect yourself from the heat by soaking your clothes in the water. Around noon of the second day you catch sight of Red Skull Island. 'Well?' mutters Grimes through thirst-blackened lips. 'Do we risk going ashore? There might be fresh water... and food.'<br><span class=\"indent\"></span>'Aye,' says Oakley. 'And it's us that might be the food, if there are cannibals in these parts.'<br><span class=\"indent\"></span>They look to you to make the final decision.<br><span data-piece=\"97b_0\" class=\"choice\"><a data-goto=\"sect_173\">Go ashore.</a></span><span data-piece=\"97b_1\" class=\"choice\"><a data-goto=\"sect_116\">Sail on towards the next island.</a></span>\n",
  "sect_97c": "\nThirst, fatigue and heatstroke take their toll on your little company. The four of you sit in silence gazing out across the bleak waters.<br><span class=\"indent\"></span>Around noon of the second day you catch sight of Red Skull Island. 'Well?' mutters Grimes through thirst-blackened lips. 'Do we risk going ashore? There could be fresh water. Maybe even food.'<br><span class=\"indent\"></span>'Aye,' says Oakley. 'And it's us that might be the food, if there are cannibals in these parts.'<br><span class=\"indent\"></span>They look to you to make the final decision.<br><span data-piece=\"97c_0\" class=\"choice\"><a data-goto=\"sect_173\">Go ashore.</a></span><span data-piece=\"97c_1\" class=\"choice\"><a data-goto=\"sect_116\">Sail on towards the next island.</a></span>\n",
  "sect_98": "\nThe chief of the islanders arrives. He is a very big man adorned in feathers and glass trinkets, with a weathered grey face like a carving in driftwood. Dipping his finger in a coconut-shell dish carried by an attendant, he proceeds to draw a design on your face in red dye.<br><span class=\"indent\"></span>'It's just like the war-paint of these natives,' says Grimes, looking at you. 'I wonder what that means?'<br><span class=\"indent\"></span>'Maybe he's inviting me to join the tribe,' you say with a wry smile.<br><span class=\"indent\"></span>Next the tribal shaman comes forward and draws a picture in the sand with his long bony fingers. It shows a woman with a scorpion crown. He spits on the picture, then lifts his ceremonial sceptre and points westwards. The chief says something which sounds like, 'Matya Ejada niyu,' and each of the islanders in turn nods and repeats the words before stamping on the picture. Before long the image is completely lost in the scuffed sand.<br><span class=\"indent\"></span>'A curious little ritual,' remarks Oakley. 'Now, why don't we shove off, mates, before we outstay our welcome?'<br><span class=\"indent\"></span>You have to agree. Clambering into the boat, you row off watched by the horde of silent islanders. 'You're not going to leave that war-paint on your face, are you?' Oakley asks when you are well clear of the shore. 'It makes you look like a ruddy heathen.'<br><span data-piece=\"98_0\" class=\"choice\"><a data-goto=\"sect_116\">Wash off the dye before it dries.</a></span><span data-piece=\"98_1\" class=\"choice\"><a data-goto=\"sect_98a\">Leave it on.</a></span>\n",
  "sect_98a": "\n\n",
  "sect_99": "\nRecognizing its former master, the little animal suddenly slips out of your grasp, bursts from the undergrowth and goes scampering towards him. Skarvench and his men leap up and seize their weapons, instantly alert. Standing rigid with a snarl stamped on his cruel face, Skarvench scans the jungle and then his eyes lock on yours despite the cover of foliage. You realise the game is up - he's spotted you. You rise to your feet with a defiant battle-cry as he levels his pistol. Thirty paces separate you - a distance you might cover in six seconds, from a standing start. A bullet can cross it in an instant...<br><span class=\"indent\"></span>Just as Skarvench squeezes the trigger, the monkey leaps up and gives his wrist a painful nip. He bellows in rage and the shot goes wide, whistling past your ear to embed itself in the bole of a tree. But you have no time to give thanks; within moments the pirates have closed in. The battle is joined, and you and your comrades are fighting for your lives.<br><span data-piece=\"99_0\" class=\"choice\"><a data-goto=\"sect_99a\">Fight.</a></span>\n",
  "sect_99a": "\n\n",
  "sect_99b": "\nYou struggle valiantly, but they come at you from all sides and you are quickly slain.<br><div class=\"s3\">THE END</div>\n",
  "sect_100": "\nUtter blackness falls like an iron door. You can hear your foe raging blindly, casting deadly bolts of occult force at random into the dark in her frenzied efforts to slay you.<br><span data-piece=\"100_0\" class=\"choice\"><a data-goto=\"sect_176\">Trick her.</a></span><span data-piece=\"100_1\" class=\"choice\"><a data-goto=\"sect_62\">Follow up your advantage with a whirlwind spell.</a></span><span data-piece=\"100_2\" class=\"choice\"><a data-goto=\"sect_195\">Sneak back to the boat under cover of darkness.</a></span>\n",
  "sect_101": "\nOnly one thing can save you and your comrades now. You must summon a rainstorm to provide you with the drinking water you so desperately need. But despite the dire straits you are now in, you cannot help hesitating. Conjuring with the weather is a risky business at the best of times. The slightest slip can turn a breeze into a typhoon, or a scatter of snowflakes into a raging blizzard. You remember a time years ago, when you were just an apprentice wizard. You tried to conjure a sunny afternoon so you could go picnicking, only to start a three-week heat wave that burnt the fields brown and reduced rivers to muddy trickles.<br><span class=\"indent\"></span>You gaze at the wand in your hand. Mistakes like that are a long way in your past; you are an accomplished sorcerer now. On the other hand, the hurricane season is looming just a month away, and that makes the risk in summoning a storm particularly high.<br><span class=\"indent\"></span>'What are you waiting for?' says Blutz. 'We'll die without fresh water.'<br><span class=\"indent\"></span>'And what if rain swamps our boat and it sinks?' you ask him. 'We'll be just as dead.'<br><span data-piece=\"101_0\" class=\"choice\"><a data-goto=\"sect_10\">Try conjuring rain.</a></span><span data-piece=\"101_1\" class=\"choice\"><a data-goto=\"sect_120\">It's too risky.</a></span>\n",
  "sect_102": "\n'Give me a hand!' says Blutz. 'She's as slippery as a salmon.'<br><span class=\"indent\"></span>The mermaid thrashes in his grasp, churning up sea-foam with her powerful tail, but Oakley and Grimes hurry to help, holding her fast until you can complete your spell. You chant the words. Her eyes glaze like frost; her struggling ceases. For a brief time, the magic makes her your slave.<br><span class=\"indent\"></span>'What is our best route home?' you demand of her.<br><span class=\"indent\"></span>'Home?' she says dully, speaking as though in deep sleep. 'Where is home?'<br><span class=\"indent\"></span>'The far west: Port Leshand.'<br><span class=\"indent\"></span>'Sail on your present course if you fear neither weird dooms nor fierce weather. Steer south if a witch's hospitality does not daunt you. West to face rain and wind and the nightmare ship; south to see the earth god's daughter.'<br><span class=\"indent\"></span>There is a long pause while you all weigh up these words. 'Er, perhaps not as lucid as we might've hoped...' says Grimes.<br><span class=\"indent\"></span>'The best we'll get from a faerie creature, enthralled or not,' you tell him. You dismiss the mermaid, breaking the spell with a snap of your fingers.<br><span data-piece=\"102_0\" class=\"choice\"><a data-goto=\"sect_178\">Continue.</a></span>\n",
  "sect_103": "\nYou get the others' help in hooking the jollyboat's mooring rope and winching it up onto the deck by means of pulleys attached to the ship's yardarm. 'At least we can make sure our little craft is seaworthy,' you tell the others as you bend to examine whatever damage the boat has taken during the days you have spent on the open ocean.<br><span class=\"indent\"></span>'Are you stark mad?' says Oakley. 'We're trapped aboard a cursed ship, and all you find to do is fiddle with the damned jollyboat!'<br><span class=\"indent\"></span>You hum a few bars of a sea shanty, then look up from your work with a relaxed grin. 'Let's think of a plan while we fix our boat up, mates. That way we'll be ready to jump ship when the chance comes our way.'<br><span data-piece=\"103_0\" class=\"choice\"><a data-goto=\"sect_122\">Continue.</a></span><span data-piece=\"103_1\" class=\"choice\"><a data-goto=\"sect_141\">Continue.</a></span>\n",
  "sect_104": "\nCertain features of this island are ominously reminiscent of an old sea-myth concerning the giant crab Pusat Tassek. This crab is said to be as big as a house. It basks in mid-ocean with the top of its shell exposed, sometimes staying in one place so long that sand gathers on its back and plants start to grow there, all the while feeding on fish that it attracts to its maw with a sweet-smelling chemical secretion.<br><span data-piece=\"104_0\" class=\"choice\"><a data-goto=\"sect_85\">Stay here and look for food.</a></span><span data-piece=\"104_1\" class=\"choice\"><a data-goto=\"sect_104a\">Leave at once.</a></span>\n",
  "sect_104a": "\nThe risk of the island submerging with you on it is too great. You convince the others to put to sea despite their grumbling about the need to gather supplies.<br><span class=\"indent\"></span>'So,' says Oakley, 'what heading now?'<br><span data-piece=\"104a_0\" class=\"choice\"><a data-goto=\"sect_47\">Keep on your previous course westward.</a></span><span data-piece=\"104a_1\" class=\"choice\"><a data-goto=\"sect_66\">Go north towards the Smoking Islands.</a></span>\n",
  "sect_105": "\n'So,' says Mortice as you settle down to sleep, 'are you going to invite me aboard your boat, or leave me here on my blessed raft all night?'<br><span class=\"indent\"></span>Oakley smiles at him. 'Are you standing on ceremony, mate? Waiting for a bloody invite?'<br><span class=\"indent\"></span>Mortice takes ill against this joking retort. 'Aye,' he growls, spitting into his beard. 'An invite's just what I'm after. Well, haven't ye dined like lords at my expense until you're as full as farmyard geese? Call me over, damn your veins!'<br><span class=\"indent\"></span>Blutz is understandably not keen to sleep beside a lunatic, no matter how charitable. He turns to you and mutters under his breath, 'Well, our boat's pretty cramped already. And no more comfortable than his raft, I'd say.'<br><span class=\"indent\"></span>'What's that whispering?' snarls Mortice, stamping his foot. 'Secrecy and distrust! Is this how you repay a bit o' kindness, eh? Come on, will you ask me aboard or not?'<br><span class=\"indent\"></span>'Ask the skipper,' says Grimes, nodding towards you.<br><span data-piece=\"105_0\" class=\"choice\"><a data-goto=\"sect_86\">Mull it over.</a></span><span data-piece=\"105_1\" class=\"choice\"><a data-goto=\"sect_143\">Invite him to come aboard.</a></span><span data-piece=\"105_2\" class=\"choice\"><a data-goto=\"sect_162\">Let him stay on his raft.</a></span>\n",
  "sect_106": "\nThe clouds are black banners across the scarlet of sunset when, gazing into the face of approaching night, you spy a billowing sail gleaming wanly in the dusk. A ship bound for Leshand! Jumping to your feet, shouting and waving, you wait anxiously until an answering hail tells you they've seen you. The ship comes nearer, her prow sliding through the twilit waters, her sails pinned like sheets of gold against the darkening sky. Faces look down from the rail, and a rope ladder is lowered. You climb rapidly despite your fatigue, gladdened by the friendly speech of the sailors.<br><span class=\"indent\"></span>A hand grasps yours and helps you up. 'Welcome aboard the <em>Jewel of Heaven</em>,' says a Gloriannic voice. You do not reply at once, but fall on your knees alongside Oakley and the others, thanking almighty God for deliverance from the brink of doom.<br><span data-piece=\"106_0\" class=\"choice\"><a data-goto=\"sect_370\">Continue.</a></span>\n",
  "sect_107": "\nFinding a secluded snug in a tavern away from the docks, you consult with your friends as to what your next move should be.<br><span class=\"indent\"></span>Blutz is all for telling the authorities what you know. 'They're in a better position than we are to protect Queen Titania,' he argues.<br><span class=\"indent\"></span>'I disagree,' says Grimes. 'An opportunity like this won't quickly come our way again. It's like the tide: take it at the flood and fortune follows; wait till it's out and you've missed your boat.'<br><span class=\"indent\"></span>'We should go to Port Selenice,' says Oakley. 'That's where Skarvench will go next. Let's see if we can't steal a march on the fiend and scupper his plans. The Gloriannic authorities will reward us richly, but even more important than that-'<br><span class=\"indent\"></span>'More important than that, we get our revenge on Skarvench,' you finish.<br><span data-piece=\"107_0\" class=\"choice\"><a data-goto=\"sect_145\">Head straight for Selenice.</a></span><span data-piece=\"107_1\" class=\"choice\"><a data-goto=\"sect_126\">Go to see the governor first.</a></span>\n",
  "sect_108": "\nThe days pass, balmy and full of ease after your long deprivation. With rest and food you recover quickly from your ordeal.<br><span class=\"indent\"></span>At last you catch sight of land, and after tacking along the coast for a few hours you arrive at Leshand harbour. A forest of masts sways along the wharf, and the sharp smells of tar and fish waft on the air. As the <em>Jewel of Heaven</em> ties up at the quayside, you are anxious to gather your few belongings and go ashore. 'Dry land,' says Oakley, in the tone of a man greeting his long-lost sweetheart. 'I never thought to see it again!' <br><span class=\"indent\"></span>The captain and crew are busy with unloading their cargo. You thank them, shaking each man's hand as you press across the deck and make your way down the gangplank.<br><span class=\"indent\"></span>The dock is a confused bustle, with longshoremen and sailors teeming around and wagons trundling to and fro. Pushing through the milling crowds, you head along a narrow alley in search of an inn.<br><span data-piece=\"108_0\" class=\"choice\"><a data-goto=\"sect_9\">Continue.</a></span>\n",
  "sect_109": "\nThe basilisk is the name of a new type of powerful long-range cannon that has recently come into use on Gloriannic warships. They are not easy to obtain, being manufactured exclusively by the Queen's armourers at the Royal Arsenal. If Skarvench really has managed to lay his hands on one, he must have friends in high places at the Gloriannic court.<br><span class=\"indent\"></span>The commotion at the bar continues. <br><span data-piece=\"109_0\" class=\"choice\"><a data-goto=\"sect_52\">Intervene.</a></span><span data-piece=\"109_1\" class=\"choice\"><a data-goto=\"sect_374\">Leave to visit the shipyard.</a></span>\n",
  "sect_110": "\nYou lift your wand, occult syllables leaping to the front of your mind like war hounds eager to be unleashed. 'What can be locked can be unlocked,' you assert. 'I shall open the chain by my most potent art.'<br><span class=\"indent\"></span>The colossus regards you with his cool majestic eyes. 'But, mortal: the chain is held closed by magic.'<br><span class=\"indent\"></span>You laugh. 'Then I'll cast a spell to undo magic!' <br><span class=\"indent\"></span>No sooner do you, however, than the coracle is swept off away from the harbour at dizzying speed. If not for Blutz catching hold of your coat, you would have been thrown overboard. 'What's happened, skipper?' he says as the four of you crouch terrified in the bottom of the coracle with the waves crashing against the sides.<br><span class=\"indent\"></span>'I forgot,' you say with a groan. 'It was magic that brought us here in the first place. My spell undid that.'<br><span class=\"indent\"></span>It is dawn by the time you reach Selenice. You are flung up onto the shore, and by the time you turn and look out to sea, the coracle has vanished. Now you must look for another way to obtain a vessel:<br><span data-piece=\"110_0\" class=\"choice\"><a data-goto=\"sect_261\">Uncork that ship in a bottle.</a></span><span data-piece=\"110_1\" class=\"choice\"><a data-goto=\"sect_318\">Use the deed of ownership.</a></span><span data-piece=\"110_2\" class=\"choice\"><a data-goto=\"sect_299\">Buy a ship.</a></span><span data-piece=\"110_3\" class=\"choice\"><a data-goto=\"sect_343a\">But how?</a></span>\n",
  "sect_111": "\nA rope is slung over the yardarm. The warship captain personally ties the end into a noose. As he puts it over your head, you cannot resist a few futile words of defiance. 'You enjoy your job, don't you?' you snarl at him.<br><span class=\"indent\"></span>He gazes back at you coolly. 'I serve my Queen and country. That is all; there's nothing personal about this.' He turns to the marines holding the end of the rope and gives a curt nod. You are hauled aloft to kick out your life under the shadow of your own ship's yardarm. It is a fate that awaits many pirates, and a far cry from the glorious destiny you dreamed of.<br><div class=\"s3\">THE END</div>\n",
  "sect_112": "\nYou have not long gone off watch, and are sitting in your cabin with a warming cup of grog, when there comes a stifled cry from up on deck. Bone weary, you throw on your cloak and grumpily stomp back up the companion-way. You are on the point of berating Blutz for calling out, certain that he has simply allowed the mist and the desolation of the spot to unnerve him, but the moment you emerge on deck those words choke off in your throat.<br><span class=\"indent\"></span>Everything is swathed in the eerie greenish mist. Blutz stands amidships, backing away from the rail with little fluttering motions of his hands. You turn and behold the cause of his terror. Coming up over the side is a figure out of a nightmare - a seaweed-draped corpse clad in robes sodden with sea water. As it climbs over the rail, its angular hunched stance and galvanic spasms of motion put you in mind of a spider's stalking gait. Patches of exposed bone show through the rotted flesh and it has only deep black sockets for eyes. In one hand it holds a rust-blotched sword; the other is rigid like a claw poised to strike.<br><span class=\"indent\"></span>'All hands on deck!' Your voice is a thin reedy screech, strained by stark fear. Even as you hear the bustle of men rushing up from below, more of these ghastly apparitions appear at the rail, and you know that you are in for the toughest battle of your life. <br><span data-piece=\"112_0\" class=\"choice\"><a data-goto=\"sect_321\">Continue.</a></span>\n",
  "sect_113": "\nYour bows smash into the helpless warship with an anguished splintering of timbers. The ship lurches and you see at least one of your crew swept overboard by a titanic wave. He is immediately swallowed up by the storm's fury. There is nothing you can do to save him - you may not even be able to save yourself.<br><span data-piece=\"113_0\" class=\"choice\"><a data-goto=\"sect_113a\">Continue.</a></span>\n",
  "sect_113a": "\n\n",
  "sect_114": "\nAn all-purpose good luck charm is your best chance. Touching your amulet, you mutter the words of the cantrip at the same moment that Skarvench lights the basilisk cannon's fuse. There is a damp spluttering and then - nothing.<br><span class=\"indent\"></span>'Misfire, curse it!' snarls Skarvench. He pulls his sword from his belt. 'Very well, then, we'll have to settle our business up close an' personal, like.'<br><span data-piece=\"114_0\" class=\"choice\"><a data-goto=\"sect_171\">Continue.</a></span>\n",
  "sect_115": "\n'You ask me how I can be sure of Queen Titania's itinerary, my lads?' growls Skarvench. 'You ask how I can whistle up a storm to scatter her escort fleet, then as quickly becalm her flagship in a bank of fog? And maybe you'll ask how I'll descend from the skies on a rope to whisk the pretty little package away before her soldiers even know what's what? Oh, what a bunch of scurvy doubting dogs you are, to be sure! There's one simple answer to all such cynical questions, and that's this: her wizard, William Wild, is my half-brother. He's in on the scheme, y'see.'<br><span class=\"indent\"></span>You have heard enough. The whole world knows of the court wizard Dr Wild and the boundless trust placed in him by Queen Titania. If he plots betrayal, she is in real danger and not all her soldiers can save her.<br><span class=\"indent\"></span>A floorboard creaks from further along the passage. You look around sharply. Someone is coming.<br><span data-piece=\"115_0\" class=\"choice\"><a data-goto=\"sect_153\">Use your agility.</a></span><span data-piece=\"115_1\" class=\"choice\"><a data-goto=\"sect_134\">Hide in the sailmaster's cabin.</a></span><span data-piece=\"115_2\" class=\"choice\"><a data-goto=\"sect_191\">Stand your ground.</a></span>\n",
  "sect_116": "\nAnother day passes, and your voyage becomes an increasing ordeal as heat and fatigue take their toll. The sea sits all about you like a gleaming leaden plate; the sun turns the sky into a furnace of white haze. By night you shiver under the uncaring gaze of a million stars.<br><span data-piece=\"116_0\" class=\"choice\"><a data-goto=\"sect_116a\">Break out the rations.</a></span><span data-piece=\"116_1\" class=\"choice\"><a data-goto=\"sect_155\">And nothing to eat.</a></span>\n",
  "sect_116a": "\n\n",
  "sect_117": "\n\n",
  "sect_117a": "\nYou must offer the natives one of the following; they won't accept anything else: <br><span data-piece=\"117a_0\" class=\"choice\"><a data-goto=\"sect_117c\">A sword.</a></span><span data-piece=\"117a_1\" class=\"choice\"><a data-goto=\"sect_117d\">A pistol.</a></span><span data-piece=\"117a_2\" class=\"choice\"><a data-goto=\"sect_117e\">An amulet.</a></span><span data-piece=\"117a_3\" class=\"choice\"><a data-goto=\"sect_117f\">A wand.</a></span><span data-piece=\"117a_4\" class=\"choice\"><a data-goto=\"sect_117g\">A crucifix.</a></span><span data-piece=\"117a_5\" class=\"choice\"><a data-goto=\"sect_117h\">A toolkit.</a></span><span data-piece=\"117a_6\" class=\"choice\"><a data-goto=\"sect_117i\">All your doubloons.</a></span><span data-piece=\"117a_7\" class=\"choice\"><a data-goto=\"sect_117j\">Don't give them anything.</a></span>\n",
  "sect_117b": "\nYou display all your belongings, but you don't have anything that interests the islanders. Disappointment quickly becomes anger and they start to turn nasty. 'I think we ought to make ourselves scarce,' says Grimes under his breath.<br><span data-piece=\"117b_0\" class=\"choice\"><a data-goto=\"sect_41\">Run for it.</a></span>\n",
  "sect_117c": "\n\n",
  "sect_117d": "\n\n",
  "sect_117e": "\n\n",
  "sect_117f": "\n\n",
  "sect_117g": "\n\n",
  "sect_117h": "\n\n",
  "sect_117i": "\n\n",
  "sect_117j": "\n'Bad move,' mutters Grimes. 'It's like showing a child a shop window full of toys and then telling him he's getting nothing for his birthday.'<br><span class=\"indent\"></span>'Especially if the child is a fathom tall, with sharpened teeth and a spear,' adds Oakley.<br><span class=\"indent\"></span>They're right. The islanders are pressing closer and you don't like the look in their eyes.<br><span data-piece=\"117j_0\" class=\"choice\"><a data-goto=\"sect_41\">Run.</a></span>\n",
  "sect_117k": "\nThe islanders bring forth two items which they offer in exchange: a shield woven of brightly coloured feathers and a hardwood sword studded with shark's teeth. Oakley gives a snort of disgust when he sees these. 'They're not worth a tenth of what we gave them!'<br><span class=\"indent\"></span>'Maybe you shouldn't accept anything,' cautions Blutz, catching your sleeve. 'The natives might get angry. What if it's just a token gesture and they don't really want to part with them?'<br><span data-piece=\"117k_0\" class=\"choice\"><a data-goto=\"sect_117l\">Take the gifts.</a></span><span data-piece=\"117k_1\" class=\"choice\"><a data-goto=\"sect_98\">Refuse them.</a></span>\n",
  "sect_117l": "\n\n",
  "sect_118": "\nYou drag your boat up the beach under the blandly incurious gaze of the paradise-birds. Blutz gives an excited cry and points, saying, 'Look, above the treetops! It's a tower. A ruddy marble tower, mates.'<br><span class=\"indent\"></span>He's right. In the declining golden light of the afternoon, you see a gleaming tower of polished stone. Since there are no creepers growing over it, the place is surely inhabited. But do you want to meet the inhabitant?<br><span data-piece=\"118_0\" class=\"choice\"><a data-goto=\"sect_213\">Continue.</a></span><span data-piece=\"118_1\" class=\"choice\"><a data-goto=\"sect_194\">Head for the tower.</a></span><span data-piece=\"118_2\" class=\"choice\"><a data-goto=\"sect_232\">Gather food and water.</a></span><span data-piece=\"118_3\" class=\"choice\"><a data-goto=\"sect_137\">Put to sea immediately.</a></span>\n",
  "sect_119": "\nYou suggest that, instead of draining one person's entire soul so that he dies, she contents herself with a fraction of the life force taken from each of you. She considers this, then gives a short regal nod. 'I accept. Step forward, mortals.'<br><span class=\"indent\"></span>She lays her knife against the chest of each of you in turn. A cold chill spreads through you as her magic leeches a part of your very soul. <br><span data-piece=\"119_0\" class=\"choice\"><a data-goto=\"sect_119a\">Can you withstand it?</a></span>\n",
  "sect_119a": "\n\n",
  "sect_119b": "\nYou <em>permanently</em> lose 3 Life Points; that is, your maximum Life Points score has been reduced by 3. After that, Ejada is done with you and you are free to return to the boat and sail away from here.<br><span data-piece=\"119b_0\" class=\"choice\"><a data-goto=\"sect_137\">Continue.</a></span>\n",
  "sect_119c": "\nIn your enfeebled state, worn down by hardship and dehydration, you cannot endure the effects of Ejada's sorcery. Your heart gives out and you slump at her feet - dead.<br><div class=\"s3\">THE END</div>\n",
  "sect_120": "\nThe days and nights become a flickering blur as you sink deeper into exhausted delirium. Arising from a fever, your eyes aching in your sockets, you behold a beautiful woman gliding across the dead calm of the sea. Her hair is the colour of honey and her skin is so white that it makes her lips blaze like rubies. Reaching you, you bends down and lifts you out of the boat as though you're weightless. Indeed, after your long ordeal your body has now become little more than skin stretched taut over bone. Borne higher and higher into the air, you realise with a curious detachment that you are not in a woman's arms at all, but in a kind of rope sling...<br><span class=\"indent\"></span>Now you come properly awake, opening your eyes to find yourself on the deck of a ship. You are surrounded by sailors. One of them bends down and cradles your head, putting a cup of water to your lips.<br><span class=\"indent\"></span>'Where..?' you croak feebly.<br><span class=\"indent\"></span>'On board the <em>Jewel of Heaven</em>,' he replies. 'Now, drink.'<br><span class=\"indent\"></span>The water stings your shrivelled lips, runs like acid in your throat. After a few sips a wave of weakness enfolds you and you pass out.<br><span data-piece=\"120_0\" class=\"choice\"><a data-goto=\"sect_120a\">Can you pull through?</a></span><span data-piece=\"120_1\" class=\"choice\"><a data-goto=\"sect_370\">Can you pull through?</a></span><br>",
  "sect_120a": "\nWeakened as you are by the rigours of your journey, you are beyond any help the sailors can give. Sleep gives way to fever. Finally you slip into a coma. You will never recover consciousness.<br><div class=\"s3\">THE END</div>\n",
  "sect_121": "\nShe swims well out of reach and remains silent while recovering her dignity. Then she rears up dolphin-like amidst the high waves and says: 'You were wise to set me free. If you had not, who can say what curse would have fallen on your heads? But now I will give you a proper reward for your courtesy.'<br><span class=\"indent\"></span>Swimming closer she catches the mooring rope and, passing it over her shoulder, proceeds to tug your boat behind her as she swims rapidly southwards.<br><span class=\"indent\"></span>'A fine figurehead for our good ship <em>Coffin Lid!</em>' declares Oakley, standing in the prow where the spray soaks his face. 'You'll agree to be our pallbearer too, I hope, madam, if events turn against us?'<br><span class=\"indent\"></span>'Sit down and be quiet, for God's sake,' whines Blutz. 'Do you want her to drag us down into the depths?'<br><span data-piece=\"121_0\" class=\"choice\"><a data-goto=\"sect_197\">Let the mermaid take you south.</a></span><span data-piece=\"121_1\" class=\"choice\"><a data-goto=\"sect_178\">Tell her to depart.</a></span>\n",
  "sect_122": "\nThe curse is immaterial. You are confident that your magical knowledge is enough to negate it - at least so that you and your friends can escape from the ship. But Captain Mandrigard is another matter. Having suffered under the curse's power for so long, he is probably doomed forever now.<br><span class=\"indent\"></span>As you start to recite the charm, Grimes catches your sleeve and points up at the sails. 'We're running before an east wind,' he says. 'No hurry in leaving the ship so long as we can do it whenever we like. Let's leave it a day or so, when we'll be closer to home.'<br><span class=\"indent\"></span>Blutz rolls his eyes at this. 'Madness! Let's get away while we have the chance.'<br><span data-piece=\"122_0\" class=\"choice\"><a data-goto=\"sect_160\">Neutralize the curse and escape at once.</a></span><span data-piece=\"122_1\" class=\"choice\"><a data-goto=\"sect_141\">Remain on board for the time being.</a></span>\n",
  "sect_123": "\nThe crab's huge claw descends from the sky to snap at you, but you dive nimbly over it in a forward roll and continue running towards the jollyboat without so much as breaking stride. The others are already aboard. You can hear their frantic shouts urging you on. As the crab rears and plunges you are almost flung off your feet, but the same sure-footedness that has carried you across many a storm-tossed deck lets you keep your balance now. A last bound carries you clear of the 'shore' and into the boat.<br><span class=\"indent\"></span>'Go!' you yell. 'Work those oars as you've never worked 'em before, my hearties!'<br><span data-piece=\"123_0\" class=\"choice\"><a data-goto=\"sect_161\">Continue.</a></span>\n",
  "sect_124": "\n'An' what if I do have something under my raft?' he counters darkly. 'Even a poor shipwrecked mariner's entitled to a bit o' shelter, ain't he, out here where the pickings are lean and there's precious little cover to keep a wight from shrivellin' up and blowing away in the wind?'<br><span class=\"indent\"></span>Seeing how you all stare at this outburst, he suddenly falls quiet and cracks his mad smile again, saying, 'But blow it, shipmates, why quarrel? Tomorrow there'll be no secrets between us, that I promise ye or my name's not Timmy Mortice.'<br><span data-piece=\"124_0\" class=\"choice\"><a data-goto=\"sect_105\">Continue.</a></span>\n",
  "sect_125": "\n\n",
  "sect_125a": "\nNo rain falls. Soon your tongue is so parched that it clings to the roof of your mouth like flypaper. The slightest effort wearies you, and you spend most of your time lolling half in a faint, idly tilting the rudder or gazing out over the pitiless expanse of the ocean. <br><span data-piece=\"125a_0\" class=\"choice\"><a data-goto=\"sect_106\">Continue.</a></span>\n",
  "sect_125b": "\nNo rain falls. Soon your tongue is so parched that it clings to the roof of your mouth like flypaper. The slightest effort wearies you, and by sunset you are delirious. Death follows swiftly.<br><div class=\"s3\">THE END</div>\n",
  "sect_126": "\nYou are taken into the marble-floored audience hall of the fort, where the governor receives visitors. He proves to be a short dumpy man with a harried look about him, no doubt more suited to banquets and other frippery than to the harsh demands of royal security. <br><span class=\"indent\"></span>After listening to what you have to say, he exchanges a few whispered words with his officials. Then, turning to you with a stern heavy-lidded expression, he says, 'No doubt you expect some reward for this tall tale of yours? You'll not get one - not a penny. Do you think we are ready to panic at every wild rumour dredged up from the bottom of a wine-jug. Not a bit of it.'<br><span class=\"indent\"></span>Without more ado you are seized by guards and thrown out into the street. 'You fools!' cries Oakley, jumping to his feet. 'Don't you understand? The Queen's in danger!'<br><span class=\"indent\"></span>'<em>You're</em> in danger of a flogging if you don't shove off, matey boy,' snarls the captain of the guard as he closes the fortress gates.<br><span class=\"indent\"></span>The rest of you get up and brush the dirt of the gutter off your clothes. 'Well, so much for that,' says Grimes. 'Now I say we should sail for Port Selenice without delay.'<br><span data-piece=\"126_0\" class=\"choice\"><a data-goto=\"sect_145\">Continue.</a></span>\n",
  "sect_127": "\nYou soon learn that the governor recently ordered preparations for a state visit by Queen Titania. Sitting in a harbour tavern with an old acquaintance of yours, Black Danny McClintock, you watch amazed as the scar-faced rogue orders a jug of spiced milk instead of his usual shot of strong rum. 'We've been warned off causing any affray, under threat of Moses's Law on our bare backsides,' he explains. 'I'm playing it safe by doing no drinking or gambling for the duration.'<br><span class=\"indent\"></span>You nod, hiding a smile. Moses's Law is thirty-nine strokes of the birch, but what this pack of dockside villains fear more than the pain is the public humiliation. After strutting like bantam cocks around Leshand's byways for so long, they hate having to knuckle under to the law. Doubtless that's why, just outside in the street, you can see your old friend Snake-Eyes Johnson helping an old lady with her shopping basket - and not even filching so much as an orange while he does it.<br><span class=\"indent\"></span>The others listen with interest when you meet up later to tell them what you've learned. 'This state visit,' ponders Blutz. 'It must be someone pretty important to cause a clampdown like this.'<br><span class=\"indent\"></span>If you are to have any hope of catching up with Skarvench you will have to move on soon. He would never show his face around Leshand, with so many murders to his name. But you also have a feeling it might be worth spending a little while digging out more rumours. <br><span data-piece=\"127_0\" class=\"choice\"><a data-goto=\"sect_88\">Listen for rumours.</a></span><span data-piece=\"127_1\" class=\"choice\"><a data-goto=\"sect_12\">Visit a chandler's to buy supplies.</a></span><span data-piece=\"127_2\" class=\"choice\"><a data-goto=\"sect_31\">Get some unusual items identified.</a></span><span data-piece=\"127_3\" class=\"choice\"><a data-goto=\"sect_50\">Apply for a letter of marque.</a></span><span data-piece=\"127_4\" class=\"choice\"><a data-goto=\"sect_409\">Apply for a letter of marque.</a></span><span data-piece=\"127_5\" class=\"choice\"><a data-goto=\"sect_69\">Pay a visit to Master Capstick.</a></span><span data-piece=\"127_6\" class=\"choice\"><a data-goto=\"sect_107\">Ready to move on.</a></span>\n",
  "sect_128": "\nPretending not to have noticed the three ruffians, you go up to the scholar and greet him like an old friend: 'Ah, here you are! I've been searching high and low. Captain Skarvench has been most concerned for your safety.'<br><span class=\"indent\"></span>'Eh?' says the scholar, peering at you with large watery eyes. 'I don't know - ' <br><span class=\"indent\"></span>You hastily silence him with a poke between the ribs.<br><span class=\"indent\"></span>The ruffians are looking on nervously. 'Um, did you say Skarvench?' says one of them at last, a sickly half-smile curdling on his rough features.<br><span class=\"indent\"></span>'Why, yes,' you reply, turning as if noticing them for the first time. 'This gentleman is his new ship's surgeon. The captain's been waiting for him to arrive in Selenice. Have you fellows been looking after him? That's very gracious. Tell me your names - the captain may wish to reward you when he hears about this.'<br><span class=\"indent\"></span>There is the sound of three very audible gulps. 'Er... think nothin' of it,' says one of the men, handing back the scholar's spectacles. 'We got to be goin', ain't we, lads?' And they are out of the door in less time than it takes to drain a tot of rum.<br><span data-piece=\"128_0\" class=\"choice\"><a data-goto=\"sect_223\">Continue.</a></span>\n",
  "sect_129": "\nDo you have anything in your possession that could be useful?<br><span data-piece=\"129_0\" class=\"choice\"><a data-goto=\"sect_243\">The hornpipe.</a></span><span data-piece=\"129_1\" class=\"choice\"><a data-goto=\"sect_224\">The monkey.</a></span><span data-piece=\"129_2\" class=\"choice\"><a data-goto=\"sect_262\">The dragon ring.</a></span><span data-piece=\"129_3\" class=\"choice\"><a data-goto=\"sect_72\">Throw yourself on the giant's charity.</a></span>\n",
  "sect_130": "\nThe captain takes your letter of marque, scans it briefly, then regards you with his coldly disapproving gaze. 'This document is invalid. We have reports that you have been plundering Gloriannic ships, which disqualifies you from acting as a privateer on Her Majesty's behalf.' <br><span data-piece=\"130_0\" class=\"choice\"><a data-goto=\"sect_111\">Continue.</a></span>\n",
  "sect_131": "\nYou come on deck shortly before eight bells. The fog shrouds everything in a spectral pall. You look up at the rigging, which hangs like the shadow of a giant web. There is a rotting miasmal smell in the air, wafting from the swamps along the back of the bay. Blutz gives a rattling cough, mumbles something about yellow fever and wanting to be shot of this anchorage, and stumps below to get a cup of grog before turning in. You are left alone on the deck.<br><span class=\"indent\"></span>Gazing back towards the glow from the swamps, you hear the muffled sound of oars splashing far off in the darkness. A small boat appears, gradually taking solid form out of the fog, and in the light of the ship's lanterns you see a tall figure standing in the prow with two rowers hunched over the oars behind him. As the boat pulls alongside you have a clear view of the man: tall and pale, with eyes of startling cobalt blue. His teeth flash in a smile as he hails you: 'Permission to come aboard?'<br><span data-piece=\"131_0\" class=\"choice\"><a data-goto=\"sect_283\">Agree.</a></span><span data-piece=\"131_1\" class=\"choice\"><a data-goto=\"sect_302\">Refuse.</a></span>\n",
  "sect_132": "\nThe Gloriannic ship goes rushing past, helpless in the grip of the storm. You catch a brief glimpse of tiny figures scurrying across her deck. Then a wave crashes down, obscuring all sight of her, and when you look again she is gone.<br><span class=\"indent\"></span>'God help the <em>Rose</em> if she's out in that,' gasps Oakley, staring into the teeth of the hurricane.<br><span class=\"indent\"></span>You do not answer. It takes every ounce of your strength to hold the whipstaff and keep your own ship on an even keel. As the thunderclouds spit molten light into the darkness all around you, fracturing the heavens with their fury, you strike on implacably towards your goal.<br><span data-piece=\"132_0\" class=\"choice\"><a data-goto=\"sect_94\">Continue.</a></span>\n",
  "sect_133": "\nYou duck into a forward roll just as the cannon belches forth its charge. The ball goes whizzing over your head, snapping a spar just where you were standing. You have the bad luck to be caught by a flying splinter of wood, but it only grazes your forehead.<br><span data-piece=\"133_0\" class=\"choice\"><a data-goto=\"sect_171\">Continue.</a></span>\n",
  "sect_134": "\nYou dart inside the cabin, pushing the door to behind you and listening with bated breath as the heavy tread of boots advances along the passage and pauses just outside. Then the door starts to swing open.<br><span data-piece=\"134_0\" class=\"choice\"><a data-goto=\"sect_210\">Use your lucky amulet.</a></span><span data-piece=\"134_1\" class=\"choice\"><a data-goto=\"sect_229\">Hide.</a></span><span data-piece=\"134_2\" class=\"choice\"><a data-goto=\"sect_191\">The game's up.</a></span>\n",
  "sect_135": "\n\n",
  "sect_135a": "\nYour tiny boat heads onward. By day you are seared by the sun; by night you are racked with chill. Salt spray chafes the sores on your skin, and the need to bail water constantly gives you no rest. Another two days crawl by, and you gradually give way to fever, exhaustion and hunger.<br><span data-piece=\"135a_0\" class=\"choice\"><a data-goto=\"sect_135c\">Break out your rations.</a></span><span data-piece=\"135a_1\" class=\"choice\"><a data-goto=\"sect_135d\">Eat the monkey.</a></span><span data-piece=\"135a_2\" class=\"choice\"><a data-goto=\"sect_231\">The monkey's not for eating.</a></span><span data-piece=\"135a_3\" class=\"choice\"><a data-goto=\"sect_231\">And nothing to eat.</a></span>\n",
  "sect_135b": "\nYour tiny boat heads onward under a blistering sun. Salt spray chafes the sores on your skin, and the need to bail water constantly gives you no rest. Fever and exhaustion soon take their toll. You die in the night.<br><div class=\"s3\">THE END</div>\n",
  "sect_135c": "\n\n",
  "sect_135d": "\n\n",
  "sect_136": "\n'Here's the question as I sees it,' says Grimes. 'Do we try to make it all the way to Leshand, or do we strike southward first? I reckon we'd have a shorter hop to Pandanus Isle, and we could pick up provisions there.'<br><span class=\"indent\"></span>'Or the natives could pick up provisions,' says Oakley. 'Us.'<br><span class=\"indent\"></span>It looked as if Blutz was about to go along with Grimes's suggestion, but at the mention of cannibals he looks nervously to the south. 'We were on that cursed ship a fair while, mates,' he says. 'Surely Leshand can't be far off, if we stay bold.'<br><span class=\"indent\"></span>'Bold!' Oakley gives a croak of mocking laughter.<br><span class=\"indent\"></span>They can't decide amongst themselves. The decision is left to you.<br><span data-piece=\"136_0\" class=\"choice\"><a data-goto=\"sect_156\">Head to the Smoking Islands.</a></span><span data-piece=\"136_1\" class=\"choice\"><a data-goto=\"sect_405\">Steer straight ahead for Port Leshand.</a></span><span data-piece=\"136_2\" class=\"choice\"><a data-goto=\"sect_386\">Steer straight ahead for Port Leshand.</a></span><span data-piece=\"136_3\" class=\"choice\"><a data-goto=\"sect_136d\">Steer straight ahead for Port Leshand.</a></span>\n",
  "sect_136a": "\n\n",
  "sect_136b": "\n'Anything to eat?' asks Blutz hopefully.<br><span data-piece=\"136b_0\" class=\"choice\"><a data-goto=\"sect_136c\">Share out the provisions.</a></span><span data-piece=\"136b_1\" class=\"choice\"><a data-goto=\"sect_136e\">There's nothing.</a></span>\n",
  "sect_136c": "\n\n",
  "sect_136d": "\nA storm billows blackly up out of the east like the death of daylight. You cling to the sides, teeth bared in terror as you expect your flimsy vessel to burst its seams at any moment. The gale lasts half a day, sporadically spitting rails of icy rain down on your heads until your joints feel as though they will never move again. When the sun finally breaks through the clouds, you greet it without cheer, knowing that within hours it will have baked you half out of your wits.<br><span data-piece=\"136d_0\" class=\"choice\"><a data-goto=\"sect_136a\">Can you go on?</a></span>\n",
  "sect_136e": "\nWe made a good run of it, mates,' says Oakley painfully through swollen lips.<br><span class=\"indent\"></span>Grimes nods. 'Better to die here, free as we are, than to have lived a decade more on Skarvench's ship.'<br><span class=\"indent\"></span>You give a grunt of disapproval. 'Stow that talk of dying. If you've breath left, save it for the fight. I won't go down while that mad dog still lives to see the sun rise.'<br><span data-piece=\"136e_0\" class=\"choice\"><a data-goto=\"sect_136f\">Can you go on?</a></span>\n",
  "sect_136f": "\n\n",
  "sect_137": "\n\n",
  "sect_137a": "\n'It's a miracle we're afloat,' says Blutz, rubbing his hand along the peeling paint of the jollyboat's hull.<br><span class=\"indent\"></span>Oakley jabs his thumb in the direction of your amulet. 'Got any more miracles in there?'<br><span class=\"indent\"></span>'Unfortunately not. For the time being, anyway.'<br><span class=\"indent\"></span>Thirst, hunger and the heat become your bitter foes. Petty quarrels break out as conditions worsen. Each man is nearing the end of his tether.<br><span data-piece=\"137a_0\" class=\"choice\"><a data-goto=\"sect_137c\">Can you go on?</a></span>\n",
  "sect_137b": "\nSwept onwards, your little craft starts to spring leaks. You're not sure how long it will stay afloat.<br><span class=\"indent\"></span>For now, that's the least of your worries. Thirst, hunger and the heat become your bitter foes. Petty quarrels break out as conditions worsen. Each man is nearing the end of his tether.<br><span data-piece=\"137b_0\" class=\"choice\"><a data-goto=\"sect_137c\">Can you go on?</a></span>\n",
  "sect_137c": "\n\n",
  "sect_137d": "\n'Oh, why didn't I grab a crust of bread from the galley?' moans Blutz, rubbing his stomach.<br><span class=\"indent\"></span>'Why stop there?' says Oakley. 'While you're daydreaming, bring along a roast bird an' all the trimmings, why don't you?'<br><span data-piece=\"137d_0\" class=\"choice\"><a data-goto=\"sect_137e\">Break out the provisions.</a></span><span data-piece=\"137d_1\" class=\"choice\"><a data-goto=\"sect_175\">'Stow that talk of food!'</a></span>\n",
  "sect_137e": "\n\n",
  "sect_138": "\nA strong breeze stretches your sails wide against the sky, driving you on towards your destiny. But you have no time to brood on what the future may hold; you have a ship to command. Seeing the way her prow cleaves the water, and the jaunty courage of your crew as they go about their chores, your heart brims with optimism. Soon Skarvench will see his last sunset in this life, of that you feel sure.<br><span class=\"indent\"></span>More than a week goes by. On the ninth day, you stand on the deck watching the sun slide out of the sky. Long blazing beams of orange light turn the green waves to liquid gold. And then - in the blink of an eye - this idyllic scene is transformed. A purple murk rises from the western horizon, blotting out the afternoon sun behind thick thunderclouds. A cold gust blows in your face, setting the sails to a pensive fluttering like frightened birds. You know well the taste of that chill wind; it is the harbinger of the hurricane.<br><span class=\"indent\"></span>'This is but the twitch of the lion's tail compared to what will come,' mutters Grimes. 'We'll have to put about.' He calls to the crew: 'Strike the main topsail.'<br><span class=\"indent\"></span>You turn. 'Belay that striking order. Lash it!'<br><span class=\"indent\"></span>Oakley stares at you. 'Skipper, the hurricane'll tear us apart.'<br><span class=\"indent\"></span>The first rain spits into your face, icily intense. 'Hurricane or not, we're going in. God is master of the sea, the heavens and the earth but, by all that's holy, <em>I'm</em> the master of this ship.'<br><span data-piece=\"138_0\" class=\"choice\"><a data-goto=\"sect_18\">Use the thundercloud fan.</a></span><span data-piece=\"138_1\" class=\"choice\"><a data-goto=\"sect_37\">Cast a charm.</a></span><span data-piece=\"138_2\" class=\"choice\"><a data-goto=\"sect_397\">Trust to your seafaring skills.</a></span><span data-piece=\"138_3\" class=\"choice\"><a data-goto=\"sect_75\">Trust to fate.</a></span>\n",
  "sect_139": "\nMulling over your extensive knowledge of myth and legend, you consider what the items might be. Obviously they are classical in style. Very old, then - which suggests the possibility of powerful magic, since everyone knows that the sorcerers of ancient times knew many magical secrets that are now lost. On the basis of hopeful surmise, you finally identify the items as follows:<br><span class=\"indent\"></span>The diamond would suffice to buy you a ship of your own, but it has no magical properties, unless the effect of staggering wealth on men's greed can be accounted magical.<br><span class=\"indent\"></span>The conch-shell horn reminds you of such an item which was said to be taken by Trojans after the sack of Atlantis. It can be used to convey its owner to the secret harbour of Poseidon, god of the sea. This harbour is filled with treasures, but it is guarded by a locked gate which can only be opened by the note of a flute or pipe.<br><span class=\"indent\"></span>The thundercloud fan is surely sacred to the storm deity of far-off Cathay. If wielded carefully, it unleashes a hurricane which can be directed as one wishes.<br><span class=\"indent\"></span>You soon place the bronze helmet as having belonged to a Spartan king. No doubt it confers skill at arms upon the wearer, since the Spartans were renowned for their martial prowess.<br><span class=\"indent\"></span>As for the dragon ring... you're not sure. It strikes a distant chord of memory, but nothing you can quite dredge to the surface. Handling it makes you feel distinctly uneasy, however.<br><span data-piece=\"139_0\" class=\"choice\"><a data-goto=\"sect_293a\">Pick which items you'll take.</a></span>\n",
  "sect_140": "\n'Much menace,' she replies in answer to your query. 'Furious storms could yet swamp your boat; icy rain will chill you; hunger will gnaw at your insides and thirst will wither your tongues-'<br><span class=\"indent\"></span>'Is that all?' says Oakley.<br><span class=\"indent\"></span>She looks hard at him. 'A cursed ship plies these waters. If you have nerves of iron and fear no fright under all of heaven, you might travel aboard her and safely be brought in sight of land.'<br><span class=\"indent\"></span>'A cuh-cursed ship...' stammers Blutz. 'What's the cuh catch?'<br><span class=\"indent\"></span>'You'd pay a high price for your passage,' replies the mermaid. 'A sinister sacrifice is called for when you wish to disembark. But nothing,' she stares at the hand grasping her long tresses, 'nothing you can't afford to part with.'<br><span class=\"indent\"></span>Nervousness makes Blutz relax his grip. With a haughty twist, the mermaid pulls away from him. <br><span data-piece=\"140_0\" class=\"choice\"><a data-goto=\"sect_178\">Continue.</a></span>\n",
  "sect_141": "\nYou return to the captain's cabin, where you find Mandrigard snoring, sprawled across a table full of gold coins. Oakley stands looking down at him with hands on hips, his expression an odd mixture of pity and loathing. 'One way to lift the curse,' he says at last, 'might be to put an end to the wretch.'<br><span class=\"indent\"></span>'Murder him?' gasps Blutz. 'I don't hold with killing a man who's not standing on his hind legs. Anyway, you're only saying that so you can take his treasure.'<br><span class=\"indent\"></span>'He's dead drunk,' points out Grimes. 'We could take the treasure from under his nose without provoking so much as a murmur. He'd never miss a few choice bits, and what good is treasure to him if he can never spend it?'<br><span class=\"indent\"></span>As usual the others look to you for authority. You can give the go-ahead for theft or worse deeds - or you can prevent them.<br><span data-piece=\"141_0\" class=\"choice\"><a data-goto=\"sect_179\">Murder Mandrigard while he sleeps.</a></span><span data-piece=\"141_1\" class=\"choice\"><a data-goto=\"sect_198\">Steal a few items of treasure.</a></span><span data-piece=\"141_2\" class=\"choice\"><a data-goto=\"sect_217\">Go back up on deck.</a></span>\n",
  "sect_142": "\nHuge eye-stalks rise from the water, swivelling to bring you under the scrutiny of the crab's ghastly black gaze. Its claw swings down at you like a yacht's boom, and it rears and twists in a furious effort to snatch you off its back. Realising that you will be torn in half instantly if you fall prey to the claws, you throw yourself flat and cling to the crab's shell for dear life. There is a great lurch, then sea water washes in to engulf you. The crab is diving into the depths - and taking you along with it.<br><span data-piece=\"142_0\" class=\"choice\"><a data-goto=\"sect_180\">Swim to safety.</a></span><span data-piece=\"142_1\" class=\"choice\"><a data-goto=\"sect_199\">Recite a charm against drowning.</a></span><span data-piece=\"142_2\" class=\"choice\"><a data-goto=\"sect_142a\">Continue.</a></span>\n",
  "sect_142a": "\nThere is nothing you can do to save yourself, and your adventure ends right here.<br><div class=\"s3\">THE END</div>\n",
  "sect_143": "\nRising to your feet, you perform as elegant an imitation of a courtly bow as your uncouth background and the cramped conditions will allow. 'Of course, we had nearly forgotten our manners. Long privation can do that to the best of us.'<br><span class=\"indent\"></span>'Yes, yes!' says Mortice eagerly, gripping the side of your boat.<br><span class=\"indent\"></span>Oakley's brow furrows into a frown and he looks on the point of saying something, but not before you have completed your mock ritual with the words: 'Mister Mortice, you have my permission to come aboard our little vessel.'<br><span class=\"indent\"></span>Instantly there is a flutter of tattered rags and a soft thud as he lands beside you in the jollyboat. You are taken aback. He moved so fast. With a wide toothy smile, he says, 'You lot get some rest. I'll keep watch a while.'<br><span data-piece=\"143_0\" class=\"choice\"><a data-goto=\"sect_181\">Say a prayer and go to sleep.</a></span><span data-piece=\"143_1\" class=\"choice\"><a data-goto=\"sect_181\">Recite a warding charm and go to sleep.</a></span><span data-piece=\"143_2\" class=\"choice\"><a data-goto=\"sect_200\">Go to sleep.</a></span>\n",
  "sect_144": "\nYou hide out deep in the hinterland of the island, surviving off berries and fruit. Eventually you deem it safe to make your way back to the native village. Peering out from the sheltering foliage, you find that the <em>Belle Dame</em> has sailed off. The coast is clear.<br><span class=\"indent\"></span>'That fiend!' rages Oakley. 'No doubt he's off to wreak more wickedness in the world. Are we really going to sit here sucking coconuts while he goes unpunished?'<br><span class=\"indent\"></span>You all agree it is high time you pressed on with your journey. The natives are now too scared to repeat the offer of an escort; you're on your own.<br><span data-piece=\"144_0\" class=\"choice\"><a data-goto=\"sect_177\">Continue.</a></span>\n",
  "sect_145": "\nExperienced sailors like the four of you have no trouble working your passage to Port Selenice. You sign on aboard a caravel and for the next week or so your days are filled with the familiar routine of life at sea.<br><span class=\"indent\"></span>'Look at the sunset!' calls Blutz across the deck one evening. He points to where long clouds lie like mauve paint smears across a palette of gloriously mingled gold, scarlet, violet and grey. 'This is the life, eh, shipmates?'<br><span class=\"indent\"></span>Grimes looks up from trimming the topsails. 'I'll take no pleasure from any such sight,' he says grimly, 'until I know that Skarvench no longer lives under the same sky as we.'<br><span class=\"indent\"></span>Eventually you reach port, and the captain of the caravel pays you off with five doubloons. Taking up your packs, you stride down the gangplank and along the bustling quay.<br><span data-piece=\"145_0\" class=\"choice\"><a data-goto=\"sect_165\">Continue.</a></span>\n",
  "sect_146": "\nThe innkeeper of The Hanged Man is a sour-faced man named Drood. You can see him at the bar polishing tankards with a filthy piece of rag. As you step up, he sets aside the tankard he's holding and gives you a long loury glare. 'Heard you were dead,' he says. 'Seems the news hasn't reached you yet.'<br><span class=\"indent\"></span>You ignore this. 'Skarvench been in?' you ask.<br><span class=\"indent\"></span>'Not lately. Things are too hot for him in Leshand.' Drood spits on the bar and starts wiping it.<br><span class=\"indent\"></span>A beefy hand clamps on your shoulder and turns you around. Facing you are six burly ruffians. You vaguely recognise them as Skarvench's 'business associates' - men who act as his spies and assassins on shore.<br><span class=\"indent\"></span>Their leader regards you with eyes like tiny beads of dull glass. 'Cap'n Skarvench is in Port Selenice takin' delivery of a new ship,' he says. 'Why're you askin'?'<br><span class=\"indent\"></span>'We're planning to meet him.'<br><span class=\"indent\"></span>You start to move past the ruffians, then freeze as they draw knives. 'Tell you what,' says the leader, 'you go straight to hell, and no doubt the cap'n will join you there when he's good and ready...'<br><span class=\"indent\"></span>It's life or death.<br><span data-piece=\"146_0\" class=\"choice\"><a data-goto=\"sect_13\">Fight.</a></span><span data-piece=\"146_1\" class=\"choice\"><a data-goto=\"sect_51\">Fall back on your cunning.</a></span><span data-piece=\"146_2\" class=\"choice\"><a data-goto=\"sect_32\">Rely on your agility.</a></span>\n",
  "sect_147": "\nStepping up to the bar, you act as if you'd only just spotted the three ruffians. 'Toby Whipstaff!' you say to the largest of them. 'Why, I haven't clapped eyes on you in a month o' Sundays! How blows the wind, Toby?'<br><span class=\"indent\"></span>He greets you with a broad smile, forgetting his sport with the scholar. 'All's well. Last week we took a Sidonian galleon loaded with gold plate; pickings have rarely been richer.'<br><span class=\"indent\"></span>You nod. 'And not just Sidonian pickings, I suppose, otherwise the governor wouldn't have set a price of a hundred doubloons on your head.'<br><span class=\"indent\"></span>He fingers his neck nervously. 'Ah, that must be the little business involving the Gloriannic merchantman a while back. I didn't expect them to make so much of it.'<br><span class=\"indent\"></span>'You're too modest! Five sailors were killed, including the governor's godson.'<br><span class=\"indent\"></span>Whipstaff visibly pales. 'A hundred doubloons, eh? That much.'<br><span class=\"indent\"></span>'Your brother's been posted for twice that. No doubt it was his expertise with the flensing-knife that attracted undue attention.'<br><span class=\"indent\"></span>'My brother? But he's sailing for Leshand this very day. I must get to the docks!' Tossing the spectacles on the bar, he races out with his two cronies close behind.<br><span data-piece=\"147_0\" class=\"choice\"><a data-goto=\"sect_223\">Continue.</a></span>\n",
  "sect_148": "\nHe gives you a single large emerald - one of his tears of mirth at your great gall. The dolphin and the shark convey you back, chatting to one another on the way. You cannot hear everything they are saying because of the splashing of the waves, but you gather they had their own ideas as to how you'd fare at Neptune's gate. 'One of them's the spitting image of that Ulysses,' you overhear the dolphin say. The shark snorts and replies, 'I'm more interested in the fat one . I like the look of him. I might hang around the shore tomorrow and see if he goes swimming.'<br><span class=\"indent\"></span>At last you arrive at the beach near Selenice. Your adventure has taken the whole night. As the sun rises, the coracle sinks under the waves. Blutz gives a shudder and, seeing this, you remark, 'Don't worry, Mister Blutz, you'll be all right so long as you don't go for a swim.'<br><span class=\"indent\"></span>'Er, it's not that,' he protests. 'I was just, er, a bit chilly. Come on, mates, let's go to the shipyard and spend our emerald!'<br><span data-piece=\"148_0\" class=\"choice\"><a data-goto=\"sect_337\">Continue.</a></span>\n",
  "sect_149": "\nHe examines the letter, then hands it back. 'All's in order,' he says. His manner is far from friendly, but at least the expression of icy menace is gone from his eyes. He orders the marines to lower their weapons. You cannot help noticing that the marine sergeant keeps his pistol cocked, however. 'I will take delivery of Her Majesty's share of your plunder,' says the captain curtly. 'This will save you the trouble of sailing to Leshand to hand it over.'<br><span class=\"indent\"></span>You show him to the hold, where he makes an inventory of your treasure and then divides a sizeable pile from it - nearly a quarter of all your spoils. 'You're levying a harsh tax,' you say, pointing at the pile.<br><span class=\"indent\"></span>For the first time his face shows a smile. It is like a crack appearing on thin ice. 'You're mistaken. That pile is what you get to keep. We're taking all the rest.'<br><span class=\"indent\"></span>You barely choke back a gasp. He means to take three-quarters of your treasure! You will barely have enough left to buy a decent ship.<br><span data-piece=\"149_0\" class=\"choice\"><a data-goto=\"sect_168\">Try to trick him.</a></span><span data-piece=\"149_1\" class=\"choice\"><a data-goto=\"sect_187\">Allow him to take the Queen's share.</a></span><span data-piece=\"149_2\" class=\"choice\"><a data-goto=\"sect_206\">Fight to keep what you've earned.</a></span>\n",
  "sect_150": "\nYou do not relish such grisly work, but there is no time for hesitation. Kneeling in the bottom of the pit, you raise the sharp stake and drive it deep into the corpse's chest. Instantly the mouth gapes open and there issues forth such a howl of cold hatred that it will haunt your dreams forevermore. The eyes blaze for an instant in their sockets, then darken in true death as a fountain of dry brown blood wells up around the wound.<br><span class=\"indent\"></span>You lurch to your feet, glad to feel your friends' hands at your shoulders. Gradually, under your horrified eyes, the corpses collapse and shrivel away to dust.<br><span class=\"indent\"></span>'Collect the treasure, shipmates,' you say in a hoarse voice. 'And look sharp - I'm keen to quit this place.'<br><span class=\"indent\"></span>The moon has risen by the time all the loot is safely stowed aboard the <em>Lady of Shalott</em>. Only then, with shaking hand, do you broach a bottle of rum. Each man gulps his tot eagerly, anxious to rid himself of his memories of this ghastly evening. <br><span data-piece=\"150_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_151": "\nClutching the talisman, you appeal to whatever ancient god or demon it depicts to use its power now. For a long instant nothing happens, and you fear that the talisman's magic has worn off with age, but then you see a black shadow spreading across the face of the moon. It has the outline of a bat's wing.<br><span class=\"indent\"></span>'The bat was the symbol of night in ancient times,' says Grimes, his voice hushed in awe as the last moonlight vanishes like a shuttered lantern-beam and the world is plunged into starlit darkness.<br><span data-piece=\"151_0\" class=\"choice\"><a data-goto=\"sect_246\">Continue.</a></span>\n",
  "sect_152": "\n\n",
  "sect_152a": "\nThe basilisk cannon roars, hurling fire and hot iron towards you. You throw yourself to one side, but the blast still catches you. You cry out in terrible agony but manage to stagger on towards your foe.<br><span class=\"indent\"></span>'You take a lot o' killing, I'll say that for ye,' hisses Skarvench as he draws his sword. 'But now your luck's run out.'<br><span data-piece=\"152a_0\" class=\"choice\"><a data-goto=\"sect_171\">Continue.</a></span>\n",
  "sect_152b": "\nThe basilisk roars, hurling fire and hot iron. You move too slowly, and the cannon ball slices you in two.<br><div class=\"s3\">THE END</div>\n",
  "sect_153": "\nReaching up, you take a firm grip on the bulkhead beam running across the ceiling of the passage. Then you swing yourself up until you are braced across the beam. A moment later you see the sailmaster's distinctive bald head appear below where you're hiding, but he does not look up. As he vanishes into his cabin, you drop silently to the floor and hurry up the companion-way to join your comrades.<br><span data-piece=\"153_0\" class=\"choice\"><a data-goto=\"sect_172\">Continue.</a></span>\n",
  "sect_154": "\nYou row in towards the island, beaching your vessel on the deserted shore. Oakley gives a cry of delight as he spots a pineapple that has fallen from a tree at the top of the beach. Its juice stings his sun-cracked lips, but he chews ravenously at it all the same.<br><span class=\"indent\"></span>'Heads up,' Grimes says tersely. 'We got company, shipmates.'<br><span class=\"indent\"></span>You turn your head. A large group of Carab natives have emerged from the woods and are coming across the sand towards you. 'Welcoming party,' you mutter under your breath, noticing the spears.<br><span data-piece=\"154_0\" class=\"choice\"><a data-goto=\"sect_253\">Why are they looking at you like that?</a></span><span data-piece=\"154_1\" class=\"choice\"><a data-goto=\"sect_196\">Open fire.</a></span><span data-piece=\"154_2\" class=\"choice\"><a data-goto=\"sect_215\">Get ready to fight them.</a></span><span data-piece=\"154_3\" class=\"choice\"><a data-goto=\"sect_272\">Parley.</a></span><span data-piece=\"154_4\" class=\"choice\"><a data-goto=\"sect_177\">Put to sea before they reach you.</a></span>\n",
  "sect_155": "\nYour limbs ache with the strain of rowing, like men who have been stretched on a rack. Slumping over the oars, you gaze feebly out across the merciless distance that still separates you from civilization. The water laps temptingly against the sides of your boat, but you know that it holds out a false promise: brine cannot slake a poor mariner's thirst, it can only drive him mad.<br><span data-piece=\"155_0\" class=\"choice\"><a data-goto=\"sect_155a\">Can you keep going?</a></span>\n",
  "sect_155a": "\n\n",
  "sect_156": "\nThe most westerly of the islands comes in sight. It is a large golden-shored jungle island with many welcoming coves. 'Others have put in here, when blown north off the main shipping route,' Grimes recalls. 'The natives are said to be hospitable.'<br><span class=\"indent\"></span>You stare into the west. Leshand is still two hundred leagues off, and it might be wise to reprovision before you undertake that long haul. And yet worry gnaws at your mind: 'Hospitable when faced with gifts and muskets and a sea-going vessel of ten cannon, perhaps. But how will they greet a handful of starving wretches in a ramshackle craft?'<br><span class=\"indent\"></span>It's up to you.<br><span data-piece=\"156_0\" class=\"choice\"><a data-goto=\"sect_154\">Put in at the island.</a></span><span data-piece=\"156_1\" class=\"choice\"><a data-goto=\"sect_177\">Sail on towards Port Leshand.</a></span>\n",
  "sect_157": "\nNow you guess the truth. As daughter of the earth goddess, Ejada received unending strength and vitality as long as she remained in contact with the ground. Now she is like an uprooted flower wilting in the hot sunlight. 'Restore me to the earth,' she begs, 'and all my treasures are yours.'<br><span class=\"indent\"></span>'They are anyway.' You've learned never to trust a sorceress. Wedging her on a high cornice of the building, well clear of the soil that would regenerate her power, you go inside to explore. You soon find a hoard of magical treasures comprising a magic wand, a healing potion, a ship in a bottle, and a black kite. The potion can be drunk at any time to restore your Life Points score to normal. The other items may or may not come in handy later.<br><span class=\"indent\"></span>Returning to the beach, you quit Grimoire Island without further delay. <br><span data-piece=\"157_0\" class=\"choice\"><a data-goto=\"sect_137\">Continue.</a></span>\n",
  "sect_158": "\nCoconuts are often found drifting at sea. That is how coconut trees establish themselves on new islands, after all. They can float at sea for months and remain perfectly fresh, so there is no reason why this one should not be edible. You finally manage to convince Blutz that it has not bobbed up from the kingdom of the dead or any such nonsense, and he happily joins the rest of you in your meal.<br><span data-piece=\"158_0\" class=\"choice\"><a data-goto=\"sect_389\">Continue.</a></span>\n",
