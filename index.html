  "sect_159": "\nThe mermaid splashes grey spume with her tail, writhing angrily in Blutz's grip and spitting like a snake. But she answers you none the less: 'Set your prow south if food and comfort are your aim, for the islands there are more hospitable to land-dwellers than these storm-churned seas. Your present course westward will take you to a baleful rendezvous, and one you are unlikely to get away from in one piece.'<br><span class=\"indent\"></span>'I don't like the sound of that,' says Blutz. 'But tell us more about the isles to the south. Aren't there any dangers there?'<br><span class=\"indent\"></span>'There is the witch Ejada,' replies the mermaid. 'She seeks souls for her god, and such is her power that none can strike her down while her feet remain planted on solid earth.'<br><span class=\"indent\"></span>Suddenly flinging a handful of brine into Blutz's face, she pulls free of his grip, leaving only two or three coral-coloured hairs twined between his stubby fingers. <br><span data-piece=\"159_0\" class=\"choice\"><a data-goto=\"sect_178\">Continue.</a></span>\n",
  "sect_160": "\nSettling into your jollyboat, you are not sorry to see the gloomy hulk of the <em>Larnassos</em> fade off into the darkness and drizzle. As for Captain Mandrigard - will he ever find rest or an end to his curse? You wonder.<br><span class=\"indent\"></span>'Should have had more sense than to offend a high priest, shouldn't he,' says Oakley. 'Save your pity for ourselves, mate. We're not through this yet.'<br><span data-piece=\"160_0\" class=\"choice\"><a data-goto=\"sect_135\">Steer south towards the Smoking Islands.</a></span><span data-piece=\"160_1\" class=\"choice\"><a data-goto=\"sect_386\">Stay on your present course.</a></span><span data-piece=\"160_2\" class=\"choice\"><a data-goto=\"sect_349\">Stay on your present course.</a></span>\n",
  "sect_161": "\nGazing back, you see the hump of the great crab's shell as it rears up, threshing at the water with its claws in a frenzied search for the human prey that so narrowly escaped its clutches.<br><span class=\"indent\"></span>'I expect it's rather short-sighted,' Blutz says. 'Obviously it wouldn't need sharp vision, seeing as how fish are so plentiful in these waters.'<br><span class=\"indent\"></span>'Yes, but keep your voice down,' hisses Oakley. 'No reason to suppose that it's deaf as well.'<br><span class=\"indent\"></span>Leaving the crab far in your wake, you plot your course.<br><span data-piece=\"161_0\" class=\"choice\"><a data-goto=\"sect_47\">Steer westwards.</a></span><span data-piece=\"161_1\" class=\"choice\"><a data-goto=\"sect_66\">Go north towards the Smoking Islands.</a></span>\n",
  "sect_162": "\nMortice becomes livid with rage, hissing out a torrent of curses to freeze the blood. At last, when his anger runs out of words, he lapses into silence and merely glares at you with incandescent yellow eyes.<br><span class=\"indent\"></span>'Perhaps we should board his vessel, if it comes to that,' suggests Grimes.<br><span class=\"indent\"></span>Oakley agrees. 'There could well be treasure in that long box there,' he says. His eyes are locked on Mortice.<br><span class=\"indent\"></span>All of you stand tense, alert. Mortice couches on his raft like a wild beast at bay. As he sees Oakley place his foot on the side of the jollyboat, ready to spring over to the raft, he gives a guttural snarl and says, 'Try it. I'll rip yer gizzard out through yer backside and feed it to the fishes.'<br><span class=\"indent\"></span>'Emphatically unwelcoming,' you remark. 'If we persist in trying to board the raft I think we'll have a fight on our hands.'<br><span class=\"indent\"></span>'A fight?' says Oakley, looking back at you. 'He's just one old lubber.' But all the same he stays poised there, waiting for you to say the word.<br><span data-piece=\"162_0\" class=\"choice\"><a data-goto=\"sect_219\">Attack Mortice.</a></span><span data-piece=\"162_1\" class=\"choice\"><a data-goto=\"sect_219\">Attack Mortice bare-handed.</a></span><span data-piece=\"162_2\" class=\"choice\"><a data-goto=\"sect_238\">Draw your sword.</a></span><span data-piece=\"162_3\" class=\"choice\"><a data-goto=\"sect_257\">Draw your pistol.</a></span><span data-piece=\"162_4\" class=\"choice\"><a data-goto=\"sect_276\">Cut the raft adrift.</a></span>\n",
  "sect_163": "\n'Let's face it,' says Oakley a few days later, 'we don't know the first thing about foraging. We'll starve if we stay here.'<br><span class=\"indent\"></span>You have to admit he is right. Unable to trap birds or animals, you are forced back on a meagre diet of nuts. You cannot even be sure which are safe to eat, and stomach pains and retching gradually sap your resolve.<br><span data-piece=\"163_0\" class=\"choice\"><a data-goto=\"sect_163a\">Can you keep going?</a></span>\n",
  "sect_163a": "\n\n",
  "sect_163b": "\n'It's hopeless,' says Grimes. 'We'd be better off going out to face Skarvench. At least we might get a quick clean death.'<br><span class=\"indent\"></span>Knowing Skarvench, you doubt that. But it is better to boldly confront your foe than starve to death like miserable dogs. You lead the others back to the shore.<br><span data-piece=\"163b_0\" class=\"choice\"><a data-goto=\"sect_87\">Continue.</a></span>\n",
  "sect_164": "\nHaunting moonlit street corners and smoky low-raftered taverns, you gradually piece together a tale of real terror. It seems El Draque was a Carpathian mercenary who arrived in the New World ten years ago and at once embarked on a spree of unrestrained piracy. Instantly recognizable by his filed teeth and acid blue eyes, he inspired such fear that most ships surrendered as soon as he raised his flag. The general consensus among everyone you speak to is that he slept by day in a box in the cargo hold of his ship, that he drank the blood of those he murdered, and that he was impervious to mortal injury.<br><span class=\"indent\"></span>There is one more thing. A month ago, taken unawares by a Gloriannic frigate, El Draque was caught and hanged at sea. His body was then flung overboard. The authorities were satisfied - at least enough to pay out the bounty on his head to the frigate captain who caught him. But then, a week or so later, that same frigate captain was found dead in a harbour-front inn. His throat had been sliced from ear to ear, but the weird thing was that there was hardly a drop of blood.<br><span class=\"indent\"></span>You've heard enough to guess that the career of the notorious El Draque has not yet ended. <br><span data-piece=\"164_0\" class=\"choice\"><a data-goto=\"sect_278\">Find out what Skarvench has been up to.</a></span><span data-piece=\"164_1\" class=\"choice\"><a data-goto=\"sect_202\">Find out about the impending royal visit.</a></span><span data-piece=\"164_2\" class=\"choice\"><a data-goto=\"sect_69\">Call at Master Capstick's house.</a></span><span data-piece=\"164_3\" class=\"choice\"><a data-goto=\"sect_12\">Visit a chandler's to buy supplies.</a></span><span data-piece=\"164_4\" class=\"choice\"><a data-goto=\"sect_31\">Get some of your items identified.</a></span><span data-piece=\"164_5\" class=\"choice\"><a data-goto=\"sect_50\">Apply for a letter of marque.</a></span><span data-piece=\"164_6\" class=\"choice\"><a data-goto=\"sect_409\">Apply for a letter of marque.</a></span><span data-piece=\"164_7\" class=\"choice\"><a data-goto=\"sect_107\">Nothing more to do in Leshand.</a></span>\n",
  "sect_165": "\nOf all the ports in the Carab Sea, only in Selenice - 'the Pirates' Haven' - would it be safe for a bloodthirsty cut-throat like Skarvench to show his face and openly spend his ill-gotten gold. Selenice has no allegiance to any nation. It is ruled by the common consent of the buccaneers who live here - the Brethren of the Coast, as they term themselves - and it is buccaneers and their families who are the town's only citizens.<br><span class=\"indent\"></span>Curiously, life here is not the lawless mayhem that outsiders imagine. The buccaneers of Selenice arrive here glutted with more than their share of violence and hardship. They want nothing more than to peacefully squander their loot on ale, women and dice. One rule that is stringently enforced above all others is an absolute ban on the use of weapons. Normal brawls can and do occur, for buccaneers are hard men filled with pride, and tempers can flare up easily when the rum flows freely. But any brawl is settled barehanded, since to draw a weapon in Selenice is to invite summary justice from the Brethren of the Coast. However you may have fared elsewhere under the laws of civilized kingdoms, you'd do well not to fall afoul of the Brethren.<br><span class=\"indent\"></span>Passing a pedlar in the street outside the Thorny Knot tavern, Oakley glances across at you. 'Maybe we should do a spot of shopping, skipper?'<br><span class=\"indent\"></span>'I'd rather do a spot of drinking,' says Blutz, casting a longing eye at the tavern.<br><span data-piece=\"165_0\" class=\"choice\"><a data-goto=\"sect_336\">Buy something from the pedlar.</a></span><span data-piece=\"165_1\" class=\"choice\"><a data-goto=\"sect_355\">Go into the tavern.</a></span><span data-piece=\"165_2\" class=\"choice\"><a data-goto=\"sect_374\">Visit the local shipbuilder.</a></span>\n",
  "sect_166": "\nDrawing your sword, you lunge towards the three bullies with a fierce yell. The terrified scholar throws himself flat and crawls under a table. The fight ranges back and forth across the room until suddenly you are seized from behind. Craning your neck, you see a throng of disapproving faces. A tall dour-faced man steps forward, saying, 'To draw a weapon in Selenice contravenes the code of the Brethren of the Coast. Fortunately we were able to stop you before anyone got seriously hurt.'<br><span data-piece=\"166_0\" class=\"choice\"><a data-goto=\"sect_166b\">Hide your pistol.</a></span><span data-piece=\"166_1\" class=\"choice\"><a data-goto=\"sect_166a\">You can't argue with the pirate code.</a></span>\n",
  "sect_166a": "\n\n",
  "sect_166b": "\nYour sword is confiscated. No doubt they'd take your pistol too, but you slip it into the back of your shirt when no one's looking. With a final warning, they bustle you to the door of the inn and send you packing. <br><span data-piece=\"166b_0\" class=\"choice\"><a data-goto=\"sect_374\">Continue.</a></span>\n",
  "sect_166c": "\nThey confiscate your sword and your pistol. As an afterthought, you are fined all the doubloons you are carrying. Then you are bustled out of the inn and sent packing. <br><span data-piece=\"166c_0\" class=\"choice\"><a data-goto=\"sect_374\">Continue.</a></span>\n",
  "sect_166d": "\nThey confiscate your sword and your pistol. 'You'll have to pay a fine, too,' says the representative of the Brethren.<br><span class=\"indent\"></span>'I have no money,' you point out.<br><span class=\"indent\"></span>'Then you are no pirate, but a mere beggar.'<br><span class=\"indent\"></span>You are bustled out of the inn and sent packing. <br><span data-piece=\"166d_0\" class=\"choice\"><a data-goto=\"sect_374\">Continue.</a></span>\n",
  "sect_166e": "\nThey confiscate your sword and any money you may have on you. Then you are bustled out of the inn and sent packing. <br><span data-piece=\"166e_0\" class=\"choice\"><a data-goto=\"sect_374\">Continue.</a></span>\n",
  "sect_167": "\n\n",
  "sect_167a": "\nHe takes a mighty breath and blows it out at you, sending your coracle surging away on a huge billowing wave. You careen through the sea-soaked darkness, shivering for hours in the teeth of an unseasonal gale until finally you are cast up onto the beach outside Selenice. <br><span class=\"indent\"></span>Dawn tinges the sky with rose and gold. You sit up. There is no sign of the coracle. Waves lap the shoreline, seeming to whisper the secrets of the sea. You know those secrets well now; you acquire the Seafaring skill.<br><span class=\"indent\"></span>Returning to town, you run through your remaining options.<br><span data-piece=\"167a_0\" class=\"choice\"><a data-goto=\"sect_261\">Use the ship in a bottle.</a></span><span data-piece=\"167a_1\" class=\"choice\"><a data-goto=\"sect_318\">You still have the deed of ownership.</a></span><span data-piece=\"167a_2\" class=\"choice\"><a data-goto=\"sect_299\">Buy a ship.</a></span><span data-piece=\"167a_3\" class=\"choice\"><a data-goto=\"sect_343a\">What options?</a></span>\n",
  "sect_167b": "\nHe takes a mighty breath and blows it out at you, sending your coracle surging away on a huge billowing wave. You careen through the sea-soaked darkness, shivering for hours in the teeth of an unseasonal gale until finally you are cast up onto the beach outside Selenice. <br><span class=\"indent\"></span>Dawn tinges the sky with rose and gold. You sit up. Waves lap the shoreline. There is no sign of the coracle. Returning to town, you run through your remaining options.<br><span data-piece=\"167b_0\" class=\"choice\"><a data-goto=\"sect_261\">Use the ship in a bottle.</a></span><span data-piece=\"167b_1\" class=\"choice\"><a data-goto=\"sect_318\">You still have the deed of ownership.</a></span><span data-piece=\"167b_2\" class=\"choice\"><a data-goto=\"sect_299\">Buy a ship.</a></span><span data-piece=\"167b_3\" class=\"choice\"><a data-goto=\"sect_343a\">What options?</a></span>\n",
  "sect_168": "\nAfter agreeing to the captain's demands, you direct your crew to carry the bulk of the treasure aboard the warship. At least, that's the way it seems. The truth is that only the top of each chest contains gold coins - the rest is filled with the salt that was left aboard the <em>Lady of Shalott</em> by her last owner. A few groans, pleas, tears and offers of bribery help to make this charade convincing. The warship sails off towards Leshand and you turn your prow towards Selenice, hoping to be long gone before they discover you've tricked them.<br><span data-piece=\"168_0\" class=\"choice\"><a data-goto=\"sect_16\">Continue.</a></span>\n",
  "sect_169": "\nThis is grim work, but you cannot afford the luxury of hesitation. The sunlight is all but gone. Kneeling quickly beside the open coffin, you raise the stake in both hands and plunge it down with all your strength into the corpse's breast. There is a terrible gasping sigh from the dead lips. It reminds you of autumn leaves scattering in a breeze. Then the body crumbles like withered parchment.<br><span class=\"indent\"></span>Blutz cries out. At the same moment, the sun is blotted out beyond the horizon and blue darkness rushes across the shore.<br><span data-piece=\"169_0\" class=\"choice\"><a data-goto=\"sect_347\">Continue.</a></span>\n",
  "sect_170": "\nHanding the kite to a sailor, you tell him to go up into the rigging and cast it towards the sky. 'What good will that do, skipper?' asks Oakley as you watch the man climb.<br><span class=\"indent\"></span>'Call it a hunch, Mister Oakley. That witch Ejada wouldn't treasure anything so mundane as a kite unless it possessed some kind of magical power. Now we'll find out exactly what.'<br><span class=\"indent\"></span>'It's a long shot,' says Blutz, watching the <em>Moon Dog</em> dip lower in the night sky with silver sails gleaming.<br><span class=\"indent\"></span>You watch the sailor reach the top of the mast and throw the kite up into the heavens. Caught by some wind that the sails do not feel, it soars aloft higher and higher, seeming to grow larger as it goes so that it spreads like an inkblot against the moon.<br><span class=\"indent\"></span>'The dragon wing of night o'erspreads the world...' breathes Grimes, his voice barely a whisper. And the last of the moonlight is blotted out, leaving only the gleam of ships' lanterns on the low bank of fog and the spangling of a million stars in the clear blackness above. <br><span data-piece=\"170_0\" class=\"choice\"><a data-goto=\"sect_246\">Continue.</a></span>\n",
  "sect_171": "\n'I don't know how you escaped death before,' snarls Skarvench, 'but this time I'm going to make sure of the matter. I'll cut off your head and stick it on the bowsprit of my ship!'<br><span class=\"indent\"></span>His sword comes slicing down in a lethal arc, barely missing your shoulder as you dodge desperately aside. It splinters a great chunk of wood out of the mast behind you. Skarvench only gives a bellow of insensate fury and draws it back for another swing. He is in a killing rage, and this fight will be every bit as dangerous as you had anticipated.<br><span data-piece=\"171_0\" class=\"choice\"><a data-goto=\"sect_171a\">Fight.</a></span><span data-piece=\"171_1\" class=\"choice\"><a data-goto=\"sect_171c\">Fight.</a></span>\n",
  "sect_171a": "\n\n",
  "sect_171b": "\nEven if you were in full fighting trim, Skarvench would give you the hardest fight of your life. But weak as you are from the many ordeals you have had to face, he soon cuts you down. The sight of that hated, grinning face as he raises his sword for the killing blow is what you will carry to your grave.<br><div class=\"s3\">THE END</div>\n",
  "sect_171c": "\n\n",
  "sect_171d": "\nSkarvench opens his mouth, but the only sound that issues forth is a stifled croak. Teetering from a mortal wound, he falls to the deck and lies still.<br><span class=\"indent\"></span>Seeing the death of their leader, the pirates lose heart for the battle and are soon rounded up. As their muskets are confiscated, Oakley comes over and takes you by the arm. 'You all right, skipper?' he asks with a look of concern. 'You look in a murdering frame of mind.'<br><span class=\"indent\"></span>You remove the Spartan helmet, which now is tarnished like any artefact of bronze with two thousand years of history. 'I'm fine, Mister Oakley. All the ghosts are gone.'<br><span data-piece=\"171d_0\" class=\"choice\"><a data-goto=\"sect_427\">Continue.</a></span>\n",
  "sect_172": "\nThe others are waiting for you on deck. In the slanting rays of the setting moon you make out the furtive silhouettes of Grimes, tall and gaunt; Oakley, strong as a tar barrel; and fat little Blutz.<br><span class=\"indent\"></span>They have the jollyboat swung out over the side. Stealthily you lower it into the water, working in deep silence like four burglars intent on a night's business. From below wafts the sound of a hornpipe and snatches of revelry as the crew sing sea shanties in the galley. Climbing down to the jollyboat, you shove off from the side and row with muffled oars away from the brooding bulk of the <em>Belle Dame</em>. The moon slips below the western horizon, leaving the night studded with stars. There is no wind and the sea is as flat as a pane of glass. As the sounds of jollity fade into the distance, only the soft splash of your oars remains to disturb the eerie quiet.<br><span data-piece=\"172_0\" class=\"choice\"><a data-goto=\"sect_381\">Continue.</a></span><span data-piece=\"172_1\" class=\"choice\"><a data-goto=\"sect_399\">Continue.</a></span><span data-piece=\"172_2\" class=\"choice\"><a data-goto=\"sect_416\">Continue.</a></span><span data-piece=\"172_3\" class=\"choice\"><a data-goto=\"sect_289\">Continue.</a></span>\n",
  "sect_173": "\nYou beach the jollyboat on a narrow strand of fine white sand backed by high cliffs. At the top of the cliffs you can clearly see the tall green boles of coconut trees. 'We're saved!' cries Blutz, dancing an absurd little jig. 'We can eat those coconuts and even drink the milk if we can't find fresh water.'<br><span class=\"indent\"></span>'But there's a problem,' says Grimes, surveying the steep cliffs with a dour gaze. 'Who's going to climb up there and get them? You, Mister Blutz?'<br><span data-piece=\"173_0\" class=\"choice\"><a data-goto=\"sect_192\">Scale the cliff on your own.</a></span><span data-piece=\"173_1\" class=\"choice\"><a data-goto=\"sect_211\">Search along the beach for another way up.</a></span><span data-piece=\"173_2\" class=\"choice\"><a data-goto=\"sect_230\">Look for food here on the beach.</a></span><span data-piece=\"173_3\" class=\"choice\"><a data-goto=\"sect_116\">Sail on towards the next island.</a></span>\n",
  "sect_174": "\nPutting in to a small cove, you moor the boat beside a large rock and then scramble ashore up a rocky moss-coated slope. Immediately you are confronted by lush jungle teeming with colour and life. Bright bulbous fruits dangle enticingly from the tree branches, yours for the taking. High up amid the emerald foliage, parrots in stained-glass hues peer down at you curiously, heads cocked to one side giving them a comical expression.<br><span class=\"indent\"></span>You and your friends have no difficulty in gathering food and fresh water, sufficient to make two meals' worth of provisions.<br><span data-piece=\"174_0\" class=\"choice\"><a data-goto=\"sect_250\">Continue.</a></span><span data-piece=\"174_1\" class=\"choice\"><a data-goto=\"sect_269\">Continue.</a></span>\n",
  "sect_175": "\n\n",
  "sect_175a": "\nYour head swims; your limbs tremble with weakness. Looking into Oakley's face, you give a croak of bleak amusement. 'Saints alive, man, you look as though you'd been keelhauled!'<br><span class=\"indent\"></span>He manages a wry half-smile. 'You think you don't?' Slumping blearily beside you, he adds, 'We're not long for this world now, are we, mate?'<br><span class=\"indent\"></span>You gaze into the west, almost all hope gone.<br><span data-piece=\"175a_0\" class=\"choice\"><a data-goto=\"sect_156\">Refuse to give up.</a></span>\n",
  "sect_175b": "\nYour head is swimming. Your limbs tremble with weakness. Looking into Oakley's face, you give a croak of bleak laughter. 'Saints alive, man, you look as though you'd been keelhauled!'<br><span class=\"indent\"></span>He manages a wry half-smile. 'You think you don't?' Slumping beside you, he adds, 'We're not long for this world now, are we, mate?'<br><span class=\"indent\"></span>You gaze across the endless leagues of sea and you know he is right. All hope is gone. <br><div class=\"s3\">THE END</div>\n",
  "sect_176": "\nResorting to an old trick of your trade, you toss a few pebbles to distract Ejada. She thinks she has heard you creeping away, and gives a wild laugh as she hurls her deathly bolts in the direction of the sound. Meanwhile you sneak into her tower and hastily feel your way along the wall until you come to a treasure chest. From this you pull a large diamond and a black kite. <br><span class=\"indent\"></span>Ejada is still striding about outside casting her spells into the undergrowth. 'Show yourself, coward!' she screeches. 'This darkness won't last for ever.'<br><span class=\"indent\"></span>Indeed it won't. Before the spell can wear off, you take your friends' arms and lead them back to the beach. <br><span data-piece=\"176_0\" class=\"choice\"><a data-goto=\"sect_195\">Continue.</a></span>\n",
  "sect_177": "\nTaking stock of your situation leaves you in a grim mood. 'We're still more than two hundred leagues out from Port Leshand, and there are no islands along the route for us to restock our supplies. What we've got left now is going to have to keep us going for at least ten days.'<br><span class=\"indent\"></span>Oakley has another thought, equally sobering. Pointing at the timbers of your vessel - now warped by the constant sun and the battering of high waves - he mutters: 'Ten days? We might not stay afloat that long.'<br><span class=\"indent\"></span>'Maybe we shouldn't try to make it all the way to Leshand,' suggests Blutz. 'We could head south from here towards the main shipping lanes. There's a good chance we'd be rescued by a friendly vessel.'<br><span data-piece=\"177_0\" class=\"choice\"><a data-goto=\"sect_367\">Strike out to the south.</a></span><span data-piece=\"177_1\" class=\"choice\"><a data-goto=\"sect_404\">Keep heading west.</a></span><span data-piece=\"177_2\" class=\"choice\"><a data-goto=\"sect_386\">Keep heading west.</a></span>\n",
  "sect_178": "\nThe flash of a coral-pink tail against the white-foamed grey of the sea, and then she is gone.<br><span class=\"indent\"></span>Thunder rattles the buttresses of heaven, and the sky gleams with distant lightning. Grimes squints into the west. 'Another storm rolling in ahead,' he says. 'We're in for a battering.'<br><span class=\"indent\"></span>'Let's head south!' cries Blutz in sudden desperation. 'There are fewer storms, and we could pick up supplies among the islands, some of which are inhabited.'<br><span class=\"indent\"></span>'Yes,' grunts Oakley. 'By cannibals.'<br><span data-piece=\"178_0\" class=\"choice\"><a data-goto=\"sect_135\">Give the order to steer south.</a></span><span data-piece=\"178_1\" class=\"choice\"><a data-goto=\"sect_235\">Stay on your present westward course.</a></span>\n",
  "sect_179": "\nIt takes no special skill to murder a man while he sleeps, just a callous disregard for life. As Mandrigard's bright red blood drips down onto the floorboards and scattered jewels, you and your three companions stare at one another in the flickering lamplight. You all know the significance of your dreadful deed. Before you were merry rogues - swashbucklers with one eye for plunder and one eye for thrills. Now you are rank villains.<br><span class=\"indent\"></span>Cramming your pockets with gold and gems worth a king's ransom, you hurry away from the scene of the murder, up onto the deck where you at last feel a shudder of remorse.<br><span class=\"indent\"></span>Oakley recognizes the look on your face; he wears the same expression himself. Nodding, he cries, 'If this fresh breeze could only clean my lungs of the stench of butchery - and this rain wash my hands of Mandrigard's blood!'<br><span class=\"indent\"></span>'Forget it,' grunts Grimes. 'The deed's done. We can never go back to being as we were before.'<br><span data-piece=\"179_0\" class=\"choice\"><a data-goto=\"sect_236\">Escape from the ship using magic.</a></span><span data-piece=\"179_1\" class=\"choice\"><a data-goto=\"sect_255\">Try using an item to break the curse.</a></span><span data-piece=\"179_2\" class=\"choice\"><a data-goto=\"sect_388\">Now you need to get off the ship.</a></span>\n",
  "sect_180": "\nThe giant crab drops down into the murk of the ocean, sinking as rapidly as a rock, and you are being carried along with it in the strong undertow. Luckily you were able to get a good lungful of air before you went under, and now you make full use of your remaining strength to strike powerfully up towards the glimmering pane of light that marks the surface.<br><span class=\"indent\"></span>The water drags at you like liquid lead. Your pulse thunders in your ears and your chest is burning with the need for air, but you struggle on with desperate strokes, clawing your way upwards until at last you break the surface.<br><span class=\"indent\"></span>Gasping for air, you are barely aware of your friends hauling you into the jollyboat. 'Come on, lads!' you hear Oakley's voice yelling. 'Let's get clear before it resurfaces.' <br><span data-piece=\"180_0\" class=\"choice\"><a data-goto=\"sect_161\">Continue.</a></span>\n",
  "sect_181": "\nYou sleep soundly, waking at dawn to discover that Mortice and his raft have vanished. 'Good riddance to him, too,' growls Oakley when you shake him awake with the news.<br><span class=\"indent\"></span>'He was a rather creepy character,' Grimes concedes.<br><span class=\"indent\"></span>'Yes, but what about the food and water he had?' Blutz reminds them. 'Now we're just as badly off as we were before.' <br><span data-piece=\"181_0\" class=\"choice\"><a data-goto=\"sect_332\">Continue.</a></span>\n",
  "sect_182": "\nSkarvench and his men are not the sort to be taken unawares. With savagery shining from their eager faces, they close to surround you. The clash of steel and the sharp crack of musket shots ring out, startling the constant jungle murmur into silence. Gunpowder smoke and the abattoir stink of blood clog your nostrils. You are heavily outnumbered, and the struggle grows ever more desperate.<br><span data-piece=\"182_0\" class=\"choice\"><a data-goto=\"sect_182a\">Fight.</a></span>\n",
  "sect_182a": "\n\n",
  "sect_182b": "\nIt's hopeless. This is not a battle you can win.<br><span data-piece=\"182b_0\" class=\"choice\"><a data-goto=\"sect_220\">Fight on regardless.</a></span><span data-piece=\"182b_1\" class=\"choice\"><a data-goto=\"sect_201\">Surrender.</a></span>\n",
  "sect_182c": "\nCourage and grit are not enough. There are too many of them. You and your comrades sell your lives dearly, but in an ultimately futile massacre.<br><div class=\"s3\">THE END</div>\n",
  "sect_183": "\n'El Draque?' whispers an old sea salt whom you get talking to. 'Have ye not heard? He was captured and hanged at sea barely a month ago. By one account, his body was thrown overboard, but then swam three times around the ship before it sank.'<br><span class=\"indent\"></span>Grimes peers into the sailor's tankard. 'What are you drinking, mate?'<br><span class=\"indent\"></span>'Why, are you buying a round?' says the fellow briskly.<br><span class=\"indent\"></span>'No,' Grimes replies. 'I was just going to advise you to drink a bit less of it.' As you leave the tavern, he says, 'Enough of these taproom tales. It's time we shipped out after Skarvench.' <br><span data-piece=\"183_0\" class=\"choice\"><a data-goto=\"sect_392\">Continue.</a></span>\n",
  "sect_184": "\n<div class=\"s4\">CHOOSE YOUR SKILLS</div><br>Skills currently chosen (maximum of four):<br><span data-piece=\"184_0\">NONE<br></span><span data-piece=\"184_1\" class=\"choice\"><a data-goto=\"sect_184hr\">AGILITY (remove)</a></span><span data-piece=\"184_2\" class=\"choice\"><a data-goto=\"sect_184ir\">BRAWLING (remove)</a></span><span data-piece=\"184_3\" class=\"choice\"><a data-goto=\"sect_184jr\">CHARMS (remove)</a></span><span data-piece=\"184_4\" class=\"choice\"><a data-goto=\"sect_184kr\">CUNNING (remove)</a></span><span data-piece=\"184_5\" class=\"choice\"><a data-goto=\"sect_184lr\">FOLKLORE (remove)</a></span><span data-piece=\"184_6\" class=\"choice\"><a data-goto=\"sect_184mr\">MARKSMANSHIP (remove)</a></span><span data-piece=\"184_7\" class=\"choice\"><a data-goto=\"sect_184nr\">ROGUERY (remove)</a></span><span data-piece=\"184_8\" class=\"choice\"><a data-goto=\"sect_184or\">SEAFARING (remove)</a></span><span data-piece=\"184_9\" class=\"choice\"><a data-goto=\"sect_184pr\">SPELLS (remove)</a></span><span data-piece=\"184_10\" class=\"choice\"><a data-goto=\"sect_184qr\">STREETWISE (remove)</a></span><span data-piece=\"184_11\" class=\"choice\"><a data-goto=\"sect_184rr\">SWORDPLAY (remove)</a></span><span data-piece=\"184_12\" class=\"choice\"><a data-goto=\"sect_184sr\">WILDERNESS LORE. (remove)</a></span><br><span data-piece=\"184_13\" class=\"choice\"><a data-goto=\"sect_1i\">You're ready.</a></span><span data-piece=\"184_14\" class=\"choice\"><a data-goto=\"sect_184h\">Choose AGILITY<br></a></span><span data-piece=\"184_15\">The ability to perform acrobatic feats, run, climb, balance and leap. A character with this skill is nimble and dexterous.<br></span><span data-piece=\"184_16\" class=\"choice\"><a data-goto=\"sect_184i\">Choose BRAWLING<br></a></span><span data-piece=\"184_17\">Fisticuffs, wrestling holds, jabs and kicks, and the tricks of infighting. Not as effective as Swordplay, but you do not need weapons - your own body is the weapon.<br></span><span data-piece=\"184_18\" class=\"choice\"><a data-goto=\"sect_184j\">Choose CHARMS<br></a></span><span data-piece=\"184_19\">The expert use of magical protections and wards to protect you from danger. Also includes that most elusive of qualities: luck. You must possess a magic amulet to use this skill.<br></span><span data-piece=\"184_20\" class=\"choice\"><a data-goto=\"sect_184k\">Choose CUNNING<br></a></span><span data-piece=\"184_21\">The ability to think on your feet and devise clever schemes for getting out of trouble. Useful in countless situations.<br></span><span data-piece=\"184_22\" class=\"choice\"><a data-goto=\"sect_184l\">Choose FOLKLORE<br></a></span><span data-piece=\"184_23\">Knowledge of myth and legend, and how best to deal with supernatural menaces such as garlic against vampires, silver bullets against werewolves, and so on.<br></span><span data-piece=\"184_24\" class=\"choice\"><a data-goto=\"sect_184m\">Choose MARKSMANSHIP<br></a></span><span data-piece=\"184_25\">A long-range attack skill for both hunting and combat. You must possess a pistol to use this skill.<br></span><span data-piece=\"184_26\" class=\"choice\"><a data-goto=\"sect_184n\">Choose ROGUERY<br></a></span><span data-piece=\"184_27\">The traditional proficiencies of a thief: picking pockets, opening locks, and skulking unseen in the shadows.<br></span><span data-piece=\"184_28\" class=\"choice\"><a data-goto=\"sect_184o\">Choose SEAFARING<br></a></span><span data-piece=\"184_29\">Thorough familiarity with life at sea, including the ability to handle anything from a rowing boat right up to a large sailing ship.<br></span><span data-piece=\"184_30\" class=\"choice\"><a data-goto=\"sect_184p\">Choose SPELLS<br></a></span><span data-piece=\"184_31\">Mastery of a range of magical effects encompassing illusions, elemental effects, commands and summonings. You must possess a magic wand to use this skill.<br></span><span data-piece=\"184_32\" class=\"choice\"><a data-goto=\"sect_184q\">Choose STREETWISE<br></a></span><span data-piece=\"184_33\">You are never at a loss in towns and cities. What others see as the squalor and menace of narrow cobbled streets is home to you.<br></span><span data-piece=\"184_34\" class=\"choice\"><a data-goto=\"sect_184r\">Choose SWORDPLAY<br></a></span><span data-piece=\"184_35\">The best fighting skill, but to use it you must possess a sword.<br></span><span data-piece=\"184_36\" class=\"choice\"><a data-goto=\"sect_184s\">Choose WILDERNESS LORE<br></a></span><span data-piece=\"184_37\">A talent for survival in the wild - whether it be forest, desert, swamp or mountain peak.<br></span><span data-piece=\"184_38\" class=\"choice\"><a data-goto=\"sect_1\">Go back and choose one of the characters provided.</a></span>\n",
  "sect_184a": "\n\n",
  "sect_184b": "\n\n",
  "sect_184c": "\n\n",
  "sect_184d": "\n\n",
  "sect_184e": "\n\n",

  "sect_184g": "\n\n",
  "sect_184h": "\n\n",

  "sect_184j": "\n\n",
  "sect_184k": "\n\n",
  "sect_184l": "\n\n",
  "sect_184m": "\n\n",
  "sect_184n": "\n\n",
  "sect_184o": "\n\n",
  "sect_184p": "\n\n",
  "sect_184q": "\n\n",
  "sect_184r": "\n\n",
  "sect_184s": "\n\n",
  "sect_184hr": "\n\n",
  "sect_184ir": "\n\n",

  "sect_184sr": "\n\n",
  "sect_185": "\nOne of the bullies gives a brutish sneer. 'You won't use that,' he says with a scornful glance at the pistol. 'You'd be strung up for using a firearm in a brawl.'<br><span class=\"indent\"></span>You shrug. 'True, I might get a rope around my neck - if I'm caught. But it's a sure thing you won't attend the hanging. You'll be dead meat by then.'<br><span class=\"indent\"></span>He stares at you, licking his thick lips uncertainly. 'You wouldn't dare. Even if you kill me, my buddies here'll rip you apart.'<br><span class=\"indent\"></span>You raise the pistol purposefully. It is aimed right between his eyes. 'Again, maybe that's so, but it won't do you any good with your brains splattered all over that wall.'<br><span class=\"indent\"></span>His nerve breaks. With a snarl, he draws his cronies away and they slope off into the street. You tuck the pistol back inside your shirt before anyone sees you with it.<br><span data-piece=\"185_0\" class=\"choice\"><a data-goto=\"sect_223\">Continue.</a></span>\n",
  "sect_186": "\nSigning on a small crew, you set sail. A strong following wind allows you to make good headway, and you reach the island within a fortnight. As you coast in search of safe anchorage, Blutz points out a smaller isle that would be joined to the main island at low tide. Beyond it lies a bay where you drop anchor. Going ashore on the smaller island armed with shovels, you soon discover a boulder marked with crossed bones. 'Here's where we shall dig,' you tell the others.<br><span class=\"indent\"></span>You labour on throughout the afternoon - and hot work it is, with barely a breath of wind under a sun steaming through coastal marsh-haze. The western sky is already turning the colour of blood when there is the scrape of iron on wood. 'I've found a box!' yells Blutz.<br><span class=\"indent\"></span>'And I another!' Grimes calls out a moment later.<br><span class=\"indent\"></span>Scooping away the sand with your hands, you uncover a dozen large wooden crates. 'This is a goodly hoard!' you say, breathless with sudden excitement. 'Break one open, lads, and let's see El Draque's treasure.'<br><span class=\"indent\"></span>Grimes smashes a hasp with his shovel. There is a creak as you wrench the lid up. A strong smell of tobacco and tar rises from the interior - and something else: formaldehyde. A corpse lies there, resting on silver ingots, eyes staring sightlessly from a face which is colourless but untouched by decay. On the waxy flesh of its bare chest you see a tattoo with the legend 'Dethly is fear'.<br><span class=\"indent\"></span>'In God's holy name,' breathes Oakley, 'what's this?'<br><span class=\"indent\"></span>Blutz grabs your arm. 'The sun's close to setting, skipper. For heaven's sake, let's forget the treasure and put to sea while we still can!'<br><span data-piece=\"186_0\" class=\"choice\"><a data-goto=\"sect_78\">Open the other boxes.</a></span><span data-piece=\"186_1\" class=\"choice\"><a data-goto=\"sect_347\">Wait until nightfall.</a></span><span data-piece=\"186_2\" class=\"choice\"><a data-goto=\"sect_413\">Return to the ship and set sail at once.</a></span>\n",
  "sect_187": "\nThe captain and his marines wait like hawks for your decision. You can sense Oakley and the others readying themselves for a fight, but you know that both honour and common-sense demand that you give in to these conditions. <br><span class=\"indent\"></span>'All right, tell your men to load the Queen's gold aboard your ship.' After he has issued the order, your resentment is still smouldering. 'I expect you'd have preferred us to fight,' you say. 'You enjoy killing pirates, I'll bet.'<br><span class=\"indent\"></span>He shrugs as if your opinion means nothing. 'Killing pirates is my duty. But you're not a pirate, are you? You're a privateer, and it's not my job to quarrel with privateers. Not so long as they pay the Queen her due.'<br><span class=\"indent\"></span>He returns to his warship and turns in the direction of Leshand. 'Any orders?' asks Grimes as you watch the warship sail away.<br><span class=\"indent\"></span>'Yes, Mister Grimes. Lay in a course for Selenice while we still have a few doubloons in our hold.' <br><span data-piece=\"187_0\" class=\"choice\"><a data-goto=\"sect_301\">Continue.</a></span>\n",
  "sect_188": "\nThis is grim work, but you cannot afford the luxury of hesitation. In moments the sunlight will be gone. Quickly dropping to your knees beside the open box, you raise the stake in both hands and plunge it down hard into the corpse's heart. A terrible gasping sigh escapes the dead lips, reminding you of the sound of autumn leaves scattering in a breeze. Then the body crumbles like ancient parchment.<br><span class=\"indent\"></span>Blutz cries out. At the same moment, the sun is blotted out beyond the horizon and night rushes triumphantly across the world. <br><span data-piece=\"188_0\" class=\"choice\"><a data-goto=\"sect_347\">Continue.</a></span>\n",
  "sect_189": "\nYou take out your pocket-watch and glance at it. The glass was cracked when it stopped Skarvench's bullet, but it is still working. 'Midnight,' you say, and close the case with a click.<br><span class=\"indent\"></span>There is a gasp from the sailors. One man almost falls out of the rigging in shock. Staring at the sky, they watch as an encroaching arc of darkness closes in front of the moon. ''Tis doomsday!' cries the bo'sun. 'First an unseasonal hurricane, then becalmed in fog, then flying ships - an' now a dragon devours the moon!' A low moan of dread escapes the crew's lips.<br><span class=\"indent\"></span>'Stand fast, you timid swabs!' you thunder down at them from the poopdeck. 'Have you never seen an eclipse of the moon before?' <br><span data-piece=\"189_0\" class=\"choice\"><a data-goto=\"sect_246\">Continue.</a></span>\n",
  "sect_190": "\nThe helmet fills your mind with the battle-lore of the unconquerable Spartans, masters of warfare. You sense the effect is only temporary - but it should last long enough to help you defeat Skarvench, or die trying.<br><span data-piece=\"190_0\" class=\"choice\"><a data-goto=\"sect_209\">Fight.</a></span>\n",
  "sect_191": "\nYou come face to face with the sailmaster. For a moment he stands there in simple perplexity. As an ordinary seaman you are not supposed to be in this part of the ship. 'What are you doing..?' he starts to say. In another moment he's going to sound the alarm.<br><span data-piece=\"191_0\" class=\"choice\"><a data-goto=\"sect_286\">Run him through.</a></span><span data-piece=\"191_1\" class=\"choice\"><a data-goto=\"sect_248\">Knock him cold.</a></span><span data-piece=\"191_2\" class=\"choice\"><a data-goto=\"sect_305\">Think fast.</a></span><span data-piece=\"191_3\" class=\"choice\"><a data-goto=\"sect_191a\">You're trapped.</a></span>\n",
  "sect_191a": "\nYou are helpless to prevent him from alerting the other pirates, who rush out of Skarvench's cabin to seize you. Your adventure ends before it even began.<br><div class=\"s3\">THE END</div>\n",
  "sect_192": "\nWith a dexterity that amazes your companions, you scale the cliffs like a monkey and have soon hurled down enough coconuts to keep you all supplied for days. You scramble back down to the beach amid cheers of delight.<br><span class=\"indent\"></span>'Well done,' says Oakley. He is smiling, but you notice that he turns to cast a wary look along the shore. 'Now I suggest we lose no time loading these aboard and casting off. I've no wish to run into the natives hereabouts.'<br><span data-piece=\"192_0\" class=\"choice\"><a data-goto=\"sect_116\">Sail west as Oakley suggests.</a></span><span data-piece=\"192_1\" class=\"choice\"><a data-goto=\"sect_211\">Explore this island first.</a></span>\n",
  "sect_193": "\n'No, you're wrong,' you tell Blutz. 'Look at most of the island. It's well covered in vegetation, right? That volcano has most likely been hissing and spitting for years, but if there had been any major eruption then the jungle wouldn't have grown up to that extent.'<br><span class=\"indent\"></span>'All the same,' says Grimes, 'let's not dally longer than we have to. The sight of those lava-covered slopes puts me in mind of Satan's brimstone fires!'<br><span data-piece=\"193_0\" class=\"choice\"><a data-goto=\"sect_174\">Go ashore.</a></span><span data-piece=\"193_1\" class=\"choice\"><a data-goto=\"sect_135\">Row on westwards.</a></span>\n",
  "sect_194": "\nDespite the thick jungle, you reach the tower quickly by following a stone pathway that leads through the undergrowth. You emerge into a wide grass-covered plaza and facing you is a white marble palace with a high tower. You move cautiously closer and Oakley runs his hand over the monumental carvings beside the entrance. They show a queen or priestess dispatching her enemies into luridly depicted hells.<br><span class=\"indent\"></span>'How was this stone brought here?' Grimes wonders aloud. 'It's not local to the island, if I'm any judge.'<br><span class=\"indent\"></span>'You're right,' says a woman's voice. 'I brought it here by magic.'<br><span data-piece=\"194_0\" class=\"choice\"><a data-goto=\"sect_251\">Continue.</a></span>\n",
  "sect_195": "\nIt seems that the witch's exertions have weakened the spell she cast to bury your jollyboat. Or perhaps desperation lends you unprecedented strength. Whatever the reason, you manage to dig the boat out of the sand and drag it down to the water's edge. Piling in, you put to sea at once.<br><span data-piece=\"195_0\" class=\"choice\"><a data-goto=\"sect_137\">Continue.</a></span>\n",
  "sect_196": "\nA shot rings out. A man falls dead. It is a sad, grim, brutally sudden scene which has been played out many times on the stage of life. As always, the onlookers stand for a moment stunned, waiting for Death to withdraw into the wings so the action can resume.<br><span class=\"indent\"></span>The moment passes. The natives are not awed by your ability to kill at a distance - they have seen firearms before, and know it is no miracle. There is an angry shout, and a thrown rock grazes your hand. The pistol is knocked to the ground. The natives stand watching you, ominously tense, torn between shock, grief and rage.<br><span data-piece=\"196_0\" class=\"choice\"><a data-goto=\"sect_196a\">Abandon your pistol and run.</a></span><span data-piece=\"196_1\" class=\"choice\"><a data-goto=\"sect_215\">Stand and fight.</a></span>\n",
  "sect_196a": "\n\n",
  "sect_197": "\nGradually you leave behind the icy rain that has been your constant accompaniment throughout the journey. The southern waters into which the mermaid is now taking you are calmer, the weather warmer. Even so, the comfort only allows you time to regret your other deprivations, not the least of which is hunger. <br><span data-piece=\"197_0\" class=\"choice\"><a data-goto=\"sect_197a\">Eat the monkey.</a></span><span data-piece=\"197_1\" class=\"choice\"><a data-goto=\"sect_197d\">Share out your provisions.</a></span><span data-piece=\"197_2\" class=\"choice\"><a data-goto=\"sect_197b\">Go without food.</a></span><span data-piece=\"197_3\" class=\"choice\"><a data-goto=\"sect_197b\">Continue.</a></span>\n",
  "sect_197a": "\n\n",
  "sect_197b": "\n\n",
  "sect_197c": "\nYou see a fleece of white cloud, then a green-tinged hump of land comes in sight. 'Yonder is Red Skull Island,' announces the mermaid. 'Here, food and water are yours for the taking - subject only to those laws of ownership which pertain throughout the surface world.' With a sly wink which raises belated misgivings in your mind, she releases the tow-rope and slides beneath the waves. <br><span data-piece=\"197c_0\" class=\"choice\"><a data-goto=\"sect_173\">Continue.</a></span>\n",
  "sect_197d": "\n\n",
  "sect_198": "\nYou hesitate, hands hovering over the wealth of spilled treasure. You are spoiled for choice. Simple riches would buy you a ship of your own, in which you could track down and challenge the foul Skarvench. On the other hand, you cannot help noticing some special items among the treasure - artefacts whose real value lies not in their monetary worth, but in the magical power they might possess.<br><span class=\"indent\"></span>Mandrigard snores, stirring in his sleep. He might awaken at any moment. You must decide.<br><span data-piece=\"198_0\" class=\"choice\"><a data-goto=\"sect_274\">Simple treasure will do just fine.</a></span><span data-piece=\"198_1\" class=\"choice\"><a data-goto=\"sect_293\">Look for items that could be magical.</a></span>\n",
  "sect_199": "\n'Can you hear me, shipmate?'<br><span class=\"indent\"></span>Blutz's face swims out of a murky void. Your first thought is: what's <em>he</em> doing under the sea? The next moment you sit bolt upright, convulsing as you cough sea-water out of your lungs.<br><span class=\"indent\"></span>'We thought you were lost,' says Oakley in voice filled with wonder. 'Since you went down with that giant crab, we hadn't seen a sign of you. That was almost an hour ago. Then you came bobbing up near the boat and we hauled you in.'<br><span class=\"indent\"></span>'It's a miracle you aren't drowned,' says Grimes.<br><span class=\"indent\"></span>You look down to see your fingers clutched tightly around your magic amulet. It is the one thing you managed to hold on to; all your other possessions are gone. You cannot remember now, but you guess that your last act before losing consciousness must have been to work a charm against drowning. That explains why you are not dead. But Grimes is still partly right, because it's a miracle that the current carried you back to your friends.<br><span class=\"indent\"></span>The crab is long gone, but it is still not safe to hang around here. You must get moving right away.<br><span data-piece=\"199_0\" class=\"choice\"><a data-goto=\"sect_47\">Stay on your previous westward course.</a></span><span data-piece=\"199_1\" class=\"choice\"><a data-goto=\"sect_66\">Steer north in hope of finding the islands.</a></span>\n",
  "sect_200": "\n\n",
  "sect_200a": "\nSleep gradually gives way to awareness. Daylight bathes you, slowly warming the chill from your bones. Suddenly your eyes snap open. You have slept long past dawn and the sun is now high in the sky. You rise and stretch, feeling curiously giddy and drained of strength. The others are the same. You remark on how haggard they look, bloodshot eyes staring from bloodless faces. You all look and feel as though you had been drugged.<br><span class=\"indent\"></span>'Something's bitten me on the neck...' growls Oakley, gingerly touching the wound and examining the sticky smear of blood on his fingers.<br><span class=\"indent\"></span>'Me too,' says Blutz. <br><span class=\"indent\"></span>All four of you have been bitten - a double puncture mark, deep and raw. No mosquito could have made those bites. And now you notice something else: the raft and its sinister occupant have vanished during the night.<br><span data-piece=\"200a_0\" class=\"choice\"><a data-goto=\"sect_332\">Continue.</a></span>\n",
  "sect_200b": "\nDeep in slumber, you feel icy lips nuzzle to your throat. Their kiss is sharp and stinging. Perhaps you dream of the embrace of comely merfolk, gills passionately aflutter, sea-cool blood warmed by the fires of ardour. The truth is that you have invited a vampire into your midst. Timmy Mortice clings to you, his shrivelled veins engorging with your lifeblood, until all that is left of you is a dry husk.<br><div class=\"s3\">THE END</div>\n",
  "sect_201": "\nYour arms are tied. 'Take 'em to the ship,' growls Skarvench to a couple of his men. 'I'm goin' to stock up on fresh victuals while we're here.' You are bundled into the boat. The men assigned to guard you are the rat-faced quartermaster, Curshaw, and Porbuck, the burly first mate. Skarvench himself stays behind with the rest of the shore party to collect supplies while you are rowed back, bound, towards the <em>Belle Dame</em>.<br><span class=\"indent\"></span>You must do something. <br><span data-piece=\"201_0\" class=\"choice\"><a data-goto=\"sect_372\">Use your cunning.</a></span><span data-piece=\"201_1\" class=\"choice\"><a data-goto=\"sect_391\">Get free using roguery.</a></span><span data-piece=\"201_2\" class=\"choice\"><a data-goto=\"sect_408\">You can take these two with your arms tied.</a></span><span data-piece=\"201_3\" class=\"choice\"><a data-goto=\"sect_240\">Wait for a chance to escape.</a></span>\n",
  "sect_202": "\nQueen Titania will be visiting a number of Gloriannic colonies in the New World and is scheduled to finish her tour at Port Tudor, where she will reside until after the hurricane season. Since the Sidonians would dearly love to capture her, security for the trip has been made watertight. She will be accompanied by Dr Wild, the court sorcerer, aboard her flagship the <em>Rose</em>, and escorted by Admiral Lord Calidor with a fleet of twelve galleons.<br><span class=\"indent\"></span>'The flotilla's security is as unassailable as the Queen's own virtue,' opines one of your informants. From what you have learned you'd be inclined to agree. And yet... Skarvench clearly has some trick up his sleeve.<br><span data-piece=\"202_0\" class=\"choice\"><a data-goto=\"sect_278\">Find out what Skarvench has been up to.</a></span><span data-piece=\"202_1\" class=\"choice\"><a data-goto=\"sect_164\">Ask about the notorious pirate El Draque.</a></span><span data-piece=\"202_2\" class=\"choice\"><a data-goto=\"sect_69\">Pay a visit to Master Capstick.</a></span><span data-piece=\"202_3\" class=\"choice\"><a data-goto=\"sect_12\">Visit a chandler's to buy supplies.</a></span><span data-piece=\"202_4\" class=\"choice\"><a data-goto=\"sect_31\">Get some of your items identified.</a></span><span data-piece=\"202_5\" class=\"choice\"><a data-goto=\"sect_50\">Apply for a letter of marque.</a></span><span data-piece=\"202_6\" class=\"choice\"><a data-goto=\"sect_409\">Apply for a letter of marque.</a></span><span data-piece=\"202_7\" class=\"choice\"><a data-goto=\"sect_107\">It's time to move on.</a></span>\n",
  "sect_203": "\nThe shark and the dolphin slowly sink, taking the strange boat with them. The waters close over them like thin black oil, and in a last pearly glimmer they are gone. Moonrise flickers just below the horizon. The wind soughs, ruffling white flecks on the waves.<br><span class=\"indent\"></span>'We'd have fared ill if we'd ventured into Neptune's realm,' says Oakley with conviction. 'Better that we obtain a ship by more normal means.'<br><span class=\"indent\"></span>You return to spend the night in Selenice. The next day you take stock of your remaining options.<br><span data-piece=\"203_0\" class=\"choice\"><a data-goto=\"sect_261\">Uncork that ship in a bottle.</a></span><span data-piece=\"203_1\" class=\"choice\"><a data-goto=\"sect_318\">You still have the deed of ownership.</a></span><span data-piece=\"203_2\" class=\"choice\"><a data-goto=\"sect_299\">Buy a ship.</a></span><span data-piece=\"203_3\" class=\"choice\"><a data-goto=\"sect_343a\">What options?</a></span>\n",
  "sect_204": "\n\n",
  "sect_204a": "\nWith the help of your comrades you make short work of the three ruffians. You retrieve the spectacles from the hands of one of the unconscious ruffians and hand them back to their owner.<br><span data-piece=\"204a_0\" class=\"choice\"><a data-goto=\"sect_223\">Continue.</a></span>\n",
  "sect_204b": "\nIt may not have been your smartest idea to wade into a tavern brawl when you were so weak that a stiff wind could lay you out. A lucky punch catches you athwart the jawline and you fall back to break your skull tidily against the tavern hearth.<br><div class=\"s3\">THE END</div>\n",
  "sect_205": "\nThe harbour is vast. You cannot see the wharfs, blurred by distance and darkness. As your coracle proceeds, you pass a multitude of ships lying at anchor all around you. A huge hulk looms up, shaped rather like a massive cradle. 'What about that one?' says Blutz, awestruck. 'You could fit an entire menagerie inside her!'<br><span class=\"indent\"></span>'Too ponderous,' you decide.<br><span class=\"indent\"></span>Next you pass a sleek high-prowed galley with notches for fifty deck-cannon. 'There is a ship built for heroes,' avers Grimes. 'Notice the fine beam of the prow, carved to resemble a mouth. What wisdom might she utter, if that mouth could talk!'<br><span class=\"indent\"></span>'A well-designed vessel, to be sure,' you admit, 'but look at the timbers of the bowsprit. They are so weathered with age that they might give way, to the mortal detriment of any poor soul standing below when they fell.'<br><span class=\"indent\"></span>'What about that one?' suggests Oakley, pointing further across the bay.<br><span class=\"indent\"></span>'Bah, she is entirely clad in sheets of iron! She would be slow to turn - and, see, despite those long spars of metal she has no masts on her deck! No, we must look further.'<br><span class=\"indent\"></span>'There's our ship!' yells Blutz in sudden excitement.<br><span class=\"indent\"></span>You look to see a tall-masted vessel painted all in black except for the blue lacquer adorning her prow. Her figurehead is a muscular statue in oak wearing a winged helmet on his brow. His arm, upraised with staff held high, seems to point to a destiny brimming with glory. You nod, reading the name blazoned in gold on the ship's escutcheon. 'Yes, she's the one for us. The <em>Calypso</em>.'<br><span class=\"indent\"></span>Climbing aboard, you raise the sails and take her out of the harbour under the watchful gaze of the colossus. Still standing astride the harbour mouth, he calls after you as you sail off: 'Mind you don't earn my ire like that other rogue that sailed her before you!'<br><span class=\"indent\"></span>There is no telling what he means by that, but your only thought is for your new vessel. She cuts through the waves with matchless grace and speed, steady as a surgeon's saw. You stand proudly behind the mast, revelling in every wave and gust of salty spray. As dawn breaks, you see the familiar outline of Selenice harbour ahead.<br><span data-piece=\"205_0\" class=\"choice\"><a data-goto=\"sect_205a\">Continue.</a></span>\n",
  "sect_205a": "\n<br>",
  "sect_206": "\nYour call to arms is cut short by the marine sergeant, who coshes you with the butt of his pistol before discharging it at Grimes. In seconds a frenzied battle breaks out all along the ship. The marines fight with iron discipline, hearts brimming with patriotic fervour, but your scurvy mob of pirates have a still stronger motivation: the glitter of gold awaits them if they win, a hangman's noose if they lose.<br><span data-piece=\"206_0\" class=\"choice\"><a data-goto=\"sect_206a\">Fight.</a></span>\n",
  "sect_206a": "\n\n",
  "sect_207": "\nYour obsessive search for the iceberg drives you to plot a course far off the familiar shipping lanes. At first, awed by your reputation as a mariner, the crew toil on without complaint. But the days draw by with no sight of land or other ships, and then the grumbling begins. Initially it takes the form of simple discontent - a spluttered curse when a man bites into an apple from the deck-barrel and finds it sour, or a surly rejoinder when orders are given. Oakley, Grimes and Blutz do their best to keep discipline, but the sun beats down day after day until the pitch bubbles in the seams and the deck is too hot to walk on in bare feet. Water begins to run low, and it is then that the grumbling begins to veer towards outright mutiny.<br><span data-piece=\"207_0\" class=\"choice\"><a data-goto=\"sect_93\">Keep looking for the iceberg.</a></span><span data-piece=\"207_1\" class=\"choice\"><a data-goto=\"sect_396\">Give up and return to Selenice.</a></span>\n",
  "sect_208": "\nThere is not enough wind to bring you up to the fog bank before the <em>Moon Dog</em>. You watch her descend until she is hovering above the fog, sails shimmering with occult energy. Ropes are dropped down from her rail, and hazily you make out the shapes of men descending on these ropes like a dozen web-spinning spiders.<br><span class=\"indent\"></span>'Not enough breeze for the sails,' you groan. 'I'd give half my life for a single gust of that hurricane now!'<br><span class=\"indent\"></span>The fog envelops your bows. 'We'll have to heave to, skipper,' cautions Grimes. 'We might run smack into the <em>Rose</em> in this pea-souper.'<br><span class=\"indent\"></span>You are forced to agree. Tense minutes pass. Straining your ears, you think you can hear muffled shouts from far off: 'The Queen! They've got the Queen!' and 'Where's their ship?'<br><span class=\"indent\"></span>As suddenly as it arose, the fog disperses. The <em>Rose</em> looms close ahead of you, and now you can see figures milling across her deck in panic. You look up to see Skarvench's flying ship appear as a gaunt shadow across the moon for a moment; then it disappears into a rack of cloud.<br><span class=\"indent\"></span>Soldiers come rowing out from the <em>Rose</em> and clamber aboard without waiting for permission. You find yourselves staring down the barrels of thirty muskets. 'What is this?' you demand angrily. 'We're not your enemies. We came to save the Queen!'<br><span class=\"indent\"></span>Admiral Calidor stares at you like a hawk. He is obviously in a state of anguish but he struggles to control it as he says flatly, 'The Queen has been kidnapped by your accomplices. You're going to tell me where they've taken her.'<br><span class=\"indent\"></span>'I don't know!' you yell back at him. 'They weren't our accomplices. I told you, we're on your side!'<br><span class=\"indent\"></span>Your arms are seized by soldiers and you are bundled into a rowboat. 'These pirates are all the same,' mutters Calidor to his sergeant of marines. 'Distasteful though it is, we'll have to put them to torture.'<br><span class=\"indent\"></span>You will be a long time dying on the rack in the bowels of Calidor's ship. But what makes the thought of your death all the more bitter is that you are being punished for the crimes of your arch enemy, the evil Captain Skarvench.<br><div class=\"s3\">THE END</div>\n",
  "sect_209": "\nThe deck is deserted. Barrels and splintered booms lie scattered all around. Fog drifts through the torn rigging, reminding you of the slow unfolding of undersea plants. 'What happened to the crew? The soldiers guarding the Queen?' whispers Blutz as he climbs over the rail behind you.<br><span class=\"indent\"></span>'Perhaps stunned by the storm,' you reply, also in a whisper. 'They must have taken a fearful battering. Also they must be expecting trouble.'<br><span class=\"indent\"></span>The end of a rope lashes down onto the deck. You glance up. A vast grey shadow is hovering overhead, buoyed up by nothing but mist and moonlight: the <em>Moon Dog</em>.<br><span data-piece=\"209_0\" class=\"choice\"><a data-goto=\"sect_228\">Climb up to the <em>Moon Dog</em>.</a></span><span data-piece=\"209_1\" class=\"choice\"><a data-goto=\"sect_247\">Devise a plan to trick your foe.</a></span><span data-piece=\"209_2\" class=\"choice\"><a data-goto=\"sect_266\">Wait for your enemies come to you.</a></span>\n",
  "sect_210": "\nHurriedly clutching your amulet and uttering an all-purpose good luck charm, you wait to see what effect it will have. Just as the cabin door is swinging open, the person outside gives a gasp of annoyance. 'Damn it...' he mutters to himself, and you hear the rustle of oilskins as he pats his pockets, 'left my pipe in the galley.'<br><span class=\"indent\"></span>Only when he has retraced his steps, vanishing off along the passage in the direction of the galley, do you expel your breath in a relieved sigh. A hurried inspection of the cabin uncovers a few items that might prove useful: a toolkit, a book of charts, and a crucifix. The last of these brings a wry smile to your lips. A thousand crucifixes would not be enough to save the souls of the black-hearted villains in Skarvench's crew.<br><span class=\"indent\"></span>Just as you are about to leave the cabin, there is a little shriek from the bunk and something small and grey launches itself onto your back. The shocks sends your heart thudding like a hammer, but it is only the monkey that serves as the ship's mascot. Mister Chatter, the crew call him. He seems keen to go with you - and small wonder, given the cruelty with which he is treated by most of the pirates. You could let him perch on your shoulder. Maybe he would bring you luck, at that. On the other hand, he'd be an extra mouth to feed aboard the rowing-boat, and if he does not keep quiet then he could bring the whole crew down on you.<br><span data-piece=\"210_0\" class=\"choice\"><a data-goto=\"sect_210a\">Take the monkey with you.</a></span><span data-piece=\"210_1\" class=\"choice\"><a data-goto=\"sect_210b\">Leave him.</a></span>\n",
  "sect_210a": "\n\n",
  "sect_210b": "\nHaving taken long enough about fetching supplies, you hasten up on deck. The others are waiting for you. In the slanting rays of the setting moon you make out the furtive silhouettes of Grimes; tall and gaunt; Oakley, strong as a tar barrel; and fat little Blutz.<br><span class=\"indent\"></span>They have the jollyboat swung out over the side. Stealthily you lower it into the water, working in deep silence like four burglars intent on a night's business. From below wafts the sound of a hornpipe and snatches of revelry as the crew sing sea shanties in the galley. Climbing down to the jollyboat, you shove off from the side and row with muffled oars away from the brooding bulk of the <em>Belle Dame</em>. The moon slips below the western horizon, leaving the night studded with stars. There is no wind and the sea is as flat as a pane of glass. As the sounds of jollity fade into the distance, only the soft splash of your oars remains to disturb the eerie quiet.<br><span data-piece=\"210b_0\" class=\"choice\"><a data-goto=\"sect_381\">Continue.</a></span><span data-piece=\"210b_1\" class=\"choice\"><a data-goto=\"sect_399\">Continue.</a></span><span data-piece=\"210b_2\" class=\"choice\"><a data-goto=\"sect_416\">Continue.</a></span><span data-piece=\"210b_3\" class=\"choice\"><a data-goto=\"sect_289\">Continue.</a></span>\n",
  "sect_211": "\nSome distance along the shore you find a ladder of knotted vines dangling down from the clifftop. 'Looks like there are natives,' observes Oakley unnecessarily. 'Perhaps we'd be wiser to go back to the boat and shove off.'<br><span class=\"indent\"></span>Your experience has been that not all islanders are hostile. It usually depends on the way they have been treated by the outsiders they've met. On the other hand, there are some who are unabashed cannibals and will attack with provocation if they see the chance of an easy meal.<br><span data-piece=\"211_0\" class=\"choice\"><a data-goto=\"sect_249\">Climb the vines.</a></span><span data-piece=\"211_1\" class=\"choice\"><a data-goto=\"sect_116\">Return to the jollyboat and sail on.</a></span>\n",
  "sect_212": "\nGrimoire Island is a strangely idyllic-looking place, with wide white beaches fringed by gently swaying palm trees. A balmy breeze blows refreshingly from the east. Birds the colour of precious gems watch your approach without fear.<br><span class=\"indent\"></span>'It's eerie,' decides Grimes. 'Almost too perfect.'<br><span class=\"indent\"></span>'Like it's been tended,' says Blutz. 'You know, like somebody's garden back home.'<br><span class=\"indent\"></span>'A demon's garden, if the native stories are to be believed,' chips in Oakley. All three, like you, are in a strange mood: both allured and uneasy.<br><span data-piece=\"212_0\" class=\"choice\"><a data-goto=\"sect_118\">Go ashore.</a></span><span data-piece=\"212_1\" class=\"choice\"><a data-goto=\"sect_137\">Row on towards the next island.</a></span>\n",
  "sect_213": "\nBlutz reaches out towards what looks like a bunch of oranges. You snatch them out of his pudgy hand. 'That's strychnine fruit,' you warn him. 'It's deadly poisonous.' Oakley shows you a handful of berries he's picked, but you shake your head. 'Those too. Everything here looks delicious, but most are poison.'<br><span class=\"indent\"></span>'The tower, then,' says Grimes. 'Whoever lives there might give us food.'<br><span class=\"indent\"></span>Blutz looks worried. 'But what kind of person lives on an island surrounded by poisonous plants?'<br><span class=\"indent\"></span>It's a good question.<br><span data-piece=\"213_0\" class=\"choice\"><a data-goto=\"sect_194\">Go to the tower.</a></span><span data-piece=\"213_1\" class=\"choice\"><a data-goto=\"sect_137\">Put to sea at once.</a></span>\n",
  "sect_214": "\n\n",
  "sect_214a": "\nWith your nautical experience, you easily outmanoeuvre the warship and soon leave her far behind. You sail back to Selenice with a hold full of treasure and hearts full of confidence. News of your fortune spreads rapidly, bringing the master shipwright himself hurrying down to the quay to greet you.<br><span class=\"indent\"></span>'Come aboard, Master Kemp,' you say, heartily pumping his hand as he steps off the gangplank. 'We've found rich pickings on our travels. Perhaps now you can sell us a ship more suited to our needs?' With that, you throw open the hold covers with a theatrical flourish.<br><span class=\"indent\"></span>The sunlight reflects off your haul in patterns of gold, silver and ruby-red across Kemp's face. He looks up with as broad a smile as a mouth could manage and says, 'Why, captain, I have the very ship for you moored just along the quay.'<br><span class=\"indent\"></span>You turn to look where he is pointing, a gasp of admiration escaping your lips as you do. The ship is a proud tall-masted galleon with sixty cannon bristling along her gunwales. Her figurehead is a painted oak mermaid of almost supernatural beauty. 'The <em>Faerie Queen</em>,' says Blutz, reading the name emblazoned on the prow. 'I think I'm in love.'<br><span class=\"indent\"></span>'That's the one for us,' you concur. 'Master Kemp, you keep the sloop and the loot here in the hold. We'll have the <em>Faerie Queen</em>.'<br><span class=\"indent\"></span>Kemp nods, stunned at having made the quickest sale of his life, while you stride down the gangplank and along the quay to take command of your new vessel.<br><span data-piece=\"214a_0\" class=\"choice\"><a data-goto=\"sect_214c\">Continue.</a></span>\n",
  "sect_214b": "\n'We can't shake 'em off, skipper,' mutters Grimes. He's right. The warship is steadily gaining on you.<br><span data-piece=\"214b_0\" class=\"choice\"><a data-goto=\"sect_252\">Make a fight of it.</a></span><span data-piece=\"214b_1\" class=\"choice\"><a data-goto=\"sect_24\">Heave to and let them come aboard.</a></span>\n",
  "sect_214c": "\n\n",
  "sect_215": "\nYou are outnumbered, but you have an advantage they do not share. Warfare in their society is rarely fatal, intended only as a ritual show of strength. They lack the murderous instincts of you 'civilized' men.<br><span data-piece=\"215_0\" class=\"choice\"><a data-goto=\"sect_215a\">Fight.</a></span>\n",
  "sect_215a": "\n\n",
  "sect_215b": "\nYou fight your way down the beach and hastily put to sea under a hail of thrown pebbles. Once safely away from shore, you address your shipmates.<br><span class=\"indent\"></span>'We're still more than two hundred leagues out from Port Leshand, and there are no islands along the route for us to restock our supplies. What we've got left now is going to have to keep us going for at least ten days.'<br><span class=\"indent\"></span>'Ten days? We might not stay afloat that long.' Oakley indicates the timbers of your little boat, now warped by the constant sun and the battering of high waves.<br><span class=\"indent\"></span>'Maybe we shouldn't try to make it all the way to Leshand,' suggests Blutz. 'We could head south from here towards the main shipping lanes. There's a good chance we'd be rescued by a friendly vessel.'<br><span data-piece=\"215b_0\" class=\"choice\"><a data-goto=\"sect_367\">Strike out to the south.</a></span><span data-piece=\"215b_1\" class=\"choice\"><a data-goto=\"sect_404\">Keep heading west.</a></span><span data-piece=\"215b_2\" class=\"choice\"><a data-goto=\"sect_386\">Keep heading west.</a></span>\n",
  "sect_216": "\nOakley's head rocks back as he feels the sting of your knuckles across his cheek, cutting off his song before he can launch into another gloom-ridden verse. 'Quiet!' you tell him with a hiss of righteous anger in your voice.<br><span class=\"indent\"></span>He glares back at you, bloodshot eyes wide in a drained and haggard face. He is shaking with fear as much as fury. 'Quiet?' he sobs. 'Why? We're all going to Davy Jones's mess hall tonight, and it's his pet sharks as will be making their meal of us.'<br><span class=\"indent\"></span>'Nonsense!' You take hold of his shoulders and stare him straight in the eye. 'Listen to me: none of us is going to die. We can all come through this in one piece if we pull together. The worst threat we have to face isn't the sea, or the weather, or hunger, or thirst. It's ourselves. Our fear. If we give in to panic, then we're lost.'<br><span class=\"indent\"></span>Oakley nods. 'You're right.' He helps you bail water, taking turns throughout the night and the following day. You feel exhaustion steadily wearing you down, but at least you have inspired a glimmer of hope in your little band. <br><span data-piece=\"216_0\" class=\"choice\"><a data-goto=\"sect_273\">Continue.</a></span>\n",
  "sect_217": "\nSalt spray spits across the deck in billows, driven by high winds that stretch the sails hard against the rigging. 'It's a wonder she ain't broke up long since!' says Blutz.<br><span class=\"indent\"></span>'She's a cursed ship,' declares Oakley matter-of-factly. 'Such vessels have an unnatural resilience.'<br><span class=\"indent\"></span>Hours pass, during which you are blown further into the west. You snatch a short sleep in the shelter of a tarpaulin, preferring not to venture below decks again. At last Grimes shakes you from a feverish dream to say, 'It's time we quit this ship, matey.'<br><span data-piece=\"217_0\" class=\"choice\"><a data-goto=\"sect_236\">Recite a charm.</a></span><span data-piece=\"217_1\" class=\"choice\"><a data-goto=\"sect_255\">Use an item.</a></span><span data-piece=\"217_2\" class=\"choice\"><a data-goto=\"sect_388\">He's right. But how?</a></span>\n",
  "sect_218": "\nWith sudden inspiration you snatch off your own belt and twist the metal of the buckle to make a hook. For a line, you get everyone to unlace their boots and tie the strings together. Tied to the end of an oar, this gives you a makeshift fishing rod. You also trick up some nets by fixing socks onto the other oar.<br><span class=\"indent\"></span>'What do we use for bait?' asks Grimes.<br><span class=\"indent\"></span>'Ah.' You give a delicate cough. 'Well, to be blunt... whatever our stomachs couldn't use from the last meal we ate.'<br><span class=\"indent\"></span>Their perplexed frowns gradually change to disgust as they catch on to what you mean. 'Ugh, you must be joking,' says Blutz.<br><span class=\"indent\"></span>'Believe me, it's the best bait. You weren't going to use it for anything else, were you, Mister Blutz?'<br><span class=\"indent\"></span>Oakley snorts with outrage. 'You expect us to fish using our own excrement? Revolting! Do we want to live like animals, or die like decent men?'<br><span class=\"indent\"></span>There is a long pause as the rest of you turn to look at Oakley. He thinks, then gives a grim nod and says, 'Right, let's get on with it, then.'<br><span class=\"indent\"></span>Hours later you have caught just three small fishes. A meagre enough meal for one person, let alone four. But at least you now won't starve tonight. <br><span data-piece=\"218_0\" class=\"choice\"><a data-goto=\"sect_256\">Continue.</a></span>\n",
  "sect_219": "\nDespite his shrivelled frame and spindly limbs, Mortice fights with the savagery and strength of a madman. Hissing, clawing, snapping at you with his long teeth, he struggles desperately to force you back off his raft.<br><span data-piece=\"219_0\" class=\"choice\"><a data-goto=\"sect_219a\">Fight.</a></span>\n",
  "sect_219a": "\n\n",
  "sect_219b": "\nAt last you manage to succeed in pinning him, though not without injury. You press all your weight down on Mortice's arms while he writhes in your grasp. Even now he continues his stream of invective, calling on the very devils of hell as though they were his blood brothers.<br><span class=\"indent\"></span>'He's as strong as an old serpent,' says Grimes, holding on to Mortice's legs. It takes three of you to keep him down. While you do, Blutz looks around the raft.<br><span class=\"indent\"></span>He soon discovers something lashed to the bottom of the raft, under the water. It is a large pine box. He drags this up and opens it, and at once a mouldering miasma rises out which causes him to gag. 'It's full of old bones,' he chokes.<br><span class=\"indent\"></span>Even as these words leave Blutz's lips, there is a mournful unearthly sigh and suddenly the three of you are wrestling empty air. Mortice has vanished like a ghost. <br><span data-piece=\"219b_0\" class=\"choice\"><a data-goto=\"sect_295\">Continue.</a></span>\n",
  "sect_220": "\nThe natives scatter, filled with fear, as the battle rages up and down the beach beside their village. Men's lifeblood spurts into the sand. Lusty battle-cries are replaced now by ragged gasps and terse grunts of pain as each blow takes its toll.<br><span class=\"indent\"></span>You are face to face with Skarvench, locked in mortal combat. His breath is a putrid gust in your face. Both of you bear a dozen wounds; your blood runs down to mingle in the gore-soaked sand underfoot. 'I'm sending you to hell-' he snarls through gritted teeth. His cutlass stabs up, and you feel it grate through your ribs as you are impaled.<br><span class=\"indent\"></span>'Then we'll go there together!' you cry, responding with a killing blow which he fails to see until it is too late. The pair of you sag to your knees, locked in a final embrace like old friends. And you are filled with a fierce exultation as, even as your own life slowly ebbs away, you see the face of your foe go stiff and white in death...<br><div class=\"s3\">THE END</div>\n",
  "sect_221": "\nA few judicious rounds bought in a dockside tavern soon sets tongues wagging. 'Aye, I've heard it's the Queen herself who'll be visiting next month,' ventures a longshoreman. 'That's why security's been tightened up. It stands to reason, don't it. The governor don't want nothing to go wrong while she's here, or he might end up begging on the streets instead of living in splendour up at the fort.'<br><span class=\"indent\"></span>Unfortunately other ears have overheard your enquiries. As you leave the tavern, footsteps ring on the cobbled street behind you. Before you have time to turn, you feel the unpleasantly familiar touch of cold steel against your neck. 'I'm sure the governor will want to know about the keen interest you're taking in Her Majesty's visit,' says a voice full of honeyed menace. 'Why don't you come and have a chat with him about it?'<br><span class=\"indent\"></span>'Why bother the man?' you reply. 'He has a lot to deal with at the moment.'<br><span class=\"indent\"></span>The knife pricks your skin. 'I wouldn't like to have to press the point,' says the voice in the darkness behind you.<br><span class=\"indent\"></span>You give a gulp. 'In that case, lead on.'<br><span data-piece=\"221_0\" class=\"choice\"><a data-goto=\"sect_126\">Continue.</a></span>\n",
  "sect_222": "\nBy the onset of the second night, severe gales are driving freezing rain down onto your unprotected heads. You huddle together for warmth, but it is still impossible to snatch more than a few minutes of fitful sleep. The bitter cold creeps into your bones.<br><span data-piece=\"222_0\" class=\"choice\"><a data-goto=\"sect_222a\">Can you endure it?</a></span>\n",
  "sect_222a": "\n\n",
